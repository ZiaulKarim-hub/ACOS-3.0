# ═══════════════════════════════════════════════════════════════════════════
# ACOS v3.0 - PERFORMANCE REVIEWER TRIGGER RULES
# ═══════════════════════════════════════════════════════════════════════════
# HUMAN-EDITABLE ONLY — No agent may read or modify.
#
# This reviewer is included at slice level when ANY path or code pattern
# matches. All patterns are OR'd together.
# ═══════════════════════════════════════════════════════════════════════════

name: ACOS-performance-reviewer
description: "Speed, efficiency, scalability"
always_required: false

# ── Slice-level triggers (all OR'd) ─────────────────────────────────────
# Covers: database code, API endpoints, payment code, performance-critical

trigger_file_paths:
  - "database"
  - "db"
  - "model"
  - "schema"
  - "migration"
  - "query"
  - "repository"
  - "entity"
  - "orm"
  - "api"
  - "route"
  - "controller"
  - "endpoint"
  - "handler"
  - "middleware"
  - "payment"
  - "billing"
  - "invoice"
  - "transaction"
  - "stripe"
  - "paypal"
  - "checkout"
  - "cart"
  - "order"
  - "subscription"
  - "pricing"

trigger_code_patterns:
  - "SELECT"
  - "INSERT"
  - "UPDATE"
  - "DELETE"
  - "CREATE TABLE"
  - "ALTER TABLE"
  - "DROP"
  - "prisma"
  - "sequelize"
  - "mongoose"
  - "typeorm"
  - "knex"
  - "sql"
  - "query"
  - "app.get"
  - "app.post"
  - "app.put"
  - "app.delete"
  - "app.patch"
  - "router."
  - "express"
  - "fastify"
  - "@Get"
  - "@Post"
  - "@Put"
  - "@Delete"
  - "fetch("
  - "axios"
  - "request"
  - "response"
  - "charge"
  - "payment"
  - "credit"
  - "debit"
  - "refund"
  - "stripe"
  - "paypal"
  - "braintree"
  - "currency"
  - "amount"
  - "price"
  - "cache"
  - "redis"
  - "memcached"
  - "index"
  - "optimize"
  - "batch"
  - "bulk"
  - "async"
  - "parallel"
  - "concurrent"
  - "worker"
  - "thread"
  - "queue"

# ── Higher-level rules ──────────────────────────────────────────────────
story_always: false
epic_always: true
vision_always: true
