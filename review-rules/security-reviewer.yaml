# ═══════════════════════════════════════════════════════════════════════════
# ACOS v3.0 - SECURITY REVIEWER TRIGGER RULES
# ═══════════════════════════════════════════════════════════════════════════
# HUMAN-EDITABLE ONLY — No agent may read or modify.
#
# This reviewer is included at slice level when ANY path or code pattern
# matches. All patterns are OR'd together.
# ═══════════════════════════════════════════════════════════════════════════

name: ACOS-security-reviewer
description: "Security vulnerabilities and best practices"
always_required: false

# ── Slice-level triggers (all OR'd) ─────────────────────────────────────
# Covers: security-sensitive code, API endpoints, payment code, file ops

trigger_file_paths:
  - "auth"
  - "login"
  - "logout"
  - "password"
  - "token"
  - "session"
  - "crypto"
  - "secret"
  - "key"
  - "credential"
  - "oauth"
  - "jwt"
  - "permission"
  - "role"
  - "access"
  - "api"
  - "route"
  - "controller"
  - "endpoint"
  - "handler"
  - "middleware"
  - "payment"
  - "billing"
  - "invoice"
  - "transaction"
  - "stripe"
  - "paypal"
  - "checkout"
  - "cart"
  - "order"
  - "subscription"
  - "pricing"

trigger_code_patterns:
  - "password"
  - "token"
  - "jwt"
  - "oauth"
  - "encrypt"
  - "decrypt"
  - "hash"
  - "salt"
  - "secret"
  - "credential"
  - "bearer"
  - "authorization"
  - "authenticate"
  - "app.get"
  - "app.post"
  - "app.put"
  - "app.delete"
  - "app.patch"
  - "router."
  - "express"
  - "fastify"
  - "@Get"
  - "@Post"
  - "@Put"
  - "@Delete"
  - "fetch("
  - "axios"
  - "request"
  - "response"
  - "charge"
  - "payment"
  - "credit"
  - "debit"
  - "refund"
  - "stripe"
  - "paypal"
  - "braintree"
  - "currency"
  - "amount"
  - "price"
  - "fs."
  - "readFile"
  - "writeFile"
  - "unlink"
  - "mkdir"
  - "rmdir"
  - "rename"
  - "copyFile"
  - "createReadStream"
  - "createWriteStream"
  - "path.join"
  - "upload"
  - "download"

# ── Higher-level rules ──────────────────────────────────────────────────
story_always: false
epic_always: false
vision_always: true
