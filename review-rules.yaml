# ═══════════════════════════════════════════════════════════════════════════
# ACOS v3.0 - REVIEW RULES (MIGRATED)
# ═══════════════════════════════════════════════════════════════════════════
#
# Review rules have been split into per-reviewer files.
# See the review-rules/ directory:
#
#   review-rules/global.yaml            — Global settings
#   review-rules/qa-reviewer.yaml       — QA reviewer triggers
#   review-rules/security-reviewer.yaml — Security reviewer triggers
#   review-rules/performance-reviewer.yaml — Performance reviewer triggers
#   review-rules/integration-reviewer.yaml — Integration reviewer triggers
#
# HUMAN-EDITABLE ONLY — No agent may read or modify these files.
# The Architect has ZERO control over the review process.
#
# To add a new reviewer: create a new YAML file in review-rules/ following
# the same format as existing reviewer files.
#
# To add cross-cutting custom rules: use the custom_rules section in
# review-rules/global.yaml.
#
# ═══════════════════════════════════════════════════════════════════════════
