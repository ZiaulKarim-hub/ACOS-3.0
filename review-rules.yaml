# ═══════════════════════════════════════════════════════════════════════════
# ACOS v3.0 - REVIEW RULES
# ═══════════════════════════════════════════════════════════════════════════
#
# HUMAN-EDITABLE ONLY
# No agent can read, modify, or influence this file.
# The Architect has ZERO control over the review process.
#
# ═══════════════════════════════════════════════════════════════════════════

version: "1.0.0"
last_modified_by: "human"
last_modified_date: "2026-01-31"

# ═══════════════════════════════════════════════════════════════════════════
# GLOBAL SETTINGS
# ═══════════════════════════════════════════════════════════════════════════

global:
  # Review depth is ALWAYS maximum - this cannot be changed
  review_depth: maximum

  # QA Reviewer is mandatory for everything
  qa_reviewer_required: always

  # All assigned reviewers must pass for approval
  all_reviewers_must_pass: true

  # Reviewers work simultaneously
  parallel_execution: true

  # Reviewers cannot see each other's feedback until submitted
  reviewer_independence: true

  # Maximum retry attempts before escalation to human
  max_retry_attempts: 3

# ═══════════════════════════════════════════════════════════════════════════
# SLICE LEVEL RULES
# ═══════════════════════════════════════════════════════════════════════════
# Rules are evaluated in order. All matching rules apply (additive).
# QA Reviewer is always included regardless of rules.

slice_level_rules:

  - name: "Security-sensitive code"
    description: "Code handling authentication, authorization, or sensitive data"
    triggers:
      file_path_contains:
        - "auth"
        - "login"
        - "logout"
        - "password"
        - "token"
        - "session"
        - "crypto"
        - "secret"
        - "key"
        - "credential"
        - "oauth"
        - "jwt"
        - "permission"
        - "role"
        - "access"
      code_contains:
        - "password"
        - "token"
        - "jwt"
        - "oauth"
        - "encrypt"
        - "decrypt"
        - "hash"
        - "salt"
        - "secret"
        - "credential"
        - "bearer"
        - "authorization"
        - "authenticate"
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-security-reviewer

  - name: "Database code"
    description: "Code interacting with databases"
    triggers:
      file_path_contains:
        - "database"
        - "db"
        - "model"
        - "schema"
        - "migration"
        - "query"
        - "repository"
        - "entity"
        - "orm"
      code_contains:
        - "SELECT"
        - "INSERT"
        - "UPDATE"
        - "DELETE"
        - "CREATE TABLE"
        - "ALTER TABLE"
        - "DROP"
        - "prisma"
        - "sequelize"
        - "mongoose"
        - "typeorm"
        - "knex"
        - "sql"
        - "query"
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-performance-reviewer

  - name: "API endpoints"
    description: "Code defining or handling API endpoints"
    triggers:
      file_path_contains:
        - "api"
        - "route"
        - "controller"
        - "endpoint"
        - "handler"
        - "middleware"
      code_contains:
        - "app.get"
        - "app.post"
        - "app.put"
        - "app.delete"
        - "app.patch"
        - "router."
        - "express"
        - "fastify"
        - "@Get"
        - "@Post"
        - "@Put"
        - "@Delete"
        - "fetch("
        - "axios"
        - "request"
        - "response"
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-security-reviewer
      - ACOS-performance-reviewer

  - name: "Payment and financial code"
    description: "Code handling payments, billing, or financial transactions"
    triggers:
      file_path_contains:
        - "payment"
        - "billing"
        - "invoice"
        - "transaction"
        - "stripe"
        - "paypal"
        - "checkout"
        - "cart"
        - "order"
        - "subscription"
        - "pricing"
      code_contains:
        - "charge"
        - "payment"
        - "credit"
        - "debit"
        - "refund"
        - "subscription"
        - "invoice"
        - "stripe"
        - "paypal"
        - "braintree"
        - "currency"
        - "amount"
        - "price"
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-security-reviewer
      - ACOS-performance-reviewer

  - name: "File operations"
    description: "Code handling file system operations"
    triggers:
      code_contains:
        - "fs."
        - "readFile"
        - "writeFile"
        - "unlink"
        - "mkdir"
        - "rmdir"
        - "rename"
        - "copyFile"
        - "createReadStream"
        - "createWriteStream"
        - "path.join"
        - "upload"
        - "download"
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-security-reviewer

  - name: "External service integration"
    description: "Code integrating with external APIs or services"
    triggers:
      code_contains:
        - "fetch("
        - "axios"
        - "http."
        - "https."
        - "request("
        - "webhook"
        - "callback"
        - "api_key"
        - "client_id"
        - "client_secret"
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-integration-reviewer

  - name: "Multi-component changes"
    description: "Changes spanning multiple modules or components"
    triggers:
      files_modified_count_greater_than: 3
      imports_from_multiple_modules: true
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-integration-reviewer

  - name: "Performance-critical code"
    description: "Code with performance implications"
    triggers:
      code_contains:
        - "cache"
        - "redis"
        - "memcached"
        - "index"
        - "optimize"
        - "batch"
        - "bulk"
        - "async"
        - "parallel"
        - "concurrent"
        - "worker"
        - "thread"
        - "queue"
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-performance-reviewer

  - name: "Default (fallback)"
    description: "Default rule when no specific triggers match"
    triggers:
      always: true
    assign_reviewers:
      - ACOS-qa-reviewer

# ═══════════════════════════════════════════════════════════════════════════
# STORY LEVEL RULES
# ═══════════════════════════════════════════════════════════════════════════
# Story reviews aggregate all reviewers from constituent slices
# plus additional integration checks.

story_level_rules:

  - name: "Story integration review"
    description: "Review how slices work together as a feature"
    triggers:
      always: true
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-integration-reviewer
    include_from_slices: true  # Include all reviewers that reviewed any slice

# ═══════════════════════════════════════════════════════════════════════════
# EPIC LEVEL RULES
# ═══════════════════════════════════════════════════════════════════════════
# Epic reviews are comprehensive capability reviews.

epic_level_rules:

  - name: "Epic capability review"
    description: "Review the complete capability"
    triggers:
      always: true
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-integration-reviewer
      - ACOS-performance-reviewer
    include_from_stories: true  # Include all reviewers from constituent stories

# ═══════════════════════════════════════════════════════════════════════════
# VISION LEVEL RULES
# ═══════════════════════════════════════════════════════════════════════════
# Final gate before project completion. Maximum scrutiny.

vision_level_rules:

  - name: "Vision final review"
    description: "Final review of the complete system"
    triggers:
      always: true
    assign_reviewers:
      - ACOS-qa-reviewer
      - ACOS-integration-reviewer
      - ACOS-performance-reviewer
      - ACOS-security-reviewer
    include_from_epics: true  # Include all reviewers from all epics
    check_vision_fulfillment: true  # Verify original user intent is satisfied

