# ═══════════════════════════════════════════════════════════════════════════
# REVIEWER DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════
# Reference list of available reviewers.
# Agent definitions are in agents/reviewers/

available_reviewers:
  - name: ACOS-qa-reviewer
    description: "General quality assurance - always required"
    focus:
      - Correctness
      - Completeness
      - Code quality
      - Test coverage
      - Acceptance criteria

  - name: ACOS-security-reviewer
    description: "Security vulnerabilities and best practices"
    focus:
      - Authentication/authorization
      - Input validation
      - SQL injection
      - XSS prevention
      - CSRF protection
      - Secure data handling

  - name: ACOS-performance-reviewer
    description: "Speed, efficiency, scalability"
    focus:
      - Response times
      - Resource usage
      - Query efficiency
      - Caching strategies
      - Scalability

  - name: ACOS-integration-reviewer
    description: "How components work together"
    focus:
      - API contracts
      - Data flow
      - Error handling
      - Component boundaries
      - System coherence

# ═══════════════════════════════════════════════════════════════════════════
# END OF REVIEW RULES
