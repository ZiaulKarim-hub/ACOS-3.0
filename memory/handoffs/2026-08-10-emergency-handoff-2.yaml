candidate_learnings:
  - "In this repo, .claude/skills/acos-research-riffs/scripts/room/room.html is a GENERATED file (regenerated from .claude/skills/acos-investment-committee/scripts/committee-room/meeting_template.html via build_meeting.py) — any bugfix to that page must be applied to the template AND the IC's own generated meeting.html AND the riff copy, or the next regeneration silently reverts the riff fix. Three-file parity is intentional except at exactly six documented label-only lines (recorded in ARCHITECTURE.md note 21). (evidence: this session found and fixed a real bug this way, and documented the allowlist after nearly missing it during the 'Did you fix all the issues?' audit.)"
  - "A 'fix pass' that itself introduces a regression, or half-lands a fix, is a repeat pattern in this codebase's history, not a one-off: round 2's audit found 5 half-landed + 2 regressed items from round 1, and round 3's targeted fix pass itself introduced a new HIGH crash while fixing something else. Every fix pass in this skill's workflow now needs its own independent fix-audit re-review; self-grading a fix pass is not sufficient. (evidence: REVIEW-2026-07-27.md fix-audit findings, and the report.ts crash discovered during fix pass 3's own re-verification.)"
  - "The Workflow() background-agent tool used in this session can hit the Claude subscription's session limit mid-run (observed twice: 'You've hit your session limit · resets 7pm/2:10am (America/Denver)'), but supports resuming via {scriptPath, resumeFromRunId} — already-completed agents replay from cache at no cost, only the dead ones re-run. This is a normal, expected interruption mode for large multi-agent workflows on this account, not an error to work around differently. (evidence: two separate mid-session interruptions and successful resumes in this session's transcript.)"
  - "The eternity-protocol pre-flight in this repo reads context size from $STATE/.last-total-<session_id> (a token-watcher-maintained file under ~/Library/Application Support/acos-token-monitor/state/), not from any git or transcript inspection, and compares it against a near-empty floor of 20000 tokens / 100 transcript lines to avoid misfiring on a just-cleared session. (evidence: this session's own pre-flight bash output showing MEASURE: 531820 context tokens; near_empty=0.)"
  - "This repo is actively worked on by multiple concurrent Claude Code sessions/windows sharing the same working tree: at handoff time, git status --short showed uncommitted modifications to eternity-protocol-core.sh, git-manager/ids.json, html-to-pdf.js, acos-eternity-protocol/SKILL.md, acos-resume-prompt/SKILL.md, and Logo Builder/brandsync/commands.jsonl, plus dozens of untracked memory/handoffs/*.yaml files for OTHER projects (OKOA-Works, Skill-Workshop, Resurrection-Protocol) — NONE of which this research-riffs session touched. Any handoff-agent or resurrection tooling reading repo-wide git/file state must not attribute these to a single session without a transcript to confirm. (evidence: git status --short output at handoff time, cross-checked against this session's transcript which never touched those paths.)"

