session_summary: |
  EPIC-001 of R2P: 24 DEV/QA pairs, each built by one agent and reviewed by a
  second that never sees the builder's reasoning, then measured once against a
  sealed holdout pack written before any code existed.

  This session resumed from a reset with 15 pairs sealed and 9 open, and took
  all nine a long way forward. Landed 16 commits. Five sealed holdout packs
  were spent (9/9, 9/9, 8/9, 7/9 pre-existing, and 6/9). Six pairs now hold a
  PASS from their independent reviewer. Pair 16's ten stale defect pins were
  converted and controlled.

  The dominant lesson of the session, repeated across five independent agents:
  THE CHECK IS OFTEN WEAKER THAN THE CODE. A verifier covering 9 of 15 emitted
  fields. A property test that asks the code under test which cases to try, and
  so cannot see that code shrink. An instrument whose anchor matched a COMMENT
  quoting the removed line, so its sentinel landed in dead text. A tamper test
  whose extracted value kept its opening quote, making the tamper a silent
  no-op that reported "resisted". A holdout harness whose search took the FIRST
  priced execution in file order — a case whose two sides are identical — so
  the boundary it existed to test was never touched. Every one of those was
  caught by the agent that owned it, and every one is on disk.

