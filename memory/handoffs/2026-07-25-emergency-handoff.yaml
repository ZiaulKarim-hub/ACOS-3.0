completed_this_session:
  - "Corrected prior scoping errors from the 2026-07-22 TTS-only riff: identified that Opus 4.8 was only ever a stand-in brain (too slow to ship, confirmed by verify-brain.md B6: Anthropic's own docs show Opus 4.8's comparative latency as only 'Moderate' vs Haiku 'Fastest'/Sonnet 'Fast', and it is now itself a Legacy model behind Opus 5); that the one-model (multimodal speech-to-speech) architecture had never been assessed; and that whole model families (Liquid AI, 'Inkling') were missing. Opened a re-scoped riff on 2026-07-24 to fix this (.acos/riffs/2026-07-24-which-self-hostable-model-or-model-stack-should-ship-as-okoa/brief.md)."
  - "Ran verify-brain.md: confirmed Qwen3-30B-A3B-Instruct-2507 (Apache-2.0, 30.5B total/3.3B active MoE) real; confirmed LiveKit Agents (Apache-2.0 + Telnyx SIP docs) and Pipecat (BSD-2-Clause, barge-in on by default) as viable open orchestration layers with documented Telnyx integration; confirmed SSML say-as/telephone/characters is W3C-real (W3C Rec 2010-09-07 + WG Note 2005-05-26) though the specific 'digits' value is a vendor extension (Amazon Polly), not W3C; confirmed Telnyx Voice API + Messaging API (SIP, bi-directional RTP streaming, 140+ countries)."
  - "Ran verify-grok.md: confirmed grok-4.5 is real, cloud-API-only (no self-host/open-weights path), and its real-time voice-turn latency is UNVERIFIABLE — no published TTFT/latency figures and no fast/low-latency tier exists (grok-4-fast returns HTTP 404). Concluded Grok is structurally poor for live voice (reasoning model, no speed data) and should be dropped from the shipping shortlist absent a live benchmark."
  - "Ran verify-quants.md: mapped the full quantization/pruning ladder for Qwen3-30B-A3B-Instruct-2507 (Unsloth/bartowski/mradermacher GGUF, official FP8, cpatonn AWQ-4bit ~18.1GB, and community REAP-pruned variants incl. SamsungSAILMontreal's 96-expert/~23B/44GB-bf16 REAP and a REAP+W4A16 that fits 24GB). Confirmed a Q4_K_M/IQ4_XS/AWQ-4bit quant (~16.5-18.6GB) fits a single 24GB consumer GPU with headroom. Flagged that real tokens/sec and latency are UNVERIFIABLE from any primary source — must be live-benchmarked."
  - "Ran verify-qwen-newest.md: discovered Qwen3.6-35B-A3B (Apache-2.0, same ~3B active params, 262k native context, released ~Apr 2026 per HF createdAt) supersedes Qwen3-30B-A3B-Instruct-2507 as the newest fast self-hostable text brain — this is the corrected #4 pick's brain. Also confirmed Qwen3-Omni-30B-A3B (Sept 2025) remains the newest Qwen that can literally talk (real-time speech out) but has only 3 FIXED preset voices with NO cloning support — this is why Qwen3-Omni was dropped from the top-5."
  - "Ran verify-openai-voice.md: confirmed gpt-realtime-2.1 / gpt-realtime-2.1-mini (released 2026-07-06/07, the newest OpenAI voice release) as a one-model speech-to-speech brain+voice option with gated custom-voice cloning (eligible customers only, consent + sample recording), prompt-based (not SSML) digit-by-digit number read-back, cloud-only deployment (Azure OpenAI offers regional residency + Zero Data Retention for approved customers), and NO officially published latency figure. Pricing confirmed: $32/$64 per 1M audio in/out tokens (mini: $10/$20)."
  - "Ran verify-voice.md: confirmed Cartesia Sonic's 'sub-90ms' latency is vendor-published (the commonly-cited ~188ms P50 TTFA is third-party, not Cartesia's own figure); confirmed Cartesia native 8kHz mu-law/a-law telephony encoding AND a native `<spell>` SSML-equivalent tag for digit-by-digit read-back (the load-bearing number-safety advantage); confirmed Cartesia self-hosted deployment explicitly EXCLUDES voice cloning creation. Confirmed ElevenLabs Flash v2.5 is actually ~75ms model inference / 100-200ms end-to-end TTFB (corrected down from a commonly-cited ~264ms), has NO native say-as/digit tag (only a phoneme/pronunciation-dictionary alias workaround limited to eleven_flash_v2/eleven_v3), and that ElevenLabs now offers a gated 'Private Deployment' running inside the customer's OWN AWS account (SageMaker/Nitro Enclaves) — enterprise/sales-gated, not self-serve GA."
  - "Assembled the corrected, updated TOP-5 stack recommendation (see decisions_made) from the six verify passes above, replacing the TTS-only framing of the 2026-07-22 riff."
  - "Drafted (but did not launch) a further re-scope toward a 'cloud-cost' seat (scratchpad cloudseat.json / costdim.json, written 2026-07-24 15:59, ~30-45 min BEFORE the six verify-*.md passes) premised on 'self-hosting is now optional and cost-effectiveness IS the priority' — this premise was itself later corrected within the same session to 'cost is NOT the priority' (self-host merely optional). Treat cloudseat.json/costdim.json as a superseded, unexecuted draft — no riff seat/dimension for it exists in the actual 2026-07-24 8-seat panel (confirmed via that riff's coverage-audit.md and manifest.json)."

