decisions_made:
  - "Deliverable format: a TOP-5 tech stack (updated, not a single pick), all five sharing one backbone — LiveKit or Pipecat orchestration + Telnyx (phone/SMS) + Cloudflare Durable Objects (per-client memory) — with a cascade architecture (separate brain -> separate TTS) preferred over one-model speech-to-speech for deterministic number read-back and constitutional-prompt governance."
  - "Updated top-5, in order: (1) Cloud cascade + Cartesia — native 8kHz mu-law/a-law + native <spell> digit read-back + cloud voice cloning; leads on number-safety. (2) OpenAI Realtime gpt-realtime-2.1 — one-model brain+voice, 2026-07-06 release, gated brand-voice cloning, prompt-based (not SSML) number read-back, cloud-only, Azure Zero Data Retention available. (3) Cloud cascade + ElevenLabs — best-in-class cloning, Flash v2.5 ~75ms model / ~100-200ms TTFB, no native say-as (pronunciation-dictionary alias workaround only), gated Private Deployment option in customer's own AWS. (4) Self-hosted cascade = Qwen3.6-35B-A3B (Apr 2026, Apache-2.0, 35B total/3B active; Q4 quant ~16-18GB fits a 24GB GPU; REAP-pruned variants exist) + an open cloning TTS (Fish/XTTS-class, trailing premium cloud voices by roughly 90-114 Elo). (5) ElevenLabs Private Deployment inside OKOA's own AWS account."
  - "Qwen3-Omni was DROPPED from the top-5 despite being a genuine self-hostable one-model speech-to-speech option, because it only has 3 fixed preset voices and NO cloning support — fails the brand-voice requirement outright."
  - "Grok 4.5 excluded as a brain candidate: cloud-only, no published latency/TTFT figures, no fast tier exists, and it's a reasoning model (added thinking latency) — structurally unproven for sub-second live voice turns."
  - "Constraints corrected mid-session (supersedes any earlier framing, including the abandoned cloud-cost seat draft): self-hosting is OPTIONAL, not required; cost is explicitly NOT the priority; OKOA is NOT a regulated lender (drop compliance-driven framing); brand-voice cloning is desired; number read-back accuracy is required; the website and phone channels must share one consistent voice."
  - "Two items are flagged as must-benchmark-live for whichever option is chosen, because no vendor publishes either figure: (a) real live-call latency, and (b) voice quality specifically at 8kHz telephony bandwidth (all published quality/MOS scores are 24kHz wideband/studio)."

blockers:
  - "Both riffs (2026-07-22 TTS-only and 2026-07-24 re-scoped brain+voice) FAILED their own coverage-gate audits and neither has a finished report/ synthesis. The 2026-07-24 auditor (.acos/riffs/2026-07-24-.../coverage-audit.md) specifically flags six unresolved gaps: (1) Microsoft Phi family (Phi-4/Phi-4-mini) entirely absent from the self-host-brains dimension; (2) 8kHz telephony-band voice quality unmeasured for every single candidate; (3) one-model (S2S) number-read-back safety is unestablished (only proven for the two-model/cascade path); (4) no shipping-stack total-cost-of-ownership model exists; (5) cross-channel (web 24kHz vs phone 8kHz) same-cloned-voice consistency was only glanced at, never probed; (6) Fixie AI Ultravox and Freeze-Omni were named as leads but never actually researched (WebSearch budget exhausted). The current top-5 was hand-assembled from six manual verify-*.md passes layered on TOP of this incomplete riff corpus, not from a completed riff synthesis — treat the top-5 as verification-corrected but not gap-closed."
  - "The six verify-*.md files (and brief2.md/dims2.json/panel2.json/cloudseat.json/costdim.json) that the current top-5 rests on live ONLY in the session's OS-level scratchpad (/private/tmp/claude-501/.../scratchpad/), NOT in the git repo or anywhere under .acos/riffs/. Scratchpad directories are ephemeral and session-scoped — if not copied into the repo (e.g., into the 2026-07-24 riff's dossiers/ or into research/) before that scratchpad is cleared, this verification work could be lost with no other record."
  - "cloudseat.json/costdim.json in the scratchpad reflect a stale, superseded interim scope ('cost-effectiveness is the priority') that contradicts the session's later, final correction ('cost is NOT the priority'). Do not act on those two files' framing without re-confirming with the user first."
  - "Real live-call latency and 8kHz-band voice quality remain unverified for every one of the five shortlisted options — no vendor publishes either figure; both require an actual live benchmark before any final commitment."

