decisions_made:
  - "plan-push NEVER runs the push. It prints the literal `git -C <path> push <remote> <branch>` command, which the session must run DIRECTLY so ~/.claude/hooks/github-repo-guard.ts sees a real push and can prompt. Wrapping it would disarm the guard."
  - "Personal is the DEFAULT push destination as of 2026-08-01 (Zee's standing rule). okoateam only when Zee names it. A trailing `?` in DO THIS marks a work-account suggestion."
  - "A duplicate is always `check vs #N`, never `delete`. Same name is evidence, not proof."
  - "A duplicate becomes the headline action only for NOT_A_REPO / NO_REMOTE rows; on a live repo with commits waiting, the push stays the action and the duplicate is appended."
  - "Filters always print their own counts (weak set, ignoreNames) so the table never reads as exhaustive when it is not."

