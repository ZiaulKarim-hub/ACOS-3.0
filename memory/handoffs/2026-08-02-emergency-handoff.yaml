context_for_next_session: |
  HOW TO USE THE THING THAT WAS BUILT

    bun .claude/scripts/git-manager/git-manager.ts scan \
        --color never --width 118 --html <path> --open
    bun .claude/scripts/git-manager/git-manager.ts plan-push --repo <path> --to personal

  Or just run /acos-git-manager, which does the first line for you and opens Chrome.

  EXIT CODES for plan-push: 0 ok · 2 bad input or unknown remote · 3 destination
  forbidden by a neverPush rule · 4 suspected credential in the outgoing diff
  (--acknowledge-secrets overrides, but that flag is Zee's call, never yours).

  LAST SCAN RESULT (2026-08-02 04:59 UTC): 20 repos · 18 untracked folders ·
  34 need attention · 5 safe · 21 unsaved files · 8 folders left out of the loose set ·
  4 hidden by ignore rules. No wrong-account rule breach.

  THE THREE GATES — this framing worked well when explaining it to Zee, reuse it:
    gate 1  is git watching this folder at all?   no -> NOT A REPO
    gate 2  does git know where online to send it? no -> NO REMOTE
    gate 3  are the latest edits snapshotted?      no -> UNCOMMITTED
  The gates only run forwards. You cannot push what was never committed, and you cannot
  commit in a folder that is not a repo. That is why one push could not fix rows 1-21.

  KNOWN LIMITS, state them when they matter:
    - remote counts are as of each repo's last fetch unless --fetch is passed
    - .gitignore'd files are invisible to the unsaved count
    - only the 60 most recently committed branches per repo are examined
    - the secret scan is a net, not a proof; it stops after 1000 commits or 5 MB of diff
      and says so — a clean result on a truncated scan is not a clean result
    - symlinked folders are not followed; a linked-in skill is reported as
      "linked in — hosted by <repo>"

  COMMUNICATION NOTES THAT MATTERED THIS SESSION:
    - Eden Protocol level 2 is active. Short sentences, gloss every term on first use,
      numbers verbatim, keep every caveat.
    - Zee asked twice for polish. He notices ragged borders and unexplained jargon.
    - When corrected on a wrong claim (the ~/.claude skills count), state it plainly and
      move on. Do not over-apologise.

