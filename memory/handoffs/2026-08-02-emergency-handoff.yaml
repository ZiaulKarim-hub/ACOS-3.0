session_summary: |
  Built /acos-git-manager end to end, then used it. One long session, three phases.

  PHASE 1 — BUILD. Created a new global skill that answers two questions and stops:
  (a) which git repo hosts which skill / sub-project / piece of software, and
  (b) what is not saved or pushed anywhere yet, split into states that have different
  fixes rather than one vague "unsynced" flag. Then it pushes ONE row at a time to a
  destination the user names. It never pushes on its own initiative.

  PHASE 2 — HARDEN. Five requested improvements plus a rewritten renderer:
  content-weighted ordering, linked-skill host resolution, build-output pruning,
  all-branch checking, and a pre-push credential scan. Then a full visual rewrite into
  box-ruled tables after Zee said the output was not polished enough. Then --open so the
  browser view opens in Chrome on every run. Then KIND + DO THIS recommendation columns.

  PHASE 3 — USE IT. Committed and pushed everything to the PERSONAL GitHub account, and
  recorded a new standing rule that makes personal the default destination.

  Several real defects were found and fixed by testing rather than by reading:
  - the secret scan silently scanned NOTHING on a never-pushed branch (git diff HEAD is
    empty once everything is committed) -> switched to git log -p
  - symlinked skill folders were followed and reported as phantom untracked projects
  - ANSI colour codes were counted as visible width, so coloured cells overflowed borders
  - a hard minimum on the last column pushed the table past its own border at narrow widths
  - inventory counted skills that live in a NESTED repo as the parent's at-risk work
    (this produced a wrong statement to Zee about ~/.claude, corrected in-session)

