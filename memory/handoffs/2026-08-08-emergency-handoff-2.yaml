  Durable lessons (also written into shapes-src/AUTHORING.md — read that file
  rather than relying on memory of this list, but it is repeated here in case
  the file is not read): use EXIT CODE never the printed tally, since a suite
  that dies mid-run still prints a plausible "N/N passed"; the ten suites do
  NOT share a port/argv contract (7 of them on 8816, symbols on 8819, gallery
  and reject on 8817 with an ABSOLUTE workspace path as argv[2] because they
  run after cd-ing into the app dir); six suites (fill, ribbon, shapes, forge,
  gallery, reject) are not idempotent and need a fresh copy of
  "ACOS 3.0/Logo Builder/brandsync" per run; shapes.json is a build artifact,
  never hand-edited; build-shapes.ts SORTS the library so "the last N records"
  is never the batch just written — read names from the batch source file
  instead (scratchpad/batch-sheet.ts does this); C() and E() in kit.ts wind
  anticlockwise while R()/P()/NGON()/STAR()/TRAP()/WEDGE()/ARCBAND() wind
  clockwise, and overlapping opposite windings silently cancel under nonzero
  fill (build every shape from one winding-consistent column, or from parts
  that only touch, not overlap; avoid L()/PL()); two crossing bars inside an
  evenodd shape punch each other back out (use one non-self-overlapping
  polygon instead); a redraw is not done until the NEW render has actually
  been looked at; redrawing fixes a FAULT, not a collision — if a shape reads
  as another already-named shape, cut it, do not keep redrawing it; count
  FORMS not names while drafting a batch, since near-identical silhouettes
  (domes, triangular piles, gun outlines) can collide with each other inside
  the same batch even when none of the names look alike; a hastily-drawn
  replacement is still an unreviewed shape and must pass its own first sheet
  like anything else; Callouts, bar-style Charts, and ring-with-marks Bakery
  shapes are SATURATED — no more members; shape-audit.ts only catches
  IDENTICAL twins, not merely confusable ones, and its 3 standing warnings
  (rectangle~round corner, round corner~round top at 98.8%, zoom in~zoom out
