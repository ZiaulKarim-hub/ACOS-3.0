  General traps worth carrying forward, stated by the session but not independently
  re-tested here: tesseract returns empty output on absolute /tmp paths (invoke from
  cwd instead); macOS has no `timeout`/`gtimeout` command; a raw grep hit-count for a
  term inside an HTML file does not prove it prints on the page — check whether the
  match sits inside an HTML comment or a non-visible notes block (this handoff's own
  LendSure check in v2-v5 illustrates why: the matches read like internal reasoning
  text, not confirmed comment blocks — worth a direct view before ruling v2-v5 clean);
  the Puppeteer html-to-pdf.js render needs --no-footer or it stamps 'Page N of M' over
  the real footer; past roughly 0.5in of page overflow, restructure the layout rather
  than shrinking type, and measure with a getBoundingClientRect pass before trimming.

