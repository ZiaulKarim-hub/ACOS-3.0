candidate_learnings:
  - "This repo (ACOS 3.0) can host a live Claude Code session whose actual working directory and real work are in a completely different sibling repo (R2P) for the entire session — the transcript stays keyed to ACOS 3.0 because that was the session's cwd at start, even though nearly every Bash tool_use in it carries cwd=/Users/zee/Documents/Vibe Coding/R2P. Any handoff/resurrection tooling that infers 'current work' from ACOS 3.0's own git status alone will completely miss this. (evidence: this transcript's own per-message cwd fields, and the R2P git log/log file confirming the work.)"
  - "R2P uses Stryker with inPlace: true for its mutation gate — while that process is alive, git status in R2P is meaningless (hundreds of source files get `// @ts-nocheck` prepended and are restored on completion), and running tsc/vitest/biome/pnpm-run-check during the run produces a FALSE PASS rather than an error, because the instrumentation silences real type errors. (evidence: user-supplied critical context in this handoff-agent's invocation prompt, corroborated by live process list showing pid 5918 running `npx stryker run` with stryker.config.mjs `inPlace: true` referenced repeatedly across DECISIONS-FOR-BEN.yaml and OBS-MG* records.)"
  - "R2P's AP-07 house rule: no agent may approve, seal, close, or ratify any planning/evidence record in this project; every such record is written with `owner: Ben` and `self_approved: false`, and silence is explicitly defined as not approval. This is a durable project convention, not a one-off instruction. (evidence: consistent across READ-THIS-FIRST-SESSION-2026-08-12.yaml, DECISIONS-FOR-BEN.yaml, SEAL-GATE-MATRIX.yaml.)"
  - "Grepping a long numeric literal by its bare digit string can miss a TypeScript file that writes it with `_` numeric separators (e.g. 9_007_199_254_740_991 vs 9007199254740991) — a builder in R2P caught this against the session's own false claim. (evidence: READ-THIS-FIRST-SESSION-2026-08-12.yaml 'errors_made_and_caught' first entry.)"

