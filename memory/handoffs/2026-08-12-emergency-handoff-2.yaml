the_lesson_this_epic_keeps_teaching: >-
  THE CHECK IS OFTEN WEAKER THAN THE CODE. This session alone: a verifier
  comparing two forgeries against each other and correctly reporting they agree;
  62 accepted forgeries across 8 doors where a review found 1; a harness
  reporting twelve controls BIT when it had parsed no counts at all; an alias
  that silently no-opped, caught only because a nonsense tamper came back GREEN;
  and the orchestrator's own recount reporting 47 because it double-counted 83
  ids. Test your instrument against known-dirty input before trusting it.
