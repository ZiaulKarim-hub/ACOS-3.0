# Handoff Template: Architect to Developer
# Copy this template and fill in the values

handoff_id: "HANDOFF-[SLICE-ID]-[TIMESTAMP]"
from: architect
to: ACOS-developer
timestamp: "[ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ]"

slice_id: "[SLICE-ID]"
story_id: "[STORY-ID]"
epic_id: "[EPIC-ID]"

objective: |
  [Clear, complete description of what needs to be implemented.
  Be specific about the expected behavior and outcome.]

context:
  - "[Relevant context item 1]"
  - "[Relevant context item 2]"
  - "[Any background the developer needs to know]"

acceptance_criteria:
  - "[ ] [Criterion 1 - Specific, measurable, testable]"
  - "[ ] [Criterion 2]"
  - "[ ] [Criterion 3]"

files_allowed:
  - "[path/to/file1.ts]"
  - "[path/to/directory/]"

files_prohibited:
  - "[path/to/protected/file]"
  - "[path/to/config/that/shouldnt/change]"

dependencies:
  completed:
    - slice_id: "[SLICE-ID of completed dependency]"
      what_it_provides: "[What this slice provides that we need]"
  pending: []  # Should be empty - we don't assign work with pending deps

skills_recommended:
  - "[skill-name-1]"
  - "[skill-name-2]"

flow: "slice-execution-flow"

effort_estimate: "[S | M | L]"

notes: |
  [Any additional guidance, warnings, or helpful information.
  Include gotchas, edge cases to watch for, or related context.]

priority: "[high | medium | low]"

deadline: "[optional: ISO 8601 date if there's a specific deadline]"
