candidate_learnings:
  - "R2P is a strategy-agnostic backtest/portfolio MECHANICS harness, not a strategy engine — the working analogy that made this legible to Zee (who did not write the PRD) is 'R2P is the loan servicing system, the strategy is the credit committee' (evidence: R2P commit 17fb1c1 and memory/feedback_define_domain_words_not_code_words.md, both written this session)."
  - "When a project's PRD was NOT authored by the person now ruling on it, glossing identifier-shaped/code terms (timeoutFactor, simulateFill) is not enough — the reader may also be missing the DOMAIN vocabulary (sleeve, netting, basis risk, break, holdout) that the PRD itself never defines either; a one-time plain-language orientation doc, built from the PRD's own early sections, is the fix that worked here (evidence: R2P commit 17fb1c1, and Zee's own follow-up read-back was 'It makes way more sense now')."
  - "In a Stryker + Vitest mutation-testing setup, there can be TWO independent timeout clocks that must both be tuned or one silently overrides the other: Stryker's own `timeoutMS`/`timeoutFactor` (stryker.config.mjs) and Vitest's own `testTimeout` (vitest.config.ts, currently 15_000ms in R2P) — a test can hit Vitest's 15s cap and fail before Stryker's separately-ruled 120000ms budget is ever reached (evidence: vitest.config.ts:10 read directly this session; referred to throughout the close-packet as 'the second clock')."
  - "A file that already reads 100.00/100.00 with zero survivors cannot be used to measure whether a stabilising setting (e.g. Stryker concurrency) helps, because there is no wobble left to remove — the probe needs a file that still shows run-to-run variance under the CURRENT tree, not a file that used to wobble before other fixes landed (evidence: R2P's OBS-MG26 record, in detail, this session)."
  - "R2P (/Users/zee/Documents/Vibe Coding/R2P) is a genuinely separate git repo from ACOS-3.0 with NO remote configured at all (`git remote -v` returns empty) — it must never be pushed anywhere, and Claude Code sessions launched with R2P as cwd nonetheless get their transcript filed under whichever project-slug directory matches the ORIGINAL launch cwd (here, ACOS-3.0's slug), so the transcript location is not a reliable signal of which repo the real work is in — the transcript's own per-line `cwd` field is (evidence: every JSONL line read this pass carries `\"cwd\":\"/Users/zee/Documents/Vibe Coding/R2P\"` despite living under the ACOS-3.0 project-slug directory)."

