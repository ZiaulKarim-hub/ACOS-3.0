context_for_next_session: |
  This session's work sits in .claude/scripts/git-manager/, a read-only-by-design
  inventory/reporting tool that scans every git repo and untracked project folder on the
  machine and tells Zee what is and is not backed up to a personal GitHub account. Three
  rounds of feature work landed this session: decisions-tracking (committed) so the tool
  stops re-flagging folders Zee has already ruled out; a live auto-refreshing local report
  page on port 8787 (committed, confirmed still running at PID 97378); and a new
  distinction between a genuine backup gap and a merely-available-but-unnecessary push to
  a non-personal account (UNCOMMITTED — this is the first thing to land next). All three
  rounds were independently verified present on disk by this handoff agent, not merely
  taken on the session's word: the diffs were read, the new types/functions/section labels
  were grep-confirmed against the exact wording described, and the live server process was
  confirmed via `ps aux`.

  The most consequential finding this handoff agent adds beyond the session's own account:
  the two specific "still open" risk items handed off — STEPS' `fix/archived-tasks-safe`
  branch (26 unbacked commits) and OKOA-Website/dev's local `main` branch (1 unbacked
  commit) — both turned out, on a fresh `git fetch personal` + `git merge-base
  --is-ancestor` check, to already be fully reachable from an already-pushed personal
  branch. STEPS is a same-repo-different-remote-nickname case (origin and personal are
  the literal same URL) that the new `stale-ref` OptionalPush kind was apparently written
  to catch. The dev repo case is subtly different — a same-account-different-BRANCH-NAME
  case (local `main` vs. pushed `dev`), which the `stale-ref` type's own doc comment
  describes only in terms of remote nicknames, not branch names, so it is not certain the
  new code actually clears it. Nothing was committed or pushed by this handoff agent; this
  is intentionally left as a next-action rather than acted on, both because raw git
  ancestry is not the same signal the tool itself reports on, and because this handoff
  agent's mandate is reconstruction, not further building.

  Two smaller items were also independently confirmed on disk: the Blog README at
  /Users/zee/Documents/OKOA/SEO Plan/Blog/README.md still falsely claims to have no
  remote (line 27), even though it is now pushed to personal/okoa-seo-blog-archive; and
  /Users/zee/Documents/private_credit_design_reference (the fuller, non-OKOA copy, not a
  git repo) genuinely does hold the 6 renderer source files the session described, and
  genuinely sits outside the tool's scan roots, so it stays invisible to the report until
