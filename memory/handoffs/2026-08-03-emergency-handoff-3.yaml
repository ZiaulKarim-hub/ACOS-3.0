next_actions:
  - id: "commit-round-3"
    detail: "Commit and push the round-3 git-manager files above to personal. Stage by exact path."
  - id: "steps-branch-RETRACTED"
    detail: |
      RETRACTED — this was a FALSE ALARM and the tool has been fixed.
      Mid-session I told Zee that STEPS `fix/archived-tasks-safe` held 26
      unprotected commits, and that OKOA Website/dev `main` held 1. Both were
      wrong. `git rev-list --count <branch> --not --remotes=personal` returns 0
      for both: every commit is already reachable from a pushed personal branch
      under a DIFFERENT name.

      CAUSE: otherBranchWork() asked whether `<remote>/<branch>` EXISTS. When it
      did not, it counted the branch's ENTIRE history as waiting. A branch nobody
      pushed under its own name is not lost work if its commits already left the
      machine inside another branch.

      FIX (uncommitted, in this session's changes): new
      G.commitsOnNoRemoteRef(dir, branch, remoteNames) in git.ts asks the honest
      question — commits on no ref of the judged remotes. scan.ts uses it; a null
      (uncomputable) result falls back to the old per-remote check, because
      uncomputable is not zero and the report should err toward flagging.

      EFFECT: need attention fell 8 -> 2, safe rose 27 -> 33. The only two rows
      left are this session's own uncommitted files.
