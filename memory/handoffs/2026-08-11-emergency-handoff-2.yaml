candidate_learnings:
  - "In this R2P orchestration pattern, an adversarial QA agent's finished, finding-rich adversarial *.test.ts file can exist on disk WELL before its formal verdict is written back to the QA-*.yaml slice record or the EVB-PAIR manifest — the two artifact classes can be badly out of sync mid-flight, sometimes by many minutes and multiple additional testrun logs. Do not infer a QA agent's completion state from the test file alone; check the YAML `verdict:` field, the manifest's git-status modification state, and the manifest's own `version:` line together (evidence: pair 19/QA-001-007-01 had a complete, 3-finding test file, 5 testrun logs including a green final lint/typecheck/scope gate, and a standalone finding-demonstration script — yet its YAML verdict was still `null` and its manifest was still unmodified v1)."
  - "State on a fast-moving concurrent multi-agent orchestration can change materially within the ~10-15 minutes it takes to gather and write a single handoff document — this handoff itself had to be corrected mid-write when a QA agent (pair 16) finished and wrote its verdict between this agent's first disk read and its second. Re-verify `git status` immediately before finalizing any handoff for a session with live background agents, not just once at the start."
  - "R2P has zero git remotes configured (`git remote -v` returns nothing) — this is the mechanical enforcement, not just a stated rule, of the local-only constraint."

