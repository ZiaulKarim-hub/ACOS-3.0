# Handoff Template: Reviewer to Architect (Feedback)
# Copy this template and fill in the values

handoff_id: "FEEDBACK-[SLICE-ID]-[TIMESTAMP]"
from: "[ACOS-qa-reviewer | ACOS-security-reviewer | etc.]"
to: architect
timestamp: "[ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ]"

slice_id: "[SLICE-ID]"
verdict: "[PASSED | REJECTED]"
review_report: "memory/reviews/slice-reviews/[REVIEW-FILE].md"

# Only include issues section if verdict is REJECTED
issues:
  - id: "ISSUE-001"
    severity: "[CRITICAL | HIGH | MEDIUM | LOW]"
    category: "[security | performance | quality | scope | correctness]"
    description: |
      [Clear description of what's wrong]
    expected: |
      [What should be instead]
    actual: |
      [What was found]
    location: "[file:line or component]"
    fix_required: |
      [Specific action needed to fix this]

  - id: "ISSUE-002"
    severity: "[severity]"
    category: "[category]"
    description: |
      [description]
    expected: |
      [expected]
    actual: |
      [actual]
    location: "[location]"
    fix_required: |
      [fix]

required_before_resubmission:
  - "[Critical fix 1 - must be done]"
  - "[Critical fix 2 - must be done]"

recommended_improvements:
  - "[Optional improvement 1]"
  - "[Optional improvement 2]"

overall_feedback: |
  [Summary of the review findings and overall assessment.
  What went well, what needs work, any patterns noticed.]

reviewer_notes: |
  [Any additional context for the architect.
  Suggestions for preventing similar issues, etc.]

# Metadata for tracking
review_duration_minutes: "[approximate time spent reviewing]"
evidence_quality: "[excellent | good | fair | poor]"
