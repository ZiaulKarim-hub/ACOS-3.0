candidate_learnings:
  - "The R2P repo's local zsh throws 'no matches found: <glob>' and ABORTS the entire compound command (not just the failing clause) when a Stryker mutation-gate cleanup step's glob (e.g. stryker-setup-*.js) matches nothing — the fix used this session was to swap that cleanup step for `find ... -delete`, which does not error on zero matches (evidence: transcript text describing the pair-11 gate's first failed launch, corroborated by the successful detached relaunch producing TESTRUN-20260810T062717Z-61)."
  - "In this R2P/Claude Code environment, a foreground Bash tool call has its own timeout that can kill a long-running mutation-gate process before it finishes, independent of the process's own runtime — the working pattern established across pair 10 and pair 11 is to launch the gate detached (nohup-style with a GATE_EXIT_CODE sentinel written to the log) and watch it via the Monitor tool rather than a blocking Bash call (evidence: pair-11 dispatch prompt to this session's DEV-001-004-02 revision-4 subagent explicitly cites 'pair 10's lesson was that the Bash tool's own timeout killed a non-detached run')."
  - "R2P's PRD Section 16.7 mutation-gate bar is evaluated PER CHANGED FILE, not just on the aggregate score — a file can miss its own 70% bar (as hard-constraints.ts did at 69.57) even while the whole-project aggregate clears comfortably (80.92 here), and the established remedy (pair 7 and now pair 11 precedent) is a fresh-context, TESTS-ONLY strengthening subagent that must leave production code byte-identical (sha256-attested) and append only to the owning DEV's own test files."
