intent_core: |
  next_action: Turn on /acos-oracle-protocol oracle for a real session and watch it with follow
  project: Skill Workshop
  decisions: |
    - Built THE ORACLE: a real AI at the permission door. Opus reads each gated tool
      call in context and answers allow/deny; Zee is never asked. Runs as a launchd
      daemon over a 0600 unix socket, judging via the Claude Code CLI in headless
      mode (subscription, never ANTHROPIC_API_KEY).
    - THE BAR IS HARM, NOT NEED. Zee: "give permission to everything unless it is
      truly going to cause harm to my system"; "just because an operation is outside
      the work directory doesn't automatically mean it is harmful... touching keys or
      credentials could be necessary too". There is deliberately NO hardcoded
      deny-list — his point was that a rule list defeats having an intelligent judge.
    - NEVER UNREACHABLE, five layers: live socket -> auto-start the daemon -> call
      the judge directly with no daemon at all -> retry with backoff -> and only then
      DENY, naming exactly what broke. It never silently allows what it has not
      judged.
    - FOUR SETTINGS AS WORDS, only one ever on: 1-10 (the dial), autopilot, yolo,
      oracle. 11 and 12 were removed from the interface — they were never rungs (one
      runs a loop, one switches the rules off) — and survive only as internal
      thresholds. Choosing any setting clears the others.
    - autopilot, yolo and oracle each REQUIRE a goal. A missing goal no longer
      refuses: oracle-ctl exits 3 (NEEDS_GOAL) and the SKILL reads the conversation
      to write a real one, asking with a multiple-choice question if it is still
      unclear. The goal is EVIDENCE about harm, never an "is it on-task" test.
    - The old separate "autopilot on" command is absorbed into the autopilot setting;
      it delegates to autopilot-activate.py rather than reimplementing it.
    - All 7 dial skills are now REAL folders in ~/.claude/skills. /research and
      /investigate were symlinks into ACOS 3.0 and were not discovered outside it.
    - Pushed to PERSONAL: ACOS 3.0 ee8be86, 9367960, 66b7b71; skills repo 4530308.
  rejected_alternatives: |
    - Falling back to YOLO when the Oracle is unreachable — rejected by Zee: "in that
      case, having the oracle mode would be useless". The last layer denies instead.
    - A hardcoded list of harmful commands — rejected by Zee: "if I have to decide
      what is harmful then what is the point of having an intelligent AI watching
      over?"
    - Shadow mode first (log what it WOULD decide for a week) — I recommended it
      twice; Zee declined both times: "no shadow mode, I know it will not fail me".
    - Putting the Oracle at threshold 12 — rejected: the dial measures LOOSENESS and
      the Oracle is not looser, it is judged. It became a switch.
    - Hand-writing the autopilot sentinel — rejected after it broke session scoping.
  traps: |
    - THE ORACLE HAS NEVER RUN LIVE. Every part is tested in isolation and the pieces
      are proven, but no real session has ever had oracle mode switched on. That is
      the next action.
    - LIVE DEFECT, NOT FIXED. A message that merely MENTIONS /simple in ordinary
      typed text now sets a reading level, because _ONESHOT_COMMANDS was widened to
      all seven dial ids. Reproduced 2026-08-13. No fix chosen.
    - /investigate has only ever answered at depth 1. Depths 2-5 have passing unit
      tests but have never produced a real answer, and the panel path was broken
      until 66b7b71 (an overlay carrying probe-charter.md but not
      researcher-charter.md silently gave panel seats the WEB charter).
    - The /investigate templates exist TWICE — in ACOS 3.0 and in ~/.claude/skills.
      They are identical today. Both must carry probe-charter.md AND
      researcher-charter.md or resolveTemplate now throws.
    - THREE OTHER SESSIONS have autopilot ON in this project folder. They predate
      this session's work. Run `autopilot-activate.py list` to see them.
    - ~/.claude/skills now has node_modules/ gitignored. A `git add -A` there once
      swept in 1036 files / 256,712 insertions; caught before pushing.
    - ACOS 3.0 still has ~137 dirty files that are NOT from this session.
  open_questions: |
    - Does the Oracle behave well over a whole real session? Latency was 8.3s to 32.6s
      per judged call in testing, and only gated calls are judged, but nobody has
      lived with it yet.
    - The three other autopilot sessions: are they meant to still be running?
    - No fix chosen for the quoted-mention defect. Options never evaluated — e.g.
      requiring the dial at a line end, or ignoring one inside quotes or backticks.
    - The 137 unrelated dirty files in ACOS 3.0 have never been reviewed or committed.
