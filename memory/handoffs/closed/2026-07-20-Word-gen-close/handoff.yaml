  next_action: Build business-name-finder skill per synthesis/report.md 10-point build plan
  project: ACOS 3.0 — business-name-finder skill research
  decisions: |
    - Ran /acos-swarm-research (10 agents + synthesizer) on how to build a Claude Code skill that generates brandable business names and checks .com availability; final report at .acos/swarm/swarm-20260718-022553/synthesis/report.md (14 findings, 6 adjudicated conflicts, 10-point build plan).
    - Verdict: buildable for $0. Primary check = Verisign RDAP https://rdap.verisign.com/com/v1/domain/<name>.com (404=appears free, 200=taken, 429=back off), optional DoH NS prefilter (negative-only), optional whois cross-check on survivors.
    - Architecture: LLM owns semantics (roots, metaphor, compounds, taste + rubric ranking); bundled scripts own exact letter mechanics (BPE tokenization makes LLMs unreliable there). Skill target: ~/.claude/skills/business-name-finder/ (SKILL.md + scripts/check_domains.sh + references/naming-guide.md).
    - Moved the swarm workspace from FruitSync into ACOS 3.0 per user request.
  rejected_alternatives: |
    - Registrar APIs (GoDaddy/Namecheap/Porkbun/Dynadot) — rejected: money gates, time gates, or IP-whitelist friction and add no availability truth beyond RDAP. Keep only as optional premium-price enrichment on <=5 finalists.
    - Zone files / CZDS / bloom filters — rejected: heavyweight (approval + ~23GB daily) and overkill at 20-200 names/run; still need RDAP confirm anyway.
    - rdap.org redirector — rejected: live-verified it just 302s to Verisign; query Verisign directly for .com.
  traps: |
    - Subagents CANNOT write findings/report files (harness blocks report-file writes) — the parent session must Write each agent's returned text itself.
    - Never report an RDAP 404 as flatly "available": reserved and premium/aftermarket names 404 too. Output tri-state AVAILABLE/TAKEN/UNKNOWN, timestamped, "confirm at checkout"; re-verify the winner at decision time.
    - Domain availability is NOT trademark clearance — pre-screen + disclaimer only, never say "cleared"; WIPO Global Brand Database bans automated querying (link only).
    - Do NOT use debunked lore (Chevy Nova, Powergen-Italia) in skill prompts/docs; use Pajero/Fitta/Fartfull and expertsexchange/therapistfinder instead.
  open_questions: |
    - Verisign RDAP true rate-limit ceiling is unpublished; empirically probe 100-200/min before fixing script concurrency (live tests passed ~7.5 QPS but that is not the ceiling).
    - Whether ${CLAUDE_SKILL_DIR} glob-matches inside allowed-tools for personal skills is unverified — fall back to coarser Bash(bash *)/Bash(curl *) if not.
