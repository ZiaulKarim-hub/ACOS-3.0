intent_core: |
  next_action: Write the Hideout addendum: verify the budget gap, size the loan at 70% of hard costs
  project: OKOA Works — Hideout construction loan analysis + Broadbent parcel hunt
  decisions: |
    - Underwrite 11451 N Fox Hollow Ct as HIDEOUT, not Park City. The request arrived titled
      "Park City, UT" but the property is in Hideout, Wasatch County. Hideout median sale price
      is $1,861,487 (June 2026, down 5.7% YoY) against Park City median asking $2,695,000.
    - As-completed base case is $2,660,379, not the borrower's $3,100,000. Method: median $/sq ft
      of the FOUR size-matched Soaring Hawk comps (3,200-3,900 sq ft) = $803.44, x 3,500 sq ft,
      less 5.4% — the average of three price cuts the subdivision is publishing right now
      ($455,000 / $149,000 / $100,000). Evidence-based haircut, not an invented one.
    - At that value LTV is 62.1% and at the low case 64.6%, so the inflated value is a sizing
      and disclosure problem, NOT a reason to decline. Report delivered as a 7-page PDF.
    - Hard-cost split for Zach's 70% question EXCLUDES 10 line items: 1, 2, 3, 4, 5, 45, 47,
      52, 53, 54. That yields $1,183,000 (Budget column) or $1,367,000 (Remaining column).
      Land improvements (7, 10, 42, 43, 48, 49, 50) stay IN as hard cost.
    - Revised reading of the $664,000 budget gap: the "Remaining" column is most likely a
      MISLABELLED second/revised budget, not an overstatement. Under that reading true cost
      to build is $1,913,000, not $1,819,000. Stated as best fit, not proof.
    - Broadbent/Springville current collateral is 14 parcels per the recorded Amendment to
      Trust Deed ENT 91465:2025 (21 Nov 2025), not the 11 in the original Trust Deed
      ENT 21997:2024. Three parcels were split by the county into six.
  rejected_alternatives: |
    - Using the 4,000+ sq ft Soaring Hawk comps to set value — they sit on better view
      positions with deeper finishes, so they would flatter the subject. Size-matched only.
    - Treating excavation, flatwork, driveways and retaining walls as land — rejected. Raw
      dirt is not a hard cost, but work performed on it is.
    - Asserting 21:096:0020 in Okoa Partial releases.xlsx is a typo for 21:096:0027 or 0028 —
      the pattern fits but the 178-file set does not prove it. Left flagged, not resolved.
    - Sizing the loan off total project cost ($1,819,000, which includes land) — Zach asked
      for hard costs specifically, which deliberately excludes the land cushion.
  traps: |
    - Parcel numbers appear in BOTH colon (23:028:0004) and hyphen (23-028-0004) formats.
      Searching one format alone MISSES every title and recording document. Cost me a full pass.
    - Recorded deeds of trust are image-only scans with no text layer. ocrmypdf --force-ocr is
      required; that is where the current 14-parcel list was hiding.
    - Property Info/Lakeside Springville.pdf and Property Info/Lakeside Vicinity Map.pdf are
      0 bytes. Their "-1" twins are the real files and hold no parcel numbers.
    - The construction budget PRINTS "Remaining Budget = $1,249,000" at its foot. That is
      total minus paid. It is NOT the sum of the Remaining column, which is $1,913,000.
    - Two fully-paid lines (47 Lot Cost, 2 Building permit) still show a remaining balance.
      That contradiction is the evidence the column heading is wrong.
    - The comps attachments the broker cites ("Comparables for Completed Value_List" and
      "_MAP") were never sent. The entire $3,100,000 rests on documents not in the folder.
    - Utah is a NON-DISCLOSURE state: closing prices are not public record. Most sold listings
      show only a last asking price. Redfin/homes.com block WebFetch; use the Chrome extension.
    - The site plan and survey are titled "Vazquez Residence" (client Cecilio Vazquez), not the
      named borrowers. Drawings dated 30 June 2022, survey 9 February 2022.
  open_questions: |
    - Which budget column governs? The broker has not been asked. Everything downstream of the
      70% sizing depends on this single answer.
    - Does the general contractor fee count INSIDE hard costs? It swings the 70% answer by
      roughly $272,000. On the Golden Eagle/Uribe deal OKOA refused to fund the 15% fee at all.
    - What is Zach's own definition of hard costs? Mine is stated but unconfirmed by him.
    - Is 21:096:0020 (Village 7, Okoa Partial releases.xlsx) real, or a slip for 0027/0028?
    - The delivered report said the request "fits without resizing" at 65% of base-case value.
      The 70%-of-hard-cost test points to roughly $977,100-$1,249,435 instead. Which basis
      OKOA sizes on is unresolved, and the recommendation changes with it.
