intent_core: |
  next_action: Verify /compact eternity flow + watcher-kill fix both work at next real handoff
  project: ACOS 3.0
  decisions: |
    - Raised the Eternity Protocol auto-fire threshold from 400,000 to 500,000
      tokens in config.yaml, anchored to Anthropic's own documented example
      value for Claude Code's built-in autoCompactWindow setting (100k-1M range).
    - Swapped the cmux Eternity Protocol's reset command from /clear to /compact
      in eternity-cmux-inpane.sh Priority 1 — /compact keeps the same session id
      (confirmed empirically via real compact_boundary markers in saved
      transcripts), closing the entire "wrong session's handoff got loaded" bug
      class that consumed hours of debugging earlier tonight.
    - Widened the SessionStart hook matcher in ~/.claude/settings.json from
      "clear" to "clear|compact" for eternity-cmux-resume-inpane.sh, after
      confirming via Claude Code's own official docs that SessionStart fires
      with source:"compact" too, and that pipe-separated matchers are valid
      syntax.
    - Built gather-candidate-learnings.py (new file, ACOS 3.0 scripts/resurrection/)
      — a KB-A cross-cycle capture step wired into Step 2a of this very
      safe-close skill, so learnings from every /clear cycle since the last
      close get folded in, not just what the closing session personally
      remembers. Tested against synthetic handoffs and against all 97 real
      handoffs on disk with zero errors.
    - Added Step 2.7 to acos-resume-prompt/SKILL.md: captures the user's exact
      last real message verbatim (not a paraphrase), alongside the existing
      summary — filtered against synthetic/system-injected pseudo-messages
      (Stop hook feedback, command-message wrappers, task-notifications,
      tool_result-only turns). Filter logic unit-tested against a synthetic
      transcript before landing.
    - Fixed a real correctness bug in token-watcher.py's _update_cmux_status():
      a failed `cmux set-status` call used to get marked as succeeded anyway,
      with zero trace — now only marked on a confirmed returncode==0, and every
      failure is logged.
    - Amended daemon-repo commit 8eefbfc -> d8ba753 to remove a false "reproduced
      a 3-hour gap on 2026-08-08" claim that had already been debunked by real
      message timestamps (actual gap: 4 seconds) before the commit was written.
    - Diagnosed and fixed the Logo Builder cmux pane showing a frozen, wrong
      token count (3.8k instead of the real ~276,400). Root cause: cmux's
      `set-status` command targets a WORKSPACE, not a pane surface directly (a
      surface is resolved to its containing workspace once and cached), and a
      prior session's watcher process for that same pane was never stopped when
      the pane handed off to a new session (fec689b9 -> b26287de, both on
      surface E8EDC962...). The dead session's last write (a stale low number)
      stayed on screen because cmux keeps showing a status value forever until
      something newer replaces it. Fixed live by pushing the correct number by
      hand, then patched register-session-pid.sh so every new session now kills
      any other watcher still bound to the exact same cmux surface at startup —
      the same eviction pattern the script already used for a different file
      type, just extended to cover watcher processes too. Verified: bash -n
      clean, bin-manifest.sha256 regenerated (12 entries, 0 mismatches). Swept
      all 8 live panes: Logo Builder was the only one broken.
    - Corrected a factually wrong prior learning in this project's knowledge
      store: "every file under acos-token-monitor/bin/ is a symlink" is FALSE —
      checked live tonight, only eternity-protocol-core.sh is a symlink; the
      other 11 files (including register-session-pid.sh) are real files that
      can be edited directly.
  rejected_alternatives: |
    - Considered replacing the resume note's summary entirely with the user's
      verbatim last message — rejected in favor of adding it ALONGSIDE the
      summary, since a bare last message with no surrounding context can be
      confusing, and an Eternity Protocol fire mid-autonomous-work may have no
      clean "still open" question at all.
    - Considered renaming the `.clear-fired-<sid>` / `.clear-requested-<sid>`
      marker files to `.compact-fired-`/`.compact-requested-` for naming
      accuracy after the /clear -> /compact swap — rejected because
      `.compact-fired-<sid>` is ALREADY a real, differently-scoped marker used
      by token-watcher.py's separate generic/Warp-path fire-guard; renaming
      would have created a silent collision between two unrelated markers, not
      a fix. Comments were added instead to explain the naming mismatch.
    - For the Logo Builder status bug, user was offered "just kill the stuck
      process" (one-time fix only) vs. "kill it and also patch the spawn script"
      — chose the patch, since the same collision will recur on every future
      handoff, in any pane, without it.
  traps: |
    - The daemon's bin/ scripts under
      `~/Library/Application Support/acos-token-monitor/bin/` are MOSTLY real
      files, NOT symlinks — only eternity-protocol-core.sh is a symlink into
      this repo. Check with `readlink` per-file before assuming; do not treat
      the whole directory as one symlink farm (an earlier learning claimed this
      and was wrong).
    - `acos-resume-prompt/SKILL.md` (and likely other eternity-protocol skills)
      exist as TWO separate copies: global (`~/.claude/skills/`) and
      project-local (this repo's `.claude/skills/`). They can silently drift —
      confirmed live tonight, one copy had a session-id-resolution fix the
      other lacked. Always `diff` both before editing either, and keep them in
      sync after every edit.
    - There is an integrity manifest at
      `~/Library/Application Support/acos-token-monitor/bin-manifest.sha256`
      that a (currently dormant, not launchd-registered) launcher script checks
      before starting the token-watcher daemon — it fail-CLOSES on a mismatch.
      Regenerate it after any bin/ edit (see the launcher's compute_bin_hashes()
      for the exact format: sorted plain filenames, sha256 hex, no leading dot).
    - Whether `/compact` drops an active Claude Code `/goal` the same way
      `/clear` does is UNCONFIRMED — the existing goal-rearm safety net
      (Priority 1.4 in eternity-cmux-inpane.sh) was deliberately left active
      either way rather than assumed unnecessary.
    - acos-eternity-protocol/SKILL.md's own "Architecture" diagram still
      describes an older, apparently-superseded detached-daemon RPC-injection
      design (inject-via-cmux.py via kqueue) that the in-pane Stop hook
      (eternity-cmux-inpane.sh) appears to have replaced in practice. This was
      flagged in the skill's own frontmatter description, NOT rewritten —
      treat eternity-cmux-inpane.sh / eternity-cmux-resume-inpane.sh as the
      real source of truth, not that diagram.
    - `cmux set-status` has NO --surface flag — it only targets --workspace.
      token-watcher.py resolves a session's surface to its containing workspace
      once (_resolve_cmux_workspace) and caches it. A status value, once set,
      persists on screen forever until a NEW value is pushed — a dead watcher's
      last number can sit there indefinitely with nothing wrong-looking in any
      log to flag it, unless you compare it against the session's own live
      transcript by hand.
