  project: Word-gen — AI-terminal / business-name domain search (via /acos-domain-finder)
  decisions: |
    - Delivered 100 Greek-root 2-syllable names with an AVAILABLE .com, in
      research/acos-domain-finder-greek-roots-2026-07-25/ (3 .xlsx + 3 .csv + REPORT.md).
      Main file: greek-roots-100-available-2026-07-25.xlsx (100 names), plus an appendix
      workbook of 166 more available names and a rejected workbook of 28 with reasons.
    - Generation method = naming-craft Part 6d: seed from a Greek-rooted English word that
      already has a MID consonant cluster (cosmos, tactic, tympan, gnomon), mutate 1-2
      letters into a non-word that still echoes the source, keep CVCCVC / 6 letters /
      hard-consonant end. 55 of the 100 are CVCCVC mid-crunch.
    - Ran TWO rounds (Phase 7 loop). Round 1: 530 checked -> 77 available (14.5%).
      Round 2 retargeted to RARE Greek seeds + c/m/l/r/t endings: 438 checked -> 217
      available (~50%). Totals: 968 .com checked, 294 AVAILABLE, 674 TAKEN, 0 UNKNOWN.
    - Applied an anti-sameness cap of 3 names per Greek seed, so the 100 span 47 seeds.
    - Implemented the famous-mark gate as a RULE (edit distance <=2 against a ~110-entry
      famous-mark list) rather than a hand-written name list.
  decisions_more: |
    - Top of the ranked list: praxut (2/2/2, no archived history), symdol, tacnic, tacric,
      glypar, tactuc, tympun, cyclol, dactur, mantog.
    - Helper scripts written in TypeScript and run with bun, per the TS/Rust-over-Python
      rule; they live in the session scratchpad, not in the repo.
