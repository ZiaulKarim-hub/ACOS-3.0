intent_core: |
  next_action: Feed the statusLine token number to the Eternity Protocol so rotation cannot mute firing
  project: Skill Workshop
  decisions: |
    - Closed the acos-communication-tracker privilege/litigation gap BY POLICY, not by code.
      Zee chose "build nothing; keep the watcher manual-only": no privilege scanner, no
      sender/label exclude-list. The control is a human present for every sweep; the Phase 7
      watcher is never started and left alone. Residual risk knowingly accepted. Written to
      memory/decisions/2026-08-10-communication-tracker-privilege-policy.md and to SKILL.md.
      DO NOT RE-ASK — this was carried open across three prior closes and is now settled.
    - Built the cmux sidebar token pill on Claude Code's statusLine instead of the outside
      daemon. Reason: Claude Code executes statusLine, so it lives exactly as long as the
      session (no start-order race, no orphan pill), and it inherits CMUX_SURFACE_ID and
      CMUX_WORKSPACE_ID from the pane env, skipping the list-workspaces walk that
      _resolve_cmux_workspace did and that returned None silently on any failure.
    - Reproduced token-watcher.py's work-in-progress formula VERBATIM in the new script
      (approx = total_input + latest_output + trunc(rolling avg delta); window 10, cap 8000)
      so the displayed number and the number the Eternity Protocol fires on cannot diverge.
    - Scoped the sidebar status key to the pane: tokens-<surface8>. cmux set-status is one
      slot per key per workspace with silent last-write-wins, so a shared "tokens" key means
      panes overwrite each other. Proven live: Skill Workshop holds TWO Claude panes.
    - Handed pill ownership over via a marker file checked PER CALL
      (~/.claude/statusline/state/OWNS_PILL), not a startup flag, so the hand-off is
      reversible by deleting one file without restarting eight long-lived daemons.
    - Left every running watcher alive on purpose. Only the pill was handed over; threshold
      firing, LAST_TOTAL and the resume machinery are untouched.
  rejected_alternatives: |
    - Restarting the 8 running watchers so they would pick up the OWNS_PILL guard — rejected:
      a watcher whose startup baseline is already over threshold fires the Eternity Protocol
      immediately via its COLD-START FIRE GATE. Several sessions are above 400k. Too risky.
    - Keeping the shared "tokens" key and relying on the statusLine to out-write the watcher —
      rejected: that is last-write-wins churn, which is the original bug, not a fix.
    - Clearing the legacy "tokens" pill on every statusLine run — rejected: it would fight a
      still-running watcher and make the pill flicker. Cleared ONCE per session instead.
    - Porting acos-dataroom-v2's dr2-privilege-scanner (three blind readers, asymmetric veto),
      a deterministic law-firm/counsel exclude-list, or both layered — all rejected by Zee on
      build cost and per-thread model cost. This is the closed privilege decision above.
  traps: |
    - ROLLING_WINDOW = 10 and DELTA_CAP = 8000 now live in TWO files: token-watcher.py lines
      90-91 and acos-statusline.ts. Changing one without the other silently re-opens the
      divergence the port was written to close.
    - The OWNS_PILL guard only affects watchers started AFTER the patch. Eight were already
      running when it landed, so Skill Workshop's legacy pill keeps reappearing this session.
      That is expected transition behaviour, NOT a bug. It clears for good at next session start.
    - A cmux surface identifies the PANE, not the session. A /clear mints a NEW session id
