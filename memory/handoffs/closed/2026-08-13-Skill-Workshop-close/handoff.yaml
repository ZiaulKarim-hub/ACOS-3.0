intent_core: |
  next_action: Run /investigate at depth 3 to exercise the panel and gate paths, never yet tested
  project: Skill Workshop
  decisions: |
    - Built /investigate as the INWARD twin of /research, REUSING the
      acos-research-riffs engine instead of writing a new one. The reuse is viable
      because Provenance.url is OPTIONAL while `source` is required
      (lib/ledger.ts:38-43), so `path/file.ts:120-134` drops straight in; dedup
      already keys on `s.url ?? s.source`; and nothing in the engine throws on a
      missing url. The Tier 1-2 trust gate that fights web research passes
      naturally here — reading the artifact IS the primary source.
    - RIFF_TEMPLATE_DIR overlays charter templates per FILE with fallback to the
      engine's own templates/ (lib/panel.ts resolveTemplate). Unset env is
      byte-identical to the prior behaviour, so the engine change is additive.
    - Command position is handled by ONE cut rule: strip the command token and its
      depth number, and whatever text remains — before, after, or both — is the
      target. joinTarget() implements it. One rule covers trailing/leading/mid so
      there is no per-position special case left untested.
    - Readers dispatch as `Explore` subagents, which have no Edit or Write tool, so
      the charter's read-only rule is enforced mechanically rather than by prose.
    - `handoff` is null at EVERY depth, unlike /research whose level 5 hands to
      acos-research-riffs. There is no larger inward engine; level 5 is the ceiling
      and compiles its own report.
    - Committed 71ca4a1 and pushed to PERSONAL (ZiaulKarim-hub/ACOS-3.0), scoped to
      only this session's 7 files.
  rejected_alternatives: |
    - Whole-directory template swap for RIFF_TEMPLATE_DIR — rejected: it forces
      every overlay to vendor all five charters, and adding a sixth template to the
      engine later would silently break every overlay that predates it.
    - Writing a fresh internal research engine — rejected: the valuable part is the
      bookkeeping (claims, dedup, source tiers, the gate) and it is already
      source-agnostic. One optional field is why reuse was cheap.
    - /research's rule that text AFTER the command replaces the topic — rejected for
      the mid-sentence case: it silently discards the first half of the question.
    - Committing all 123 dirty files — rejected: about 120 predate this session and
      were never reviewed here. Only the 7 authored files were staged.
  traps: |
    - RIFF_TEMPLATE_DIR must be exported in EVERY bash block that renders a charter.
      Miss it and the engine silently renders the WEB probe charter — readers go
      searching the internet instead of reading files. There is NO error; the
      failure is silent and looks like a working run.
    - `riff` must be a shell FUNCTION, not a string variable. The interactive shell
      is zsh, which does not word-split an unquoted variable.
    - A pass tally without an exit code lies. The first test-riff.ts run printed
      "528 passed, 0 failed" but a pipe swallowed the exit code; it had to be re-run
      without the pipe to get a real 0.
    - `origin` on this repo is the WORK account (okoateam). A bare `git push` sends
      personal work to the work account. Always name `personal` explicitly.
    - Only investigate-plan.ts is unit-tested. The multi-step orchestration in
      SKILL.md is prose and cannot be checked by `bun test`.
  open_questions: |
    - Depths 3, 4 and 5 have NEVER been exercised — the panel, the coverage gate,
      the compiler, the citer and the report paths are all unproven. Only depth 1
      has run end to end.
    - The depth-5 citer must re-open each cited file and confirm the quoted lines
      still say what the claim says. That behaviour has never been run.
    - Whether the mid-sentence join rule is right, or should instead match
      /research's replace rule. Zee chose join; it is untested against real usage.
    - Coverage on the one live run came back "thin" (1 reader, 14 novel claims
      against a cap of 8). Unknown what a non-thin internal investigation looks like.
