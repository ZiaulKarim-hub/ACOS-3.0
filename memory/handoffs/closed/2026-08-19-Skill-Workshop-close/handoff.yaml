      claude, rather than accept DELIVERY NOT-VERIFIED on every open. Built and MEASURED
      — the shell prints the reentry between BEGIN/END markers before `exec claude`, and
      Claude Code renders inline so the markers survive in scrollback.
    - Implemented in launch-project.sh: new default command (claude), --focus-existing to
      opt into the old jump behaviour, --label for window naming with auto-numbering
      otherwise, join-back now finds the NEW workspace id (two windows share one key tag),
      finalize renames to THIS window's name and records window_name in the audit.
    - NEW script open-picks.sh (166 lines): resolves a whole pick list against a FRESH
      book, ALL-OR-NOTHING (one bad token opens nothing), then calls launch-project.sh
      per row. Exit 2 on refusal, 3 if any open was not delivery-verified.
    - SKILL.md rewritten: Steps 2-4 now route every pick through open-picks.sh; adopt is
      demoted to the opt-in verb `adopt <n>`.
    - BUG FIXED during the build: launch-project.sh resolved the reentry by newest file in
      the folder with NO ownership check. Now uses bundles_lib.resolve_reentry.
    - R2P consolidation PLANNED but NOT EXECUTED (needs Zee's yes): keep row
      048824ec-e271-4d0f-8e82-7c322194d2c1 ("R2P", rooted /Users/zee/Documents/Vibe
