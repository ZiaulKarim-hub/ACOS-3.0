  project: Skill Workshop
  decisions: |
    - Zee's Rules 1-4 for the Resurrection Protocol (2026-08-19). Rule 1: a pick may be
      a LIST ("2, 5, 7, 9" opens all four). Rule 2 (2026-08-18): every pick lands in the
      project's OWN folder. Rule 3: re-opening an already-open row gives it ANOTHER
