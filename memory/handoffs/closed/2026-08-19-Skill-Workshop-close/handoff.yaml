  traps: |
    - Book pick numbers are PER-RENDER. In this session 11 was "Resurrection Protocol" in
      one render and "OKOA Works" in the next. Never resolve a pick against a stale render.
    - `--dangerously-skip-permissions` does NOT bypass the folder trust prompt. In a folder
      Claude Code has not been trusted in, it stops at "Quick safety check" and the reentry
      is never read. launch-project.sh detects it and prints TRUST GATE DETECTED, and that
      line can appear ALONGSIDE a verified marker — note reached the screen, claude has not.
    - Under Rule 3 the [key:<uuid>] tag is no longer unique across workspaces. Any join-back
      that takes "the last tagged workspace" can return a sibling window instead of the new
      one. launch-project.sh now diffs against the tagged set captured BEFORE create.
