      d86cf151-0897-4641-8def-cc5ff6f4d844.
  rejected_alternatives: |
    - Receipt option (b) — accept opens with no delivery proof and print DELIVERY
      NOT-VERIFIED loudly. Rejected by Zee; he asked for the real receipt instead.
    - Reading "merge all the branches" as git branches. R2P has 11 worktree-agent-*
