intent_core: |
  next_action: Ask Zee to pick option 1, 2 or 3 for the Thurston Reserve/carve-out conflict
  project: ACOS 3.0 — LinkedIn/blog anti-duplicate archive + open OKOA decisions
  decisions: |
    - Built content-archive.ts: a persistent post archive plus a novelty gate, so
      "not a repeat of a prior run" is verified instead of merely asserted. TypeScript
      on bun, zero dependencies, no network. Mirrors check_recency.py's fail-closed
      contract on a different axis: recency asks "is the SOURCE fresh?", novelty asks
      "is the POST new?".
    - Zee's standard (this session): the unit of comparison is the WHOLE POST PLUS ITS
      ARTICLE, and the test is "have we already sent this MESSAGE?" — not "have we
      already used these words".
    - Same source article is NO LONGER an automatic block. It returns REVIEW, which
      prints both texts in full and requires a written rationale to clear. Reason: a
      genuinely different take on the same piece is not a repeat, and the Phase 2
      recency cap (article mode 7 days; other modes 14) already makes reuse rare.
    - Saving every batch is now MANDATORY, not opt-in. The old skill had an optional
      save that had never once run — the LinkedIn folder did not exist on disk.
    - Retry budget: 3 rounds per post, each differing IN KIND (rewrite the opening ->
      new take on the same topic -> different angle -> drop), plus a batch-level stop
      if more than one third of a batch blocks on the first pass. Reasoned starting
      points, NOT measured optimums; revisit after ~5 real runs.
    - Archive seeded with 55 historical posts Zee supplied, then a live run added 10.
      Archive now holds 65 posts across 6 runs, all status draft.
    - Ran /acos-linkedin-posts mixed mode 10 posts on 2026-07-28: both gates passed on
      the FIRST attempt, zero redrafts, 10/10 NEW. Saved as li-2026-07-28-01..10.
  rejected_alternatives: |
    - Blocking on content-word overlap alone — rejected. Two honestly different posts
      about a recurring topic (the maturity wall, the Fed) legitimately share most of
      their vocabulary, so blocking on it would kill legitimate drafts. It is REVIEW
      or WARN, never an outright block.
    - Keeping the hard block on article reuse — rejected by Zee explicitly. The
      standard is "same message", not "same link".
    - A new ~/.claude/skills/_shared/ directory for the tool — rejected. No such
      convention exists in that tree; the tool was housed in the skill that owns the
      duplicate problem instead.
    - Python for the dedup tool — rejected per the standing TypeScript/Rust default.
      check_recency.py stays Python because it already existed.
  traps: |
    - content-archive.ts lives in acos-linkedin-posts but is SHARED: acos-auto-blogger
      calls it by absolute path. Deleting or moving that skill breaks auto-blogger
      Phase 6.5 and Phase 9. Documented in both SKILL.md files.
    - The 55 seeded post dates are INFERRED from each batch's own content, not given.
      They affect reporting windows only, never the duplicate check, which compares
      text and links. Ask Zee before treating any of them as fact.
    - All 65 posts carry status draft. Zee never confirmed which were actually
      published, so the monthly report shows zero posted. That is expected.
    - Both archive stores are LOCAL git repos with NO remote and the tool never
      pushes. Never push without asking which account first: okoateam (work) or
      ZiaulKarim-hub (personal).
    - Web search returns "2026 outlook" pages that are actually dated January or
      March. 28 of 42 candidate URLs failed the recency gate this run. Always gate
      URLs BEFORE drafting against them, never after.
    - Do NOT re-litigate "Anini big house" = 4200 Anini Vista Dr #D. Zee decided it,
      despite a 2026-07-20 meeting using "the big house" for 2818 Kamookoa Rd #1.
    - The ~190 modified files in this git working tree are unrelated leftovers from
      PRIOR sessions. Nothing from the OKOA business threads belongs in this repo.
  open_questions: |
    - THURSTON BLOCKING: Silver Falls (4200 Anini Vista Dr #D) and the Sundance Big
      Cabin are BOTH Reserve Sale Properties carrying mandatory acceptance of bona
      fide offers at or above Reserve Price, whose refusal is a Milestone Default —
      which cannot coexist with their new 90-day carve-out protection. It also strands
      the Day 90 milestone, since only 17 Dorado Beach Estates stays freely forceable.
      Three options are in CHANGE NOTE 20260728.md section 2.1; option 3 (mandatory
      acceptance starts Day 91) is most internally consistent but was NOT applied.
      Documents must not go out until Zee decides.
    - Sundance Big Cabin address is an ASSUMPTION: 3060 E Deer Run Rd ($7,000,000)
      chosen over 3093 E Deer Run Rd ($5,000,000), based on a "$7 million" remark on
      the 2026-07-20 call. Confirm before sending.
    - Thurston rate mechanics, PRE-EXISTING and unresolved: the term summary frames it
