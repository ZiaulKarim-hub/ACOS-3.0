intent_core: |
  next_action: Ask Zee: commit the two untracked hook scripts, then guard placeholder handoffs.
  project: ACOS 3.0 — Eternity Protocol native auto-compaction + /investigate defect fixes
  decisions: |
    - Eternity Protocol fires through Claude Code's OWN auto-compaction, not typed
      keystrokes. autoCompactWindow: 533000 in ~/.claude/settings.json puts the fire
      point at 500,000. Verified live end-to-end on three panes this session.
    - Handoff DEPTH is restored in two passes, after Zee pushed back on losing it:
      PostCompact pastes the real model-written compaction summary into the handoff
      (no extra model call), then SessionStart(compact) asks the resumed session for
      the judgement fields. pending -> summary-written -> deepened.
    - The duplicate-resume bug is fixed by teaching _resume_landed about the pane's
      INPUT QUEUE, with a new exit code 3 = "queued, not consumed yet" whose caller
      WAITS. Bounded by RESUME_QUEUE_WAIT=420, which must exceed the 283220 ms
      worst-case compaction measured live.
    - The native-arm pane lookup now resolves the pid from the pid-<sid> state file,
      then asks that process for its own lstart. The command line is only a fallback.
    - /investigate defect 1 (panel seats got the WEB charter): Zee chose the overlay
      file PLUS an engine guard. templates/researcher-charter.md is the inward twin,
      and resolveTemplate now throws when an overlay carries probe-charter.md but not
      researcher-charter.md.
    - /investigate defect 2: Zee chose normalising `role` on INGEST (setPanel and
      addSeat), so the stored file agrees with the declared lowercase SeatRole union.
    - /investigate defect 3: Zee chose a FOURTH option proposed mid-conversation —
      keep both payload shapes exactly as they are, and only make the refusal message
      name the count and both ways out.
  rejected_alternatives: |
    - Letting `panel add` accept a full array — rejected: `panel set` REPLACES the
      roster and drops approval while `panel add` appends one seat that is live
      immediately, and matching payload shapes removes the last cue they differ.
    - Letting `panel add` accept a single-element array — rejected: Zee's real failure
      was a list of TWO, so it would not have helped him; only the message would.
    - Counting a QUEUED resume send as "landed" — rejected: a queue dropped before
      consumption would then look like success, which is the failure the retry exists
      to catch. The queue-pending state waits instead.
    - Normalising `role` only at the two comparisons in validatePanel — rejected: the
      seat would still be STORED as "Generalist" while the type says "generalist".
    - Restarting the six older panes onto native auto-compaction — NOT rejected. It
      remains Zee's call and nothing was restarted.
  traps: |
    - The shell cwd DRIFTS after any `cd` in an earlier block. Re-derive the project
      root at the top of every block; safe-close Step 1 failed once on this exact trap.
    - `pgrep -f -- "--session-id <sid>"` finds NOTHING for a cmux-launched claude pane
      (huge inline --settings blob). And `ps | grep` DOES read the command line but the
      command line carries the LAUNCH session id, which changes at every clear or
      compaction. Measured: command-line grep resolved 3 of 11 live panes; the
      pid-<sid> file resolved 11 of 11.
    - A prompt typed into a BUSY pane is QUEUED and, once consumed, never becomes a
      type:"user" transcript record. It appears only as queue-operation enqueue/remove.
    - Claude Code reads settings.json ONCE, at process start. A running pane never sees
      a settings change; only a restart applies one.
    - The handoff agent writes a 608-byte placeholder handoff first and enriches it
      ~3 minutes later. The eternity Step 1 guard checks freshness, never completeness,
      so it would accept that placeholder.
    - /investigate exists TWICE: ~/.claude/skills/investigate/ and this repo's
      .claude/skills/investigate/. The project copy wins inside this repo. Both were
      missing researcher-charter.md; both are now synced.
    - To verify "what did the hook see when it ran", truncate the transcript at the
      hook's run time and replay. Sampling later gives a false clean result — it did.
  open_questions: |
    - Commit .claude/scripts/precompact-handoff.ts and .claude/scripts/handoff-enrich.ts?
      Both are UNTRACKED (not ignored). A `git clean -fd` would delete the live
      PreCompact and PostCompact hooks and leave the bin/ symlinks dangling.
    - Add a size-and-placeholder check to acos-eternity-protocol Step 1, so a reset
      cannot proceed on a 608-byte placeholder handoff?
    - Restart the six older panes so they gain native auto-compaction? A restart
      interrupts their work. Zee's call alone; nothing was restarted.
    - A full depth-4 /investigate run with real dispatched reader agents was NOT run.
      The three checks Zee named were all verified without it.
