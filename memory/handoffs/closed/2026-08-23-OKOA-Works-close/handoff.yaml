  traps: |
    - .page has overflow:hidden, so content past the edge is SILENTLY CROPPED in the
      PDF. Always run `bun measure.ts` before shipping; it reports exact per-page pixel
      overflow. Fix by the exact reported amount, never by eye.
    - A container with overflow:hidden HIDES the overflow it causes. The dark band was
      clipping its own labels and measure.ts reported nothing until `flex:0 0 auto`
      stopped the band shrinking — which then exposed real overflow in five versions.
    - Deliberate off-page artwork must carry class "bleed" or measure.ts counts it as
