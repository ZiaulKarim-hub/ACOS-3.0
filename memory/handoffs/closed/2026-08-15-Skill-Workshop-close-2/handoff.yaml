intent_core: |
  next_action: Ask Zee which skill takes his email ziaul@okoacapital.com, then add it there
  project: Skill Workshop
  decisions: |
    - Built /simple, /explain and /dials, and made the whole DIAL SKILL family
      stack in one message. A dial skill is a command appended to a message that
      changes the SHAPE of the reply rather than asking a new question.
    - /simple reuses Eden's existing parse_oneshot_level rather than a new system.
      A bare /simple means one step simpler than the standing dial; 5 is the floor;
      with the dial off it anchors on 3. Documented range is 1-5 — 0 is an OFF
      switch (raw register), kept only because ONESHOT_VALID is shared with
      /conclude's L0.
    - /explain is a COVERAGE dial: five fixed ordered lenses (mechanism, purpose,
      failure, people, analogy); level N uses the first N; exactly one example per
      lens. The per-angle word budget SHRINKS as angles are added
      (110/90/80/70/64), so level 5 has 5x the angles of level 1 but under 3x the
      reading. L5 is 64 words per angle, not 65: at 65 the 4->5 step costs 45 words
      where 3->4 cost 40, i.e. growth accelerating at the rung most at risk of
      becoming a wall of text.
    - dial-registry.ts is the SINGLE source of truth for the catalog. /dials prints
      it; the tests check the shipped skills against it. Seven dials: /simple,
      /explain, /conclude, /short, /research, /investigate, /restate.
    - Stacking enabled by widening _ONESHOT_COMMANDS in eden-level-injector.py from
      ("conclude","simple") to all seven dial ids. Conflict rule (Zee's call):
      when two dials cap the same thing the TIGHTER limit wins, never a refusal.
    - Every dial carries "**Category: dial skill.**" in its own SKILL.md, and
      dial-registry.test.ts fails if any is missing — so the grouping is checkable,
      not just asserted.
  rejected_alternatives: |
    - A FIXED default level for a bare /simple — rejected: it does nothing when you
      already sit on that number. The relative step always acts.
    - Removing 0 from /simple's accepted values after Zee noted the range is really
      1-5 — rejected: ONESHOT_VALID is shared with /conclude's L0, so removing it
      would break /conclude. The DOCS changed; the code did not.
    - Refusing a message whose stacked dials conflict — rejected: it punishes the
      exact habit these commands exist to serve, and the tighter reading is safe.
    - Giving /explain its own hook like /simple has — rejected: nothing grades
      /explain, so a hook would just be a second copy of a rule that already lives
      in the skill file, and hooks run globally on every message so a bug is costly.
  traps: |
    - LIVE DEFECT, NOT FIXED. Widening _ONESHOT_COMMANDS means a message that merely
      MENTIONS /simple in ordinary typed text now sets a reading level. Reproduced
      live 2026-08-13: command-args "3 with no /simple typed sets no level at all."
      bumped the dial from 3 to 4 for that reply. The guard against a skill's own
      BODY still holds (only <command-args> is scanned) — this is about the user's
      own words, which the parser cannot tell from a command.
    - /simple with an out-of-range number (/simple 6, /simple 12) is REFUSED, not
      rounded. It used to fall through to the bare form and silently return 3.
    - The /explain word caps inside dial-registry.ts are a COPY of explain-plan.ts.
      dial-registry.test.ts is the only thing stopping that copy from rotting.
    - Adding a new dial takes THREE edits or the tests fail: DIALS in
      dial-registry.ts, _ONESHOT_COMMANDS in eden-level-injector.py, and the
      Category line in its SKILL.md.
    - ~/.claude/skills is its OWN git repo, separate from ACOS 3.0. Every dial file
      from this session is UNCOMMITTED there. Commit 71ca4a1 in ACOS 3.0 does not
      contain any of it.
    - Check the test EXIT CODE, not the printed tally. A suite that throws mid-run
      still prints a clean count.
  open_questions: |
    - THE NEXT ACTION. Zee asked to add his email ziaul@okoacapital.com to "the
      skill" so updates are reflected in it. Three things are undecided: WHICH skill
      (the dial family has no email role at all), whether the address is merely
      RECORDED or the skill should actually READ that inbox, and whether there are
      other addresses ("my emails", plural). He interrupted the clarifying question
      and closed, so none of it is settled.
    - Constraint on that work: this session is signed in as jason@okoacapital.com,
      the BOSS's account, and the standing rule is never to touch his mail. Reading
      ziaul@okoacapital.com may need a separate account linked first.
    - No fix has been chosen for the quoted-mention defect above. Options were never
      evaluated — e.g. requiring the dial to sit at a line end, or ignoring a /simple
      that appears inside quotes or backticks.
    - /explain has only been exercised at levels 1 and 3 in real use. Levels 2, 4
      and 5 have passing unit tests but have never produced an actual answer.
