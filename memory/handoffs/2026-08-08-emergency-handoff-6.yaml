decisions_made:
  - "No memory/decisions/ ADR was written for this work — it lives entirely under the /goal Stop-hook workflow, not the planning hierarchy, and nothing dated today exists in memory/decisions/ (confirmed by directory listing)."
  - "Screening pipeline, now validated as the standard procedure for every future batch, in order: (a) full-string exact-duplicate test against every existing shape name; (b) word-wise look-alike grep over BOTH names and keywords — this now out-earns the exact-name test alone, having caught e.g. `spatula` as a keyword on Hand tools/putty knife, `plough` on Rural/tractor, `keg` on Containers/barrel, `swallowtail` on Ribbons/forked banner, `turret`/`moat` on Landmarks/castle and drawbridge; (c) a FORM probe organized by SILHOUETTE rather than by subject category — batch 40 lost four shapes because each was checked only against its own family and killed by an unrelated one (`banjo` against Kitchen/frying pan); (d) for pure geometric figures, BUILD FIRST and let shape-audit.ts compare pixels, since vocabulary probes miss same-form-different-word records (`astroid` came back 98.7% alike to Stars and bursts/twinkle)."
  - "The UNFINISHED-SET method is the strongest candidate-discovery lead found this session: dump a sub-category in full and ask what the library started but never finished. It produced zero exact duplicates on two separate uses. It found the missing logic gates (nor, xnor), zodiac signs (virgo, sagittarius, capricorn), a missing planet (mercury), currency symbols (dollar, pound), a missing card suit (club), weather fronts (occluded, stationary), music notation (natural, crotchet rest, segno), and organs (lungs, bone)."
  - "The unfinished-set method's LIMIT was also found this session: a declared set can be unfinished and still correctly be DONE. Three would-be polygon-frame shapes (trapezoid, heptagon, cross) were cut in batch 47 as audit-flagged near-twins, since every polygon frame is a thin polygon outline and the audit already flags rectangle~round-corner at 98.8%."
  - "Families now recorded CLOSED (dumped in full, complete, no further candidates): Technology/Electronics (38 records), Flowchart/Process (18), Transport/Air and space (23), Technology/Power (18). Also effectively closed: the vessel family (amphora/samovar/jar/bottle/wine glass), the brass family (trumpet/french horn/saxophone), the bridge family (bridge/drawbridge/suspension/railway)."

