    (2026-08-04, 6565), references/playbooks/underwriting-ic.md (2026-08-03, 5618),
    SKILL.md (2026-08-04, 12246). Those five came from Claude writing files by hand
    mid-session, NOT from any loop.

  FINDING 3 — The capture loop is not firing.
    references/.last-mined reads "2026-07-17T14:09:09-0600 initial-mine wf_f8fbbfae-2d7".
    It has not moved in 18 days.
    references/.rejected-learnings.md is 0 lines / 0 bytes. Zee has never declined a
    proposed learning, which means he has almost never been offered one.

    Live example from this same session. Six durable facts were produced; coverage check:
