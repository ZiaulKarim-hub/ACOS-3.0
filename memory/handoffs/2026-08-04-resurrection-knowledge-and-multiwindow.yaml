    Nothing checks these. A stale fact is worse than a missing one — it reads as confident.

live_bug_fix_first: |
  MW-A is a real bug, observed live this session, NOT a feature request.

  adopt-project.sh printed, when adopting OKOA Works:
    reentry source: scan of closed/ at adopt time (newest of 24 candidates by mtime)

  It takes the NEWEST closing note by file modification time and ignores every other one.
  With one window per project that is harmless. With several windows on one project, the
  last window to close SILENTLY HIDES the others. No warning, no error, no signal in the
  book. The other threads simply never surface again.

  Multi-window support is UNSAFE until this is fixed. Do MW-A before anything else.

decisions_made: |
  All settled by Zee. Do not reopen without asking him.

  --- STORAGE ---
  D1. Knowledge lives at ~/.acos/knowledge/<project_uuid>/ — keyed by the registry's project
      uuid, NOT by folder root. REASON: several projects share one root. OKOA Works,
      ACOS 3.0 and Resurrection Protocol all root at /Users/zee/Documents/Vibe Coding/ACOS 3.0.
      Folder-keyed storage would merge them into one another.
  D2. It sits BESIDE ~/.claude/skills/acos-okoa-works/references/ and does not replace it.
      The skill keeps its own base; the generic store covers the projects that have no skill.

  --- WHO WRITES, AND WHEN (Zee REJECTED the original default) ---
  D3. REJECTED: "close proposes candidates, you approve each one, nothing written silently."
      Zee's reason, verbatim: "approving each can be tedius and i don't read any of those,
      it may contain technical stuff that I may not udnerstand."
      The design principle this establishes: an approval gate the approver cannot evaluate
      is WORSE than no gate. It creates false assurance and trains click-through.
  D4. ADOPTED: sort every learning by whether a MACHINE can check it.
      Kind 1 — machine-verifiable. File paths, file counts, commands that worked, render
        traps, library quirks. AUTO-WRITTEN, SILENTLY, ALWAYS. Zee is never asked.
      Kind 2 — Zee's own rulings. Business policy, naming, what may leave the building,
        deal facts only he holds. ASKED — but at most TWO questions per session, and phrased
        in plain language about the DECISION, not the mechanism.
        Good:  "You said we never print LendSure on broker material. Make that a standing rule?"
        Bad:   "Record that break-before:page yields blank pages in WeasyPrint?"
      If a session yields no Kind 2 item, Zee gets no question at all.
      Ratio observed this session: 5 of 6 learnings were Kind 1.
  D5. FOUR SAFETY RULES that make silent auto-writing acceptable:
      (a) Evidence or no write. Every auto-written fact carries its source — a path, a
          quoted line, or a command that reproduces it. No working shown, no write.
      (b) Append-only. Nothing is ever overwritten. Facts carry dates; an old fact is
          superseded, never erased. Every bad write stays reversible.
      (c) Staleness re-check. Any fact naming a count, a path or a date is re-verified on
          resurrect. This is what would have caught the 1,305-vs-1,594 drift.
      (d) Review AFTER, not before. On resurrect Zee sees a short plain-language digest,
          "learned since you were last here", and can strike any line with one word.
          Control moves from gatekeeper to editor. That fits how he actually works.
  D6. HONEST RISK, kept on the record: auto-writing means a wrong fact can enter without
      Zee seeing it. The four rules shrink that risk; they do not remove it. It was
      accepted because the status quo fails worse — today nothing is written at all, and
      what did get written has already drifted stale with nobody checking.

  --- SCOPE AND LOADING ---
  D7. Opt-in, not all 42 pickable rows. Start with the ~20 Zee actually reopens
      (tiers OPEN NOW + RECENT).
  D8. On resurrect, load an INDEX plus the digest — not the whole base. Context cost is
      real: the OKOA base alone is 156,622 characters. Deeper files open on request.

  --- MULTI-WINDOW ---
  D9. Several context windows on ONE project is a first-class supported mode.
  D10. The book still shows ONE row per project, with a live-window count.
       Example: "7. OKOA Works (2 open)". Splitting into several rows was explicitly
       rejected by Zee — it defeats the purpose of one accumulating project.
  D11. The one-project-one-tab guard STAYS as the default. It is not removed. But when Zee
       picks a project that is already open, he is ASKED: focus the existing window, or
       open another one. He wants the choice, not the removal of the guard.
       (Current behaviour, for contrast: SPINE 1 forces the jump with no choice —
       adopt-project.sh exits 4 and Step 3 focuses the existing tab.)
  D12. WINDOW NAMING — Zee's instruction, his wording: names derive from the project name,
       "OKOA works *label*". So: "OKOA Works Golden East", "OKOA Works Flyer".
       The project name stays the stem so the row identity is never in doubt.
  D13. ON SAFE CLOSE — Zee's instruction: "when safe closed, the context resolves to the
       original knowledge base." A labelled window's learnings fold back into the single
       per-project store at ~/.acos/knowledge/<project_uuid>/. The label survives only as
       provenance on each fact, not as a separate store.
  D14. Closing ONE window does not park the project. The row stays active while any window
       is open. It parks only when the LAST window closes.
  D15. No hard cap on window count. The book shows the count so it cannot creep up unseen.

  --- PROCESS ---
  D16. Scope of the design turns was "design and plan, stop before changing any file."
       That was honoured. Nothing has been built.

workstream_kb: |
  Per-project knowledge bases. Build order matters — C was deliberately moved up.

  KB-A  THE CAPTURE LOOP.  Kind-1/Kind-2 sorting, the evidence rule, append-only writes,
        the two-question-per-session cap, plain-language phrasing for Kind 2.
        WHY FIRST: nothing else matters if facts are never written.
  KB-C  STALENESS RE-CHECK.  Any stored fact naming a count, path or date carries a
        re-verify command; it runs on resurrect and flags drift.
        WHY IT MOVED UP: it was a nice-to-have while approval was manual. Once writes are
        silent it becomes the SAFETY NET THAT PERMITS SILENT WRITING. Ship it with KB-A,
        not after.
  KB-B  LOAD ON ADOPT.  adopt-project.sh prints the knowledge index plus the
        "learned since you were last here" digest. This is where Zee finally feels it.
  KB-D  BACKFILL.  Mine the 24 existing bundles in memory/handoffs/closed/ into a starting
        base per project, so day one is not an empty folder.
  KB-E  CROSS-PROJECT TAGGING.  A trap learned in one project surfaces in another.
        Needs KB-A..KB-D in place to have anything to link.

workstream_mw: |
  Several windows, one project. Zee approved all five.

  MW-A  MERGE EVERY WINDOW'S REENTRY AT PICK.  Replaces newest-by-mtime with a merge of all
        unconsumed notes for that project uuid.
        MANDATORY AND FIRST — this is the live bug in `live_bug_fix_first`, not an
        enhancement. Multi-window is unsafe until it lands.
  MW-B  WINDOW LABELS IN THE BOOK.  "7. OKOA Works (2 open: Golden East · Flyer)".
  MW-C  SHARED PROJECT BRIEF.  A new window reads what the other windows are doing before
        it starts. This is what stops two windows duplicating work.
  MW-D  MERGE VERB.  Fold one window's thread into another when the work converges.
  MW-E  COLLISION WARNING.  Flag when two windows touch the same file.
        Costed as high and watch-heavy; Claude advised deferring it. Zee said do all five.
        Suggest building it last and behind a switch.

