      cert 1.pdf            NOT KNOWN
      outparcel             NOT KNOWN
      PBA                   NOT KNOWN
      Berkeley Capital      NOT KNOWN
      Occupied Renovations  NOT KNOWN
    Five of six would be lost.

  FINDING 4 — What is stored has quietly drifted stale.
    references/deal-index.md states the Kohan_Golden East folder holds "1,305 files — largest".
    Live count on 2026-08-04: 1,594 files.
    It names one sale data room. Three exist: "Golden East Crossing Sale - Reed",
