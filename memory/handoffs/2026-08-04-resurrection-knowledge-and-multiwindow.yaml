blockers: |
  - MW-A must land before multi-window is exercised, or closing a second window will
    silently destroy the first window's reentry.
  - The Kind-1/Kind-2 sorter is the one genuinely hard judgement in KB-A. Getting it wrong
    in the permissive direction means wrong facts enter silently. Suggest erring toward
    Kind 2 (ask) when the sorter is unsure, and letting the two-question cap drop the
    overflow rather than auto-writing a doubtful fact.
  - Nothing in either workstream has been prototyped. All effort estimates in the design
    conversation were judgement, not measurement.

