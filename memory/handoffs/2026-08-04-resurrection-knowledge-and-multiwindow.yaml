session_summary: |
  A design conversation, not an implementation session. NOTHING has been built yet —
  no script changed, no directory created. This file is the complete brief.

  Zee described the intent behind his long-lived project windows, an audit measured how
  far the system is from delivering it, and two workstreams were agreed in full. Every
  open decision was settled by Zee across four /restate rounds. The build was then moved
  to the Resurrection Protocol window on his instruction.

  Two workstreams, deliberately separated because they have different owners and different
  risk profiles:
    KB-A..KB-E   per-project knowledge bases that accumulate across resurrections
    MW-A..MW-E   several context windows working one project coherently

  MW-A is a LIVE DATA-LOSS BUG, not a feature. It should be fixed first.

zees_vision: |
  Stated by Zee in his own framing, 2026-08-04:

  "OKOA is the company that I work in and OKOA-works context in the window where I do all
  my OKOA related works. The purpose of doing all the works in one context that is
  constantly resurrected is to capture all necessary context over however long possible so
  that whenever I do a work in the context window, the task context is already present
  somewhere in the handoff or at least give AI some overview of the kind of the tasks I do
  and where old templates are and so on."

  He then asked that the same capability exist for every other project in the book, so any
  resurrection returns knowledge and not merely a next-action line.

audit_findings: |
  Measured live on 2026-08-04. All figures verbatim.

  FINDING 1 — Resurrection handoffs do not accumulate, BY DESIGN.
    Six OKOA Works closes exist since 2026-07-21. intent_core sizes, in date order:
      2026-07-21  3050 chars
      2026-07-22  2167 chars
      2026-07-26  2585 chars
      2026-07-28  5612 chars
      2026-08-02  3828 chars
      2026-08-04  5943 chars
    Session-sized each time, never cumulative.

    Carry-forward test (does a handoff still mention earlier sessions' subjects?):
      handoff      Alaska  AscentSF  XL-Ant  Thurston  poster  flyer
      2026-07-21   yes     -         -       -         -       -
      2026-07-22   -       yes       -       -         -       -
