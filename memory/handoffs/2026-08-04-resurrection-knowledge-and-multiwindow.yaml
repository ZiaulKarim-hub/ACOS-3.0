      2026-07-28   -       -         -       yes       -       -
      2026-08-02   -       -         yes     yes       yes     -
      2026-08-04   -       -         -       -         -       yes
    A near-perfect diagonal. Two handoffs did carry some forward, so it is not zero —
    but the newest (2026-08-04) retained nothing from any earlier session.

    This is correct behaviour for a baton. It is simply not a knowledge base.

  FINDING 2 — The right store exists and has stalled.
    /Users/zee/.claude/skills/acos-okoa-works/ holds 156,622 characters across 28 .md files:
    deal fact-sheets, a folder map, 20 task playbooks, formatting rules, a traps list.
    23 of those 28 files are unmodified since before 2026-07-18.
    Updated since the initial mine: references/deal-index.md (2026-08-04, 20821 bytes),
