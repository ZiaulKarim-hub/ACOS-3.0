context_for_next_session: |
  Read this whole file before writing any code. The decisions block (D1-D16) is the
  contract — Zee settled every one of them across four /restate rounds, and several
  represent him overruling Claude's proposed default. In particular D3/D4 reversed the
  approval model entirely; do not quietly reinstate per-item approval.

  Two design ideas are load-bearing and easy to lose:
    1. Handoff and knowledge base are DIFFERENT JOBS. A handoff answers "where was I".
       A knowledge base answers "what do I know". Zee had been expecting the first to do
       the second. Do not merge them.
    2. An approval gate only works if the approver can judge the item. That is why
       machine-verifiable facts are written silently and only Zee's own rulings are asked
       about. The safety comes from evidence, append-only writes, staleness re-checks and
       an after-the-fact digest — not from a prompt he cannot evaluate.

  Zee reads at plain-language level and has said the technical detail is not something he
  can meaningfully approve. Write every prompt and digest line accordingly.

