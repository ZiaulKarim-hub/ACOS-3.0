# Handoff Template: Developer to Reviewer
# Copy this template and fill in the values

handoff_id: "HANDOFF-[SLICE-ID]-[TIMESTAMP]"
from: ACOS-developer
to: review-system
timestamp: "[ISO 8601 format: YYYY-MM-DDTHH:MM:SSZ]"

slice_id: "[SLICE-ID]"
status: completed

summary: |
  [2-3 sentence summary of what was implemented.
  Focus on the what and why, not the how.]

evidence_bundle_path: ".acos/evidence/[YYYY-MM-DD]/[SLICE-ID]/"

acceptance_criteria_addressed:
  - criterion: "[Criterion 1 from assignment]"
    how_addressed: "[How this was implemented]"
    verification: "[How to verify it works]"

  - criterion: "[Criterion 2]"
    how_addressed: "[How implemented]"
    verification: "[How to verify]"

files_modified:
  - path: "[path/to/file1.ts]"
    changes: "[Brief description of changes]"
    lines_changed: "[approximate number]"

  - path: "[path/to/file2.ts]"
    changes: "[Brief description]"
    lines_changed: "[number]"

tests:
  added: "[number of new tests]"
  modified: "[number of modified tests]"
  all_passing: true

build_status: passing  # or failing with explanation

known_limitations:
  - "[Any caveat or limitation the reviewer should know]"
  - "[Edge cases not covered]"

implementation_notes: |
  [Any notes about the implementation that reviewers should know.
  Unusual approaches, trade-offs made, etc.]

ready_for_review: true

# Developer self-check (for transparency)
self_check:
  scope_respected: true
  all_criteria_met: true
  evidence_complete: true
  code_quality_acceptable: true
