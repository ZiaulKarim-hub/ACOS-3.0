completed_this_session:
  - "Adaptive Phase-0 capture redesign: 27-layer library + a selection protocol driven to `coverage_benchmark: 0.99` (default), layer count varies per app (not fixed); a server-invisible probe now always runs (`always_on_layers`); an inner top-up loop (add layers until benchmark met) plus an outer re-run loop (`max_reruns: 2`, `rerun_compare: normalized-features`, `vary_conditions_between_runs: true`); step 0.2 merged into capture-layer 3 (single contract-inference pass); Phase-0 steps renumbered 0.1-0.5 plus the outer loop. Documented in .claude/skills/acos-reverse-cleanroom/references/capture-layers.md (modified today, 01:30) and .acos/config/cleanroom.yaml `capture:` block."
  - "A robustness bundle for capture steps 0.1-0.5 was specified (not yet coded): multi-session HAR merge, published-doc/source-map cross-check, oracle multi-sample with stable/volatile tags, baseline repeat-keep-spread, disposable probe sinks + two-signal corroboration, manifest content-hash/version-stamp + auto drift-compare, secret/PII scan + multi-granularity fingerprint. All flags present under `capture.robustness:` in .acos/config/cleanroom.yaml."
  - "Phase 1 intent extraction redesigned as a 9-blind-extractor POV matrix: 3 lenses (pov-user, pov-operator, pov-risk) x 3 instances each, ALL Claude on-machine — external/cloud models explicitly FORBIDDEN pre-wall (dirty room; they would egress raw capture). Two-level synthesis: L1 within-lens convergence >= within_pov_convergence_floor (0.60 default, >=2/3 instances agree); L2 cross-lens UNION (a lens seeing something another lens missed = coverage, not noise; a cross-lens CONTRADICTION = a defect). Config block `intent:` added to .acos/config/cleanroom.yaml. Schema (.claude/skills/acos-reverse-cleanroom/templates/intent-claims.schema.json, modified today 02:11) gained a `pov` enum field, an `unresolved` status value, and a `provenance` array field (which of the <=9 reads asserted the claim)."
  - "Phase 1 QA/synthesis bundle (steps 1.2-1.4): rc-intent-synthesizer does deterministic claim-key matching + records provenance; rc-intent-qa runs a falsification pass and marks claims `unresolved` on hitting the redraft cap rather than silently keeping them as confirmed; a re-fingerprint assert-coverage step plus a pre-wall tech-noun lint were added ahead of Phase 2."
  - "Phase 2 (spec wall) hardening bundle (2.1-2.3): mechanical detectors run underneath the LLM judgment, fail-closed-on-doubt, a consistent pseudonymization map, an independent second-wall re-scan; forbidden-token list sourced from both detectors and the corpus itself; an armed-guard probe; the wall manifest enriched with detector/second-wall/probe results plus a hash-chained egress log. New `wall:` block in .acos/config/cleanroom.yaml."
  - "Phase 3 (prioritize) got 7 false-cut guards plus a NEW agent rc-cut-defender (.claude/agents/rc-cut-defender.md, created 02:49): non-destructive/quarantine-only cuts (never delete — intent stays in the ledger), a machine protected-set HARD GATE that blocks+halts on rule-ledger/behavior-critical/human-essential items, positive-evidence-required to cut, a BLIND adversarial defender with single-story veto power (asymmetric, keep-biased — the defender never sees the prioritizer's cut rationale), Gate-B human sign-off, mandatory traceability waivers for every cut, and re-includability downstream by a proposer or rc-red-team. New `prioritize:` block in .acos/config/cleanroom.yaml."
  - "NEW Phase 3.5 — PRD synthesis, with 2 new agents: rc-prd-drafter (.claude/agents/rc-prd-drafter.md) and rc-prd-synthesizer (.claude/agents/rc-prd-synthesizer.md), both modified 15:56 today. N (default 3) blind convergent PRD drafters run POST-WALL (heterogeneous model families now OK — see spec-clean.md + parity IDs only, no raw capture exposure) -> synthesizer merges with a HARD completeness gate: every kept intent/surface/rule/parity item must map to a REQ-#### or an explicit waiver, else FAIL and redraft (cap 3 rounds). PRD is a 9-section document, WHAT-not-HOW (internal architecture stays an OPEN section deferred to Phase 4). The PRD (035-prd/prd.md) was added to the Phase-2 egress allow-list. New `prd:` block in .acos/config/cleanroom.yaml."
  - "Phase 4/5/6 robustness + a BUILD-BACKEND REWIRE: Phase 4 proposers (rc-rebuild-proposer) now design from the Phase-3.5 PRD with a mandatory requirements-trace + declared key-risks (dropping a REQ is grounds for rejection). Phase 5 (rc-fusion-synthesizer, modified 16:00 today) adds a completeness gate plus a leaves-first buildability dry-run; rc-red-team (modified 16:00 today) blockers are now falsification-backed. Phase 6 REWIRED: default build backend is now acos-genesis-protocol -> acos-synthesis-protocol as a matched pair (component-tree plan -> leaves-first parity-verified build with up-down-up repair), with Phase-0 parity cases bound as each component's verifier; acos-preeng-classic demoted to an OPTIONAL depth add-on, off by default, Gate-B-gated on its assumptions. New `build:` block in .acos/config/cleanroom.yaml. Roster is now 12 rc-* agents total (verified: rc-capture-orchestrator, rc-cut-defender, rc-fusion-synthesizer, rc-intent-extractor, rc-intent-qa, rc-intent-synthesizer, rc-prd-drafter, rc-prd-synthesizer, rc-prioritizer, rc-rebuild-proposer, rc-red-team, rc-spec-wall — confirmed present in .claude/agents/)."
