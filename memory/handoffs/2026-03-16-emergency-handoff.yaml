decisions_made:
  - "HTML as intermediate format for Phase 3: Designers write HTML fragments → assembler produces complete HTML doc → Puppeteer converts to PDF. Both HTML and PDF kept in output. This gives browser-viewable + distributable PDF and leverages CSS Paged Media in pdf-styles.css."
  - "Puppeteer chosen over wkhtmltopdf/Prince for PDF conversion: full CSS Paged Media support, printBackground=true for colored cover pages, well-maintained npm package. Trade-off: ~170MB Chromium download. Pandoc is fallback."
  - "STRUCT-003 auto-fail check: if raw markdown syntax (**, ##, |--) found in output HTML, Phase 4 fails immediately. Prevents silent markdown bleed-through from designers."
  - "Iteration tracking via manifest (not input parameter): phase34 agent reads current_iteration from session-manifest.yaml rather than receiving it as CLI arg. Centralizes state."
  - "document_id (not category_id) used for all catalog lookups across all 4 phases. category_id is preserved for grouping only."
  - "Batch session 20260316-130000: 5 documents queued (Internal Credit Memo, Term Sheet, Deal Memo, Scoping Letter, Executive Summary) against Kelso, WA Warehouse — all Wall Street Classic design"

