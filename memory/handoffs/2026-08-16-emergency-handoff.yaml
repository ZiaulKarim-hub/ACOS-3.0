candidate_learnings:
  - "cmux-launched Claude Code panes carry a large inline --settings JSON blob
    on their process command line; `pgrep -f -- \"--session-id <sid>\"` cannot
    match past that blob and silently returns nothing for these panes, while
    `ps -eo pid,command | grep -- \"--session-id <sid>\"` finds them reliably —
    any future pane-liveness/session-lookup logic for cmux windows must use ps
    +grep, not pgrep -f (evidence: this session's live debugging and fix at
    /Users/zee/Library/Application Support/acos-token-monitor/bin/eternity-cmux-inpane.sh:656)."
  - "When building a Bash test fixture for a process whose command line must
    contain specific flags (e.g. `--session-id X --settings <blob>`), do not
    pass those flags to a real binary like `sleep` — it will reject unknown
    flags and exit immediately, leaving nothing to find. Use `bash -c '<real
    command>' <fake-argv0> <flags...>` so the flags become inert positional
    parameters the process keeps alive with, while still appearing on its
    command line (evidence: scratchpad/order-barrier.test.ts fixture fix, this
    session)."
  - "PreCompact hooks in Claude Code fire on BOTH manual (/compact) and
    automatic compaction, are distinguished by a `trigger` field on stdin, and
    block execution until they finish (600s default cap) — so a PreCompact
    hook is a reliable place to guarantee a handoff is written before native
    auto-compact destroys context, unlike trying to intercept via keystroke
    timing (evidence: 2026-08-12 acos-research-riffs probe-02, 12 verified
    claims, cited in memory/handoffs/2026-08-12-emergency-handoff-5.yaml)."
  - "This ACOS 3.0 repo folder is worked on by multiple concurrent Claude Code
    windows/sessions sharing the same working directory at once (observed
    directly this session: 9 live cmux windows classified by session_id, only
    one of which — c5978d8d — is this session). git status / git log for this
    repo reflect ALL of them, not just this session; do not attribute
    repo-wide changes (e.g. the /investigate skill, xl-update email sweep
