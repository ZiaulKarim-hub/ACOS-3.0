session_summary: |
  Multi-day (2026-08-11 through 2026-08-17) infrastructure investigation into why
  "/compact" was firing outside the ACOS Eternity Protocol's intended order
  (protocol runs -> handoff created -> resume prompt created -> compact runs ->
  eternity resumes). The work produced a new native-auto-compact path
  (.claude/scripts/precompact-handoff.ts + handoff-enrich.ts, both currently
  untracked in git) as an alternative to cmux keystroke injection, backed by three
  new test suites (order-barrier.test.ts, precompact-hook.test.ts,
  handoff-enrich.test.ts, all in the ephemeral scratchpad). The session's final
  arc (2026-08-15 23:09 to now) answered a direct question from Zee about a
  manual "yes" he had to press in the "ToDoTree" cmux window: while checking,
  the session found and fixed a REAL bug — the pane-liveness/"native-armed"
  classification lookup in the live installed daemon script used `pgrep -f --
  "--session-id <sid>"`, which returns nothing for cmux-launched panes because
  their command line carries a huge inline --settings JSON blob past pgrep's
  match window, so it had silently classified every window as "not native ->
  keystroke path stays armed" for roughly a day. Switched to `ps -eo
  pid,command | grep`, verified working against all of Zee's then-9 live cmux
  windows, and confirmed ToDoTree's manual yes-press was NOT related to the
  Eternity Protocol's keystroke-injection mechanism (no typed command was ever
  sent to that window). 253 checks pass across the three test suites (exit 0).

