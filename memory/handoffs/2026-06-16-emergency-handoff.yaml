context_for_next_session: |
  This session built the acos-guided-reader skill from a capable MVP into a
  significantly richer reading environment. The skill lives entirely at
  ~/.claude/skills/acos-guided-reader/ — it is NOT inside the ACOS 3.0 git
  repo, so git diff/status in the project will show nothing about it.

  ELEVEN features shipped:

  1. Tier C+ code language support — plan-builder.py now has explicit detectors
     for 13 languages (Rust/Go/Ruby/Java/Kotlin/Swift/C#/PHP/Scala/Elixir/Bash/
     JS/TS/Py) plus a C-family heuristic and a universal-keyword fallback for
     the long tail. The LANG_TO_SUBLANG and EXT_TO_FORMAT dicts in plan-builder
     are the canonical registry.

  2. Mnemonic keymap — N/B/F/C/P/E/S/X/D/Q. The F key means "pure" (full
     document). C means "chunked" (focus mode). ←/→/PageUp/PageDown alias
     chunk nav. ↑/↓ move the karaoke line cursor. [/] are gone.

  3. Pure-mode-as-default — view_mode='pure' in state.json. The whole document
     renders at once with a document-derived sidebar TOC. Chunked mode is C.
     Legacy full_mode bool is still written for back-compat (full_mode=True when
     view_mode=pure) but view_mode is the primary field.

  4. AI chunk titles — plan-builder.py's generate_ai_chunk_titles() fires 16
     parallel claude CLI subprocesses at 90s timeout each, replacing every
     non-synthetic chunk's title with a Haiku one-line summary. The prompt is
     hardened; _validate_ai_title() rejects meta-responses. --no-ai-titles skips
     this for speed. After titles change, next_hint cascade is rebuilt.
     CRITICAL: use the claude binary at /Users/zee/.claude/local/claude.
     NEVER use ANTHROPIC_API_KEY — user pays $200/mo Claude Code Max sub.

  5. Hover synonyms + AI definition fallback — synonyms-wordnet.json ships 60k
     WordNet entries. Per-plan synonyms.json is derived at plan-build time.
     ALL words >=4 chars get a .hover-word span (not just words with synonyms)
     so technical jargon gets the AI button too. Context sent as surrounding
     line text; gr-server build_prompt() uses PASSAGE field to pick the right
     technical sense.

  6. Prose-flow rendering — _render_prose_body() in build-page.py merges
     soft-wrapped lines into paragraphs. Structured formats (YAML/JSON/CSV etc.)
     bypass this and keep one-div-per-line.

  7. Plain-text fallback titles — _derive_chunk_title_from_lines() gives every
     chunk a real preview title before AI runs. Replaced "Lines 1-30".

  8. Paste-to-read pipeline — /paste endpoint in gr-server.py. Writes pasted
     text to ~/.acos/paste/<timestamp>-<slug>.md, spawns plan-builder + build-
     page --serve, returns redirect URL.

  9. No-args launch UX — data/paste-starter.md is the landing file. --auto-paste
     CLI flag makes build-page inject GR_AUTO_PASTE=true, causing the paste
     modal to open on DOM-ready.

  10. AF_UNIX path-length fix — pool socket is now /tmp/gr-pool-<sha1(rid)[:8]>.
      sock (~28 chars, well under macOS 104-char limit). For paste-starter, this
      is /tmp/gr-pool-3411d2f9.sock.

  11. SSE-driven reload on view_mode change + set-mode endpoint — applyState()
      in the template reloads on view_mode change. gr-server has a new set-mode
      cmd type (explicit mode target) alongside legacy toggle-mode.

