completed_this_session:
  - "Tier C+ expanded code language support: added explicit per-language detectors for Rust (.rs), Go (.go), Ruby (.rb), Java (.java), Kotlin (.kt/.kts), Swift (.swift), C# (.cs), PHP (.php), Scala (.scala), Elixir (.ex/.exs); C-family heuristic for C/C++/Objective-C (.c/.h/.cpp/.cc/.cxx/.hpp/.hh/.m/.mm) detecting function signatures + class/struct/namespace/enum; universal-keyword fallback for long tail (Lua, Perl, R, Julia, Dart, Clojure, Erlang, Haskell, OCaml, F#, Nim, Zig, Crystal, D, V, SQL, Groovy, Tcl, VB, Vala) with dotted-name support. All in plan-builder.py."
  - "Mnemonic-first keymap redesign: final keymap is N=next, B=back, F=pure (default whole-doc view), C=chunked (opt-in), P=paste, E=explain, S=simpler, X=example, D=deeper, Q=quit. Arrow keys ←/→ alias chunk nav; PageUp/PageDown alias chunk nav; ↑/↓ are karaoke cursor only. [/] removed. In page-template.html."
  - "Pure document view as default: new view_mode field (was full_mode boolean). Pure mode renders whole document as-is with document-derived TOC (markdown headings, code defs, YAML keys); chunked mode is opt-in via C. Legacy migration: full_mode==True → pure, False → chunked. view_mode always written to state.json so client and server agree. In build-page.py and gr-server.py."
  - "AI chunk title generation: every non-synthetic chunk gets a Haiku one-line summary via parallel subprocess calls to the claude CLI binary. 16 workers, 90s timeout per call. --no-ai-titles flag to opt out. Hardened prompt + validation regex in _validate_ai_title() catches and discards meta-responses ('I need to...' etc.). next_hint cascade rebuilt after titles change. In plan-builder.py."
  - "Hover synonyms + AI definition fallback: pre-baked WordNet master JSON (~60k entries, ~2 MB) at ~/.claude/skills/acos-guided-reader/data/synonyms-wordnet.json. Per-plan synonyms.json extracted via extract_synonyms_for_plan() and shipped via build-page into window.GR_SYNONYMS. ALL qualifying words wrap (>=4 chars, not stopword), even those with no WordNet entry — bubble shows 'No dictionary entry — click AI for a contextual definition' + AI button. Context-aware AI definition: client sends surrounding-line text as context field; build_prompt() in gr-server uses PASSAGE field, tells model to pick technical sense when context is technical. In plan-builder.py, build-page.py, gr-server.py, page-template.html."
  - "Prose-flow rendering: non-code chunks now go through _render_prose_body() which merges soft-wrapped lines into paragraphs. Block-level markers (heading #, list - * + 1. bullet, blockquote >, hr ---, indented code) start new logical lines. Structured formats (YAML/TOML/INI/JSON/CSV) keep one-div-per-line. Critical for pasted markdown where lines wrap at 70-80 chars. In build-page.py."
  - "Plain-text fallback titles: _derive_chunk_title_from_lines() produces first-meaningful-line preview replacing 'Lines 1-30' placeholder. AI titles then overlay these when claude is available. In plan-builder.py."
  - "Paste-to-read pipeline: /paste endpoint in gr-server.py writes pasted text to ~/.acos/paste/<timestamp>-<slug>.md, spawns plan-builder + build-page --serve, returns new URL, browser redirects. Paste modal in page-template.html. P key opens modal. Modal gets --auto-paste flag via GR_AUTO_PASTE window var. In gr-server.py and page-template.html."
  - "No-args launch UX: /acos-guided-reader with no arguments opens data/paste-starter.md with --auto-paste flag so paste modal pops on load. window.GR_AUTO_PASTE flag + --auto-paste CLI flag in build-page.py. SKILL.md Phase 0 updated."
  - "AF_UNIX path-length fix: gr-pool socket moved from state_dir/pool.sock (160+ chars for paste reading_ids) to /tmp/gr-pool-<sha1(reading_id)[:8]>.sock (~28 chars). macOS 104-char Unix socket path limit was breaking pool startup for paste sessions. For paste-starter reading_id 'paste-starter-md-c1bbb4' the socket path is /tmp/gr-pool-3411d2f9.sock. In gr-server.py."
  - "SSE-driven reload on view_mode change: applyState() in page-template.html reloads page on view_mode change (was only on chunk_idx change). Without this, F/C key presses flipped server state but browser stayed on the old mode. Tracks currentViewMode parallel to legacy currentFullMode."
  - "Set-mode endpoint in gr-server: new cmd type 'set-mode' with explicit mode='pure'|'chunked'. Legacy 'toggle-mode' kept for backwards compat. Both update state and regenerate page. In gr-server.py."
  - "Debugged and fixed 16w/90s AI title timeout (was 8w/30s, tail of distribution caused TimeoutExpired). Fixed split-brain full_mode/view_mode default bug where state.json wasn't always written. Fixed meta-response contamination in AI titles via two-pronged stronger-prompt + validation regex fix."

