  - "Ran `/research 2` (depth-2 grounded research pass via acos-research-riffs) with topic 'How an external tool can make a busy Claude Code session compact and resume itself without keystrokes...' — riff session id `2026-08-12-how-an-external-tool-can-make-a-busy-claude-code-session-com`, root at /Users/zee/.acos-research/.acos/riffs/2026-08-12-how-an-external-tool-can-make-a-busy-claude-code-session-com/."
  - "Probe 1 (native auto-compact, 17 verified claims): auto-compact fires with zero keypresses, fires mid-turn while tools are running, background helpers survive it (their records live in separate files that a main-session compaction does not touch), requires Claude Code >=2.1.221 (this machine is exactly 2.1.221). One unresolved gap: whether a main-session compaction waits for still-running helpers before firing is nowhere documented — reasonable inference is 'no', but unverified. Claims file: dossiers/probe-01.claims.jsonl."
  - "Probe 2 (PreCompact hook mechanics, 12 verified claims): PreCompact fires on BOTH manual (/compact) and automatic compaction, distinguished by a `trigger` field ('manual'/'auto') on stdin; it blocks execution until it completes (600s default timeout), so a handoff write in this hook is guaranteed to finish before compaction starts. It can only cancel a compaction (risky — cancelling an auto-fired-from-overflow compaction makes the current request fail), cannot delay one, and cannot inject text into the compaction summary (systemMessage/continue fields are discarded). SessionStart afterwards reports source 'compact' for both auto and manual — the auto/manual distinction is lost by the time SessionStart runs, so any downstream logic needing it must be captured and stashed by PreCompact/PostCompact. Claims file: dossiers/probe-02.claims.jsonl."
  - "Probe 3 (input-during-subagents, 13 verified claims): typed submission during a busy turn is DEFERRED to turn-end, not blocked, and Anthropic's docs do NOT tie this to subagents specifically (an open bug, anthropics/claude-code#73118, matches Zee's exact symptom — messages sit pending until the turn ends; a second, closed bug #49373 reports the opposite, flushing 'after a subagent returns' — so the real flush point is inconsistent/undocumented, not a documented subagent-block). Corrected an earlier claim in this same conversation that Escape's role in unsticking messages was confirmed — it is not; no source ties an interrupt to flushing a stuck message. Two non-keystroke, non-mailbox steering paths do exist and are documented: Channels (an MCP server pushing events into a live session — research-preview, allowlist-gated) and Stop hooks / /goal / /loop (start the next turn under a script's own control). Claims file: dossiers/probe-03.claims.jsonl."
  - "Synthesized final recommendation to Zee across all three probes (delivered, awaiting reply): stop trying to type into a busy pane; turn on autoCompactEnabled with a token trigger matching the current threshold; add a new PreCompact hook that writes the handoff (does not exist today); leave SessionStart alone (already fires after any compaction); retire the cmux keystroke-injection machinery to avoid double-compaction if both mechanisms ran simultaneously."

