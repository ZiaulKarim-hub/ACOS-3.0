candidate_learnings:
  - "Claude Code's cross-session keystroke mailbox (Unix-domain socket, one per session PID under /tmp/cc-socks/<pid>.sock) only exists on sessions started after the feature shipped — 3 of 7 live sessions checked this session (Research to Portfolio, Insightia, Logo Builder) had no socket, and the only way to add one is a restart that would discard the very context being preserved (evidence: transcript, live `ls -S` check on cc-socks across 7 sessions, 2026-08-12)."
  - "autoCompactEnabled is set to false in /Users/zee/.claude/settings.json:126 and has been false since that file's very first commit (cc5ce4a) — this was a deliberate choice, not an oversight, made so the Eternity Protocol's cmux-injection mechanism could own compaction timing instead of native Claude Code (evidence: git log -S on settings.json, this session)."
  - "This ACOS setup currently registers only PreToolUse, SessionStart, Stop, and UserPromptSubmit hooks — PreCompact and PostCompact are not wired anywhere, so no handoff-before-compaction safety net exists for native auto-compact today; if native auto-compact is ever turned on without adding a PreCompact hook, handoffs would not be written before the context is summarized (evidence: python json inspection of ~/.claude/settings.json hook keys, this session)."
  - "Anthropic's own open bug anthropics/claude-code#73118 documents that a typed message can stay pending and unacted-on until the current turn ends — this matches Zee's own observed symptom of Enter being 'swallowed' while helpers run, but Anthropic's docs describe the deferral as turn-scoped, not subagent-scoped, and a separate closed bug (#49373) reports the opposite flush timing ('after a subagent returns'), so the exact flush condition is genuinely undocumented/inconsistent rather than a settled fact (evidence: probe-03 claims, dossiers/probe-03.claims.jsonl, sourced from Anthropic docs + GitHub issue states via gh CLI)."
  - "A new lightweight `/research <depth 1-5>` skill exists at .claude/skills/research/ (untracked in git as of 2026-08-12) — it is a thin launcher over the acos-research-riffs engine for quick, grounded, cited research passes mid-conversation, distinct from the full acos-research-riffs interactive engine and from acos-deep-research's one-shot reports (evidence: .claude/skills/research/SKILL.md, read this session)."

