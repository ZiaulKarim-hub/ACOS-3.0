session_summary: |
  This session was reverse-engineering how the ACOS Eternity Protocol should solve
  a real usability bug: when a cmux-injected keystroke (e.g. a resume prompt or the
  handoff-trigger command) is sent into a session that is busy running background
  helpers/subagents, the typed Enter is sometimes swallowed and the message sits
  unsent in the input box. Zee rejected two proposed workarounds — a Unix-socket
  "mailbox" injector (blocked because 3 of 7 live sessions predate the feature and
  restarting them to add it would defeat the purpose; also requires flipping
  `crossSessionInbound` to `accept`, which would reintroduce permission prompts and
  break autonomy) and repeated blind Enter keypresses (rejected on Zee's own
  observation that Enter does nothing while helpers are running). Zee then ran
  `/research 2`, spawning 3 parallel research probes via the `acos-research-riffs`
  engine. All three came back with a converging recommendation: stop trying to
  inject keystrokes into a busy pane at all, and instead turn on Claude Code's own
  native `autoCompactEnabled`/`autoCompactWindow` self-compaction (currently OFF in
  `/Users/zee/.claude/settings.json:126`), paired with a `PreCompact` hook (not
  currently registered anywhere in this setup) that writes the handoff before
  Claude Code compacts on its own, keystroke-free. The session was mid-conversation
  — the assistant had just asked "Want me to build this?" — when its own context
  hit 532,154 tokens and the Eternity Protocol's own token-watcher fired the
  standard `/acos-eternity-protocol` pre-clear sequence, which spawned this
  handoff-agent. This is a designed, expected auto-fire, not a crash.

