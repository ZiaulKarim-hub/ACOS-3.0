context_for_next_session: |
  This session's whole arc is the acos-axiom-synthesis skill: a multi-model
  (Claude/Gemini/GLM/ChatGPT) claim-synthesis pipeline that elicits candidate claims from
  each "family" blind to the others, grades and cross-examines them, de-circularizes
  shared-origin evidence so consensus among models parroting the same source doesn't
  fake independence, and writes an append-only ledger culminating in a source-of-truth.md
  with confidence tiers (unverified -> probable -> verified/ESTABLISHED).

  Two boss-requested improvements were built and wired first: a boolean confidence
  checklist (scripts/checklist.py + config/checklist.yaml, 4 veto + 10 scored questions,
  wired into orchestrate.py stage 4.5) and the four-model-family fan-out (all four blind
  prompts in prompts/, zai provider added to .acos/config/providers.yaml). Then a
  live-run harness ("conductor," scripts/conductor.py) was built to actually drive a real
  fan-out end-to-end, plus RUNBOOK.md documenting the manual steps (notably: v1 claim
  clustering is exact-normalized-text only, so semantic paraphrase-merging across
  families is still a manual orchestrator step — raw per-family replies are preserved
  under collected/elicitor-raw/ for that purpose). The elicitor prompt was then upgraded
  to demand a real cited source_url + source_date per claim, and origin/de-circularization
  now keys on that URL rather than treating "the model said so" as evidence.

  Two live end-to-end runs PROVE the pipeline is correct, not just unit-tested: a
  memory-only run (.acos/axiom/live-2026-08-02/) correctly landed every claim at
  probable/CORROBORATED because sources were all model-internal (no external citation);
  a web-enabled run (.acos/axiom/live-sourced-2026-08-02/) correctly promoted C1 ("the
  capital of Australia is Canberra") to ESTABLISHED/verified because Claude and ChatGPT
  independently cited two DIFFERENT real sources (nca.gov.au and britannica.com) — and a
  prior attempt where both models cited the SAME source was correctly held at probable,
  demonstrating the de-circularization firewall actually works under a live adversarial
  test, not just in mocked unit tests. Along the way six real bugs were found and fixed
  purely by running the thing for real (family self-report unreliable, source text
  falsely implying verbatim-copy non-independence, zsh 1-indexed array gotcha, numeric
  string coercion crash, plus the documented-not-fixed illegal-transition-on-rerun limit
  and the paraphrase-clustering manual-step limit).

  The offline regression suite is 99 assertions across four files (test_substrate 19,
  test_pipeline 35, test_checklist 21, test_conductor 24) — all four suites were
  re-executed live during this handoff and all still pass, confirming the working tree
  is in a good, non-broken state despite being uncommitted.

  A separate research deliverable, planning/acos-axiom-synthesis/RESEARCH-recency-bias-
  2026-08-02.md, answers "why can an old claim outscore a fresher, better one?" with a
  cited literature review and a concrete recommendation (volatility as a claim attribute,
  advisory-only volatility classifier, as-of staleness banner, conditional freshness
  gate, and a triple-gated supersession rule reusing the existing oscillation guard) — but
  this is DESIGN ONLY, nothing from it has been implemented yet.

  Provider credentials live in Doppler under project ai-model-api, config dev_personal:
  GOOGLE_API_KEY (Gemini, model gemini-flash-latest — note gemini-2.5-flash is retired
  and 404s) and ZAI_CODING_PLAN_API_KEY (must be mapped to the env var ZAI_API_KEY the
  code expects; the Coding Plan key only works against the coding endpoint
  https://api.z.ai/api/coding/paas/v4, not the general z.ai API). ChatGPT participation
  is via browser voice (Chrome, logged-in Plus account), not an API key.

  The very next thing to do is a human decision, not more building: the user's own
  wake-up note explicitly leaves the choice open between (a) building the recency-bias
  fix, (b) adding web-search grounding to run-external-agent.py so Gemini/GLM can also
  reach 'verified', or (c) pausing here. Do not pick for them — ask.

