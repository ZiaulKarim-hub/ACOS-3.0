  - decision: "Brand-first image sourcing with auto-bootstrapped manifest via Claude vision"
    rationale: "User (b): prefer brand assets, fall back to internet. User explicitly said they do not want to hand-maintain a manifest. Vision-keyed-by-hash means one-time cost per image, zero ongoing maintenance."
  - decision: "Zero loan-doc design-library content loads"
    rationale: "User's hard constraint. Loan-doc skill is reused at the SCRIPT level (html-to-pdf.js, data-to-pptx.py, render-doc-audit.py) and at the PATTERN level (Wigum loop shape, visual checklist structure) — never at the design-content level. Enforced by acceptance criterion: grep agent prompts for 'design-library' must return empty."
  - decision: "PDF path before PPTX (Story 3 before Story 4)"
    rationale: "PPTX is the heaviest work (9 slide masters in python-pptx, font embedding, theme-shadow cleanup). Better to have end-to-end PDF working and verified before adding PPTX complexity."
  - decision: "Visual reviewer model hard-pinned to opus"
    rationale: "Learning from prior loan-doc evaluation: sonnet misses subtle coffee-table defects (editorial spacing, italic accent patterns, photo rhythm). Documented in story file; not inherited from session config."

