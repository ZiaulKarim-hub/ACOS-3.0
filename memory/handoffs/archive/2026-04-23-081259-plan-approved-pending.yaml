  - decision: "Write ONE master plan (1 epic + 6 story YAMLs) instead of 22 separate slice YAMLs"
    rationale: "Context budget. Slice YAMLs can be materialized at execution time by /acos-execute-slice. Story-level files contain enough slice detail to drive execution."
  - decision: "Page-as-canvas composition (not flow-layout-with-page-breaks)"
