architecture_changes:
  inject_keystroke_rewrite:
    file: "/Users/zee/Library/Application Support/acos-token-monitor/bin/inject-keystroke.py"
    size_lines: 438
    modified: "2026-05-20T01:44Z"
    previous_architecture: "CGEventPostToPid(target_node_pid, event) — silent no-op for Node.js"
    new_architecture: |
      1. Read claude PID from state file (session_id keyed)
      2. Derive tty via `ps -o tty=` on claude PID
      3. Write OSC 2 title marker \\033]2;ACOS[<sid>] claude\\007 to /dev/<tty> just-in-time
         (Claude Code overwrites titles; stamping just before injection is the load-bearing moment)
      4. Sleep 150ms for terminal to render title change
      5. osascript finds the Warp window whose AXTitle contains the session UUID marker
         AND performs AXRaise + NSApplication activate
      6. CGEventPost(kCGHIDEventTap, event) — HID layer injection, routes to frontmost window
      7. Poll JSONL transcript for /clear evidence within 3 seconds (post-injection verification)
         rc=0 on verification, rc=5 if no JSONL evidence (treated as unverified, not failure)
    dry_run_flag: "--dry-run exits after AXRaise (step 5), confirms window targeting works
      without firing keystrokes. DRY-RUN end-to-end showed: claude pid=45454, OSC 2 stamped
      on /dev/ttys000, AXRaise result OK_MARKER_MATCH, exit 0."
