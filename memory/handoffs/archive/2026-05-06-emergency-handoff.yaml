  WHAT THE PROJECT IS: A 224-page PDF design reference catalogue for a fictional private credit
  LP (Meridian Credit Partners). It renders the same Q4 2026 LP Update content in 100
  substantively distinct visual designs across 20 named categories (Clean Consulting, IB
  Pitchbook, Private Credit LP Update, Credit Committee Memo, Risk Dashboard, Institutional
  Asset Management, Dark Mode Analytics, Minimalist Swiss Grid, Luxury Capital Markets, Legal /
  Covenant Monitoring, Real Estate Credit, CLO / Structured Credit, Fintech Dashboard, Annual
  Report Style, Board-Level Executive Summary, Distressed / Special Situations, Macro + Portfolio
  Strategy, Data-Rich Analytics, One-Page Deal Summary, Modern Capital Markets Deck). The purpose
  is a personal/team reference catalogue for on-screen use.

  ALBUM STRUCTURE (224 pages):
    Page 1: Cover (portrait, EB Garamond editorial, neutral chrome)
    Page 2: TOC (portrait)
    Pages 3–222: 20 × (1 category divider + 5 designs × 2 pages each) = 20 × 11 = 220 pages
    Pages 223–224: Palette index + Layout index

  DESIGN PAGE GEOMETRY:
    Portrait designs: 612×792 pt, MARGIN_PT=36 (D006, D012, D016, D017, D022, D029, D036,
    D041–D043, D045–D047, D051, D066–D071, D073, D075–D076, D079, D081, D083, D087,
    D091–D095, D098 — 33 designs total).
    Landscape designs: 792×612 pt, MARGIN_PT=36 (remaining 67 designs).
    Metadata page matches its design's orientation. Structural pages always portrait.

  TECH STACK:
    - Python 3 + venv at .venv/ (reportlab 4.5, matplotlib 3.10, pypdf, fonttools, Pillow, numpy)
    - 36 vendored fonts in fonts/ (OFL/Apache, ~12 MB)
    - charts_cache/ — 134 matplotlib PNGs keyed by SHA-1
    - Build entrypoint: python -m src.build (from project root)
    - Rebuild is idempotent; chart cache survives across runs

  RECONSTRUCTION WARNING: Three source files were rebuilt from session memory because the
  Desktop originals became read-locked:
    - src/canonical.py — KPIs/table/NAV/waterfall are correct; 5 insight variant texts are
      plausible but NOT verbatim from the original session-1 brief.
    - src/palettes.py — 25 palettes, unique families, but hex values and names differ from
      original session-1 design.
    - src/treatments.py — IDs match registry.py but names/style hints are reconstructed.
  If the user cares about restoring the original palettes or insight wording, the originals
  are at ~/Desktop/private_credit_design_reference/src/ — accessible if TCC grants are
  restored (e.g., via macOS Privacy & Security settings or after a reboot).

