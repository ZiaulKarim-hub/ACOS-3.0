# ── NEW BUG IDENTIFIED ────────────────────────────────────────────────────────

new_bug_6:
  id: "Bug #6"
  title: "Hook consumes .clear-fired marker before daemon orphan-check sees it"
  severity: "HIGH — blocks autonomous resume verification"
  root_cause: |
    eternity-resume-prepend.sh and token-watcher.py claim_orphan_resume_if_any()
    both depend on .clear-fired-<sid> existing in state/. The hook runs on the user's
    first UserPromptSubmit in the new session. The daemon's new watcher runs
    claim_orphan_resume_if_any() at startup (before any UserPromptSubmit fires).
    Timeline in the 9dad2072 case:
      21:02:03 — /clear fires, new session minted
      21:02:03 — 9dad2072 watcher starts, runs claim_orphan_resume_if_any()
      (orphan check sees consumed/.clear-fired — NOT in state/ — skips claim)
      21:08:41 — first event in 9dad2072 daemon log (evt=3, user typed first prompt)
      (hook fires on that first UserPromptSubmit, delivers resume via additionalContext)
    The orphan check ran BEFORE the hook could move the marker, but the marker was
    ALREADY in consumed/ from the PRIOR hook run (or prior manual move). The b498b8da
    artifacts were manually moved to consumed/ during session setup this turn. The
    .clear-fired marker was among those moved artifacts.
  fix_approaches:
    option_a: |
      Do NOT include .clear-fired-<sid> in the hook's artifact list. The hook only
      needs to consume: pending-resume-*.txt, .resume-pending-*, .compact-fired-*.
      The .clear-fired marker is purely for the daemon's orphan-claim path. Leave it
      in state/ for the daemon. The daemon can clean it up after a successful claim.
      PREFERRED: least invasive, corrects the scope mismatch.
    option_b: |
      Change claim_orphan_resume_if_any() to also check state/consumed/ for the
      .clear-fired marker. This is architecturally messier but doesn't require changing
      the hook.
    option_c: |
      Introduce a separate .hook-fired-<sid> marker written by the hook, so the daemon
      can see that the hook already delivered the resume and skip the orphan claim
      gracefully (logging "hook already delivered, skipping daemon injection").
  file_to_fix_option_a: "/Users/zee/Documents/Vibe Coding/ACOS 3.0/.claude/scripts/eternity-resume-prepend.sh"
  fix_detail_option_a: |
    In the artifact loop at lines 109-118, remove the .compact-fired-${RESUME_SID}
    entry and add a note that .clear-fired-${RESUME_SID} is intentionally NOT consumed
    by this hook (it belongs to the daemon's orphan-claim path). Change the loop to only
    consume: "$RESUME" and "$STATE/.resume-pending-${RESUME_SID}".
    NOTE: .compact-fired is different from .clear-fired — double-check which is being
    consumed. Current line 112 consumes ".compact-fired-${RESUME_SID}" not ".clear-fired".
    If the marker moved to consumed/ was moved MANUALLY (as part of session setup),
    not by the hook, then the hook's artifact list may be fine and Bug #6 is actually
    a "manual cleanup moved wrong file" issue rather than a hook bug.

