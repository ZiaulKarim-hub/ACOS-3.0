clarification_needed: |
  IMPORTANT: The .clear-fired-b498b8da was in consumed/ at 15:02 (May 20) and the
  9dad2072 session started at 21:02:03. The user-provided context says "b498b8da
  residual artifacts (.clear-fired, .parse-offset, pid) moved from state/ to
  state/consumed/ to start the rerun from a clean state." This manual move at session
  setup is the ACTUAL cause of the orphan-claim skip, not a hook race condition.

  The eternity-resume-prepend.sh hook artifact loop (lines 109-112) consumes:
    - pending-resume-${RESUME_SID}.txt
    - .resume-pending-${RESUME_SID}
    - .compact-fired-${RESUME_SID}    ← NOTE: compact-fired, NOT clear-fired

  The hook does NOT consume .clear-fired-${RESUME_SID}. So the Bug #6 framing as
  "hook moves the marker before daemon sees it" is INCORRECT based on the hook source.
  The actual issue is: the .clear-fired marker was MANUALLY moved to consumed/ as part
  of session setup. The daemon's orphan-claim code doesn't check consumed/.

  This means the "Bug #6" is actually:
    When setting up a fresh rerun by cleaning b498b8da artifacts to consumed/,
    moving .clear-fired to consumed/ prevents the new session's orphan claim from
    working. The correct manual cleanup procedure should move everything EXCEPT
    .clear-fired, OR the orphan-claim code should also check consumed/.

