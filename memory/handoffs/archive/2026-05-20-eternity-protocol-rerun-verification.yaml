    The eternity-resume-prepend.sh UserPromptSubmit hook ran BEFORE the 9dad2072
    watcher's claim_orphan_resume_if_any() had a chance to check for the .clear-fired
    marker. The hook (as part of its consume-once behavior) moved .clear-fired-b498b8da
