    in state/, it found nothing — the marker was gone. The orphan-claim logic then fell
    back to the mtime heuristic and found the b498b8da JSONL "still active" (same
    false-positive root cause as Bug #1), so it skipped the claim.

    Bug #6 is a race condition introduced by the Bug #5b fix: by making the hook move
    the .clear-fired marker to consumed/ (correctly, per the preserve invariant), we
    inadvertently broke the daemon's orphan-claim check which needs the marker to still
    be in state/ at the time of the new watcher's startup.

    The fundamental design conflict: the hook and the daemon both use .clear-fired-<sid>
    as a signal, but for different purposes. The hook uses it as a "was /clear fired?"
    check to decide whether to inject resume content. The daemon uses it as proof of
    /clear for the orphan claim. After the hook runs (consuming the marker), the daemon's
    check always fails.

