      raw_html injects memo-007-018.jpg with caption "Interior — guest bedroom."
      The image (per IMAGE-CATALOG.md) is listed as "Interior — bedroom" but may
      actually show a vanity/finish area based on visual inspection. Caption should
      either be updated to accurately describe the space, or the image should be
      swapped for memo-007-019.jpg (courtyard terrace) or memo-007-020.jpg
      (living/kitchen with fireplace) which are unambiguously identifiable.
      MEMO PDF page 7 is the source; confirm by viewing the raw extract.

  - id: "ISSUE-02"
    severity: "medium — silent render omission"
    page: 21
    section: "Condo Sales Strategy"
    description: >
      The Competitive Set comparison table is defined under tables_2: in both
      YAMLs (line 460 in both A and B). The renderer reads section.get('tables'),
      not tables_2, so the Competitive Set table is silently dropped from the
      rendered PDF. Fix: rename tables_2: to tables: and append the Competitive Set
      to the existing tables list (after Unit Mix & Projected Pricing). Verify the
      page doesn't overflow after adding the second table — the Condo Sales
      Strategy section already has Unit Mix, body text, and prose extensions.

  - id: "ISSUE-03"
    severity: "deal-team / out of scope for renderer"
    section: "Use of Proceeds tables (A-verbatim) + Repayment structures"
    description: >
      Even after Version B's arithmetic corrections, neither Use of Proceeds
      table balances to the stated loan amounts ($57M preferred / $88M alternative).
      Preferred: corrected total $63,396,061 vs. $57M loan. Alternative: corrected
      total $87,377,363 vs. $88M loan. A true sources-and-uses statement would
      balance to zero. This is a deal-team issue — the line items and the loan
      amounts reflect different scopes or assumptions that must be reconciled by
      LKCap before the memo goes to lenders. The renderer correctly renders whatever
      numbers are in the YAML; this is a content issue, not a rendering bug.

  - id: "ISSUE-04"
    severity: "low — image audit needed"
    description: >
      IMAGE-CATALOG.md note: "v7 diagonal-line page textures, small masks and
      gradient fills (the ~124 sub-60 KB streams that are not in the page-14 photo
      grid)" are labeled ignore-category. However, several mkt-* logical_id bindings
      in the YAML point to files in the 60-100 KB range from v7 pages 21-30 that
