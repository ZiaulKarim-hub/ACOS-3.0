      and v7-024-117.jpg (mkt-ski-panorama, 1025 KB) are large and likely real
      photos, but v7-026-132.jpg (mkt-deer-valley, 553 KB), v7-027-141.jpg
      (mkt-skiers, 247 KB), v7-028-145.jpg (mkt-mtn-biking, 588 KB), and
      v7-030-153.jpg (mkt-egyptian, 605 KB) have not been opened and confirmed.
      mkt-autumn-town and mkt-ski-panorama are the only mkt-* images currently
      used as PART_CONFIGS divider photos or SECTION_PHOTOS; the others are
      declared in the YAML images: block but not routed to any render call.
      The Part 03 divider (mkt-town-aerial → v7-031-158.jpg, 1221 KB) was
