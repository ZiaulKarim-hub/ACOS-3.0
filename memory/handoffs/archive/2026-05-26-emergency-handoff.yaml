# --------------------------------------------------------------------------
# Per-page change log (this session)
# --------------------------------------------------------------------------
# Page numbering is in the rendered PDF (ridgeline FINAL, 24 pages).
# Layout terminology:
#   pillars          = 3-col full-height card grid for Credit Thesis
#   comparison_cards = 2-scenario hero card layout for Transaction Summary
#   horizontal steps = steps-timeline rendered as row of columns instead of vertical stack
#   prose_layout: two_col = CSS column-count:2 for Market Overview prose extensions
#   raw_html         = escape hatch block injected after main body content
# --------------------------------------------------------------------------

per_page_changes:
  - page: 3
    section: "Transaction Summary"
    change: >
      Switched the Transaction Summary table to layout: comparison_cards.
      Renderer renders two side-by-side scenario hero cards (Preferred / Alternative)
      with shared collateral band, sponsor footnote, and _shrink_dollar() abbreviation.
      Dispatch wiring: render_comparison_cards() called when tbl['layout'] ==
      'comparison_cards'; otherwise falls through to standard render_table().

  - page: 5
    section: "Credit Thesis"
    change: >
      Added layout: pillars to YAML. Renderer dispatches to render_pillars_body()
      which produces a large-type claim line ("Any one pillar substantially covers
      the loan.") above a 3-col grid of full-height pillar cards (numeral in
      coral accent, hero value, hero sub, frame separator, rationale text).
      CSS: .pillars-claim, .pillars-grid, .pillar-card, .pillar-numeral,
      .pillar-hero, .pillar-frame, .pillar-rationale all already in css().

  - page: 6
    section: "Capital Stack"
    change: >
      Pages 5 and 6 were swapped. In the prior version, Capital Stack (tables)
      came before Credit Thesis (pillars) in the part. The YAML section order was
      reordered so Credit Thesis (pillars) is section 03 (page 5) and Capital Stack
      is section 04 (page 6). Now the pillars page introduces the three repayment
      sources before the stack details.

  - page: 7
    section: "Key Credit Strengths"
    change: >
      Added raw_html image injection: memo-007-015.jpg (Porte-cochère — winter)
      at 85mm height, full-width, after the callout block. The raw_html field
      in the YAML follows the existing callout: block. Caption reads "Porte-cochère
      arrival, winter — Canyons Village base."

  - page: 10
    section: "Property Description (page 1 of 2)"
    change: >
      Property Description was previously one page with a dense items grid that
      made floor plans too small. This session dropped the items grid from the
      rendered output (render_property_combined_pages suppresses it) and replaced
      it with a floorplans-stacked layout showing Unit A and Unit B at full body
      width. Body text + brand note still render above the plans.

  - page: 11
    section: "Property Description (page 2 of 2 — Floor Plans)"
    change: >
      The section now spans 2 pages sharing one section number. Page 11 is
      purely a floor-plans continuation: Unit C&D + Lobby & Offices + FF&E in a
      floorplans-3up (vertical stack, max-height 62mm each). Previously these
      were crammed into a 2-up grid on a shared page with the amenities content.
      Dispatch: render_property_combined_pages() returns [page1, page2] and both
      are extend()ed into the pages list.

  - page: 12
    section: "Location & Construction"
    change: >
      Location (formerly its own section) and Construction Status (formerly its
      own section) were merged into a single "Location & Construction" section
      with body_col_1 (location) / body_col_2 (construction status) / Drive Times
      table. The raw_html block injects a 3-up photo row at the bottom:
      v7-013-052.jpg (location map), v7-011-040.jpg (aerial Canyons Village),
      v7-014-063.jpg (construction progress) each at 105mm height in a 1/3 grid.

  - page: 13
    section: "Deal Background"
    change: >
      Added raw_html image injection: memo-007-016.jpg (ridge view) at 78mm height
      after the pull quote. Caption: "Ridge view — the asset in its Canyons Village
      landscape. The project is substantially complete and in good condition; only
      the sponsor entity is distressed."

  - page: 17
    section: "Financial Analysis"
    change: >
      Added analysis: prose extension field to the YAML. Renderer picks it up via
      PROSE_EXT_KEYS list and renders it as a labeled prose block after the tables.
      Text: LKCap underwriting carries hotel from $1.73M NOI Year 1 to $3.23M at
      Month 52; collateral holds through −49% pricing decline.

  - page: 18
    section: "Repayment Plan"
    change: >
      Added steps_layout: horizontal to YAML. The waterfall steps (4 steps: Sales
      Costs / Operating Shortfall / Interest / Senior Principal) now render as a
      horizontal row of columns (CSS .steps-timeline.horizontal) instead of a
      vertical stack, freeing vertical space for the three tables below (PACE
      Release Mechanics, Cash Flow Timeline, Breakeven Analysis).
      Also: trimmed the Breakeven table — intermediate scenarios (−10%, −30%) were
      removed for brevity; note added that collateral holds through −49%.

  - page: 19
    section: "Hotel Operations & Franchise"
    change: >
      Added raw_html image injection: memo-007-018.jpg (interior — bedroom/vanity
      area) at 78mm height. Caption reads "Interior — guest bedroom." NOTE: image
      may actually depict a vanity/finish area rather than a full guest bedroom —
      caption may need updating or image may need swapping to memo-007-020.jpg
      (living/kitchen) or memo-007-019.jpg (courtyard terrace) on next review.

  - page: 20
    section: "Market Overview (Part 03 divider photo area)"
    change: >
      Part 03 divider (page before Market Overview) photo logical_id was previously
      pointing at mkt-town-aerial binding which mapped to v7-031-157.jpg — a
      diagonal paper-texture extract, NOT a real photo. This was corrected in the
      prior session (source_file changed to v7-031-158.jpg, Park City town aerial
      at sunset, 1221 KB). This session confirmed the fix is live in both YAMLs.

  - page: 21
    section: "Condo Sales Strategy (Competitive Set table + prose)"
    change: >
      The Competitive Set table was previously keyed as tables_2: in the YAML
      (a secondary table list). The renderer only reads section.get('tables'),
      not tables_2. This means the Competitive Set table is NOT currently being
      rendered on page 21 — it is silently skipped. The tables_2: key needs to
      be renamed to tables: (and the existing Unit Mix table moved to a separate
      YAML key or the Competitive Set appended to the tables: list) to fix this.
      The 2-col prose fix (prose_layout: two_col on Market Overview, not Condo
      Sales) also landed in this session: render_prose_extensions() wraps blocks
      in .prose-2col div when section.get('prose_layout') == 'two_col'.

  - page: 23
    section: "Sponsorship"
    change: >
      Added portfolio_note: "The six properties above are the ARCHITECT's (Think
      Architecture) portfolio — NOT the sponsor's." This note is rendered by
      render_portfolio() as a .portfolio-note div after the 6 portfolio cards.
      The attribution clarification was flagged in RECONCILIATION-NOTES.md §3
      (Think Architecture portfolio, not LKCap). Added to both A-verbatim and
