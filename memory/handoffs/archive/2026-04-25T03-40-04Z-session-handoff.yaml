decisions_made:
  - "Decision: produce a Lean-curated bundle (43 files) rather than the full v2 sweep (76 files). Rationale: counsel production has a quality/quantity tradeoff — opposing counsel reviews everything you produce, and dilution masks dispositive documents. Cut every file that didn't pass the test 'would counsel cite this in a brief or response letter to Natalya?'"
  - "Decision: preserve v1 of every deliverable with explicit `_v1_` filename suffix rather than silently overwriting. Rationale: chain-of-custody integrity. Counsel can show their work — 'this is what we found on date X, this is what we found on date Y.'"
  - "Decision: keep cut files re-sourceable from Dropbox rather than archived in a separate cuts/ folder. Rationale: source-of-truth principle (the Dropbox loan folders are the authoritative record); a `cuts/` folder would just duplicate part of Dropbox and risk drift."
  - "Decision: rename 06_Casa_Grande_Loan_File → 06_Casa_Grande_I_and_II_Loan_Files with symmetric subfolders rather than create a new 09_Casa_Grande_II/. Rationale: counsel will index by transaction theme, not by file folder; symmetric CG_I/CG_II is more legible than scattering CG II evidence across multiple top-level folders."
