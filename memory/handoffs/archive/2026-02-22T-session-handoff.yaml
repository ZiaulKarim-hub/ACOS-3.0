context_for_next_session: |
  CRITICAL HANDOFF — READ THIS FIRST:

  The handoff enforcement system has a bug that lets sessions run to 160k+ tokens.
  The bug: once ANY handoff file exists for the current session, the token-gate
  permanently disables enforcement. Even if 30k more tokens are used after the
  handoff, the system stays silent.

  THE FIX MUST:
  1. Fire the handoff protocol at 130k tokens MAXIMUM (user requirement)
  2. Start warnings even earlier (100k-110k suggested)
  3. If a handoff already exists but tokens grew >20k since it was written,
     demand a FRESH handoff (the old one is stale)
  4. Never allow the session to exceed 130k without a handoff being created
  5. Be strict — no way around it, no silent bypass

  The fix is in token-gate.sh. The key section is the "Handoff Detection" block
  (~line 200+). Currently it finds any file with matching session_id and exits.
  It needs to ALSO check: "was this handoff created recently enough relative to
  current token usage?"

  Approach: Store the token count when the handoff was created (either in the
  handoff YAML as `tokens_at_creation:` or in the enforcement state file).
  On subsequent checks, compare current tokens vs tokens_at_creation.
  If delta > threshold (e.g., 20k), re-activate enforcement.

  ALSO: Lower all thresholds:
  - WARN: 50% (100k) instead of 55% (110k)
  - BLOCK: 60% (120k) instead of 65% (130k)
  - EMERGENCY: 65% (130k) instead of 70% (140k)
  - Hard ceiling at 130k — enforcement should be impossible to bypass after this

  AFTER fixing the handoff bug, continue the /acos-update implementation:
  - 3 scripts still need creating (session-cleanup.sh, enforce-quality-gate.sh, inject-agent-context.sh)
  - 4 reviewer agents need isolation:worktree added
  - Run health check, verify, commit everything

  The update report is at memory/decisions/acos-update-2026-02-22.md
  The full research findings (Claude Code 17 hooks, Agent Teams, SDK, etc.) were
  gathered earlier in this session — check the handoff for the full list of findings.
