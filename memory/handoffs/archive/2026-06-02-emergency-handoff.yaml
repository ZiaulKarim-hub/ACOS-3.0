context_for_next_session: |
  The session left the project cleanly between stories. STORY-003-001 is fully closed:
  all 7 slices reviewed and passed, 124 tests green, 87.64% coverage, public API frozen.
  The audit-trail artifact is at memory/handoffs/archive/2026-05-28-slice-003-001-07-and-story-001-completed.yaml
  and contains the full review verdicts, acceptance criterion mapping, public API surface,
  and runtime guarantees. That file is the authoritative STORY-003-001 closure record.

  The parser module lives at apps/visual-composer/src/parser/. Its public surface:
    extract(html: string, opts?: { bradEnrichment?: boolean }): Promise<ContainerRecord[]>
  plus ContainerRecord, NodeKind, ComputedStyle, ContainerContent variants, enrich(),
  EnrichOptions, BRAD_CLASSES, BRAD_CLASS_SET, BRAD_CLASS_PRIORITY, BradClass, ExtractOptions.
  All internal helpers (walkDom, extractText, extractImage, extractSvgFromWalkedNode,
  extractTableFromWalkedNode, extractBackground, assertKindCoherent, isSafeBackgroundUrl,
  isDeniedHostname, parseIPv4, pickHighestPriority) are module-private and must not be
  imported by downstream stories.

  Key security contracts the STORY-003-002 canvas developer MUST respect:
  1. SVG rawMarkup (SvgContent.rawMarkup) is UNTRUSTED. The canvas MUST sanitize via
     DOMPurify (SVG profile) before any innerHTML insertion. Forbidden:
       el.innerHTML = rec.content.rawMarkup
       el.outerHTML = rec.content.rawMarkup
       document.write(rec.content.rawMarkup)
  2. Background URLs have already been filtered through the SSRF allowlist in background.ts.
     The canvas can use them for CSS background-image without re-checking the scheme, but
     note that IPv4-mapped IPv6 loopback (http://[::ffff:127.0.0.1]/) is a known bypass
     (S1, deferred).

  Five forward findings must make it into the STORY-003-002 plan (see next_actions above).
  The most urgent are: the mandatory SVG sanitize-at-render AC (security prerequisite,
  non-negotiable) and BG3-audit (run at kickoff before any canvas work — if multi-layer
  backgrounds exist in production docs, the BackgroundContent type needs a hot-fix slice
  before the canvas is built against it, otherwise it is a type-contract change in the
  middle of STORY-003-002).

  The prior session (2026-06-01) worked on the global acos-guided-reader skill (outside
  the ACOS 3.0 repo entirely). That work is captured in memory/handoffs/2026-06-01-emergency-handoff.yaml
  and is unrelated to EPIC-003. The guided-reader session ended with browser end-to-end
  validation pending — if the user asks about the guided reader, refer to that handoff.

  Stack context: apps/visual-composer uses Vite + React + TypeScript, pnpm, Vitest.
  Test runner: `pnpm run test` (unit) + `pnpm run test:integration` + `pnpm run test:perf`.
  Coverage report lives at apps/visual-composer/coverage/ (git-ignored).

forward_findings_verbatim:
  S1:
    severity: LOW
    source: "security-reviewer re-review 2026-05-28"
    description: >
      IPv4-mapped IPv6 loopback http://[::ffff:127.0.0.1]/ slips past isDeniedHostname.
      URL.hostname normalizes to [::ffff:7f00:1] (hex); IPv4 dotted-quad parser does not
      recognize the hex form.
    action: >
      Extend isDeniedHostname bracket-strip branch: parse ::ffff: suffix as IPv4
      dotted-quad OR hex pair; feed recovered octets through CIDR checks. Also reject
      any host containing '::' literal unless explicitly allowlisted.
    target: "STORY-003-002 prep tick or first slice touching security"

  F2-neg:
    severity: LOW
    source: "integration-reviewer slice 07"
    description: >
      assertKindCoherent throws on bad records but has no negative-path unit test.
      Throw branch is uncovered.
    action: >
      Add one test that hand-crafts a mismatched record via type-cast and asserts
      toThrow(/dual-discriminator desync/).
    target: "STORY-003-002 prep tick (~15 min)"

  BG3-audit:
    severity: LOW
    source: "Architect — story closure"
    description: >
      Multi-layer background MVP takes only the first url() layer. Hand-authored
      fixtures don't exercise multi-layer; real OKOA Brad docs unverified.
    action: >
      STORY-003-002 kickoff: run one real Brad doc through extract() and grep source
      CSS for comma-separated background-image rules. If present, file a hot-fix slice
      to extend BackgroundContent (layers: string[]) before canvas work — this is a
      type-contract change that must happen before STORY-003-002 slices build against
      BackgroundContent.
    target: "STORY-003-002 kickoff gate"

  fixture-size:
    severity: LOW
    source: "performance-reviewer"
    description: >
      brad-full-10pg.html is 18 KB, not ~30 KB as documented. Perf claim is still
      trivially satisfied; headroom number needs recalibration against real production
      document size.
    action: >
      Re-validate extract() perf against a real Brad doc sized to actual production
      output (typically 25-50 KB for a 10-page credit memo).
    target: "STORY-003-002 prep or first integration run"

  bracket-comment:
    severity: LOW
    source: "security-reviewer re-review"
    description: >
      background.ts inline comment incorrectly states URL.hostname does NOT include
      brackets. Node (and browser) return [::1] with brackets; the bracket-strip code
      is load-bearing, not redundant.
    action: >
      Correct the comment in the next slice that touches background.ts (or as a
      standalone one-line fix before STORY-003-002 begins).
    target: "Next slice touching background.ts"

