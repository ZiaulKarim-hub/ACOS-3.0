bug_fix_this_session:
  id: "B11"
  title: "register-session-pid.sh recorded transient inner claude child, not outermost Claude Code process"
  root_cause: |
    The ancestor-walk loop in register-session-pid.sh iterated from the current
    process upward toward the terminal. On the first match of a process whose
    comm was `claude` (or matched the argv pattern), the old code immediately
    broke the loop and wrote that PID to the state file. However, Claude Code
    spawns transient inner claude subprocesses per tool call — these processes
    exist only for the duration of the tool call and die immediately after.
    As a result, the script was recording the inner child's PID (e.g., 63321),
    which was dead by the time any downstream code tried to use it, while the
    real long-lived Claude Code process (PID 45454) was further up the ancestor
    chain and was never seen.
  fix: |
    Changed the inner loop to record each claude match into LAST_MATCH_PID /
    LAST_MATCH_START but KEEP WALKING instead of breaking. After the loop
    completes, writes LAST_MATCH_PID (the outermost — i.e., longest-lived —
    claude process in the chain). Header comment updated with B11 reference
    and 2026-05-20 dating.
  file: "/Users/zee/Library/Application Support/acos-token-monitor/bin/register-session-pid.sh"
  verification: "Ran script manually; pid file went from 63321 (dead) → 45454 (alive, 2h19m uptime). Confirmed via ps -p 45454."
  syntax_check: "bash -n passed"

