context_for_next_session: |
  This session was entirely focused on diagnosing and fixing the eternity protocol's
  recurring "silently didn't fire" failures. The investigation was triggered by a
  FruitSync session (b6c4dc9b) that blew 227k tokens PAST the 400k threshold with
  no eternity fire. Root cause analysis found TWO independent bugs, both in recovery
  paths (the happy path worked fine):

  BUG 1 — backfill-watchers.sh's launchd plist lacked AbandonProcessGroup. launchd
  SIGKILLs every child in the job's process group the instant the job's main process
  exits. nohup+disown only detaches from shell job-control, NOT launchd's pgroup.
  Result: 16,000+ iterations in backfill-launchd.log of "[spawn] ... spawned: 2"
  repeating every 2 minutes, with 0-byte watcher logs (killed before first write).
  Sessions that missed their SessionStart spawn (due to a known JSONL-doesn't-
  exist-yet race at session start) were therefore NEVER covered by backfill.
  FIX: Added AbandonProcessGroup=true to the plist.

  BUG 2 — stale cmux-unhealthy markers. The daemon marks a session cmux-unhealthy
  after 2 consecutive injection failures. During a Jun 16-20 cmux app outage, every
  pane got marked. When cmux recovered, the markers stayed because the only recovery
  path is "a future dispatch ping succeeds" — but if the session was idle, no dispatch
  ever fired again. Permanently suppressed.
  FIX: Added age-based GC to backfill-watchers.sh: clear any cmux-unhealthy marker
  >10 min old, unconditionally. cmux ping is the preferred clear trigger but only
  works in-pane; the age path is launchd-safe.

  Both fixes are in out-of-repo files (~/.../acos-token-monitor/). Verified working.

  IMPORTANT GOTCHA: find -mmin's exit code is 0 whether or not it found any matches.
  The first cut of the reaper used "if find $path -mmin +N >/dev/null" and would have
  killed EVERY watcher every 120s (opposite of intended). Caught in dry-run. All age
  tests in backfill-watchers.sh now use stat -f %m + bash arithmetic.

  ARCHITECTURE (clarified this session, must know when touching eternity):
  - Watcher DETECTS crossing (writes .last-total-<sid>)
  - Skill GENERATES handoff + arms .clear-requested-<sid> AND .clear-requested-surface-<sid>
  - In-pane Stop hook (eternity-cmux-inpane.sh) INJECTS via cmux send
  - Watcher's own fire_inject_cmux is vestigial/benign noise
  - cmux CLI ONLY works in-pane (detached daemon context always gets EPIPE)

  SKILL RENAMES (28c42d8):
  - /acos-eternity-protocol = the cmux/auto-fire engine (was /acos-eternity-protocol-cmux)
  - /acos-continue = the Warp/manual handoff (was /acos-eternity-protocol-warp)

  FRESHNESS GUARD (added this session, both skills Step 1):
  Both skills now abort with an error if the handoff-agent wrote nothing or only a
  stale handoff — "test -s" was the prior check but it passed for any pre-existing
  handoff. The guard requires the handoff mtime < 10 min.

  HANDOFF-AGENT IMPROVEMENTS (this session, not yet committed):
  - maxTurns: 20 → 45 (was hitting cap before writing on large repos)
  - Step 1.5: stub-write-first — writes a minimal YAML stub immediately after
    preflight, then overwrites with the full handoff. Guarantees something useful
    is written even if the agent is cut off mid-gather.

  CONCURRENT WORK THREAD — HCA (hypercore-ask):
  There is a large parallel work thread for planning/preeng/001-hypercore-ask/.
  Last evidence: SLICE-HCA-16-hardening (2026-06-19). Many new files unstaged.
  This was NOT the focus of this session; eternity fixes took priority.

