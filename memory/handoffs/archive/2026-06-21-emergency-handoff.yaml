decisions_made:
  - "AbandonProcessGroup=true is now mandatory in any launchd plist that spawns child processes via nohup+disown — shell job-control detach (nohup/disown) does NOT protect from launchd's pgroup SIGKILL."
  - "cmux-unhealthy GC must be age-based (>10 min), not cmux-ping-based, when running under launchd — cmux CLI is in-pane-only and always fails from detached daemon context."
  - "find -mmin exit code is NOT a reliable 'any matches found' test (exits 0 even on no match). Always use stat -f %m + arithmetic for age-gated logic."
  - "Canonical skill names going forward: /acos-eternity-protocol (cmux auto-fire) and /acos-continue (Warp manual). The -cmux and -warp suffix names are retired."
  - "Freshness guard on handoff: 10-minute maximum age enforced by both eternity skills before they'll write a .clear-requested flag. If handoff is stale, the skills ABORT (session not cleared) so the user can investigate."
  - "handoff-agent must write a stub first (Step 1.5) because turn-cap on large repos kills it before Step 4 — stub-write-first is a mechanical guarantee that SOMETHING is always written."
  - "Architecture clarification: watcher DETECTS tokens (writes .last-total-<sid>), SKILL GENERATES handoff (writes .clear-requested-<sid>), IN-PANE HOOK INJECTS (eternity-cmux-inpane.sh reads .clear-requested and calls cmux send). Watcher's own fire_inject_cmux is vestigial from before in-pane hook; it marks sessions unhealthy but is benign noise (age-GC clears within 10 min)."

