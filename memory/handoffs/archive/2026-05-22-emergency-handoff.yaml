decisions_made:
  - "page.goto('file://') is mandatory — setContent() puts page at about:blank origin which blocks all file:// image loads (this was the root cause of blank hero pages in the earlier pipeline)"
  - "All <img> src attributes in brad-build.py use absolute file:// paths, not relative paths, because the HTML may be opened from any working directory"
  - "loading='lazy' must NOT be used in image grids — headless Chromium does not scroll and therefore never triggers lazy-load for images below the initial viewport fold"
  - "Version A preserves MEMO numbers verbatim with inline red/green callout markers at the three footing-error locations; Version B corrects those three tables. Both versions go through the same brad-build.py pipeline."
  - "node_modules/puppeteer is resolved from the ACOS 3.0 directory (/Users/zee/Documents/Vibe Coding/ACOS 3.0/node_modules/puppeteer) — there is no node_modules in the OKOA workspace"

