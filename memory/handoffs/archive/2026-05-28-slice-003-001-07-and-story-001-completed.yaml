forward_findings_for_story_003_002:
  - finding_id: "S1"
    severity: LOW
    source: "security-reviewer re-review 2026-05-28"
    description: "IPv4-mapped IPv6 loopback http://[::ffff:127.0.0.1]/ slips past denylist. URL.hostname normalizes to [::ffff:7f00:1] (hex); IPv4 dotted-quad parser doesn't recognize."
    action: "Extend isDeniedHostname's bracket-strip branch: parse ::ffff: suffix as IPv4 dotted-quad OR hex pair; feed recovered octets through CIDR checks. Also reject any host containing '::' literal unless explicitly allowlisted."
    target: "future security touch-up slice or STORY-003-002 prep"
  - finding_id: "MANDATORY"
    severity: MAJOR (planning)
    source: "Architect — story closure prerequisite"
    description: "STORY-003-002 (canvas) MUST include explicit acceptance criterion: 'SVG rawMarkup is sanitized via DOMPurify (SVG profile) or DOMParser-strip pattern before being inserted into the live DOM via innerHTML or equivalent. Forbidden insertions: el.innerHTML = rec.content.rawMarkup; el.outerHTML = rec.content.rawMarkup; document.write(rec.content.rawMarkup).'"
    action: "Add to STORY-003-002 acceptance_criteria block when story planning begins."
  - finding_id: "F2-neg"
    severity: LOW
    source: "integration-reviewer slice 07"
    description: "assertKindCoherent throws on bad records but has no negative-path unit test. Throw branch untested."
    action: "Add a one-line test that hand-crafts a mismatched record via type-cast and asserts toThrow(/dual-discriminator desync/)."
    target: "STORY-003-002 prep tick (15 min)"
  - finding_id: "BG3-audit"
    severity: LOW
    source: "Architect — story closure"
    description: "Multi-layer background MVP behavior: only first url() layer captured. Hand-authored fixtures don't use multi-layer; real OKOA Brad docs may."
    action: "STORY-003-002 kickoff: run ONE real Brad doc through extract() and grep source CSS for comma-separated background-image rules. If absent, freeze is safe. If present, file hot-fix slice to extend BackgroundContent before canvas work."
  - finding_id: "fixture-size"
    severity: LOW
    source: "performance-reviewer"
    description: "brad-full-10pg.html is 18 KB, not ~30 KB as documented. Story-level perf claim still trivially satisfied; headroom recalibration."
    action: "STORY-003-002 prep: re-validate against real-Brad fixture sized to actual production document."
  - finding_id: "bracket-comment"
    severity: LOW
    source: "security-reviewer re-review"
    description: "background.ts inline comment incorrectly states URL.hostname does NOT include brackets. Node returns [::1] with brackets; bracket-strip code is load-bearing, not redundant."
    action: "Comment correction in next slice that touches background.ts."

