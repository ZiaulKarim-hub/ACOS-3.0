context_for_next_session: |
  The acos-guided-reader skill lives at ~/.claude/skills/acos-guided-reader/ as a
  global personal skill — it is NOT inside the ACOS 3.0 project repo and will
  never appear in git status.

  The rebuild converted the skill from a terminal-driven F+Enter model to a
  browser-native two-way architecture. The architecture is:

    Browser (f/b/e/x keypresses + text selection)
      ↕ HTTP POST + SSE (EventSource)
    gr-server.py (local ThreadingHTTPServer, random loopback port)
      ↕ commands.jsonl (tail -f)
    Claude-in-terminal (explains selections, handles exit)

  f and b are entirely server-side: ~50ms, no Claude tokens consumed. e and x
  go to commands.jsonl for Claude to pick up. Claude blocks in a tail -f loop
  in Phase 6 of the skill protocol, processes explain/exit events, and POSTs
  explanations back via curl to /internal/complete-explain.

  The server smoke test passed (all 6 endpoints verified via curl). What has NOT
  been tested is any browser interaction — keyboard handlers, SSE re-render, text
  selection capture, and the e-panel history list are all untested in a real
  browser. The immediate next action for Zee is to invoke the skill and do that
  test. Expected invocation:

    /acos-guided-reader acos-knowledge-builder

  The server log for debugging is at:
    .acos/state/guided-reader/knowledge-builder/server.log
  (relative to the working directory when the skill was invoked; likely the ACOS
  3.0 project root if invoked there, or ~/.acos/ if invoked from a directory
  without a .acos/ folder)

  There is no leftover state from the smoke test — the state dir was cleaned up.
  The first real run will create a fresh .acos/state/guided-reader/knowledge-builder/
