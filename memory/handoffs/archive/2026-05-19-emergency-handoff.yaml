decisions_made:
  - "f/b navigation is 100% server-side: server rewrites page.html and pushes SSE
    — Claude consumes zero tokens for navigation, achieving ~50ms round-trip"
  - "e/x events go to commands.jsonl (tail-f polling): these require LLM work
    (explain) or session teardown (exit), so Claude must be in the loop"
  - "stdlib-only constraint on gr-server.py: consistent with subscription-only
    constraint — no pip installs, no API keys. Claude-in-terminal does LLM work."
  - "Modifier-key ignore on keyboard handler: intentional, so Ctrl/Cmd/Alt+anything
    passes through to the browser natively (reload, find, etc.)"
  - "Mechanism C (pre-baked hover tooltips on terms) explicitly deferred out of
    MVP scope"
  - "Help overlay (? key) reserved in key-bindings table but not implemented"

