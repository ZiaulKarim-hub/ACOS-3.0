CRITICAL_NOTES_category_6_mechanics:
  description: |
    These are the three "renderer mechanics that aren't visible but matter"
    patterns the user explicitly wants to continue exploring. Keep these
    front-and-center when resuming.

  pattern_6a_inter_table_breathing:
    name: "Inter-table breathing via adjacent-sibling CSS selector"
    css: ".t + .t { margin-top: 6mm; }   .t-note + .t { margin-top: 6mm; }"
    problem: "Two stacked tables crash into each other; naive 'top margin on every table' also pushes the first table down from its section title."
    solution: "CSS + selector targets only elements that come after another of the same kind. First table doesn't match → no margin. Second/third tables match → automatic 6mm gap."
    simple_analogy: "Like handing out coasters at a party: only people who arrive second-or-later get one, because there's nothing before them to protect from."
    generalizes_to: "Any stack of repeated elements (testimonials, footnotes, photo cards, bullet groups)."
    where_used: "Page 17 (Financial Analysis) — 3 tables now have visible breathing room."

  pattern_6b_flex_column_bottom_pinning:
    name: "Flex-column page-body with margin-top: auto for bottom-pinning"
    css: ".page-body { display: flex; flex-direction: column; }   .bottom-treatment { margin-top: auto; }"
    problem: "Want some element to pin to page bottom when content above is short, sit inline when content above is tall. Absolute positioning causes overlap; static positioning leaves gaps."
    solution: "Convert page-body to flex column. The magic value `margin-top: auto` on a child converts ALL available empty space above it into margin — element naturally pins to bottom when there's space, sits inline when there isn't."
    simple_analogy: "Like a heavy book on a shelf with other books on top: if there are 2 books above, the heavy one falls until it touches the shelf; if there are 20 books above, no room left to fall through."
    generalizes_to: "Footer captions, contact strips, copyright notices, key-takeaway panels — anything that should pin-to-bottom-when-possible."
    where_used: "Built for the (later reverted) anchor-panel work. Mechanism still in the renderer, ready to reuse."

  pattern_6c_eyebrow_folding:
    name: "Eyebrow folding for continuation pages"
    pattern: |
      Page 1: eyebrow "07 PROPERTY DESCRIPTION" + big title "Property Amenities & Features"
      Page 2: eyebrow "07 PROPERTY DESCRIPTION — Floor Plans" (NO big title)
    problem: "Multi-page sections redundantly repeat the big section-title element, wasting ~25mm of vertical space on continuation pages."
    solution: "Fold the page-specific subject into the eyebrow text. Drop the big title element. Section identity preserved (eyebrow still says §07), page subject communicated ('— Floor Plans'), but ~25mm of vertical real estate reclaimed."
    simple_analogy: "Like chapter headers in a book — first page of Chapter 7 has the big CHAPTER SEVEN banner, but pages 2/3/4 just have a small running header 'Chapter 7 · Title' at the top."
    generalizes_to: "Any multi-page section (long appendices, dense data sections, multi-page TOCs)."
    where_used: "Page 11 of the rebuild — the Floor Plans continuation page of §07 Property Description."
    why_it_matters: "Eyebrow is cheap real estate (12pt all-caps). Section-title is expensive real estate (32pt italic display). Trade expensive for cheap when the title would be redundant."

