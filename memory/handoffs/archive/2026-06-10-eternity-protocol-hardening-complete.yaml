session_summary: |
  Multi-week saga building, debugging, and hardening the ACOS Eternity
  Protocol. This session (b9240c80, alive since May 19) accumulated the
  full design + implementation arc:
    - May 28: variant split (-cmux / -warp / -stop replacing single skill)
    - Jun 4: per-PID pointer + handoff-paired .resume.md sibling design
    - Jun 4 PM: warp variant made manual-only (auto-fire disabled)
    - Jun 9: universal SessionStart hook → every claude session in every
              project auto-gets a watcher; per-project launchd plists
              kept as safety net
    - Jun 9 PM: all 5 eternity-protocol skills globalized via symlinks
              into ~/.claude/skills/; eternity-protocol-core.sh also
              symlinked into the global daemon bin dir
    - Jun 10: three-bug fix surfaced by Auto-Blogger autopilot postmortem:
              (1) core.sh handoff glob now accepts .md AND .yaml,
              (2) inject-via-cmux.py retries once on EPIPE/broken-pipe,
              (3) check_post_compact tolerates pre_compact_total=0
              (defaults to threshold instead of deleting marker)
    - Jun 10: watcher processes restarted to load the new check_post_compact
              code

what_works_now:
  universal_coverage: |
    User-global SessionStart hook in ~/.claude/settings.json ensures every
    claude session in every project gets a token-watcher.py spawned. No
    per-project setup needed. Idempotent via pgrep guard.
  variant_dispatch: |
    Daemon's dispatch_threshold_fire() at 400k correctly identifies cmux
    vs warp sessions via state/cmux-surface-<sid> marker. cmux gets full
    automation via Unix-socket RPC. warp is manual-only (auto-fire
    disabled deliberately because AXTitle race makes injection
    ~always fail in multi-Warp-window setups).
  resume_lookup: |
    /acos-eternity-protocol-resume uses per-claude-PID pointer first
    (state/.eternity-pointer-pid-<pid>), then legacy state/pending-resume-*
    (project-scoped), then pick-from-list of newest .resume.md siblings.
    Cross-day resume works because claude PID survives /clear within a pane.
  globally_reachable: |
    All 5 skills (-cmux, -warp, -stop, -resume, -threshold) symlinked into
    ~/.claude/skills/. eternity-protocol-core.sh symlinked into
    ~/Library/Application Support/acos-token-monitor/bin/. inject-via-cmux.py
    and inject-keystroke.py natively in daemon bin. memory/handoffs/ auto-
    created by skill body if missing. Works in any project.

known_limitations:
  warp_auto_fire_disabled: |
    Deliberate. AXTitle marker race makes daemon-driven keystroke injection
    fail in multi-Warp-window setups. User invokes /acos-eternity-protocol-warp
    manually when ready to hand off. Skill produces handoff + visible block
    with paths; user does /clear and resume manually.
  cmux_socket_dependency: |
    cmux variant requires the cmux GUI app to be running. If the socket
    file is missing or the cmux process is dead, RPC injection fails.
    Jun 10 EPIPE retry handles stale sockets; relaunching cmux app fixes
    fully-dead-process case. Operator hint surfaced in daemon log.
  cmux_rpc_method_name_unverified: |
    inject-via-cmux.py defaults to RPC method "surface.send-input". Not
    confirmed against `cmux capabilities` output. Override via
    CMUX_INJECT_METHOD env var if cmux's real method name differs.

todays_three_bug_fixes:
  - bug: "core.sh handoff glob hardcoded to *.yaml"
    location: ".claude/scripts/eternity-protocol-core.sh L53"
    impact: "Blocked all variant fires when only .md handoffs existed"
    fix: "Glob both extensions; case statement for basename suffix strip"
  - bug: "inject-via-cmux.py didn't retry on EPIPE"
    location: "~/Library/Application Support/acos-token-monitor/bin/inject-via-cmux.py"
    impact: "Stale cmux socket caused immediate failure on first write"
    fix: "is_broken_pipe() helper + 0.4s sleep + single retry; surfaces relaunch hint"
  - bug: "check_post_compact deleted markers with pre_compact_total<=0"
    location: "~/Library/Application Support/acos-token-monitor/bin/token-watcher.py"
    impact: "Resume artifacts lost when upstream derivation failed"
    fix: ">10M still deleted; <=0 now defaults to cfg threshold (preserves marker)"

