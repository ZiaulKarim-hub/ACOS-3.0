context_for_next_session: |
  This session added an emergency handoff system as a safety net for when auto-handoff fails.
  The system has two components: a global skill (/acos-handoff) and a project-level agent
  (handoff-agent). The skill is ultra-minimal (~50 words) so it can execute even with very
  few tokens remaining — it just spawns the agent via Task(), which gets its own fresh context
  window. The agent then reads all project state from disk and produces a structured YAML handoff.

  Key finding: several global skills (acos-complete, acos-start, acos-status, acos-oracle-protocol)
  are symlinks pointing back to ACOS 3.0 project directory. These will break if the project is
  moved. The acos-handoff symlink was already broken (we deleted the project-level source) and
  was replaced with a real directory. The others should be migrated similarly.

  The handoff-agent was also copied to okoa-wiki for immediate use there. Long-term, it should
  be part of the acos-embed-skills portable set.
