decisions_made:
  - "Drop attempts to render a photographic specular highlight on Cover 4 (v2). Multiple iterations produced smudges or UFO halos. Cleaner result without it. Lesson: pure SVG/PIL can't fake studio lighting physics — the gold edge stroke alone carries enough metallic feel for institutional brand work."
  - "Branch plexus renderer on is_light. On dark bg keep bloom + bokeh; on light bg use sharp lines + crisp nodes only. Bokeh is a 'light bleeding through dark' phenomenon with no analog on light bg."
  - "Bump cover 17 cube_top from #1A2433 → #3F5078 so the navy cube separates from the near-black bg."
  - "Use Inter Medium 11pt @ 0.16em tracking instead of Helvetica Neue Thin 11pt @ 0.40em for the typographic chrome. Inter Medium reads crisply at small sizes; thin weight + wide tracking compounded to hazy on dark bgs."
  - "Reuse okoa-design palette tokens (voltage / japandi-* / ridgeline / studio-nordost / datum-tech) directly rather than inventing per-cover palettes. Keeps the 20-variant series on-brand and lets the user pick covers seasonally without brand voice fragmenting."

