context_for_next_session: |
  ALL 8 /acos-update IMPROVEMENTS ARE COMPLETE AND PUSHED.

  Three commits pushed this session:
  - 21ee06e: feat: Complete /acos-update — all 8 improvements
  - c8c3996: fix: Remove Oracle hard blocks
  - 30b5435: fix: Token estimation calibration (3 chars/token + 25k overhead)

  KEY BUG FOUND AND FIXED:
  assign-reviewers.sh had a heredoc/stdin conflict — the Python heredoc
  captured stdin, so json.load(sys.stdin) always failed and the except block
  returned ["qa-reviewer"]. This means reviewer assignment was NEVER actually
  working. Fixed by reading stdin into MANIFEST env var before the heredoc.

  TOKEN ESTIMATION was undercounting by ~2x because:
  1. Used 4 chars/token ratio (should be ~3 for mixed content)
  2. Had no overhead for system context (~25k tokens of CLAUDE.md, MEMORY.md,
     auto-loaded handoffs, system prompt are invisible to the JSONL transcript)

  ORACLE hard blocks removed per user request. All operations now use
  temperature scoring. Destructive commands still score +5 and escalate
  at most threshold levels — just not unconditionally denied.

  5 active handoffs exist. Consider /acos-complete to archive them.
