session_summary: |
  This session built a full Playwright-based web crawler for HyperCore
  (https://app.hypercore.ai), the loan-servicing SaaS that Okoa Capital uses to
  manage its private-credit real estate book. The session captured 25 of 33 active
  loans (the other 8 are "quiet" loans with no current notifications, making them
  unreachable via the notification-driven discovery method), produced 91 screenshots
  and 91 raw HTML files, extracted per-loan YAML data for all 25 loans, and
  synthesized everything into a comprehensive reverse-engineered operational guide
  (HYPERCORE_GUIDE.md) covering the portfolio dashboard, loan anatomy, and UI
  navigation map. The deliverable is a standalone reference directory at
  hypercore-learning/ — not yet converted to an ACOS skill, but that was the
  stated next step.

