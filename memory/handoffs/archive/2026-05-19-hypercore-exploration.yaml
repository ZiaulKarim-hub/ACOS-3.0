context_for_next_session: |
  The hypercore-learning/ directory is a self-contained exploration artifact at
  /Users/zee/Documents/Vibe Coding/ACOS 3.0/hypercore-learning/. It is NOT part
  of any ACOS slice and has no planning YAML. The deliverable was HYPERCORE_GUIDE.md,
  which is now complete as a draft v1 and lives at that path.

  The core discovery method relied on HyperCore's notification bell: because the
  app is a React SPA, the crawler could not enumerate loans from the /loans list
  page (SPA hydration timing issue — the page returned empty before JavaScript
  populated the table). Instead, loans were discovered by following 95 notification
  links in the notification panel. This is why only 25 of 33 active loans appear
  — the missing 8 have no current alerts (no missed payments, no maturities within
  30 days, no upcoming payments within 7 days).

  The nav probe pass (04_recrawl_v2.py) discovered that /portfolio resolves to
  /loans (confirmed URL in nav_probes.yaml), /reports resolves to
  /reports?report=Management%20Dashboard (a pre-built "Management Dashboard" report
  exists), and /settings resolves to /settings with sub-tabs General / Currency /
  Floating Rates / Notifications / Historical Activity. These partial results
  should be folded back into Chapter C of HYPERCORE_GUIDE.md as confirmed URLs.
  The guide currently states all sidebar URLs are "unknown" which is now partially
  wrong — /reports and /settings are confirmed.

  For the next session, the highest-value quick wins are: (1) update Chapter C
  to reflect the confirmed /reports and /settings URLs found in nav_probes.yaml,
  (2) attempt a better /loans list capture by adding a SPA wait before snapshot
  (this would unlock all 33 loans), (3) bulk-extract cap stack data from existing
  HTML without re-crawling (the HTML files are all present).

  Auth note: The .auth/auth_state.json last written 2026-05-04 is ~2 weeks old
  and almost certainly expired. Before running any crawler script, Zee must run:
    cd "/Users/zee/Documents/Vibe Coding/ACOS 3.0/hypercore-learning"
    .venv/bin/python scripts/01_login.py
  This opens a visible Chrome window for manual Google OAuth login. Then run
  06_full_crawl.py immediately before the session expires (~60 minutes).

  The Python virtualenv is at hypercore-learning/.venv/. Playwright is installed
  there. No other dependencies.

