context_for_next_session: |
  The renderer is mature. Anyone resuming can:

    cd "/Users/zee/Documents/OKOA/Ascent LK Cap preso/rebuild"
    ~/Documents/OKOA/.venv-design/bin/python3 business-report-build.py \
      --input ascent-park-city.A-verbatim.yaml \
      --output OUT.html \
      --scope all \
      --variant {ridgeline|stillness} \
      [--minimal-weights]
    node "/Users/zee/Documents/Vibe Coding/ACOS 3.0/.claude/scripts/html-to-pdf.js" \
      OUT.html OUT.pdf --margin 0 --no-footer

  For per-page visual QA: pdftoppm -r 130 -png OUT.pdf .qa-foo/page (writes
  page-NN.png at ≤1430px tall, safely under the 2000px many-image cap from
  feedback_screenshot_qa_2000px_cap.md).

  Token sets (T_RIDGELINE, T_STILLNESS) and the _minimize_weights() helper
  live at the top of business-report-build.py. The 11 canonical type stops are
  in _TYPE_SCALE. The 4 part-divider configs (numeral + photo + 3 metrics) are
  in PART_CONFIGS. In-section photo placements (Location, Floor Plans,
  Construction Status) are in SECTION_PHOTOS. Special-cased renders (Property
  Renderings 3-photo spread, Floor Plans 3-up grid) are hardcoded in build_html.

  YAML schema is loose — extend by adding handlers to render_data_spread.
  Already handles: body_col_1/2, pull_quote, tables (with footing_error
  preservation), metrics, callout, items (with auto-detect for risk cards),
  figure, brand_note, alignment, portfolio, portfolio_note, steps, and 6
  prose extensions (pricing_justification, absorption_assumptions, analysis,
  market_performance, demand_drivers, lifestyle).

