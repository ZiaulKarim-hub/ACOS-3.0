  KEY LESSONS (do not repeat these mistakes):
  1. Visual verification with LibreOffice real renders is mandatory — install it BEFORE
     starting builds, not after iteration 4.
  2. Fonts must be installed system-wide or LibreOffice substitutes Helvetica and the
     editorial character is lost.
  3. When source HTML has specific Unsplash photo URLs, use THOSE URLs — do not
     substitute with agent-chosen alternates.
  4. "Look like the PDF" means literal 1:1 page-to-slide mapping including continuation
     paragraphs, secondary pull quotes, full disclosure blocks, and footer strips. Never
     compress or reorganize unless explicitly asked.
  5. Dispatched sub-agents that pause at their own confirmation gates waste turns — when
     briefing sub-agents, pre-authorize all decisions in the brief.

