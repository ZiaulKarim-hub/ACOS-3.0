critical_findings:
  - finding: "Universal injection failure across all active sessions"
    detail: |
      35 fires across 6 sessions, ZERO successes. All refused with
      'AXTitle marker not found in 1 windows: [Eternity Protocol Debugging]'
      (or the current Claude task description for each pane).
      Sessions affected: f3c79025 (THIS session, 5 fires), 75254de0 (14 fires —
      session was lost, user /exit'd at 12:46 MDT), 5e64ad16 (2), 0fd2b551 (5),
      87755fdd (7 fires/8 fails — one extra fail), 9fd5f7e8 (2).
    root_cause: |
      2026-05-21 patches correctly closed the cross-session misfire vector by
      removing the OK_SOLE_WINDOW fallback in inject-keystroke.py's osascript.
      Side effect: any session where Claude Code overwrites the window title
      with task-description text loses the AXTitle marker race. Stamp → Claude
      overwrites → AXRaise scans → marker not found → refuse. Universal.

  - finding: "New claude launches SIGKILLed (exit 137) in user's Warp"
    detail: |
      User cannot start NEW claude sessions in any Warp pane. Tested:
      - claude --version → 137
      - env -i bare binary /Users/zee/.claude/local/claude → killed
      - fresh Warp window (Cmd+N) → 137
      9 existing claude panes work fine (predates the issue).
    root_cause: |
      User stopped Warp updates because each update revoked Full Disk Access
      (granted via Safe Mode reboot). Newer Claude Code binary is incompatible
      with the pinned older Warp version. New launches get SIGKILLed (likely
      by Warp's launch-integration layer detecting protocol mismatch).
    workarounds_available:
      - Use one of 8 alive existing claude panes for work (no fix needed)
      - Switch to iTerm2 or Ghostty (terminal change, ~30min)
      - Update Warp + redo Safe Mode FDA dance (~30-60min)
      - Roll back Claude Code to compatible version (hacky)

  - finding: "tmux integration landed but cannot be tested"
    detail: |
      All patches in place and syntactically validated:
      - ~/.tmux.conf (NEW, 50 lines, Ctrl-x prefix, 100k history, true-color)
      - ~/.zshrc appended (acos / acos-list / acos-attach functions; v4 is the
        bare `tmux new-session -s NAME` that drops user at shell prompt)
      - register-session-pid.sh patched (lines 78-110, detects $TMUX, writes
        tmux-session-<sid>; benign when not in tmux)
      - inject-keystroke.py patched (get_tmux_session_for_session() +
        inject_via_tmux() with CGEventPost fallback; verified syntax + smoke
        test confirms None return for non-tmux sessions = correct fallback)
      - SKILL.md acos-eternity-protocol-resume Step 1 consumed-probe
        disambiguation (commit 5278a73 on main)
      - bin-manifest.sha256 currently missing (will TOFU-regenerate on next
        launcher restart)
    blocked_by: "Cannot launch new claude inside tmux (same SIGKILL as above)"

