architecture:
  daemon_home: "~/Library/Application Support/acos-token-monitor/"
  components:
    launcher: "bin/token-watcher-launcher.py — launchd entry point. Spawns one
      token-watcher.py per active JSONL. Runs as launchd service com.acos.token-monitor."
    watcher: "bin/token-watcher.py — per-session kqueue JSONL watcher. Fires
      fire_command at threshold, detects post-compact drop, injects resume prompt."
    injector: "bin/inject-keystroke.py — types text+Return into Claude Code.
      Primary: CGEventPostToPid --pid mode. Fallback: AppleScript-frontmost."
    pid_hook: "bin/register-session-pid.sh — SessionStart hook. Writes Claude Code
      PID to state/pid-<session_id> at session open."
    pid_resolver: "bin/resolve-session-pid.py — lsof-based fallback PID resolver."
    config: "config.yaml — hot-reload: threshold, fire_command, post_compact_drop_pct."
    plist: "com.acos.token-monitor.plist — launchd service definition."
    installer: "install.sh — one-shot setup."
  state_files:
    pid_file: "state/pid-<session_id> — Claude Code PID, written by SessionStart hook."
    fired_flag: "state/.compact-fired-<session_id> — prevents double-fire per cycle."
    resume_pending: "state/.resume-pending-<session_id> — arms daemon with pre-compact
      total; daemon checks this to detect when compaction is done."
    resume_prompt: "state/pending-resume.txt — the text to inject post-compact."
    cycle_history: "state/.cycle-history-<session_id> — JSON list of {cycle, fired_at,
      pre_total, post_total, resumed_at} for loop guard and diagnostics."
    heartbeat: "state/heartbeat — epoch timestamp, updated each kqueue event."
  skills:
    - "acos-eternity-protocol — master orchestrator (pre-compact). SKILL.md: /Users/zee/
      Documents/Vibe Coding/ACOS 3.0/.claude/skills/acos-eternity-protocol/SKILL.md"
    - "acos-eternity-protocol-threshold — threshold config helper."
    - "acos-eternity-protocol-resume — manual post-compact resume fallback."
    - "acos-resume-prompt — resume prompt generator (global: ~/.claude/skills/)."
  launchd:
    label: "com.acos.token-monitor"
    plist: "~/Library/LaunchAgents/com.acos.token-monitor.plist (symlink)"
    log_stdout: "~/Library/Logs/acos-token-monitor.log"
    log_stderr: "~/Library/Logs/acos-token-monitor.err"
  settings_hook: ".claude/settings.local.json — SessionStart hook registered:
    '$HOME/Library/Application Support/acos-token-monitor/bin/register-session-pid.sh'"

decisions_made:
  - "/clear over /compact: /compact achieved only 15.6% drop in this session (compaction-
    resistant content — large code files, structured YAML). Loop guard would suspend
    30 min. /clear always reaches ~80-120k floor — deterministic, no yield variance.
    The tradeoff (total context loss vs partial retention) is acceptable because the
    handoff + resume-prompt gives the post-clear AI full structured context."
  - "launchd supervision: KeepAlive=true means the daemon restarts automatically if
    it crashes. The launcher pattern (one process per JSONL) isolates session failures."
  - "CGEventPostToPid over AppleScript: AppleScript requires the target window to be
    frontmost. CGEventPostToPid bypasses focus entirely, enabling background firing.
    The infrastructure is fully built; it becomes the active path now that the
    SessionStart hook provides reliable PIDs."
  - "TCC-friendly path: all daemon files in ~/Library/Application Support/ (not
    ~/Documents/). macOS TCC blocks launchd-spawned processes from reading ~/Documents
    without user consent prompts. The Library path is user-owned and TCC-exempt."
  - "Per-session flag keying: all state files are suffixed with session_id so concurrent
    sessions (multiple Warp tabs, multiple projects) don't interfere."
  - "Loop guard design: 5 min window + 20% drop requirement prevents runaway re-fire
    when content can't compress. 30 min suspend gives the user time to act."
  - "Threshold 400k: comfortable headroom below Claude Code's 500k compaction trigger.
    Configurable via config.yaml (hot-reload) or /acos-eternity-protocol-threshold."
  - "post_compact_drop_pct 35: daemon considers compaction complete when token count
    drops 35% from pre-compact baseline. For /clear this is always satisfied (drops
    to ~80-120k from 400k+, which is 70-80% drop)."

