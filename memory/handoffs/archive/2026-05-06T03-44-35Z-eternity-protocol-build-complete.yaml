context_for_next_session: |
  The Eternity Protocol system is live and operational. The launchd service
  com.acos.token-monitor (PID 71066) is running and supervising 3 parallel session
  watchers: this session (308261d5), de6cfa11, and 663e6411. The system already
  fired once this session at 410k tokens using AppleScript-frontmost mode.

  The architecture is a two-phase design: the skill (acos-eternity-protocol) handles
  pre-compact work (handoff + resume prompt + arm daemon + fire /compact), and the
  daemon handles post-compact work (detect token drop, inject resume prompt). The
  skill intentionally exits after /compact is typed — it cannot survive its own
  compaction.

  The one incomplete piece is precise pane targeting. Everything is built for
  CGEventPostToPid (inject-keystroke.py --pid mode is fully implemented) but the
  PID source is missing. The fix is a SessionStart hook: one line that writes
  $PPID (or the Claude Code process PID) to a known path keyed by session ID. Once
  that hook exists, the daemon reads the PID file instead of attempting lsof, and
  --pid mode becomes the default path.

  The skills inventory cleanup (Tier 1: delete acos-credit-memo-generator, dedup
  security-review-ultimate; Tier 2: loan-doc-* consolidation) is a separate
  workstream — do not conflate it with the eternity-protocol work. It is gated on
  the floor-test results from session de6cfa11.

  All daemon infrastructure lives in ~/Library/Application Support/acos-token-monitor/
  NOT in .acos/state/. The in-repo config mirror is .acos/config/eternity-protocol.yaml
  but the daemon reads only the ~/Library path. Edit config.yaml there to change
  threshold; daemon hot-reloads on next kqueue event.

