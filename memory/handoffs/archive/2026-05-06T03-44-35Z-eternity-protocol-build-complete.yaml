decisions_made:
  - "TCC-friendly path migration: all daemon files moved from .acos/state/ (~/Documents —
    blocked by macOS TCC for launchd-spawned processes) to ~/Library/Application Support/
    acos-token-monitor/. This was a hard requirement, not a preference."
  - "Multi-session architecture: single-session watcher replaced with launcher+watcher
    pattern so all open Claude Code sessions are watched simultaneously."
  - "lsof PID resolution rejected as primary path: sub-20ms JSONL open cycle is too short
    for reliable polling. lsof code kept in resolve-session-pid.py for completeness; the
    known limitation is documented. Option 2 (SessionStart hook) is the planned fix."
  - "CGEventPostToPid infrastructure built but unused in production: inject-keystroke.py
    --pid mode is fully implemented and working, but only reachable when PID resolution
    succeeds. AppleScript-frontmost is the effective runtime path until Option 2 lands."
  - "Fire-once per session keying: .compact-fired-<session_id> (not .compact-fired) so
    multiple concurrent sessions don't interfere with each other's fire flags."
  - "post_compact_drop_pct set to 35 (not 60 as in skill docs): daemon considers compaction
    done when token count drops 35% from pre-compact baseline."

