completed_this_session:
  - "token-watcher.py — kqueue-based daemon. Watches one JSONL file. Per-session flag
    keying (.compact-fired-<session_id>) prevents double-fire. Rolling-average
    forward-looking token estimation (total_input + output_tokens * 1.02). Hot-reloads
    config.yaml on every event."
  - "token-watcher-launcher.py — multi-session launcher. Enumerates all *.jsonl files
    in the project session directory, spawns one token-watcher.py subprocess per file,
    reaps terminated watchers and restarts on new JSONL appearance. This is what launchd
    actually runs."
  - "inject-keystroke.py — dual-mode keystroke injector. Default mode: AppleScript
    typeText into frontmost Warp pane. --pid <PID> mode: CGEventPostToPid (Quartz Event
    Services) to deliver keystrokes directly to a specific Claude Code process, bypassing
    focus. Infrastructure complete; --pid mode unused in practice due to PID resolution
    limitation."
  - "resolve-session-pid.py — attempts to find the Claude Code PID that owns a given
    JSONL by using lsof. Known limitation: Claude Code opens the JSONL for <20ms per
    write; lsof polling cannot reliably catch the window. Returns empty on most attempts.
    Documented as known limitation — Option 2 (SessionStart hook) is the intended fix."
  - "com.acos.token-monitor.plist — launchd service definition. Points to
    token-watcher-launcher.py with the project session dir as argument. RunAtLoad +
    KeepAlive=true. WorkingDirectory in ~/Library/Application Support/acos-token-monitor/
    (TCC-friendly). Logs to ~/Library/Logs/acos-token-monitor.{log,err}."
  - "install.sh — one-shot installer. Creates ~/Library/Application Support/acos-token-monitor/
    directory tree, copies scripts, writes config.yaml, symlinks plist to
    ~/Library/LaunchAgents/, calls launchctl load."
  - "config.yaml — hot-reload daemon config. threshold: 400000, fire_command:
    /acos-eternity-protocol, post_compact_drop_pct: 35."
  - "Skill: acos-eternity-protocol — master orchestrator (pre-compact phase). Invokes
    acos-handoff, then acos-resume-prompt, then arms daemon via .resume-pending flag,
    then keystroke-injects /compact. Explicitly non-confirmatory: autonomous execution
    is the design contract."
  - "Skill: acos-eternity-protocol-threshold — convenience wrapper to hot-edit
