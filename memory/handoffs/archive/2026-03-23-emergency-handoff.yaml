context_for_next_session: |
  Two parallel workstreams are active:

  WORKSTREAM 1 — Loan Document Generator V2 (EPIC-001)
  The loan doc generator has received a large set of upgrades this session that are
  all UNCOMMITTED. The key changes: (a) output is now DOCX+PDF (no more .html/.md),
  using html-to-docx.py for styled Word documents; (b) XLSX files are pre-processed
  through xlsx-extract.py before analyzer agents touch them, providing cell-level
  accuracy; (c) a data verification gate was added between Phase 2 and Phase 3 to
  surface all data points with provenance before generation proceeds; (d) a recommendation
  matrix system was added for credit memos, configurable via
  .acos/loan-doc-generator/recommendation-matrix.yaml; (e) generate-chart.py provides
  SVG chart generation for embedding in documents. The EPIC-001 planning artifact
  (planning/epics/EPIC-001-loan-doc-generator-v2.yaml) is comprehensive: 8 stories,
  30 slices, covering everything from DOCX output to rendering quality, design library
  overhaul, XLSX extraction, data verification, charts, workflow resilience, and UX.
  The most pressing next step is to commit all this work.

  WORKSTREAM 2 — Financial Statement Preparation (NEW SKILL)
  A brand-new skill acos-financial-statement was built this session and is completely
  untracked. Architecture: 3 independent sandbox orchestrators (fin-stmt-sandbox)
  each prepare complete GAAP financial statements from a loan folder; a Primary Accountant
  (fin-stmt-accountant) compares outputs, identifies deficiencies without providing numbers,
  and runs a Wigum loop until substance convergence (Actual mode) or optimal synthesis
  (Projection mode). Output is institutional-grade XLSX with FAST Standard formatting,
  IB color conventions, and cross-statement linkages. A 9-lens swarm review ran on the
  skill and 17 fixes were applied — all 17 verified PASS (evidence at
  .acos/evidence/2026-03-22/SWARM-FIXES/). Key design decisions to be aware of:
  the incremental Wigum mode (skip re-extraction on iterations 2+) is instruction-based
  not mechanical; selective sandbox re-spawning skips sandboxes that are locked;
  data-requests.yaml is the relay mechanism for critical missing data.

  PRIOR SESSION LEFTOVERS
  The acos-underwriting-pipeline skill (18.5KB, created 2026-03-16) has never been
  committed despite being mentioned in the 2026-03-16 handoff. It implements a 6-phase
  end-to-end underwriting pipeline that feeds into /acos-loan-doc-generator in batch
  mode. It should be committed alongside the current session's work.

