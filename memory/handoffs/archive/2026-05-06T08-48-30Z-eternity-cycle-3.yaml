decisions_made:
  - "/clear over /compact: /compact achieved only 15.6% token drop in cycle 1 on this session
    (compaction-resistant content — large code, structured YAML). Loop guard would suspend 30 min.
    /clear always reaches the ~80-120k platform floor — deterministic, 70-80% drop guaranteed.
    Tradeoff (total context loss vs partial retention) is acceptable because handoff + resume-prompt
    gives post-clear AI full structured context. This decision is codified in the skill."
  - "launchd supervision with KeepAlive=true: daemon auto-restarts on crash. Launcher pattern
    (one watcher subprocess per JSONL) isolates session failures from the launcher process."
  - "CGEventPostToPid over AppleScript for primary injection: AppleScript requires frontmost window.
    CGEventPostToPid delivers keystrokes to a specific PID regardless of focus — enables background
    firing when user is in another app. SessionStart hook provides reliable PID at session open."
  - "TCC-exempt path: all daemon files in ~/Library/Application Support/ (not ~/Documents/).
    macOS TCC blocks launchd-spawned processes from ~/Documents without consent prompts."
  - "Per-session state keying: all flags/prompts suffixed with session_id so concurrent sessions
    (multiple Warp tabs, multiple projects) never collide on shared files."
  - "FIRED_FLAG age-out at 600s: prevents permanent session lockout if /clear never lands
    (e.g., daemon fired but /clear confirmation never came). Orphaned-history guard ensures
    age-out works even when cycle 1 history write failed."
  - "TOFU manifest: bin-manifest.sha256 written at install time, re-hashed at daemon startup.
    Detects accidental corruption or partial updates. First run establishes trust."
  - "Threshold 400k: comfortable headroom below Claude Code's ~500k compaction trigger.
    Hot-reloadable via config.yaml (no daemon restart needed)."
  - "post_compact_drop_pct 35: for /clear this is always satisfied (drops to ~80-120k from
    400k+). Retained in config for /compact compatibility if user ever reverts."
  - "Atomic writes for all mutable state: O_CREAT|O_EXCL for flags, tmp+mv for JSON history
    and resume prompts. Prevents partial-write corruption on crash."

architecture:
  daemon_home: "~/Library/Application Support/acos-token-monitor/"
  launchd_label: "com.acos.token-monitor"
  launchd_plist: "~/Library/LaunchAgents/com.acos.token-monitor.plist (symlink to daemon_home)"
  components:
    launcher: "bin/token-watcher-launcher.py — launchd entry point. Enumerates *.jsonl modified
      within 6h, spawns one token-watcher.py per file, reaps terminated watchers, respawns for
      new JSONLs. This is the process launchd runs directly."
    watcher: "bin/token-watcher.py — per-session kqueue JSONL watcher. Tail-seek parser reads
      only new bytes per event. Fires fire_command at threshold via inject-keystroke.py.
      Detects post-/clear drop >= post_compact_drop_pct, then injects resume prompt."
    injector: "bin/inject-keystroke.py — dual-mode keystroke injector. Primary: CGEventPostToPid
      via pyobjc (Quartz). Fallback: AppleScript-frontmost. --confirm-clear sends Return 700ms
      later. Frontmost-app allowlist includes 'Warp', 'warp', 'stable' (Warp's binary name)."
    pid_hook: "bin/register-session-pid.sh — SessionStart hook. Walks process tree 15 levels,
      matches 'claude'/'claude.ex'/'npx claude'/'bunx claude', writes (pid + lstart) to
      state/pid-<session_id>."
    pid_resolver: "bin/resolve-session-pid.py — lsof-based fallback (rarely useful; retained
      as Strategy 2)."
    config: "config.yaml — threshold:400000, fire_command:/acos-eternity-protocol,
      post_compact_drop_pct:35. Hot-reloaded on mtime change per kqueue event."
    installer: "install.sh — one-shot setup: creates dirs, copies bin/, writes config.yaml,
      symlinks plist to LaunchAgents, runs launchctl load. Also updates bin-manifest.sha256."
    manifest: "bin-manifest.sha256 — TOFU hash pins for all 5 bin files. Verified at daemon
      startup. Written/updated by install.sh."
  state_files:
    pid_file: "state/pid-<session_id> — lines: pid + lstart. Written by SessionStart hook."
    fired_flag: "state/.compact-fired-<session_id> — O_CREAT|O_EXCL atomic. Ages out after 600s."
    resume_pending_arm: "state/.resume-pending-<session_id> — YAML: pre_compact_total, resume_prompt_file,
      armed_at. Arms daemon to inject resume after /clear."
    resume_prompt: "state/pending-resume-<session_id>.txt — text injected post-/clear."
    cycle_history: "state/.cycle-history-<session_id> — JSON list of {cycle, fired_at,
      pre_total, post_total}. Atomic tmp+replace writes. Used by loop guard."
    parse_offset: "state/.parse-offset-<session_id> — byte offset for tail-seek parser."
    heartbeat: "state/heartbeat — epoch timestamp, updated each kqueue event."
    shared_manifest: "state/bin-manifest.sha256 — TOFU pin (also in daemon_home root)."
  skills:
    - "acos-eternity-protocol — master orchestrator. SKILL.md:
      /Users/zee/Documents/Vibe Coding/ACOS 3.0/.claude/skills/acos-eternity-protocol/SKILL.md"
    - "acos-eternity-protocol-threshold — hot-edit threshold in config.yaml. Usage:
      /acos-eternity-protocol-threshold 350000"
    - "acos-eternity-protocol-resume — manual post-/clear resume fallback. Reads
      pending-resume-<sid>.txt, uses PID file if available."
    - "acos-resume-prompt — per-session resume prompt generator. Writes to
      state/pending-resume-<session_id>.txt. Global skill: ~/.claude/skills/acos-resume-prompt/"
  hook:
    event: "SessionStart"
    command: "$HOME/Library/Application Support/acos-token-monitor/bin/register-session-pid.sh"
    registered_in: ".claude/settings.local.json (confirmed at line 162-167)"
  current_pid_file: "state/pid-308261d5-c5b3-4107-8b84-e36e5e18b5e4 — contains 59978"

