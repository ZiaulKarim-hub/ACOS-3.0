decisions_made:
  - "Use python-docx + direct lxml manipulation rather than pandoc for the edit, because pandoc lossy-converts to/from .docx and would have lost the auto-list numbering and Times New Roman formatting"
  - "Insert Section 3 sub-paragraphs WITHOUT numPr (no auto-list assignment) so Word's auto-numbering counter for Section 4 onward is not bumped — verified Section 4 still renders as '4. Payments'"
  - "Hard-code dollar amounts ($25,300, $50,600) in the document rather than expressing as formulas, because Word does not evaluate inline arithmetic reliably and removing the math also removes any rounding-ambiguity attack vector for borrower counsel"
  - "Name the new defined term 'Repayment Amount' instead of 'Principal' because $2,530,000 is the loan-fee-inclusive amount due at repayment, not principal in the strict sense ($2,200,000 was funded)"
  - "Save as 'Version 2' rather than overwriting original — matches existing 'Version 1B / Version 3 / Version 3B' naming convention used elsewhere in the Lux 2 Extension folder; preserves diff capability for the user"
  - "Recommend manual page break for Section 27 rather than 'Keep with next' / 'Keep lines together' because the document is heading to execution, not further upstream editing"

