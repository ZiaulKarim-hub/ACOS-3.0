eternity_protocol_architecture:
  inject_keystroke_py:
    path: "/Users/zee/Library/Application Support/acos-token-monitor/bin/inject-keystroke.py"
    size_lines: 438
    last_modified: "2026-05-20T01:44Z"
    architecture: |
      1. Read claude PID from state file (session_id keyed)
      2. Derive tty via 'ps -o tty=' on claude PID
      3. Write OSC 2 title marker to /dev/<tty> just-in-time
      4. Sleep 150ms for terminal to render title change
      5. osascript finds Warp window matching session UUID via AXTitle, performs AXRaise
      6. CGEventPost(kCGHIDEventTap) — HID layer injection, routes to frontmost window
      7. Poll JSONL transcript for /clear evidence within 3 seconds (rc=5 if no evidence)
