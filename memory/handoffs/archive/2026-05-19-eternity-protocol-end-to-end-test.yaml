open_decisions:
  accessibility_csreq_pinning:
    title: "Apply csreq-pinning to Accessibility TCC permission for Warp"
    status: "PENDING — awaiting user decision"
    context: |
      The Warp-Disk-Access-Permanent-Fix.md documents how to pin the com.apple.security.codesigning
      requirement for Full Disk Access (kTCCServiceSystemPolicyAllFiles) so Warp updates
      don't silently revoke it. The same recipe can be applied to kTCCServiceAccessibility
      (which governs CGEventPostToPid keystroke injection used by inject-keystroke.py).
      Without this, a Warp update could silently kill keystroke injection even if the
      daemon's heartbeat and PID files are healthy.
    recommendation: "Apply the same csreq-pinning recipe to Accessibility for symmetric protection"
