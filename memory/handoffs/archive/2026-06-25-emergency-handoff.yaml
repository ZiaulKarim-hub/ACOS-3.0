decisions_made:

  - |
    DECLINE THE PAXTON PROPOSAL: the vendor's core link method is a Private Blog Network — an
    explicit Google-named link scheme violation. For a YMYL lender whose value is trust, the
    risk-adjusted decision is to decline. The 6-month white-hat plan is the recommended path.

  - |
    100 CLICKS/DAY IS MONTHS 9-12, NOT MONTH 6: three adversarial lenses independently put
    the month-6 probability of 100/day at 6–8%. The plan commits to 20–70/day by month 6 as
    the honest, achievable target. This must be communicated to stakeholders BEFORE month 1
    to prevent a panic cancellation in month 2 when clicks are still low.

  - |
    EXPERT REVIEW THROUGHPUT IS THE BINDING CONSTRAINT: for a YMYL finance site, every indexed
    page requires a documented, named-human substantive review (Jason/Ty/Brad). Batch/sampled
    attestation on programmatic pages IS the "scaled content abuse" pattern. Page count target
    is 150–180 reviewed pages by month 6 (base plan), not 280.

  - |
    PER_DIEM_INTEREST USES NATIVE HYPERCORE VALUE: "you can compute to double-check, but I prefer
    the output directly coming from Hypercore." per_diem = scheduleTable[].due.interest (native
    accrual row), with computation as cross-check only. Actual/360 is now PROVEN, not assumed.

  - |
    HYPERCORE DATA CATALOG: built as a deterministic, regenerable, git-tracked artifact. The catalog
    is the answer to "how do we find any field without reverse-engineering the schema each time."
    Generated artifacts (introspection JSON, candidates) are gitignored; durable outputs (index.json,
    FIELD-MAP.md, paths.json, enrichment.json) are committed.

