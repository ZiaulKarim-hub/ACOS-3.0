oracle_autopilot_conflict_details: |
  Specific concern: The Oracle autopilot (`.acos/state/autopilot-active` sentinel,
  managed by autopilot-activate.py + the PreToolUse hook) auto-approves ALL tool
  calls including destructive ones. The eternity-protocol daemon runs out-of-band
  (outside the Claude process) and injects /clear at the 400k token threshold via
  either cmux RPC (cmux variant) or CGEventPost (warp variant). If both are active
  simultaneously:
    - The daemon fires /clear mid-turn of an autonomous build
    - /clear wipes the conversation context including in-flight autopilot state
    - The new post-/clear session starts WITHOUT autopilot active
    - The automated build stops (autopilot was in the cleared session)
  This is probably the correct behavior (preserve safety by clearing autopilot
  on /clear), but it needs to be confirmed and documented as a known interaction,
  not silently discovered by users running long autopilot jobs.

  A possible mitigation: the autopilot sentinel could be made persistent across
  /clear by moving it to a per-PID or per-project path (similar to the eternity
  pointer), with the resume skill re-activating autopilot on the new session.
  This is not implemented; it is a design option to consider.

