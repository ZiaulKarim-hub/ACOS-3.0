phase4b_procedure: |
  Per SKILL.md §8.2 of acos-dataroom-v2:
  1. Create sub-folder skeleton inside dataroom/:
       for each folder in TAXONOMY.json: mkdir dataroom/NN_Folder_Name
       (NN = zero-padded num; pick a safe filesystem name from the folder name)
  2. For each of the 645 files currently in dataroom/ flat root, decide its
     folder via dr2-placement-classifier x3 (models opus/sonnet/opus). Each
     classifier gets the file content (extraction/<file_id>/extraction.json) +
     filename + TAXONOMY.json, and picks ONE folder number.
       - Unanimous (3/3 same folder): move the file into that sub-folder.
       - Split: blind re-dispatch, cap K=5.
       - Still split after K=5: move to dataroom/00_Pending_Classification/ + log.
     Apply (2)/(3) filename suffixes on intra-folder name collisions.
  3. Checkpoint run_state.json: phase="4_classification",
     last_completed_checkpoint="phase4_placement_complete".

  EFFICIENCY — USE BATCHED DISPATCH (do NOT spawn 3 agents per single file —
  that is 1935 spawns). Mirror the Phase 3 / exclusion-QA pattern that worked
  all session: chunk the 645 files into batches of ~10-12; per batch spawn 3
  dr2-placement-classifier agents (opus/sonnet/opus); each agent independently
  classifies ALL files in its batch and writes one verdict per file
  (e.g. phase4/placement/<file_id>.json with {file_id, filename, folder_num}).
  Then compute per-file consensus from the 3 verdicts. ~54 batches x 3 = ~162
  spawns. Build a small helper script like phase3/exclusion_qa/xqa.py.
  VERIFY verdicts on disk before trusting agent return text — agents repeatedly
  mis-reported "all written" this session; consensus/move must read the JSON.

