context_for_next_session: |
  This session is midway through the first production run of acos-dataroom-v2 on the
  Wolfgramm Ascent Beehive Waldorf 30M loan folder — a ~2,285-file Dropbox corpus for
  the Ascent Park City Tapestry Collection hotel (4080 N Cooper Lane, Park City UT).
  The deal is a $30M Okoa construction loan in workout/settlement/sale mode; Zee (Okoa
  Capital, jason@okoacapital.com) wants a buyer-ready dataroom to sell the hotel asset.

  BACKGROUND ON WHY v2 EXISTS:
  acos-dataroom-v1 failed in the field because it required a mandatory boss-review of
  an Internal Working Workbook. The boss refused ("I don't have time") and the AI's
  raw output became the deliverable. Boss verdict: "AI is a piece of shit." v2 removes
  all human pause gates and uses multi-stage adversarial consensus (3-agent blind swarms,
  Wigum QA loops, privilege scanner) so the final folder + Excel is the ONLY thing the
  boss ever sees. The design is in .claude/skills/acos-dataroom-v2/DESIGN.md (~975 lines).

  WHERE EXECUTION LEFT OFF:
  Phase 2 Tier-3 swarm deliberation is paused at end of batch 26 (of 90). run_state.json
  is the checkpoint file — it is the ground truth for all numeric counters and the
  unresolved_splits list (32 entries as of last wave3 update). The next wave should
  dispatch batches 27-90 in waves of 4-6 batches, using the same 3-agent-per-batch
  pattern established in waves 1-3.

  HOW TO DISPATCH A BATCH:
  Each batch file at phase2/batches/batch_NNN.json contains a list of ~10 files. For
  each batch, spawn 3 dr2-inclusion-deliberator agents in parallel (via Task()), passing:
  - The batch file contents (list of {file_id, relative_path, extracted_text_path})
  - The SOLIDIFIED_OBJECTIVE from phase1/SOLIDIFIED_OBJECTIVE.md
  - Output path: phase2/votes/<file_id>/instance_{1,2,3}.json
  After all 3 agents complete, run consensus_check.py to classify each file as
  unanimous-INCLUDE, unanimous-EXCLUDE, or SPLIT, then copy INCLUDE files to dataroom/
  and append to inclusion_log.csv / exclusion_log.csv. Write split decisions to
  phase2/disputed/batch_NNN_splits.json.

  WAVE POST-PROCESSING PATTERN:
  wave1_post.py, wave2_post.py, wave3_post.py in the run_dir show the exact pattern for
  post-processing a wave's votes. Write a wave4_post.py (or reuse/generalize) that:
  1. Reads all vote JSONs for the new wave's batches
  2. Runs consensus logic (2-1 → SPLIT, 3-0 → unanimous)
  3. Copies INCLUDE files to dataroom/
  4. Appends rows to inclusion_log.csv and exclusion_log.csv
  5. Writes batch_NNN_splits.json for any splits
  6. Updates run_state.json counters and unresolved_splits list
  7. Updates last_completed_checkpoint to "phase2_tier3_wave4_batches_27-NN_processed"

