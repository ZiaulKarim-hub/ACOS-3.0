decisions_made:
  - |
    OKOA LinkedIn voice = natural first-person practitioner, NOT ad. User explicitly
    rejected a batch of well-researched posts because they "all sound like ads." Approved
    voice: observation/anecdote-led, first-person "I", real opinion, contractions, light
    OKOA mention as aside, end on thought/question, no CTA, no hashtag walls.
  - |
    Privacy blocklist (hard requirements for every post): never reveal active book scale,
    AUM, deal counts, loss rate, target returns (12-15%), named deals/borrowers/investors
    (e.g. Golden East, Lux II, Ascent, Wolfgramm), OKOA's own loan pricing, or
    "proprietary data" claims. Only public scale stat allowed: "deployed over $500M in 3 years."
  - |
    Brand etymology: "OKOA = Hawaiian-derived word for 'creative and flexible'" is a
    factual claim that must be verified before asserting publicly. Skill's okoa-positioning.md
    flags this with a warning emoji. Use the meaning ("creative and flexible") without
    naming the language if unverified.
  - |
    SEO plan is complete and delivered (v2 PDF, 10 pages, done in the prior task of this
    session). 14 locked requirements for the SEO plan live in the 2026-06-26-emergency-handoff-2.yaml
    (already archived or in handoffs dir). The plan covers the LinkedIn pillar as a channel.

