context_for_next_session: |
  The auto-handoff system is fully implemented and the Stop hook has been verified
  working in production (it triggered this very handoff at 284KB/198 lines).

  The system has 3 layers:
  1. Stop hook (context-monitor.sh) — fires at ~80% context, asks Claude to run /acos-handoff
  2. PreCompact hook (context-watchdog.sh) — fires at 85% compaction threshold, creates mechanical handoff
  3. SessionStart hook (auto-load-handoff.sh) — loads latest handoff on every new/resumed session

  All changes are uncommitted. The ~/.zshrc now has CLAUDE_AUTOCOMPACT_PCT_OVERRIDE=85
  which will take effect in new terminal sessions.

  The settings.local.json now has 6 hook types: PreToolUse, PostToolUse, SubagentStop,
  SessionStart, PreCompact, Stop. Script count is now 14 (was 11).
