context_for_next_session: |
  The entire session's work lives at ~/.claude/skills/acos-guided-reader/ (global
  skill — NOT in the ACOS 3.0 git repo; git status will show no changes for this
  work). This is a multi-turn in-progress build with substantial complexity.

  Architecture recap: gr-server.py is the HTTP server that handles browser
  keypresses. On startup it spawns gr-pool.py as a subprocess. gr-pool.py
  maintains two warm claude subprocesses (haiku for E/S modes, opus for X/D
  modes) and listens on a Unix socket at state_dir/pool.sock. When the user presses
  E/S/X/D in the browser, gr-server routes the explain request to the pool via
  the socket; the pool member generates and POSTs paragraphs back to the server's
  /internal/append-explain endpoint, which the browser picks up via SSE. The
  fallback path (when pool unreachable) appends to commands.jsonl for the main
  Claude session to handle.

  The word-segment cursor logic is in page-template.html starting around line
  1030. It tokenizes .reading-line innerHTML into <=15-word .word-segment spans
  using a tag-stack-aware algorithm that prevents unclosed <strong> tags from
  spanning segment boundaries. This was a hard-won fix for a cursor-skip bug.

  The auto-expand fix (most recent change) is in page-template.html around lines
  598–680. It uses a seenIds Set and mostRecentNewId to identify newly-arrived
  explanation IDs in a first pass, then uses mostRecentNewId in a second pass to
  unconditionally expand the newest entry. The userToggled Map records user-
  overrides and is consulted before the auto-expand logic so manual
  collapse/expand is sticky.

  plan-builder.py currently handles .md (heading-based chunking with tag-stack-
  aware code-fence skipping) and falls through to 30-line plain-text windowing
  for anything else. .py/.ts/.js/.sh/.yaml/.csv are all TODO (Tiers C/D/E in
  SKILL.md). The SUPPORTED_EXTENSIONS dict in plan-builder.py (line ~37) is
  annotated with the pending tiers.

  The ACOS 3.0 planning hierarchy (EPIC-003, STORY-003-001, SLICE-003-001-07)
  is the visual-composer project (apps/visual-composer/) — completely separate
  from this session. SLICE-003-001-07 (extract orchestration integration) was the
  last committed slice (2026-05-28). That work is complete and unrelated to pick
  up here.

  Next session: start by asking Zee to test the guided reader in a fresh browser
  tab before making any further code changes. Validation first.

