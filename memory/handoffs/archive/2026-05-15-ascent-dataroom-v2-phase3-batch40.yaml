  orchestrator: "phase3_orchestrator.py — lives in run_dir alongside run_state.json"
  orchestrator_subcommands:
    - "status              — progress summary"
    - "next-batch          — prints next un-completed batch_id"
    - "prep-batched <id>   — writes 3 lens-prompts (+ solo prompts for oversized files)"
    - "consensus <id>      — reads QA outputs, computes per-file consensus, logs results"
    - "list-fails          — lists Wigum-pending file_ids"

  dispatch_mode: |
    BATCHED dispatch (user-approved for 5x throughput). Per batch of 5 files:
    spawn 3 dr2-inclusion-qa agents (opus/sonnet/opus) — instance_1 adversarial,
    instance_2 completeness, instance_3 coherence. Each agent QAs ALL 5 files in
    the batch under its single lens and writes one JSON verdict per file.
    Files with extraction.json >450KB are split out for solo dispatch (3 dedicated
    agents). prep-batched handles this automatically and reports solo files.

  resume_procedure: |
    cd run_dir
    LOOP:
      1. python3 phase3_orchestrator.py next-batch   -> e.g. b0041
      2. python3 phase3_orchestrator.py prep-batched b0041
      3. Read phase3/dispatches/b0041/dispatch_manifest.json
      4. Spawn the batched_spawns (3 Task calls, subagent_type dr2-inclusion-qa,
         models opus/sonnet/opus) — each prompt = "Read <prompt_path>, execute exactly,
         return per-file one-line results". Also spawn any solo_spawns the same way.
      5. python3 phase3_orchestrator.py consensus b0041
      6. If a whole batch fails 2 lenses uniformly OR a FAIL looks suspicious,
         read the FAIL reasonings (phase3/qa/<fid>/instance_*.json) before trusting.
      7. Repeat until next-batch reports "(all batches complete)".
    Then run the Wigum re-deliberation pass (see wigum_pending below).
    Then update run_state.json: phase="3_inclusion_qa_clean", checkpoint="phase3_converged".

