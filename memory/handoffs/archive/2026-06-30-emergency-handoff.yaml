  ridgeline_print_tokens: |
    /* Verbatim, hand-verified subset of the resolved ridgeline (print) token
       graph, copied from the token-extraction subagent's scratchpad output
       (resolve_stylesheet.css, lines 1-1202, cross-checked against
       emit_stylesheet.css which is byte-identical). Use these values directly;
       do not re-derive from scratch unless something below looks incomplete,
       in which case fall back to the persistent tool-results JSON dumps. */

    /* --- Font chains --- */
    --okoa-serif: Cormorant Garamond, Georgia, serif;
    --okoa-sans:  Inter, Helvetica Neue, Arial, sans-serif;
    --okoa-disp:  Inter Display, Inter, sans-serif;
    --okoa-mono:  JetBrains Mono, ui-monospace, monospace;

    /* --- Type scale (rem-based for screen tokens; print classes use pt below) --- */
    --t-display-xl: clamp(2.6rem, 1.6rem + 3.6vw, 5rem);
    --t-display-l:  clamp(2rem, 1.4rem + 2.6vw, 3.4rem);
    --t-display-m:  clamp(1.6rem, 1.2rem + 1.6vw, 2.4rem);
    --t-title:      clamp(1.3rem, 1.05rem + 1vw, 1.9rem);
    --t-lead:       clamp(1.1rem, 1rem + 0.6vw, 1.4rem);
    --t-body:       1.0625rem;
    --t-body-sm:    0.9375rem;
    --t-fine:       0.8125rem;
    --t-label:      0.72rem;
    --t-label-sm:   0.66rem;
    --t-micro:      0.6rem;
    --w-light: 300; --w-regular: 400; --w-medium: 500; --w-semibold: 600;
    --tr-tight: -0.02em; --tr-snug: -0.01em; --tr-normal: 0; --tr-wide: 0.06em;
    --tr-caps: 0.12em; --tr-caps-wide: 0.18em;

    /* --- Print-specific point sizes (use these for the PDF, not the rem scale) --- */
    --okoa-pt-display-xl: 40pt; --okoa-pt-display-l: 28pt; --okoa-pt-display-m: 20pt;
    --okoa-pt-title: 14pt; --okoa-pt-subhead: 11.5pt; --okoa-pt-lead: 11pt;
    --okoa-pt-body: 9.5pt; --okoa-pt-body-sm: 8.5pt; --okoa-pt-caption: 7.5pt;
    --okoa-pt-label: 7pt; --okoa-pt-micro: 6pt;
    --okoa-pt-table: 8pt; --okoa-pt-table-header: 7pt;
    --okoa-pt-data: 9pt; --okoa-pt-data-lg: 18pt;
    --okoa-pt-leading-body: 1.42; --okoa-pt-leading-tight: 1.18;
    --okoa-type-table-cell-size: 8pt; --okoa-type-table-cell-leading: 9pt;
    --okoa-type-table-cell-tracking: 0; --okoa-type-table-cell-weight: 425;
    --okoa-type-table-header-size: 8pt; --okoa-type-table-header-leading: 9pt;
    --okoa-type-table-header-tracking: 0; --okoa-type-table-header-weight: 650;

    /* --- Typography role classes (font-family + weight pairing — load-bearing
       for the "Cormorant headlines only, never tables; mono for all numeric
       data" constraint) --- */
    .t-display-xl, .t-display-l, .t-display-m, .t-quote {
      font-family: var(--okoa-serif); font-weight: var(--w-medium); /* 500, NEVER 700 */
    }
    .t-title, .t-subhead { font-family: var(--okoa-disp); font-weight: var(--w-semibold); } /* Inter Display 600 */
    .t-lead { font-family: var(--okoa-disp); font-weight: var(--w-light); }
    .t-body, .t-body-sm, .t-fine, .t-body-strong { font-family: var(--okoa-sans); }
    .t-label, .t-label-sm, .t-micro, .t-data, .t-data-lg { font-family: var(--okoa-mono); font-weight: var(--w-medium); }

    /* --- Page geometry (US Letter, print) --- */
    --okoa-page-letter-w: 216mm; --okoa-page-letter-h: 279mm;
    --okoa-page-margin-letter: 20mm;   /* => 176mm live text block, matches spec exactly */
    --okoa-grid-letter-columns: 16; --okoa-grid-letter-gutter: 8mm;
    --okoa-page-bleed: 3mm; --okoa-page-safe: 5mm;

    /* --- Spacing scale (mm, for print) --- */
    --okoa-sp-0: 0mm; --okoa-sp-1: 1mm; --okoa-sp-2: 2mm; --okoa-sp-3: 3mm;
    --okoa-sp-5: 5mm; --okoa-sp-8: 8mm; --okoa-sp-13: 13mm; --okoa-sp-21: 21mm;

    /* --- Radii / borders / rules (square corners, borders not shadows) --- */
    --okoa-radii-none: 0; --okoa-radii-sm: 2px; --okoa-radii-md: 4px; --okoa-radii-pill: 9999px; /* avoid pill in print */
    --okoa-border-hair: 1px; --okoa-border-thick: 2px; --okoa-border-emphasis: 3px;
    --okoa-rules-hairline: 0.5pt; --okoa-rules-default: 1pt; --okoa-rules-emphasis: 1.2pt;

    /* --- [data-style="ridgeline"] semantic + component + signal colors (LIGHT,
       this is the primary print variant) --- */
    --okoa-semantic-fg1: #3C3C3C;            /* primary text */
    --okoa-semantic-fg2: #6B6B6B;            /* secondary text */
    --okoa-semantic-fg3: #757575;            /* tertiary/muted text */
    --okoa-semantic-fg-accent: #FF795E;      /* CORAL — use <=3%, line/text only, never fill */
    --okoa-semantic-fg-on-dark: #FEFEFE;
    --okoa-semantic-surface-default: #FEFEFE;
    --okoa-semantic-surface-alt: #F0ECE9;
    --okoa-semantic-surface-warm: #F5EEE4;   /* warm light surface */
    --okoa-semantic-surface-chrome: #465D53; /* dark green — chrome/footer/divider bands ONLY */
    --okoa-semantic-border-default: #D4D4D4;
    --okoa-semantic-border-strong: #3C3C3C;
    --okoa-semantic-border-accent: #FF795E;
    --okoa-semantic-entity-primary: #465D53;
    --okoa-semantic-entity-secondary-a: #678CA7;
    --okoa-semantic-entity-secondary-b: #104473;
    --okoa-accent-fill-surface: #A8492F;     /* AVOID — this is a coral FILL, violates "never a fill" */
