    --okoa-semantic-surface-chrome-dark: #0E120F;
    --okoa-semantic-fg1-dark: #F2EEE6;
    --okoa-component-table-header-bg-dark: #0E120F;
    --okoa-component-chrome-footer-bg-dark: #0E120F;
    --okoa-component-table-total-rule-dark: #C8C6BB;

  font_face_paths_as_resolved: |
