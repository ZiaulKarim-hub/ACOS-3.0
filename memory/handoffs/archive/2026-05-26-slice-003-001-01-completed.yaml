minor_findings_to_address_in_downstream_slices:
  - finding_id: "F1"
    severity: MINOR
    source: integration-reviewer
    target_slice: "SLICE-003-001-02"
    description: |
      vite.config.ts sets test.environment: 'node'. Slice 02's DOM walker
      tests will need 'jsdom' or 'happy-dom' (or per-file @vitest-environment
      pragma) to access window/Document. Add to slice 02 plan.
    action: "Document in slice 02's technical_requirements; add happy-dom or jsdom as devDep when slice 02 starts."

  - finding_id: "F2"
    severity: MINOR
    source: integration-reviewer
    target_slice: "SLICE-003-001-07"
    description: |
      ContainerRecord.kind and ContainerRecord.content.kind are two parallel
      discriminators. TypeScript can't enforce structural agreement between
      them. Mitigation: add a runtime invariant check
      (assert(record.kind === record.content.kind)) in slice 07 integration tests.
    action: "Add to slice 07 testing_requirements before execution starts."

  - finding_id: "F3"
    severity: MINOR
    source: qa-reviewer
    target_slice: "SLICE-003-001-02 (when index.ts is next touched)"
    description: |
      apps/visual-composer/src/parser/index.ts:33 has a stale
      `// eslint-disable-next-line` comment. No ESLint configured; comment
      is dead. Recommend dropping in the next slice that touches index.ts.
    action: "Remove the comment line during slice 02 when wiring extractors."

  - finding_id: "F4"
    severity: MINOR
    source: qa-reviewer
    target_slice: "any future slice"
    description: |
      apps/visual-composer/public/favicon.svg and icons.svg are Vite-template
      leftovers, unreferenced. Cosmetic dead weight, not load-bearing.
    action: "Optional cleanup; not assigned to a specific slice."

  - finding_id: "F5"
    severity: MINOR
    source: qa-reviewer
    target_slice: "SLICE-003-001-02 or later"
    description: |
      Vitest test glob limits discovery to tests/**/*.test.ts. Downstream
      slices may want to co-locate `.test.ts` files next to source under src/.
      Not a defect; flag for awareness.
    action: "If co-located tests are wanted later, extend vite.config.ts test.include."

framework_findings:
  - finding_id: "FW1"
    severity: MAJOR (out-of-slice-scope)
    source: developer + integration-reviewer + qa-reviewer (corroborated by 3 independent agents)
    description: |
      .claude/scripts/check-scope.sh does not normalize absolute vs relative
      paths. The hook compares absolute paths from Write/Edit tool calls
      against the relative patterns in .acos/config/active-slice.yaml. Result:
      the hook does NOT actually enforce slice scope at the tool-call layer.
      For this slice, developer discipline kept all writes inside the
      intended scope, but a future developer relying on the hook for safety
      could write outside scope with impunity.
    action: "Create a follow-up framework-hygiene slice to fix check-scope.sh — normalize paths, treat trailing-slash patterns as subtree-allow."
    suggested_slice_owner: "framework hygiene; not in EPIC-003 scope"

