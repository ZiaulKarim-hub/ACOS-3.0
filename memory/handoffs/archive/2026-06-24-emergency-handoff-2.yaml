decisions_made:
  - "capitalizedBalance is a non-additive MEMO field in the Hypercore LoanSummary — it equals principal (Beehive 134: both = 27,240,937.50). It MUST NOT be summed in outstanding_balance reconciliation; doing so would falsely refuse any loan with a non-zero capitalizedBalance."
  - "The reliable Hypercore funding query is a 2-step: (1) fetch loanFundingIds via loanFundingAssets(filter:{loanId}) -> assetId list, (2) fetch repaymentSchedule.summary.totalOutstanding per loanFundingId. The dual-filter variant (loanId + fundingEntityId together) returns HTTP 500."
  - "hca-ask.py is the new primary entry point for arbitrary questions. hca-deliver.py --ask remains the deterministic spine (called by hca-ask.py first); do not retire it."
  - "The explorer fallback (hca-explorer.py) is confidence-graded: HIGH/MEDIUM/LOW. Confidence reflects field-match certainty, not value authenticity — values are always fetched-real or omitted, never fabricated."

