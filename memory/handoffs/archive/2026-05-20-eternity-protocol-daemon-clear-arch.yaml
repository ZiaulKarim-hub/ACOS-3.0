decisions_made:
  - "Daemon owns ALL /clear injection. The skill NEVER calls inject-keystroke.py for /clear.
    This is a permanent architectural boundary. Rationale: daemon fires from outside the agent
    loop on an idle JSONL transcript; skill fires during its own running turn (input busy)."
  - "The .clear-requested-<sid> flag is the interface between skill and daemon for /clear.
    Pattern: skill writes flag + exits; daemon polls flag + fires + deletes flag."
  - "Daemon deletes the flag after firing regardless of inject self-reported success.
    Leaving it would cause repeated /clear fires on every subsequent kqueue event (DoS).
    If inject fails, user can rewrite the flag or manually run /acos-eternity-protocol-resume."

