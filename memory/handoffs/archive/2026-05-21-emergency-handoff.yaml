    issue: |
      bin-manifest.sha256 must be manually regenerated after any edit to token-watcher.py
      or inject-keystroke.py. The launcher refuses to start if the manifest is stale.
      There is no pre-commit hook or automated guard for this.
    fix: |
      Option A: add a pre-commit hook in the acos-token-monitor install that regenerates
      the manifest on each bin/ edit. Option B: document the regeneration command prominently
      in both script headers.
