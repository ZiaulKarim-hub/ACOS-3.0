    file: ".claude/skills/acos-eternity-protocol-resume/SKILL.md Step 0"
    issue: |
      Step 0 self-writes the PID file before injection. There is a comment-acknowledged race:
      the daemon's SessionStart hook may also be writing the same PID file concurrently.
      The race has not been observed in practice (both writes produce the same PID value).
    fix: "Document the race, add an atomic write or lock if ever observed."
    effort: "low priority"

  launcher_is_single_point_of_failure:
    issue: |
      If the launcher (token-watcher-launcher.py) fails to start (e.g., stale manifest,
      Python error), there is no autonomous resume. The UserPromptSubmit hook (eternity-resume-prepend.sh)
      is the safety net in this case, but it requires the user to type a prompt — it does
      not fire autonomously. A launcher failure = no daemon = hook-only recovery.
    fix: "Out of scope for now. Accept the limitation."

