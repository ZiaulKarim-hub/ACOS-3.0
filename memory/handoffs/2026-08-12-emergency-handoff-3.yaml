fix_loop_protocol: >-
  planning/evidence/EVB-EPIC-001/close-packet/FIX-LOOP-PROTOCOL.yaml. Baseline N
  runs BEFORE touching anything; fix with lever 1 only; re-run N times; require
  (a) post-min killed > pre-max killed, (b) post-max survived < pre-min survived,
  (c) no_coverage strictly down if that was the target, (d) suite green by EXIT
  CODE. (b) is the load-bearing one: without it a fix that merely made the suite
  SLOWER would pass (a) by pushing mutants into timeout. The bar stays PRD
  16.7's score >= 70; these conditions only prove an improvement is REAL.
  Single-file gate costs 1m59s for a 538-mutant file against 459 minutes full.

what_fairly_means_grounded: >-
  planning/evidence/EVB-EPIC-001/close-packet/RESEARCH-RAISING-MUTATION-SCORES-FAIRLY.yaml.
  Depth-2 riff, 29 claims, 7 independent sources, stamp "[1 sources ·
  primary-new]", delivered AS OF 2026-08-12. The mechanical line: score =
  detected/valid, and `ignored` mutants leave the denominator. FORBIDDEN:
  project-wide excludedMutations (Stryker's own docs call it "a shotgun
  approach"), `// Stryker disable` except per-site for a DEMONSTRATED equivalent
  mutant with a written reason, narrowing `mutate` globs, weakening any test.
