completed_this_session:
  - "Verify-first guardrails (commit f435d3e, ARCHITECTURE.md as-built note 16): a live run had surfaced a cluster of failures — figures asserted from memory/blogs (ElevenLabs latency cited as ~264ms when the vendor's own figure is ~75ms model / ~100-200ms end-to-end; a third-party ~188ms worn as Cartesia's own), invented framing not stated by the user (a 'regulated lender' lens, a 'cost-first' priority), a narrowed proxy question, blog-heavy sourcing, and a category-shaped search that missed whole model families. Fixed by moving each guardrail before the answer: the sufficiency router (`assess` in lib/claims.ts) now caps any measurement claim to `provisional` unless it has a Tier 1-2 primary source, judged on the answering (top-hit) claim so a different vendor's primary source can't launder a blog figure; a new `figures-primary-sourced` eval check fails a session containing any unsourced measurement claim; invariants I9 (verify-first) and I10 (given-not-assumed) added to SKILL.md; Phase-1 interview gained a proxy/reframe question plus a stated-priority (not inferred) rule; Phase-3 auditor gained a mandatory category sweep + `scope_reframe` output; Phase-4 register rewritten to deliver-first/verify-first-in-conversation/latest-version-check; researcher, auditor, citer, and brief-template charters all updated to name these failure shapes explicitly."
  - "Committee-room rebuild, take 1 then corrected (commits f435d3e then 42fdc51, ARCHITECTURE.md as-built notes 17-18): the user asked for the room to look and behave exactly like the Investment Committee's committee room. The first attempt (note 17) hand-copied IC's CSS but hand-wrote its own seat layout/JS and shipped broken — seats overlapping, labels colliding, call/hand-raise/autoplay missing. The user correctly called it a stale reimplementation. Corrected (note 18, commit 42fdc51) by generating scripts/room/room.html directly from acos-investment-committee's own current committee-room/meeting.html (the output of its build_meeting.py) with three transforms — relabel IC to Research Riff, blank the baked demo seats so the first /state push drives buildArc(), swap the 'Mitigant:' label for 'Latest:'. lib/room.ts gained buildIcState(), which maps a riff RoomState into IC's meeting-state.json shape (panel to seats, coverage to vote bar + briefing, ledger to transcript, gate to verdict box). riff-server.ts serves that shape on /state and /events. Verified by headless screenshot against a live 9-seat/235-claim session."
  - "Live responder (commit d5f352a, ARCHITECTURE.md as-built note 19): the room had Call/hand-raise/autoplay buttons but nothing consumed the chair-inbox — a called seat only spoke if the moderator hand-wrote its turn. Built scripts/riff-live.ts, a Bun daemon that ports IC's warm-pool engine (ic-pool.py / ic-live.py) to the riff stack verbatim: a warm pool of `claude -p --safe-mode` workers using stream-json framing, `result` = end-of-turn, subscription OAuth (refuses to run if ANTHROPIC_API_KEY is set). It tails chair-inbox.jsonl and for each `speak` command builds the called seat's prompt strictly from its own dossier claims, writes the answer to room-turns.jsonl in ~5-7s with the moderator entirely out of the loop. `riff room` now auto-starts this daemon (self-locking, one per session; `--no-live` opts out). buildIcState surfaces room-turns.jsonl as the live transcript plus a `thinking` seat and the reading-level dial; stateFingerprint watches the room-* files so the server SSE-pushes the instant a turn lands. Hard rule enforced in the prompt, not softened: a seat answers ONLY from its own dossier claims and must cite claim ids; if the chair's question isn't in its corpus it says so and does not guess (invariants I2 + I9)."
  - "Verified live end-to-end: calling seat 3 (Liquid AI) with 'Does Liquid AI actually support voice cloning, or not?' returned a grounded turn citing [liquid-ai-010] and [liquid-ai-024], explicitly overriding a secondary summary's incorrect cloning claim with four Liquid primary sources (blog post, two Hugging Face model cards, the liquid-audio repo) — confirmed directly by reading room-turns.jsonl and chair-inbox.jsonl on disk during this handoff's reconstruction, matching ARCHITECTURE.md note 19's claim verbatim."
  - "Test suite confirmed green during this handoff's reconstruction: `bun .claude/skills/acos-research-riffs/scripts/test-riff.ts` -> 154 passed, 0 failed (re-run live, not just taken on faith)."
  - "Confirmed both git remotes (origin and personal) are at the same commit as local HEAD (d5f352a) — nothing is unpushed on this branch."

