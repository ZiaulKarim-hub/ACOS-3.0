context_for_next_session: |
  Everything in this project lives under "/Users/zee/Documents/Vibe Coding/R2P"
  — a completely separate, LOCAL-ONLY git repo from this ACOS 3.0 repo (this
  handoff file lives in ACOS 3.0's memory/handoffs/, but do not confuse the
  two repos' git states; R2P must never be pushed anywhere). The orchestration
  pattern is: a DEV agent implements a slice (TDD), an independent QA agent
  adversarially reviews it (BLOCK or PASS with findings), DEV revises to
  answer findings, QA re-verifies fresh, an independent holdout custodian runs
  a sealed, one-shot-only hidden test pack against the surviving candidate,
  and only after ALL of that plus a mutation-gate score (per-file >= 70 on the
  changed production file) clears does the orchestrator seal the pair. Human
  ratification of every pair, every ADR, and every finding disposition is
  explicitly deferred to epic close (referenced throughout as "AP-07") — no
  agent in this project, including the orchestrator, approves or closes
  anything itself.

  Pair 13's specific state: the core defect chain this pair worked through is
  about WHO is allowed to move an order and on WHAT evidence — a cancel
  REQUEST is not a venue's answer, and a broker REPORT is not the firm's own
  decision, but the v1 state model conflated both into one undifferentiated
  reachability graph. ADR-012 (proposed, unratified) fixes this by tagging
  every adjacency row with an actor. Findings still open going into revision 3
  are: holdout F01 (a fresh-client-order-id resend bypasses the uncertain-
  state guard because the guard checks order identity, not economic intent —
  fairness-noted as possibly out of this slice's declared scope, see the
  three-part fairness_note in EVB-HLD-001-005-01-v1/manifest.yaml lines
  ~436-458), QA F12 (MEDIUM — recovery_rollback ignores the actor rule
  entirely and can walk held/approved/canceled_pending backwards across a
  platform-authored row, reaching an edge ADR-012's own alternatives_considered
  says was deliberately not taken), and F13/F14/F15 (LOW — one wording
  over-claim, two wrong `why` rationales in DEV's own confined-failure
  pre-derivation, and a one-directional pre-execution guard). None of the four
  block the holdout's own verdict; F12 is flagged as the one a further
  revision would most usefully answer since it is a published rule wider than
  its implementation and lands squarely on ADR-012's subject.

