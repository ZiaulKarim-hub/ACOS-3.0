candidate_learnings:
  - "R2P holdout pack integrity hashing is PER-STORY-FAMILY, recorded centrally in planning/holdouts/HASHING.md, and the in-manifest header comment claiming a method is NOT authoritative and can be wrong — STORY-001-001 uses bsdtar with dir-prefixed member names, STORY-001-002 is documented UNRESOLVED, STORY-001-003 and STORY-001-005 use plain `COPYFILE_DISABLE=1 tar cf - cases.yaml expected.json README.md | shasum -a 256`, STORY-001-004 uses `cat cases.yaml README.md | shasum -a 256`. Any future holdout custodian brief must pull the method from HASHING.md, never from a sibling manifest's header comment or a prior story's precedent. (evidence: R2P planning/holdouts/HASHING.md STORY-001-005 erratum section, commit 5c6254d)"
  - "The async background-Task custodian/reviewer pattern used in this orchestration (SendMessage to resume a stalled/killed agent by id, after checking disk state) survived two distinct failure modes cleanly this session: a correct-but-false-alarm abort from bad provisioning data, and an outright process kill from a 600s stream watchdog. Both recovered without re-spending the holdout's one-shot run, because the harness writes everything to disk BEFORE the single run executes — a crash before the run costs nothing, a crash after it still leaves the log on disk. This ordering discipline (write-then-run-once-then-record, never the reverse) is the reason recovery was safe. (evidence: R2P commits 5c6254d and df663c3; transcript 2026-08-10T15:36-16:28)"
