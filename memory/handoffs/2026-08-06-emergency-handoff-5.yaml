context_for_next_session: |
  This is a 24-pair adversarial DEV/QA build for R2P's EPIC-001, running under
  the Eternity Protocol so it survives repeated context exhaustion ("fires").
  R2P (/Users/zee/Documents/Vibe Coding/R2P) is a completely separate,
  local-only git repo from ACOS 3.0 (no remote configured — `git remote -v`
  returned empty; NEVER attempt to push it anywhere). ACOS 3.0 is only the
  orchestrating pane's cwd, which is why handoffs get written here and then
  mirrored to R2P's own memory/handoffs/ under the identical filename.

  Ground truth for the whole build is R2P/CLAUDE.md and R2P/docs/PRD_v0.4.txt
  (not read in full by this handoff pass — read them at the start of the next
  session if unfamiliar with the domain). The pattern per pair is strictly
  sequential and adversarial: an implementer agent produces a DEV slice via
  TDD (red/green/refactor, full gates including >=70 material mutation
  score) inside allowed_files only; a FRESH-CONTEXT adversarial QA agent
  (who has never seen implementer reasoning) independently writes its own
  attack tests and issues PASS/BLOCK; BLOCK triggers an implementer revision
  responding only to QA's disclosed findings, looping until PASS; PASS
  triggers a holdout evaluation against a pre-sealed private pack the
  implementer/QA never saw; holdout findings trigger another revision loop;
  a clean holdout run lets the ORCHESTRATOR (never the agents themselves)
  seal the pair's evidence bundle. This pattern has now completed twice
  (pairs 1 and 2, both taking 3-4 revisions and multiple holdout runs before
  sealing) and is one QA cycle away from completing a third time.

  The single most load-bearing fact for the very next action: pair 3's DEV
  side is DONE and committed (6ffc7db, 395/395 tests, mutation 89.20/100/
  92.27), but pair 3's QA side has ZERO trace on disk. An agent was spawned
  for it 3.5 minutes before this fire and evidently never got far enough to
