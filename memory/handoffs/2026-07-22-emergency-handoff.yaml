session_summary: |
  Built and shipped a new ACOS skill, `/acos-research-riffs`, at
  `.claude/skills/acos-research-riffs/` (25 files, confirmed on disk, all
  untracked/uncommitted). It is conversational deep research with guardrails: a
  dynamically GENERATED panel of research agents pre-briefs itself into
  claim-level dossiers on disk before conversation starts; the conversation then
  answers only from those dossiers with categorical confidence labels; a
  question the corpus doesn't support abstains and dispatches a probe rather than
  improvising; a moderator surfaces findings nobody asked about; every turn
  appends to an append-only ledger; and a formal cited report compiles from that
  ledger on request. The engine is TypeScript run directly by `bun` (no build
  step). Also renamed `/deep-research` to `/acos-deep-research` and updated all
  live cross-references, and — as the last item of the session — added a live
  browser "research room" (mirroring the Investment Committee skill's committee
  room) that the user had explicitly asked for after noticing its absence.
  Nothing from this session is committed to git; branch is
  acos-deficiency-fixes-2026-06-04.

