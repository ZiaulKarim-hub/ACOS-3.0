candidate_learnings:
  - "R2P (/Users/zee/Documents/Vibe Coding/R2P) is a LOCAL-ONLY repo with no git remote configured at all — never attempt to push it, and a bare 'origin' check will find nothing (evidence: `git status`/`git log` succeed with no remote-tracking output; project_r2p_epic_001 memory note confirms this is intentional)."
  - "In this project's PRD (docs/PRD_v0.4.txt §18.3), 'Ben is the human gate' names a ROLE, not a person — Zee has instructed that going forward he is that role and wants to be called Zee, not Ben, in conversation, even though prior close-packet records that already say 'owner: Ben' are left untouched and are additive-only, never edited (evidence: OBS-MG22's naming_note field, and the transcript's last human prompt)."
  - "A Stryker mutation-testing 'timeout' verdict is not proof of a genuinely non-terminating mutant — on benchmark-alpha.ts, raising timeoutMS 24x (5000->120000) revealed 209 of 269 timeouts were actually survivors that merely needed more wall-clock time, while only 19 were real kills. The standard mutation score is vulnerable to this and can cross a pass/fail bar purely from clock miscalibration; the killed-only score (which does not count timeouts as detections) is comparatively stable under the same change. Worth checking on any Stryker-scored codebase where a file's score is timeout-heavy and sits near a bar (evidence: OBS-MG22-THE-TIMEOUTS-WERE-SURVIVORS-IN-DISGUISE.yaml, commit 8968b00)."
  - "This project's mutation-gate reading tooling had a basename-keying bug that silently merged distinct files sharing a generic name (three index.ts, two result.ts) into one scored row — a good general lesson for any tool that indexes source files by filename alone instead of full relative path (evidence: tools/read-mutation-gate.ts fix, commit 7f1d3b4)."
  - "macOS has no timeout/gtimeout binary (already a standing MEMORY.md fact, reconfirmed as a live constraint in this session's carried-forward notes) and this repo's own path contains a space ('R2P' is fine but its sibling 'ACOS 3.0' cwd is not), so any script invoked across these two repos must quote paths."

