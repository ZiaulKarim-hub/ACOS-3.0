completed_this_session:
  - "Ran a /goal-driven bug-hunt loop tracked via 5 TaskCreate/TaskUpdate tasks (all completed): (1) fix the known empty-doc undo-baseline bug, (2) line-by-line read of editor.html in 13 x ~500-line chunks, (3) line-by-line read of server.py in full, (4) live-probe every suspect found in the reads and fix confirmed bugs, (5) full re-run of all 11 suites + a self-review loop until one clean pass found nothing new."
  - "Bug 1 (the original ask): blank-document boot never seeded an undo baseline, so the FIRST drawn shape in an empty doc could not be undone. Fixed in editor.html's boot else-branch. Probe (probe-first-undo.ts) confirmed all three undo routes (qUndo button, undo-button click, keyboard shortcut) now go empty=0 -> drawn=1 -> after-undo=0 (UNDONE) for the first shape."
  - "Bug 2: Undo, Redo, and Reset never wrote the debounced 0.7s autosave (persistLocal()), so a reload after an undo resurrected the pre-undo state. Measured before the fix: drawn=1, after-undo=0, after-reload=1 (bug). After the fix: after-reload=0. All three actions now call persistLocal()."
  - "Bug 3: one Quick-Styles click booked THREE undo snapshots instead of one, so the first Cmd-Z visibly did nothing (it consumed a duplicate). Probe measured stack 2 -> 5 (+3) for one click before the fix; fill unchanged after 2 undos. Fixed by giving applyFill a no-snapshot option and calling snapshot() exactly once; after the fix, stack grows 2 -> 3 (+1) and one undo restores the prior colour."
  - "Bug 4: Format Painter had the identical one-action-books-multiple-snapshots flaw as bug 3 (its onclick called applyFill + applyOutline + snapshot() separately). Fixed with the same no-snapshot rule."
  - "Bug 5: the `[` and `]` brush-size keyboard shortcuts skipped syncMirrors(), so the Draw-tab's cloned size readout went stale (Home showed 12, the Draw-tab mirror still showed 8). Probe A measured mirror=8/8 vs original=12/12 before the fix, mirror=12/12 after."
  - "Bug 6: escXML() escaped &, <, and > but not double-quote characters. Six of the project's thirteen bundled fonts have quoted family names (e.g. `\"Source Serif 4\", Georgia, serif`), so the embedded quote silently truncated the rendered `font-family` attribute to empty and leaked stray text (`source`, `serif`) as bogus attributes. probe-font.ts measured `font-family=\"\"` (empty) before the fix; the font name survives byte-for-byte after."
  - "Bug 7: layer names, clip-picker row names, and asset-gallery names were interpolated into innerHTML unescaped, so a name containing `<` could break its own row's markup. Escaped in all three spots."
  - "Bug 8: importCandidate() (the reset/paste-import path) trusted the incoming SVG's four viewBox size numbers without validation, unlike its twin useDesign() (the Designer-apply path) which already validated them — bad numbers meant silent NaN math downstream. Fixed by giving importCandidate() the same check."
  - "Bug 9: selecting a shape with no stroke left the PREVIOUSLY selected shape's stroke-width value showing in the width box instead of 0. Fixed in the paint-readout path."
  - "Bug 10: reidGradients() (runs when duplicating a layer) collapsed two DISTINCT old gradient ids in the same group (e.g. lfg3 and lfg7) onto the same new id. Fixed to keep them distinct after duplication."
  - "Bug 11 (server.py): atomic_write() staged every write through one SHARED `.tmp` filename regardless of caller, so two near-simultaneous writes (e.g. two Designer variants saving close together) could interleave/clobber each other's temp file. Fixed so each writer stages its own per-call temp filename before os.replace()."
  - "Bug 12: a failed Designer save always showed the generic 'Save failed — is the server ok?' toast even when the server had returned a real, more specific error reason. Fixed so editor.html now surfaces the server's actual error text instead of the generic fallback."
  - "Re-ran all 11 suites after all 12 fixes, every one green: ribbon 280/280, button 42/42, gallery 38/38, designer 36/36, shapes 28/28, fill 27/27, symbols 25/25, shapelib 25/25, forge 19/19, reject 17/17, explode 12/12 = 549 assertions total. Added new regression-guard tests for bugs 1-2 (button-test.ts) and bug 5 (ribbon-test.ts)."
  - "Re-ran the static id/handler audit (btn-audit.ts) after all edits: 223 unique element ids (0 duplicates), 113 clickable elements, 111 with a bound handler, 0 GHOST references (JS reaching a non-existent id). 19 dead-clickables were listed but NOT investigated further and NOT counted among the 12 fixes — flagged as pre-existing/explained, not new findings."
  - "Ran a full click sweep (sweep.ts, 130 clickable elements) and a mirror-parity probe (probe-mirror.ts, 25 mirrored id/-d pairs): 0 boot errors during the sweep, 0 mirror mismatches. The sweep flagged 44 of 130 elements as zero-size/unreachable in their CURRENT default UI state (e.g. #insPicB, #insTextB) — not investigated further this session and not counted among the 12 fixes; likely buttons hidden until a specific tab/mode is active, but that was not verified."
