  - "Updated acos-logo-forge/SKILL.md's TEST ROSTER section from today's real run: button-test.ts must now print 42/42 (was 37/37 in the doc, already stale before this session), and the roster table now reads 'ELEVEN suites, 549' assertions, with the doc itself flagging that this count has now drifted TWICE historically — take numbers from a real run, never from memory."
