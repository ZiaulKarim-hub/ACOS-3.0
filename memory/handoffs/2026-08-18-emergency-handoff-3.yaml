candidate_learnings:
  - "escXML() in acos-logo-forge/app/editor.html must escape double-quote characters, not just &, <, and > — 6 of the project's 13 bundled fonts have quoted font-family names (e.g. `\"Source Serif 4\", Georgia, serif`), and an unescaped quote silently truncates the rendered font-family attribute to empty in the browser (evidence: probe-font.ts measured font-family=\"\" before the fix, the real name after)."
  - "In acos-logo-forge's undo system, any mutator called from a single user action (Quick Styles, Format Painter, etc.) must pass a no-snapshot option to helpers like applyFill/applyOutline and call snapshot() exactly once, or one click books multiple undo steps and the first Cmd-Z appears to silently do nothing (evidence: Quick Styles and Format Painter both had this bug independently; undo stack grew by 2-3 for a single click before the fix)."
  - "Undo, Redo, and Reset in acos-logo-forge's editor.html must explicitly call persistLocal() (the debounced 0.7s autosave) after mutating state — the autosave debounce does not fire on its own for those three actions, so a reload right after an undo resurrects the undone state (evidence: measured drawn=1, after-undo=0, after-reload=1 before the fix; after-reload=0 after)."
  - "~/.claude/skills is a single-remote repo (`personal` -> git@github.com-personal:ZiaulKarim-hub/claude-skills-personal.git only) — unlike the ACOS 3.0 repo's dual-remote origin(work)/personal setup, there is no origin-vs-personal ambiguity to resolve here; the standing push=personal default still applies."
