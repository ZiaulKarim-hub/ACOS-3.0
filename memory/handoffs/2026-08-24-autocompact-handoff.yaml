candidate_learnings: |
  - Word IGNORES per-cell table widths unless w:tblLayout is "fixed" AND w:tblGrid is rewritten.
  - Word merges adjacent paragraphs that share identical borders, so stacked write-in rules
    collapse into one line; use one-column table rows instead.
  - A .page with overflow:hidden crops PDF content SILENTLY — measure every page, and skip
    footer descendants (.chrome children) or they read as a false 19px overflow.
  - Deriving a parcel-number -> plat map from the commitment's own Schedule B-II labels is
    far more defensible than inferring it from number ranges or a county site.
  - An SCR search is only as good as the parcel list it was run against. This one covered
    6 of 202 parcels and zero Plat F. "No hits" there is an untested question, not a finding.

