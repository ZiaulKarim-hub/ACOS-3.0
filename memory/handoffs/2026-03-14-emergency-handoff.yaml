context_for_next_session: |
  The session added a substantial body of new work — primarily the loan document generator
  ecosystem. The core pattern is that acos-loan-doc-generator is a thin interactive router
  (SKILL.md ~8KB) that delegates all heavy processing to three dedicated phase agents
  (loan-doc-phase1, loan-doc-phase2, loan-doc-phase34), each running in their own context
  window. This keeps the primary context at ~25K tokens instead of 300K+. The phase agents
  read their detailed instructions from .claude/skills/acos-loan-doc-generator/phases/
  (phase1-extract.md, phase2-analyze.md, phase3-design.md, phase4-validate.md) — these
  files were created as part of the skill structure and are also untracked.

  The acos-loan-doc-mapper is a separate, simpler skill for filling existing loan forms
  (rather than generating new documents from scratch). It uses strict zero-fabrication
  rules and binary QA checklists at each phase boundary. Both loan document skills include
  a model selection UI offering GLM-5 via OpenRouter as a token-saving option, backed by
  the new set-skill-model.sh script.

  The acos-software-swarm-review is a hardened version of the existing acos-swarm-review
  with three differentiating capabilities: a three-pass line-by-line review methodology
  (structure scan → risk identification → deep review), a cross-file integration agent
  that connects multi-file vulnerability chains, and an independent verification group
  (deep mode only) that reviews code blind before challenging the coordinator's findings.
  This skill currently lives only at the project level; consider promoting it to global.

  The fallback-to-opencode.sh script fills an important operational gap: when Claude Code
  runs out of context and the handoff system can't save the session, this script finds the
  latest active handoff and launches OpenCode with GLM-5 via OpenRouter, pre-loaded with
  the handoff content. This requires both `opencode` CLI and `doppler` to be installed.

  The starter-templates/ directory provides copy-paste prompts for generating project-
  specific agent definitions. These are not ACOS-specific — they work in any Claude Code
  project. The generate-developer.md template is the most complete and illustrative.

  Priority for next session: (1) commit everything untracked, (2) verify the glm-review
  and glm-heavy model profiles exist in .acos/config/model-profile.yaml, (3) do an
  end-to-end test of acos-loan-doc-generator in Quick mode.

