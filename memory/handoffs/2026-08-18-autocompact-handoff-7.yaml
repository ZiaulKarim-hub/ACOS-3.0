candidate_learnings: |
  - macOS `stat` does NOT follow symlinks by default; `stat -f '%d:%i'` on a
    symlink returns the LINK's inode, so a same-file test silently reports
    "differs". Use `stat -L`.
  - zsh does not word-split an unquoted string variable, so
    ${VAR:+--flag "$VAR"} arrives as ONE glued argument. Use an array and
    "${ARR[@]}".
