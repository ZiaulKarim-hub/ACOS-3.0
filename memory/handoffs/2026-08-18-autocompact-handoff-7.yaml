  ## 2. Key Technical Concepts
  
  - **ACOS Resurrection Protocol** — registry rows in `~/.acos/registry.d/<uuid>.json`, keyed by (folder root, cmux sidebar name); `adopt-project.sh` (adopt-in-place), `launch-project.sh` (focus-or-create), `close-project.sh` (safe close), `resurrect-view.py` (the book), `registry_lib.py`, `knowledge_lib.py`, `windows_lib.py`
  - **The `[key:<uuid>]` tag** — written into a cmux workspace *description*; outranks the sidebar name; prevents a renamed tab from minting a duplicate row
  - **Eternity Protocol** — `PreCompact` → `precompact-handoff.ts`, `PostCompact` → `handoff-enrich.ts`, both registered in `~/.claude/settings.json`; `autoCompactWindow: 533000`
  - **Knowledge store** — `~/.acos/knowledge/<project_uuid>/{facts,entities,edges}.jsonl` + `index.json`; fact ids are content-addressed `sha256(subject\x00claim)[:16]`; strikes and supersedes are EDGES, never deletes
  - **Tombstone** — hides a row in ARCHIVED, never deletes the file
  - **cmux constraint** — a workspace's folder is fixed at creation; `--cwd` exists only on `workspace create`; there is no re-point verb
  - **Claude Code transcripts are keyed by launch cwd** — `~/.claude/projects/<sanitized-cwd>/`, so several projects in one folder share one pile
  - **zsh does not word-split unquoted string variables** — `${VAR:+--flag "$VAR"}` arrives as ONE glued argument; `"${ARR[@]}"` is safe in both shells
  - **acos-research-riffs engine** — `riff init/coverage/brief/panel/charter/claims ingest/ask`; seat schema requires `slug, role, title, objective, lane, not_lane, dimensions, status`; roles are a fixed token set; `panel approve` refuses a roster without a generalist AND a skeptic
  
