  ### Created
  
  **`.claude/scripts/resurrection/conflict-scan.py`** (new, read-only, Python by the extend-existing-Python exception)
  Reports 5 classes with a named fix each: `BLEED`, `NAME-CLASH`, `ROOT-GONE`, `ROOT-UNREACHABLE`, `SESSION-SHARED`. Stays silent on multi-window (a supported mode). Exit 0 = clean, 1 = conflicts, 2 = could not run. Currently reports **10 conflicts**: 4 NAME-CLASH, 3 SESSION-SHARED, 3 ROOT-UNREACHABLE.
  
  **`.claude/scripts/resurrection/prune-state-bindings.ts`** (new, TypeScript per the standing rule)
  Prunes `cmux-surface-`, `pid-`, `project-`, `stop-` prefixed files. MOVES to `state/pruned/<utc-stamp>/`, never deletes. A binding is pruned only when: no live process holds the session, no `pending-resume-<sid>.txt` exists, and it is older than `--older-than` (default 7) days. The PID-reuse guard:
  ```ts
  function sessionLive(sid: string): boolean {
    const pidFile = join(STATE, `pid-${sid}`);
    if (!existsSync(pidFile)) return false;
    let lines: string[] = [];
    try { lines = readFileSync(pidFile, "utf8").split("\n"); } catch { return false; }
    const pid = (lines[0] ?? "").trim();
    if (!/^\d+$/.test(pid)) return false;
    const liveStart = pidStart(pid);
    if (liveStart === null) return false;          // not running at all
    const recordedStart = (lines[1] ?? "").trim();
    if (!recordedStart) return true;               // cannot disprove — keep it
    return recordedStart === liveStart;            // same process, or a reused pid
  }
  ```
  
  **`.claude/scripts/resurrection/backfill-key-tags.ts`** (new, TypeScript)
  Tags untagged tabs. **Strict rule**: tag only when EXACTLY ONE live row carries the tab's sidebar name; any name clash REFUSES with candidates printed.
  
  **`.claude/scripts/resurrection/merge-knowledge.py`** (new, Python)
  `--from <uuid> --into <uuid> [--apply] [--allow-different-roots]`. Dry run by default. Refuses same uuid, missing rows, a tombstoned target, and differing roots (unless forced). Moves facts via `knowledge_lib.append_fact` (so schema gate + content-addressed dedup apply), stamps `provenance.merged_from_project`, then carries `struck` / `strike-reason` / `supersedes` edges whose endpoints landed in the target. Never modifies the source, never retires a row.
  
