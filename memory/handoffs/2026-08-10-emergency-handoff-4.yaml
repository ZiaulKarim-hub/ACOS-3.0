handoff_provenance_caveat: |
  READ THIS FIRST. This file was NOT written by handoff-agent. The agent
  (acd8324446569b5d7) wrote its 496-byte STUB and then stalled — 667 seconds
  with no transcript write at 745KB — and never enriched it. The stub said
  "STUB — enrichment in progress. If this text survives, the handoff agent was
  cut off before finishing".

  That stub would have PASSED the eternity protocol's Step 1 freshness guard,
  which checks only that the newest session-matched handoff exists, is
  non-empty, and is under 10 minutes old. A stub is all three. So the guard
  has a real hole: it cannot tell "the agent finished" from "the agent started".
  The main session detected the stub by reading it, aborted the automatic path,
  and wrote this file directly from live context. That is strictly better
  sourcing than a transcript re-read, not worse — the main session WAS the
  session — but it is a deviation from the documented flow and is recorded
  here rather than hidden.

  SUGGESTED FIX for whoever picks this up: add a completeness check to Step 1
  of .claude/skills/acos-eternity-protocol/SKILL.md — e.g. refuse a handoff
  that still contains the literal string "STUB — enrichment in progress", or
  one under some floor size (every healthy handoff this week is 18-24KB; the
  stub is 496 bytes).

