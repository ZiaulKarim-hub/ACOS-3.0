  - "d12a47d fix(logo-forge): fixed 'the outline line looks stripped' by re-cropping Zee's real PowerPoint screenshot (x=1200..1400 of 1913px) instead of guessing, and found PowerPoint puts the colour-bar swatch DIRECTLY UNDER the icon at icon width (.icb unit), not past the ▾ as a separate chip. Repositioning the bar (.split .sw now 18x4 under the icon, was 22x6 after it) is ALSO why the no-fill diagonal-slash marker (PowerPoint's own convention) started reading as an unrelated red barber stripe once squeezed into the smaller bar — it needs the ~20px square a menu row gives it. Replaced with a hollow DASHED bar (.nil class): white fill = solid bar with hairline edge, no fill = dashed with nothing inside, unambiguous either way. Test updated not deleted: the old assertion checked the MECHANISM (a linear-gradient in inline style); re-anchored to the REQUIREMENT (a colourless swatch must be visibly marked) via .nil class + dashed border + empty computed background, plus a new companion check that a coloured swatch renders solid — 177->178 assertions. Measured: Drawing group 318->291px, Home tab 1287->1260px, Clipboard group still 112.3px (guard fails above 113.3). Tests exit 0: 356 total (pre-symbols), audit.ts 0 findings, 12 text-run checks 12/12."
  - "dfb3a8a feat(logo-forge): built a Symbols tool with 2,095 symbols extracted as REAL VECTOR PATHS (not text-layer font references) — deliberately more expensive than a text approach because an exported SVG sent to someone without the same font would silently render wrong or empty. build-symbols.py (new file, Python via fontTools — documented exception to the TS/Rust default, build-time only, produces symbols.json and ships no Python into the editor) reads 4 installed macOS fonts: Apple Symbols 1715, Zapf Dingbats 184, Arial Unicode 195 (filtered to usable Unicode blocks — arrows/geometric/dingbats/maths/technical/currency/etc, dropping the tens of thousands of CJK text codepoints), Symbol 1. Two easy-to-miss, silent-failure details handled: font-space Y is flipped for SVG's y-down convention, and glyphs under MIN_INK bbox coverage are dropped as specks. Picker (forced by the 2,095 count, vs. shape library's 45-then-264): symbols.json (1.1MB) fetches on FIRST OPEN not at boot, category chip + search filter before drawing, SYM_PAGE=240 cells built at a time behind Show more; search matches name OR codepoint OR category. New suite symbols-test.ts, 25 assertions — load-bearing one asserts every symbol is a <path> with zero font-family instances anywhere near an inserted symbol. One test assertion was initially wrong (checked query-in-NAME, failed on legitimate codepoint/category hits like 'arrow'->harpoon symbols) and was corrected, not loosened. Layout cost: zero — Drawing group unchanged at 291px/112.3px, Home tab 1260px of 1680. Tests exit 0: 381 total (fill 27, ribbon 178, shapes 28, forge 19, explode 12, gallery 38, reject 17, symbols 25, button 37), audit.ts 0 findings."
  - "25c49a5 feat(logo-forge): shape library expanded 44->264 (a prior count of '45' was wrong, corrected via git — actual old breakdown: Basics 14, Stars&bursts 7, Arrows 4, Symbols 15, Frames 4 = 44). A 22-agent workflow researched PowerPoint's OOXML preset-geometry AutoShapes list (~180 presets), authored path data across 10 new categories (Rectangles 12, Basic shapes 26, Block arrows 25, Equation 6, Flowchart 25, Stars&banners 15, Callouts 8, Frames&badges 17, Nature 27, Objects&tech 59 = 220 shapes), and adversarially verified each — verifiers found/fixed 81 authoring defects. Governing rule: RENDER and LOOK at it, not just parse the path — a shape that doesn't look like its own name fails, which no per-category verifier structurally can catch alone; 3 cross-category duplicates (two 'rounded frame', two 'tag', two 'spiral') survived all 10 per-category passes and were only caught laying categories side by side — two pairs were genuinely different and renamed, one spiral pair was near-identical and one was dropped (221 authored, 220 shipped). Kept INLINE in editor.html (56,651 bytes of rows), deliberately unlike symbols.json's lazy fetch, because of the ~20x size difference — picker stays instant. Verified in the real editor: SHAPES.length 264, all 264 cells draw with 0 blank, no page errors, insertion still yields a <path>. Tests exit 0: 381 total, audit.ts 0 findings."

