context_for_next_session: |
  This handoff is for the morning-after pickup following an autonomous overnight build
  of acos-dataroom-v2. Here is everything the post-clear AI needs to know.

  BACKGROUND (what went wrong with v1):
  On 2026-05-12/13 the v1 acos-dataroom skill was run on the Ascent Park City /
  Waldorf-Astoria deal folder (path: /Users/zee/Library/CloudStorage/Dropbox-OkoaCapital/
  Okoa Loans - 2. Active/1. In HyperCore/Wolfgramm_Ascent_Beehive - Waldorf (30M)).
  v1's architecture included a mandatory Pause Gate #2 where the boss reviews an Internal
  Working Workbook (Excel) before the final dataroom is assembled. The boss refused to
  review the Excel ("I don't have time") and the AI's raw classifications became the
  final output. Boss's verdict: "AI is a piece of shit." This was a TRUST failure — the
  skill was architected around a human review step that the human would never actually
  perform. Zee, the operator at Okoa Capital (jason@okoacapital.com, PE real estate
  lender), authorized a complete redesign.

  WHAT V2 IS:
  acos-dataroom-v2 is a fully autonomous pipeline: source folder + one-line objective
  in, buyer-ready dataroom + Excel guide out. No human pause gates. The quality mechanism
  is multi-stage adversarial consensus: 3-agent blind voting swarms (Opus + Sonnet + Opus
  model mix for cognitive diversity), Wigum-loop QA at every stage, dedicated privilege
  scanner (Phase 2.5), emergent per-dataroom taxonomy design, and default-EXCLUDE on
  irreducible disagreement. The boss only ever sees the final folder + Excel. Two
  deliverables only. No working workbook. No risk dashboard. No gaps analysis.

  ARCHITECTURE CRITICAL DETAIL — OUTPUT DIR SPLIT:
  There are TWO output locations and they serve different purposes:
  (1) AUDIT TRAIL: $(pwd)/_acos_dataroom_v2_output/run_{timestamp}_{hash}/ — written to
  the directory WHERE THE SKILL IS INVOKED FROM, not next to the source. This is
  intentional: keeps multi-GB deliberation transcripts out of Dropbox sync. Contains
  run_state.json (checkpoint + resume data), all deliberation logs, HALT_REPORT.md if
  triggered.
  (2) FINAL SHIPPABLE: <source_parent>/<asset_name>_Dataroom/ — the buyer-facing
  organized dataroom with numbered folders + Excel guide + optional Manual_Review_Required.md.
  This lands NEXT TO the source folder for easy sharing.
  For the Ascent run: invoke from a consistent pwd (e.g., project root). If interrupted,
  re-invoke from the SAME pwd so resume can find the audit trail.

  THE FIRST MORNING ACTION:
