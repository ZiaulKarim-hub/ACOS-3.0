candidate_learnings: |
  An emoji relocated onto a ribbon reads as a missing icon. Same lesson the
  clear-space button taught when it rendered as an empty box: an emoji is
  somebody else's typeface, so it never matches drawn 18px marks beside it.
  Making a tab contextual can silently amputate a command. Shape hid behind the
  selection, and Group-with-nothing-selected - which groups the whole board - had
  no door left. Ask what a command does when NOTHING is selected before gating
  its tab on a selection.
  Two neighbouring buttons must not share one icon (dlPng/dlAll, resetT/resetGeo).
