  8. **`canonical-hash.ts` symlink bug — CONFIRMED by my own test.** `statSync` follows symlinks; `lstatSync` does not. My comment claims the opposite. Proof: a pack with a file symlink and a directory symlink hashed `["README.md","cases.yaml","expected.json","linked.txt","linkeddir/secret.txt"]`; changing only the outside target moved the digest `d158d0cad2fa8e3167c51653cf00ccec` → `ff192ac062e1a1d3bb49d4a1408fbeda`. **Planned fix: REFUSE a pack containing any symlink, not skip it** — because `reveal.ts` reads `cases.yaml` with `readFileSync`, which follows symlinks, so a silently-skipped symlinked cases file would RUN but not be hashed.
  9. **`reveal.ts` maxBuffer false-FAIL — CONFIRMED by my own test.** Default `maxBuffer` is 1,048,576 bytes. At 1,048,577 `execFileSync` throws `ENOBUFS`, `e.status` is `null`, so the catch records `code = 1`. Measured: 1,048,575 bytes exit 0 → recorded 0; 1,048,577 bytes exit 0 → recorded **1**. A passing case is permanently failed on a one-shot exam that is then SPENT.
  10. **`reveal.ts` no timeout** — a hanging case hangs the whole reveal forever; nothing is written until the end so a hang loses the run.
  11. **`render.ts` watch dies on parse error** — measured: process exits code 1, no further events. No try/catch, and the `FSWatcher` has no `error` listener.
  12. **`render.ts` throttle drops rebuilds** — it is leading-edge, not a debounce; a discarded event is never rescheduled. The comment "fs.watch fires twice per write on macOS" **did not reproduce** (80 writes / 40 trials → 41 events). Currently masked at 0% stale rate. Always rebuilding costs 0.014 ms.
  
