<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brad Chart Fixture — SLICE-003-001-03</title>
    <style>
      body { font-family: 'Inter', sans-serif; color: rgb(20, 20, 20); }
      h1.heading-display { font-size: 32px; font-weight: 700; }
      .chart-card { padding: 16px; }
      .icon { width: 24px; height: 24px; display: inline-block; }
    </style>
  </head>
  <body>
    <section class="chapter">
      <h1 class="heading-display">OKOA Brad — Chart Fixture</h1>

      <!-- SVG 1: bar chart, has viewBox, NO explicit width/height attrs -->
      <figure class="chart-card" id="bar-chart-card">
        <svg id="brad-bar-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet">
          <title>Quarterly Revenue</title>
          <defs>
            <linearGradient id="bar-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4a90e2" />
              <stop offset="1" stop-color="#2e5d8f" />
            </linearGradient>
          </defs>
          <g class="bars" fill="url(#bar-gradient)" stroke="#1a3a5c" stroke-width="0.5" stroke-dasharray="2,1">
            <rect x="5"  y="20" width="10" height="30" />
            <rect x="20" y="10" width="10" height="40" />
            <rect x="35" y="15" width="10" height="35" />
            <rect x="50" y="5"  width="10" height="45" />
          </g>
          <text x="50" y="48" font-size="3" text-anchor="middle" fill="#333">Q1–Q4</text>
        </svg>
        <figcaption>Quarterly revenue, FY26</figcaption>
      </figure>

      <!-- SVG 2: line chart, NO viewBox, has explicit width/height attrs (200×100 → aspectRatio = 2.0) -->
      <figure class="chart-card" id="line-chart-card">
        <svg id="brad-line-chart" xmlns="http://www.w3.org/2000/svg" width="200" height="100">
          <title>Daily Active Users</title>
          <polyline
            fill="none"
            stroke="#22b14c"
            stroke-width="1.5"
            points="0,80 20,60 40,65 60,40 80,30 100,35 120,20 140,25 160,15 180,10 200,5"
          />
          <g class="dots" fill="#22b14c">
            <circle cx="0"   cy="80" r="2" />
            <circle cx="100" cy="35" r="2" />
            <circle cx="200" cy="5"  r="2" />
          </g>
        </svg>
        <figcaption>DAU, last 10 days</figcaption>
      </figure>

      <!-- SVG 3: tiny icon, neither viewBox NOR width/height attrs (aspectRatio defaults to 1.0 + warn) -->
      <p class="body-text">
        Inline icon <svg id="brad-icon" xmlns="http://www.w3.org/2000/svg" class="icon"><path d="M0 0 L10 10 L0 10 Z" fill="#888" /></svg> appears alongside body text.
      </p>
    </section>
  </body>
</html>
