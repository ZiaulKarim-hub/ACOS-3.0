    <h1 class="heading-display">OKOA Brad — Background Fixture</h1>

    <!-- Full-bleed hero. Carries BOTH a background AND inline text — must
         emit two records (one 'text', one 'background') per acceptance
         criterion #4. -->
    <section class="hero" id="hero-section">
      <h2 class="hero-title">Hero with background AND text</h2>
    </section>

    <!-- Section divider: background-size contain + explicit position. -->
    <div class="divider" id="divider-1"></div>

    <!-- Decorative spread: default size + pixel-coordinate position. -->
    <div class="decorative" id="decorative-1"></div>

    <!-- data: URI background applied via inline style, sanity check the
         inline-attr path. Uses the 50x50 PNG. -->

         style="background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADIAAAAyCAYAAAAeP4ixAAAAVElEQVR4nO3PsQ0AIAzAsJ7ez+EMIuQhezy7e35oXg+AgMQDqQVSC6QWSC2QWiC1QGqB1AKpBVILpBZILZBaILVAaoHUAqkFUgukFkgtkFogtb6BXObnYaV7inyEAAAAAElFTkSuQmCC'); background-size: auto; background-position: 0 0; height: 60px;"></div>

    <!-- No background; must NOT emit a background record. Has text so
         text extractor still emits. -->
    <div class="no-bg" id="plain-paragraph">
      <p class="body-text">A plain paragraph with no background-image. The
        background extractor must skip this element entirely.</p>
    </div>

    <!-- A gradient-only background-image must NOT emit (no url()). -->
    <div id="gradient-only"
         style="background-image: linear-gradient(to right, red, blue); height: 40px;"></div>
