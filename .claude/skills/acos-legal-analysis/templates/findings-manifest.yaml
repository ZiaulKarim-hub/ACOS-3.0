# ACOS Legal Analysis — Findings Manifest
# Structured output. Every row is one finding. The narrative report renders from this file.
# Lives at: .acos/sessions/legal-analysis/{session-id}/findings-manifest.yaml

session_id: ""
mode: ""                                  # lending | ip-infringement

# ── Summary rollup (populated last) ─────────────────────────────────────
summary:
  total_findings: 0
  by_severity:
    CRITICAL: 0
    HIGH: 0
    MEDIUM: 0
    LOW: 0
    INFO: 0
  by_category: {}                         # dynamic per mode (e.g., chain-of-title: 3)

# ── Findings list ───────────────────────────────────────────────────────
# Each finding uses this schema. Append as discovered.
findings:
  # Example (remove in real use):
  # - id: "F-001"
  #   severity: "HIGH"                    # CRITICAL | HIGH | MEDIUM | LOW | INFO
  #   category: "chain-of-title"          # mode-specific category key
  #   label: "fact"                       # fact | inference | argument
  #   title: "Borrower name on deed does not match loan application"
  #   description: |
  #     The Grantee on the recorded deed is "ABC Holdings LLC"; the loan application
  #     names "ABC Holdings LP" as borrower. These are distinct legal entities.
  #   citations:
  #     - file: "path/to/deed.pdf"
  #       page: 2
  #       clause: "Grantee"
  #     - file: "path/to/loan_app.pdf"
  #       page: 1
  #       clause: "Borrower"
  #   counter_argument: |
  #     These may be affiliated entities under common control; a resolution
  #     + assignment of rights could cure the mismatch before closing.
  #   proposed_fix: "Obtain corrective deed OR restructure loan to match the deed vesting."
  #   jurisdictional_note: "Outcome varies by state (e.g., NY requires strict name match for recording)."

