# ═══════════════════════════════════════════════════════════════
# NON-OPERATING ITEMS (6000-6999)
# ═══════════════════════════════════════════════════════════════
non_operating:
  depreciation_amortization:
    - code: "6000"
      name: "Depreciation — Building"
      type: debit
      classification: non-operating
      cfs_category: operating  # added back as non-cash
      property_types: all
      notes: "39 years commercial, 27.5 years residential, straight-line"

    - code: "6010"
      name: "Depreciation — Building Improvements"
      type: debit
      classification: non-operating
      cfs_category: operating
      property_types: all
      notes: "5-15 years, straight-line"

    - code: "6020"
      name: "Depreciation — Tenant Improvements"
      type: debit
      classification: non-operating
      cfs_category: operating
      property_types: [office, retail, industrial, mixed-use]
      notes: "Shorter of useful life or remaining lease term"

    - code: "6030"
      name: "Depreciation — FF&E"
      type: debit
      classification: non-operating
      cfs_category: operating
      property_types: all
      notes: "5-7 years, straight-line"

    - code: "6100"
      name: "Amortization — Intangible Lease Assets"
      type: debit
      classification: non-operating
      cfs_category: operating
      property_types: all

    - code: "6110"
      name: "Amortization — Below-Market Lease Liability"
      type: credit
      classification: non-operating
      cfs_category: operating
      property_types: all
      notes: "Credit = increases revenue"

    - code: "6200"
      name: "Amortization — Deferred Financing Costs"
      type: debit
      classification: non-operating
      cfs_category: operating
      property_types: all

  interest:
    - code: "6300"
      name: "Interest Expense"
      type: debit
      classification: non-operating
      cfs_category: operating  # or financing depending on policy
      property_types: all

  other:
    - code: "6400"
      name: "Gain on Sale of Property"
      type: credit
      classification: non-operating
      cfs_category: investing
      property_types: all
      notes: "Reclassify from operating to investing in CFS"

    - code: "6410"
      name: "Loss on Sale of Property"
      type: debit
      classification: non-operating
      cfs_category: investing
      property_types: all

    - code: "6500"
      name: "Impairment Loss"
      type: debit
      classification: non-operating
      cfs_category: operating  # non-cash
      property_types: all
      notes: "ASC 360-10; test when events suggest carrying amount not recoverable"

# ═══════════════════════════════════════════════════════════════
# SUPPLEMENTAL METRICS (non-GAAP, computed from GAAP data)
# ═══════════════════════════════════════════════════════════════
supplemental_metrics:
  - code: "NOI"
    name: "Net Operating Income"
    formula: "Total Revenue (4xxx) - Total Operating Expenses (5xxx)"
    notes: "Non-GAAP subtotal widely used in CRE; shown for analysis"

  - code: "FFO"
    name: "Funds From Operations"
    formula: "Net Income + Depreciation (6000-6030) + Impairment Loss (6500) - Gain on Sale (6400) + Loss on Sale (6410)"
    notes: "NAREIT definition; primary PE real estate performance metric"

  - code: "AFFO"
    name: "Adjusted Funds From Operations"
    formula: "FFO - Maintenance CapEx - Straight-Line Rent Adj (4010) + Non-Recurring Items"
    notes: "No standard definition; approximates recurring distributable cash flow"

  - code: "DSCR"
    name: "Debt Service Coverage Ratio"
    formula: "NOI / Annual Debt Service"
    notes: "Minimum typically 1.20x-1.35x for CRE lenders"

  - code: "DEBT_YIELD"
    name: "Debt Yield"
    formula: "NOI / Loan Amount"
    notes: "Minimum typically 8-12%; lender's unlevered return on loan"

  - code: "LTV"
    name: "Loan-to-Value"
    formula: "Loan Amount / Property Value"
    notes: "Maximum typically 65-75% for CRE"
