parts:
  - title: "The Strategy"
    subtitle: "What we finance, how we underwrite, and why it performs."
    sections:
      - name: "Thesis"
        title: "Flexible Capital"
        body_col_1: |
          OKOA finances bridge, construction, and light-transitional real estate across
          the US West. Loan sizes range from $5M to $75M with hold periods of 9–24 months.
          We move from indication to closing in under three weeks — a speed the bank
          channel cannot match.
        body_col_2: |
          Our pricing sits above the bank market and below the rescue-capital market.
          This middle band reflects our ability to underwrite story loans with precision
          and deliver certainty of execution, without charging for optionality we do not
          use.
        pull_quote: "First dollar in, last dollar out — with eyes open on every line."

      - name: "Metrics"
        title: "Track Record"
        metrics:
