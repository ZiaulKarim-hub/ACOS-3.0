<!-- template: closing | variables: {{eyebrow}} {{title_lead}} {{italic_accent_phrase}} {{summary_col_1}} {{summary_col_2}} {{panel_title}} {{panel_body}} {{footer_text}} -->
<div class="page" data-template="closing" style="background-color: var(--white); color: var(--ink); display: grid; grid-template-rows: auto 1fr auto;">
  <div style="padding: 1.0in 0.75in 0.3in 0.75in; background-color: var(--white);">
    <div class="mono-label" style="color: var(--coral); background-color: var(--white); margin-bottom: 24px;">{{eyebrow}}</div>
    <h2 class="display-md" style="color: var(--ink); background-color: var(--white); margin: 0 0 32px 0;">
      {{title_lead}} <span class="italic-accent">{{italic_accent_phrase}}</span>
    </h2>
    <div style="display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; background-color: var(--white);">
      <div class="body-md" style="color: var(--ink-80); background-color: var(--white);">{{summary_col_1}}</div>
      <div class="body-md" style="color: var(--ink-80); background-color: var(--white);">{{summary_col_2}}</div>
    </div>
  </div>

  <div style="margin: 0.4in 0.75in; padding: 40px 48px; background-color: var(--ink); color: var(--white); background-image: linear-gradient(135deg, rgba(16,68,115,0.35), transparent 60%), repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 24px);">
    <div class="display-quote" style="color: var(--white); background-color: transparent;">{{panel_title}}</div>
    <div class="body-md" style="color: rgba(255,255,255,0.85); background-color: transparent; margin-top: 16px;">{{panel_body}}</div>
  </div>

  <footer style="padding: 0.4in 0.75in; background-color: var(--sage-80); color: var(--white); display: flex; justify-content: space-between; align-items: center;">
    <svg width="80" height="21" viewBox="0 0 140 37" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M126.1 0.7H119.2L105.7 35.5H113.6L116.1 28.4H129.1L131.6 35.5H139.5L126.1 0.7ZM118.5 21.9L122.7 10.3L126.8 21.9H118.5Z" fill="#FEFEFE"/><path d="M73.3 0.7H63.5L48.9 15.9V0.7H41.4V35.5H48.9V20.3L63.5 35.5H73.3L56.6 18.1L73.3 0.7Z" fill="#FEFEFE"/><path d="M18.8 0C7.7 0 0 9.2 0 18.1C0 27 7.7 36.2 18.8 36.2C29.9 36.2 37.6 27 37.6 18.1C37.6 9.2 29.9 0 18.8 0ZM28.4 27.7H9.2V8.5H28.5V27.7H28.4Z" fill="#FEFEFE"/><path d="M88.7 0C77.5 0 69.9 9.2 69.9 18.1C69.9 27 77.6 36.2 88.7 36.2C99.8 36.2 107.5 27 107.5 18.1C107.5 9.2 99.8 0 88.7 0ZM98.3 27.7H79.0V8.5H98.3V27.7Z" fill="#FEFEFE"/></svg>
    <div class="mono-tech" style="color: rgba(255,255,255,0.85); background-color: transparent;">{{footer_text}}</div>
  </footer>
</div>
