<!-- template: portfolio-grid | variables: {{eyebrow}} {{title_lead}} {{italic_accent_phrase}} {{items}} (list of 4: {eyebrow, title, location, body, stats: [{label, value}]}) | photo_slots: 4 per page -->
<div class="page bg-ink05" data-template="portfolio-grid" style="background-color: var(--ink-05); color: var(--ink);">
  <div class="running-header" style="background-color: var(--ink-05);">
    <div class="mono-meta" style="color: var(--ink-60); background-color: var(--ink-05);">{{running_header_left}}</div>
    <div class="mono-meta" style="color: var(--ink-60); background-color: var(--ink-05);">{{running_header_right}}</div>
  </div>

  <div style="padding: 1.0in 0.6in 0.9in 0.6in; background-color: var(--ink-05);">
    <div class="mono-label" style="color: var(--coral); background-color: var(--ink-05); margin-bottom: 18px;">{{eyebrow}}</div>
    <h2 class="display-md" style="color: var(--ink); background-color: var(--ink-05); margin: 0 0 32px 0;">
      {{title_lead}} <span class="italic-accent">{{italic_accent_phrase}}</span>
    </h2>

    <div style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; column-gap: 16px; row-gap: 16px; background-color: var(--ink-05);">
      {{items_html}}
    </div>
  </div>

  <div class="running-footer" style="background-color: var(--ink-05);">
    <div class="mono-tech" style="color: var(--ink-60); background-color: var(--ink-05);">OKOA CAPITAL</div>
    <div class="mono-tech" style="color: var(--ink-60); background-color: var(--ink-05);">{{page_number_roman}} / {{total_pages_roman}}</div>
  </div>
</div>
