<!-- template: cover | variables: {{eyebrow}} {{title_lead}} {{italic_accent_phrase}} {{subtitle}} {{metadata_label}} {{metadata_value}} | photo_slot: cover_image (tags: hero, landscape, architectural) -->
<div class="page bg-ink" data-template="cover" style="background-color: var(--ink); color: var(--white);">
  <div data-photo-slot="hero,landscape,architectural,cover" data-slot-id="cover_image" style="position:absolute; inset:0; background-size:cover; background-position:center;"></div>
  <div style="position:absolute; inset:0; background: linear-gradient(180deg, rgba(22,22,22,0.25) 0%, rgba(22,22,22,0.55) 65%, rgba(22,22,22,0.85) 100%);"></div>

  <div style="position:absolute; top:0.6in; left:0.6in; right:0.6in; background-color: transparent;">
    <div class="mono-label" style="color: var(--coral); background-color: transparent;">{{eyebrow}}</div>
  </div>

  <div style="position:absolute; left:0.6in; right:0.6in; bottom:1.4in; background-color: transparent;">
    <h1 class="display-xl" style="color: var(--white); background-color: transparent; margin:0;">
      {{title_lead}} <span class="italic-accent">{{italic_accent_phrase}}</span>
    </h1>
    <div class="body-lg" style="color: rgba(255,255,255,0.85); background-color: transparent; margin-top: 16px; max-width: 5.5in;">{{subtitle}}</div>
  </div>

  <div style="position:absolute; left:0.6in; right:0.6in; bottom:0.5in; display:flex; justify-content: space-between; align-items: flex-end; background-color: transparent;">
    <svg width="120" height="32" viewBox="0 0 140 37" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M126.1 0.7H119.2L105.7 35.5H113.6L116.1 28.4H129.1L131.6 35.5H139.5L126.1 0.7ZM118.5 21.9L122.7 10.3L126.8 21.9H118.5Z" fill="#FEFEFE"/><path d="M73.3 0.7H63.5L48.9 15.9V0.7H41.4V35.5H48.9V20.3L63.5 35.5H73.3L56.6 18.1L73.3 0.7Z" fill="#FEFEFE"/><path d="M18.8 0C7.7 0 0 9.2 0 18.1C0 27 7.7 36.2 18.8 36.2C29.9 36.2 37.6 27 37.6 18.1C37.6 9.2 29.9 0 18.8 0ZM28.4 27.7H9.2V8.5H28.5V27.7H28.4Z" fill="#FEFEFE"/><path d="M88.7 0C77.5 0 69.9 9.2 69.9 18.1C69.9 27 77.6 36.2 88.7 36.2C99.8 36.2 107.5 27 107.5 18.1C107.5 9.2 99.8 0 88.7 0ZM98.3 27.7H79.0V8.5H98.3V27.7Z" fill="#FEFEFE"/></svg>
    <div class="mono-meta" style="color: rgba(255,255,255,0.75); background-color: transparent; text-align: right;">
      <div>{{metadata_label}}</div>
      <div style="color: var(--white); margin-top: 4px; font-weight: 600;">{{metadata_value}}</div>
    </div>
  </div>
</div>
