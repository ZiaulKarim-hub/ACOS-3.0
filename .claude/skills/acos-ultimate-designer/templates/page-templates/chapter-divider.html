<!-- template: chapter-divider | variables: {{eyebrow}} {{title_lead}} {{italic_accent_phrase}} {{subtitle}} | photo_slot: divider_image -->
<div class="page bg-ink" data-template="chapter-divider" style="background-color: var(--ink); color: var(--white);">
  <div data-photo-slot="architecture,landscape,atmospheric" data-slot-id="divider_image" style="position:absolute; inset:0; background-size:cover; background-position:center;"></div>
  <div style="position:absolute; inset:0; background: linear-gradient(135deg, rgba(16,68,115,0.85) 0%, rgba(22,22,22,0.8) 100%);"></div>

  <div style="position:absolute; left:0.8in; right:0.8in; top:50%; transform: translateY(-50%); background-color: transparent;">
    <div class="mono-label" style="color: var(--coral); background-color: transparent; margin-bottom: 24px;">{{eyebrow}}</div>
    <h1 class="display-xl" style="color: var(--white); background-color: transparent; margin:0;">
      {{title_lead}} <span class="italic-accent">{{italic_accent_phrase}}</span>
    </h1>
    <div class="body-lg" style="color: rgba(255,255,255,0.85); background-color: transparent; margin-top: 24px; max-width: 5.5in;">{{subtitle}}</div>
  </div>
</div>
