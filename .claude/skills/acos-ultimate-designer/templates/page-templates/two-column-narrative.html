<!-- template: two-column-narrative | variables: {{eyebrow}} {{title_lead}} {{italic_accent_phrase}} {{pull_quote}} {{body_col_1}} {{body_col_2}} {{page_number_roman}} {{total_pages_roman}} -->
<div class="page bg-white" data-template="two-column-narrative" style="background-color: var(--white); color: var(--ink);">
  <div class="running-header" style="background-color: var(--white);">
    <div class="mono-meta" style="color: var(--ink-60); background-color: var(--white);">{{running_header_left}}</div>
    <div class="mono-meta" style="color: var(--ink-60); background-color: var(--white);">{{running_header_right}}</div>
  </div>

  <div style="padding: 1.2in 0.75in 0.9in 0.75in; background-color: var(--white);">
    <div class="mono-label" style="color: var(--coral); background-color: var(--white); margin-bottom: 24px;">{{eyebrow}}</div>

    <h2 class="display-md" style="color: var(--ink); background-color: var(--white); margin: 0 0 24px 0; max-width: 6.8in;">
      {{title_lead}} <span class="italic-accent">{{italic_accent_phrase}}</span>
    </h2>

    <blockquote class="display-quote" style="color: var(--ink-80); background-color: var(--warm); border-left: 3px solid var(--coral); padding: 16px 24px; margin: 32px 0; max-width: 6in;">
      {{pull_quote}}
    </blockquote>

    <div style="display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; margin-top: 32px; background-color: var(--white);">
      <div class="body-md" style="color: var(--ink-80); background-color: var(--white);">{{body_col_1}}</div>
      <div class="body-md" style="color: var(--ink-80); background-color: var(--white);">{{body_col_2}}</div>
    </div>
  </div>

  <div class="running-footer" style="background-color: var(--white);">
    <div class="mono-tech" style="color: var(--ink-60); background-color: var(--white);">OKOA CAPITAL</div>
    <div class="mono-tech" style="color: var(--ink-60); background-color: var(--white);">{{page_number_roman}} / {{total_pages_roman}}</div>
  </div>
</div>
