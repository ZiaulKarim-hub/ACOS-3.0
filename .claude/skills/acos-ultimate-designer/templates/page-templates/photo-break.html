<!-- template: photo-break | variables: {{caption_label}} {{caption_location}} | photo_slot: band_image (full-bleed) -->
<div class="page" data-template="photo-break" style="background-color: var(--ink); color: var(--white);">
  <div data-photo-slot="landscape,atmospheric,architectural,full-bleed" data-slot-id="band_image" style="position:absolute; inset:0; background-size:cover; background-position:center;"></div>

  <div style="position:absolute; left:0.6in; bottom:0.5in; background-color: transparent;">
    <div class="mono-label" style="color: var(--coral); background-color: transparent; margin-bottom: 4px;">{{caption_label}}</div>
    <div class="body-caption" style="color: rgba(255,255,255,0.85); background-color: transparent;">{{caption_location}}</div>
  </div>
</div>
