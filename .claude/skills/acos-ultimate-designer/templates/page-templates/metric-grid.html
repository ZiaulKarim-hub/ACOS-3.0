<!-- template: metric-grid | variables: {{eyebrow}} {{title_lead}} {{italic_accent_phrase}} {{metrics}} (list of 9 items: {label, value, description}) {{page_number_roman}} {{total_pages_roman}} -->
<div class="page bg-warm" data-template="metric-grid" style="background-color: var(--warm); color: var(--ink);">
  <div class="running-header" style="background-color: var(--warm);">
    <div class="mono-meta" style="color: var(--ink-60); background-color: var(--warm);">{{running_header_left}}</div>
    <div class="mono-meta" style="color: var(--ink-60); background-color: var(--warm);">{{running_header_right}}</div>
  </div>

  <div style="padding: 1.2in 0.75in 0.9in 0.75in; background-color: var(--warm);">
    <div class="mono-label" style="color: var(--coral); background-color: var(--warm); margin-bottom: 24px;">{{eyebrow}}</div>
    <h2 class="display-md" style="color: var(--ink); background-color: var(--warm); margin: 0 0 48px 0;">
      {{title_lead}} <span class="italic-accent">{{italic_accent_phrase}}</span>
    </h2>

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, auto); column-gap: 16px; row-gap: 16px; background-color: var(--warm);">
      <!-- metrics block: 9 cards rendered by emitter -->
      {{metrics_html}}
    </div>
  </div>

  <div class="running-footer" style="background-color: var(--warm);">
    <div class="mono-tech" style="color: var(--ink-60); background-color: var(--warm);">OKOA CAPITAL</div>
    <div class="mono-tech" style="color: var(--ink-60); background-color: var(--warm);">{{page_number_roman}} / {{total_pages_roman}}</div>
  </div>
</div>
