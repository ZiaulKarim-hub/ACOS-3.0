<!-- template: product-detail | variables: {{eyebrow}} {{title_lead}} {{italic_accent_phrase}} {{items}} (list: {name, description}) -->
<div class="page bg-white" data-template="product-detail" style="background-color: var(--white); color: var(--ink);">
  <div class="running-header" style="background-color: var(--white);">
    <div class="mono-meta" style="color: var(--ink-60); background-color: var(--white);">{{running_header_left}}</div>
    <div class="mono-meta" style="color: var(--ink-60); background-color: var(--white);">{{running_header_right}}</div>
  </div>

  <div style="padding: 1.2in 0.75in 0.9in 0.75in; background-color: var(--white);">
    <div class="mono-label" style="color: var(--coral); background-color: var(--white); margin-bottom: 24px;">{{eyebrow}}</div>
    <h2 class="display-md" style="color: var(--ink); background-color: var(--white); margin: 0 0 48px 0;">
      {{title_lead}} <span class="italic-accent">{{italic_accent_phrase}}</span>
    </h2>

    <div style="display: grid; grid-template-columns: 2.4in 1fr; column-gap: 48px; background-color: var(--white);">
      <div style="background-color: var(--white);">
        {{names_html}}
      </div>
      <div style="background-color: var(--white);">
        {{descriptions_html}}
      </div>
    </div>
  </div>

  <div class="running-footer" style="background-color: var(--white);">
    <div class="mono-tech" style="color: var(--ink-60); background-color: var(--white);">OKOA CAPITAL</div>
    <div class="mono-tech" style="color: var(--ink-60); background-color: var(--white);">{{page_number_roman}} / {{total_pages_roman}}</div>
  </div>
</div>
