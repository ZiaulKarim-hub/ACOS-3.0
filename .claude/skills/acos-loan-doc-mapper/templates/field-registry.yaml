# Field Registry Template
# Phase 1 output — all fields extracted from the target form
# Generated by: loan-doc-mapper / Form Analyst agent

session_id: "[LDM-YYYY-MM-DD-HH-MM]"
target_form: "[filename]"
target_form_path: "[absolute path]"
total_pages_analyzed: 0
total_fields: 0
extraction_date: "[YYYY-MM-DD HH:MM:SS]"

# Field type reference:
#   text       — free-text input (names, addresses, descriptions)
#   currency   — dollar amounts ($1,234.56)
#   number     — numeric values (counts, rates, percentages)
#   date       — date fields (any format)
#   boolean    — checkboxes, yes/no fields
#   table      — repeating row structures (each row is a sub-record)
#   signature  — signature blocks (extraction: false)

fields:
  - field_id: "F-[SECTION]-[NNN]"
    name: "[Exact label as printed on form]"
    type: "[text | currency | number | date | boolean | table | signature]"
    section: "[Form section name]"
    page: 0
    format_hint: "[Expected format, e.g., MM/DD/YYYY, $#,###.##, or null]"
    context: "[Surrounding text on the form for disambiguation]"
    extraction: true  # false for signature fields
    required: true    # true if the form marks this field as required
    notes: null

