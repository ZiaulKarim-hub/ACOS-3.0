# Answer Map Template
# Phase 2 output — every field's answer with full provenance
# Generated by: loan-doc-mapper / Extractor agents

session_id: "[LDM-YYYY-MM-DD-HH-MM]"
field_registry_ref: "[path to validated field-registry.yaml]"
extraction_date: "[YYYY-MM-DD HH:MM:SS]"
total_fields: 0
populated_count: 0
not_found_count: 0
conflict_count: 0

answers:
  - field_id: "F-[SECTION]-[NNN]"
    field_name: "[Exact field name from registry]"
    status: "[FOUND | NOT_FOUND | UNRESOLVED_CONFLICT]"

    # Populated when status = FOUND
    value: "[Exact value as found in source document — character-by-character]"
    confidence: "[high | medium | low]"
    provenance:
      source_doc: "[filename]"
      source_doc_type: "[appraisal | tax_return | bank_statement | etc.]"
      page: 0
      section: "[Section or area on the page]"
      verbatim_quote: "[Exact surrounding text from source, enough to locate the value]"

    # Populated when status = NOT_FOUND
    not_found_record:
      documents_searched:
        - doc: "[filename]"
          pages_checked: "[all | specific pages]"
          result: "not present"
      absence_confirmed: true
      notes: "[Why this data is genuinely absent]"

    # Populated when status = UNRESOLVED_CONFLICT
    conflict_record:
      values_found:
        - value: "[value from source 1]"
          source_doc: "[filename]"
          page: 0
          verbatim_quote: "[quote]"
        - value: "[value from source 2]"
          source_doc: "[filename]"
          page: 0
          verbatim_quote: "[quote]"
      resolution_attempted: "[recency | authority | specificity | none]"
      resolution_rationale: "[Why the hierarchy could not resolve this]"
      recommended_value: null  # null if truly unresolvable
      requires_user_decision: true

    # Multi-source corroboration (when value found in multiple docs and they agree)
    corroboration: null
    # corroboration:
    #   additional_sources:
    #     - source_doc: "[filename]"
    #       page: 0
    #       verbatim_quote: "[quote]"
    #   note: "Value confirmed across [N] sources"
