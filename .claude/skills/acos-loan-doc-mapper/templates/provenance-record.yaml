# Provenance Record Template
# Full audit trail — field -> answer map -> source document chain
# Generated by: loan-doc-mapper / Phase 2

session_id: "[LDM-YYYY-MM-DD-HH-MM]"
generated_date: "[YYYY-MM-DD HH:MM:SS]"
target_form: "[filename]"
source_documents_used: 0

# Complete chain for every field mapping
chains:
  - field_id: "F-[SECTION]-[NNN]"
    field_name: "[Field name]"
    field_type: "[type]"
    target_form_location:
      page: 0
      section: "[Section name]"
      label: "[Exact label on form]"

    # The answer (what goes into the form)
    answer:
      value: "[Exact value or NOT_FOUND]"
      status: "[FOUND | NOT_FOUND | UNRESOLVED_CONFLICT]"
      confidence: "[high | medium | low]"

    # Source document evidence (the origin of the answer)
    source_evidence:
      primary:
        document: "[filename]"
        document_type: "[classification]"
        page: 0
        section: "[Section/area]"
        verbatim_quote: |
          [Exact surrounding text from source document]
      corroborating: []
      # corroborating:
      #   - document: "[filename]"
      #     page: 0
      #     verbatim_quote: "[quote]"

    # Extraction metadata
    extraction:
      extractor_agent: "[agent identifier]"
      extraction_date: "[YYYY-MM-DD HH:MM:SS]"
      qa_validated: true
      qa_iteration: 1
      conflict_resolved: false  # true if this field had a conflict that was resolved

# Summary statistics
summary:
  total_chains: 0
  verified_chains: 0
  not_found_chains: 0
  conflict_chains: 0
  average_confidence: "[high | medium | low]"
