created_date: "[YYYY-MM-DD HH:MM:SS]"
status: "[in_progress | complete | escalated | failed]"

# Inputs
target_form:
  path: "[absolute path]"
  filename: "[filename]"
  format: "[pdf | docx | xlsx | txt | other]"
  page_count: 0

loan_folder:
  path: "[absolute path]"
  total_files: 0
  by_format:
    pdf: 0
    docx: 0
    xlsx: 0
    txt: 0
    images: 0
    other: 0
  unsupported_files: []
  empty_files: []

# Evidence bundle location
