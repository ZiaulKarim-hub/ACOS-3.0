# QA Checklist — Phase 1: Field Registry Validation
# Binary YES/NO evaluation. ALL criteria must be YES for PASS.
# Reviewer: qa-reviewer agent (adversarial posture)
# Input: target form (original) + field-registry.yaml

session_id: "[LDM-YYYY-MM-DD-HH-MM]"
phase: 1
iteration: 1
reviewer: "qa-reviewer"
review_date: "[YYYY-MM-DD HH:MM:SS]"

verdict: "[PASS | REJECT]"

criteria:
  - id: "P1-C01"
    description: "Every page of target form analyzed"
    result: "[YES | NO]"
    evidence: "[Page count in registry matches actual form pages, or explain discrepancy]"

  - id: "P1-C02"
    description: "All text input fields captured"
    result: "[YES | NO]"
    evidence: "[Spot-check findings — list any missed text fields]"

  - id: "P1-C03"
    description: "All numerical fields captured (amounts, rates, counts)"
    result: "[YES | NO]"
    evidence: "[Spot-check findings — list any missed numerical fields]"

  - id: "P1-C04"
    description: "All date fields captured"
    result: "[YES | NO]"
    evidence: "[Spot-check findings — list any missed date fields]"

  - id: "P1-C05"
    description: "All checkbox/boolean fields captured"
    result: "[YES | NO]"
    evidence: "[Spot-check findings — list any missed checkboxes]"

  - id: "P1-C06"
    description: "All table/repeating-row structures captured"
    result: "[YES | NO]"
    evidence: "[Spot-check findings — list any missed tables, verify column definitions]"

  - id: "P1-C07"
    description: "Field names match exact labels on form"
    result: "[YES | NO]"
    evidence: "[Compare 30%+ of field names against form labels — list any mismatches]"

  - id: "P1-C08"
    description: "Field types correctly classified"
    result: "[YES | NO]"
    evidence: "[Verify type assignments — list any misclassified fields]"

  - id: "P1-C09"
    description: "Page numbers accurate"
    result: "[YES | NO]"
    evidence: "[Spot-check 30%+ of page assignments — list any errors]"

  - id: "P1-C10"
    description: "No duplicate fields"
    result: "[YES | NO]"
    evidence: "[Check for duplicate field_ids or duplicate names — list any found]"

  - id: "P1-C11"
    description: "Signature fields identified and marked extraction: false"
    result: "[YES | NO]"
    evidence: "[List all signature fields and verify they are not marked for data extraction]"

  - id: "P1-C12"
    description: "Section assignments match form structure"
    result: "[YES | NO]"
    evidence: "[Verify section names and field-to-section mappings — list any errors]"

# Summary (filled by reviewer)
pass_count: 0
fail_count: 0
failed_criteria: []
# failed_criteria:
#   - id: "P1-C02"
#     finding: "[Specific fields missed and their locations]"
#     remediation: "[What the Form Analyst should do to fix this]"

notes: null
