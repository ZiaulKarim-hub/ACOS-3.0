# ACOS Data Extractor — File Inventory
# Phase 0 output — complete inventory of all source files
# Generated by: Phase 0 coordinator during initialization

session_id: "{session-id}"
inventory_date: "YYYY-MM-DD HH:MM:SS"

source_directories:
  - path: ""
    file_count: 0
    breakdown:
      pdf: 0
      docx: 0
      xlsx: 0
      csv: 0
      txt: 0
      images: 0
      other: 0

total_files: 0
total_size_bytes: 0
large_files: []             # files > 50MB requiring special handling
# - file_path: ""
#   size_bytes: 0
#   handling: "sheet-by-sheet | page-range | skip"

files:
  - filename: ""
    file_path: ""           # full path
    source_dir: ""          # which source directory this came from
    file_type: ""           # pdf | docx | doc | xlsx | xls | csv | txt | md | other
    file_size_bytes: 0
    parent_folder: ""       # immediate parent folder name
    estimated_triage_tokens: 0    # from Step 0.7a token estimation
    estimated_extraction_tokens: 0
