# ACOS Data Extractor — Extraction Map
# Phase 2 output — every schema field's extracted value with full provenance
# Generated by: extractor agents (merged by coordinator)

session_id: "{session-id}"
extraction_date: "YYYY-MM-DD HH:MM:SS"
schema_ref: ""              # path to extraction-schema.yaml
total_fields: 0
found_count: 0
not_found_count: 0
conflict_count: 0

extractions:
  # ── Single-value field (multi: false) ──
  - field_id: ""
    field_name: ""
    field_type: ""
    multi: false
    status: ""              # FOUND | NOT_FOUND | UNRESOLVED_CONFLICT

    # Populated when status = FOUND
    value: ""               # Exact value as found — character-by-character
    confidence: 0            # percentage 0-100, rounded to nearest 5%
    provenance:
      source_file: ""        # filename
      source_path: ""       # full path
      page: 0               # page number (1-indexed) or sheet name for XLSX
      section: ""           # section or area on the page
      verbatim_quote: ""    # exact surrounding text from source
    extracted_by: ""        # agent identifier

    # Corroboration (when found in multiple sources with same value)
    corroboration: null
    # corroboration:
    #   additional_sources:
    #     - source_file: ""
    #       page: 0
    #       verbatim_quote: ""
    #   note: "Value confirmed across N sources"

    # Populated when status = NOT_FOUND
    not_found_record: null
    # not_found_record:
    #   documents_searched:
    #     - doc: ""
    #       pages_checked: "all"
    #       result: "not present"
    #   absence_confirmed: true
    #   notes: ""

    # Populated when status = UNRESOLVED_CONFLICT
    conflict_record: null
    # conflict_record:
    #   values_found:
    #     - value: ""
    #       source_file: ""
    #       page: 0
    #       verbatim_quote: ""
    #     - value: ""
    #       source_file: ""
    #       page: 0
    #       verbatim_quote: ""
    #   resolution_attempted: ""    # recency | authority | specificity | none
    #   resolution_rationale: ""
    #   recommended_value: null
    #   requires_user_decision: true

  # ── Multi-value field (multi: true) ──
  - field_id: ""
    field_name: ""
    field_type: ""
    multi: true
    status: ""              # FOUND | NOT_FOUND | PARTIAL

    # Populated when status = FOUND or PARTIAL
    entry_count: 0
    entries:
      - value: ""           # Exact value
        date: ""            # Associated date (if currency_with_date type)
        context: ""         # Additional context (e.g., "Q1 distribution")
        confidence: 0        # percentage 0-100, rounded to nearest 5%
        provenance:
          source_file: ""
          source_path: ""
          page: 0
          section: ""
          verbatim_quote: ""
        extracted_by: ""

    # For PARTIAL status: note what appears to be missing
    completeness_note: null
    # completeness_note: "Found 10 of expected 12 monthly payments. Missing: Nov 2025, Dec 2025"

    # Populated when status = NOT_FOUND
    not_found_record: null
