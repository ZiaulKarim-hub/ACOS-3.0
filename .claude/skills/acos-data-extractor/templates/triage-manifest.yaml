# ACOS Data Extractor — Triage Manifest
# Phase 1 output — relevance classification for every file
# Generated by: triage agents (merged by coordinator)

session_id: "{session-id}"
triage_date: "YYYY-MM-DD HH:MM:SS"
total_files: 0
agents_used: 0

# Summary statistics
summary:
  relevant: 0             # Files likely containing answers
  maybe: 0                # Ambiguous — will be deep-read
  skip: 0                 # Clearly irrelevant
  deep_extraction_target: 0  # relevant + maybe

# Field coverage — how many candidate files per schema field
field_coverage:
  # - field_id: "origination_date"
  #   candidate_count: 8
  #   candidates: ["file1.pdf", "file2.docx"]
  # - field_id: "payoff_amount"
  #   candidate_count: 0
  #   candidates: []        # zero candidates — QA should flag this

# Per-file triage results
files:
  - file_path: ""
    filename: ""
    source_dir: ""
    file_type: ""           # pdf | docx | xlsx | txt | other
    file_size_bytes: 0

    relevance: ""           # RELEVANT | MAYBE | SKIP
    suspected_fields: []
    # - field_id: "origination_date"
    #   confidence: "high"
    # - field_id: "property_address"
    #   confidence: "medium"

    content_summary: ""
    # 1-2 sentence summary of what the document appears to contain.
    # e.g., "Closing disclosure for residential mortgage, dated 2024,
    #         contains borrower info, loan terms, and settlement charges."

    triaged_by: ""          # agent identifier (triage-agent-01, etc.)

# Files marked SKIP (abbreviated — full paths only, for QA sampling)
skip_list:
  # - file_path: ""
  #   filename: ""
  #   skip_reason: ""       # brief reason (e.g., "marketing brochure", "unrelated correspondence")
