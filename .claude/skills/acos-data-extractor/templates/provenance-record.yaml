# ACOS Data Extractor — Provenance Record
# Full audit trail — field -> extracted value -> source document chain
# Generated by: Phase 2 coordinator after extraction merge

session_id: "{session-id}"
generated_date: "YYYY-MM-DD HH:MM:SS"
total_source_documents: 0
total_citations: 0

# Complete chain for every extraction
chains:
  # ── Single-value chain ──
  - field_id: ""
    field_name: ""
    field_type: ""
    status: ""              # FOUND | NOT_FOUND | UNRESOLVED_CONFLICT

    # The extracted value
    extraction:
      value: ""             # or "NOT_FOUND"
      confidence: 0         # percentage 0-100, rounded to nearest 5%

    # Source document evidence
    source_evidence:
      primary:
        source_file: ""     # filename
        source_path: ""     # full path
        source_type: ""     # inferred type (e.g., "closing disclosure", "tax return")
        page: 0
        section: ""
        verbatim_quote: |
          [Exact surrounding text from source document]
      corroborating: []
      # - source_file: ""
      #   page: 0
      #   verbatim_quote: ""

    # Extraction metadata
    metadata:
      extractor_agent: ""
      extraction_date: ""
      qa_validated: false
      qa_iteration: 0
      conflict_resolved: false

  # ── Multi-value chain ──
  - field_id: ""
    field_name: ""
    field_type: ""
    multi: true
    status: ""
    entry_count: 0

    entries:
      - value: ""
        date: ""
        source_evidence:
          source_file: ""
          source_path: ""
          page: 0
          section: ""
          verbatim_quote: ""
        metadata:
          extractor_agent: ""
          qa_validated: false

# Summary statistics
summary:
  total_chains: 0
  verified_chains: 0
  not_found_chains: 0
  conflict_chains: 0
  multi_value_entries: 0
  average_confidence: 0     # percentage 0-100
  unique_source_documents: 0
