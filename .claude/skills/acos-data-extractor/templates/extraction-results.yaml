# ACOS Data Extractor — Extraction Results
# Phase 3 output — machine-readable final results with provenance
# Generated by: Phase 3 coordinator from extraction-map.yaml

session_id: "{session-id}"
extraction_date: "YYYY-MM-DD"
schema_version: "1.0"
prism_enabled: false        # true if PRISM DD framework was active

results:
  # ── Single-value field (FOUND) ──
  - field_id: ""
    field_name: ""
    status: "FOUND"
    value: ""               # Exact value as found — character-by-character
    confidence: 0           # percentage 0-100, rounded to nearest 5%
    source_file: ""         # filename of primary source
    source_path: ""         # full path to primary source
    page: 0                 # page number (1-indexed) or sheet name for XLSX
    section: ""             # section or area on the page where the value was found
    quote: ""               # verbatim quote from source document
    ccii_source: ""         # only when prism_enabled: true
    authority_level: ""     # only when prism_enabled: true

  # ── Multi-value field (FOUND) ──
  - field_id: ""
    field_name: ""
    status: "FOUND"
    multi: true
    entries:
      - value: ""
        date: ""            # Associated date (if currency_with_date type)
        confidence: 0       # percentage 0-100, rounded to nearest 5%
        source_file: ""
        source_path: ""
        page: 0             # page number (1-indexed) or sheet name for XLSX
        section: ""         # section or area on the page where the value was found
        quote: ""           # verbatim quote from source document
        ccii_source: ""     # only when prism_enabled: true

  # ── NOT_FOUND field ──
  - field_id: ""
    field_name: ""
    status: "NOT_FOUND"
    source_file: null
    documents_searched: 0
    notes: ""
    expected_ccii: ""       # only when prism_enabled — where it SHOULD be
    dd_gap: ""              # only when prism_enabled — what's missing from corpus

summary:
  total_fields: 0
  extracted: 0
  not_found: 0
  conflicts_resolved: 0
  unresolved_conflicts: 0
  high_confidence: 0        # fields with confidence >= 90%
  medium_confidence: 0      # fields with confidence 60-89%
  low_confidence: 0         # fields with confidence < 60%
  coverage: ""              # e.g., "83%"

dd_gaps: []                 # only when prism_enabled
# - "Missing document description"
