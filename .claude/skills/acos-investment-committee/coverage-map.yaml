# ACOS Investment Committee — 16-risk coverage map
# SLICE-A1 data artifact. Maps each of the 16 risk categories to its
# default owning seat (see roster.yaml for seat definitions). Data-only;
# no logic. A separate check_coverage.py (not part of this slice) is
# expected to assert zero unowned categories against this file.

version: 1

risk_categories:
  - id: 1
    category: "Credit/Borrower"
    owner: 1
    cross_check: [3]
    note: "Seat 1 repayment-capacity sub-pass"

  - id: 2
    category: "Collateral/Valuation"
    owner: 1
    cross_check: [3]
    note: "Seat 1 collateral-value sub-pass"

  - id: 3
    category: "Market/Macro"
    owner: 1
    cross_check: []
    note: "Seat 1 collateral-value sub-pass, sub-check"
    triggered: 13

  - id: 4
    category: "Structural/Legal"
    owner: 4
    cross_check: []

  - id: 5
    category: "Title/Survey"
    owner: 4
    cross_check: []
    note: "Seat 4 sub-pass"

  - id: 6
    category: "Environmental"
    owner: 4
    cross_check: []
    note: "Seat 4 legal-materiality sub-lens ONLY (CERCLA/Phase I currency); full condition review promotable to optional #15"
    triggered: 15

  - id: 7
    category: "Construction/Completion"
    owner: 1
    cross_check: []
    note: "Seat 1 collateral-value sub-pass, baseline"
    triggered: 11

  - id: 8
    category: "Cash-Flow/DSCR"
    owner: 1
    cross_check: [3, 5]
    note: "Seat 1 repayment-capacity sub-pass; cross-checked by Seat 3 (NOI) and Seat 5 (DSCR transmission)"

  - id: 9
    category: "Interest-Rate/Refi/Exit"
    owner: 2
    cross_check: []
