  - id: 12
    category: "Tax"
    owner: 4
    cross_check: []
    note: "Seat 4 fold-in"
    triggered: 12

  - id: 13
    category: "Insurance"
    owner: 5
    cross_check: []

  - id: 14
    category: "Fraud/Misrepresentation"
    owner: 6
    cross_check: [3]

  - id: 15
    category: "Regulatory/Compliance"
    owner: 4
    cross_check: []
    note: "Seat 4 state sub-pass"
    triggered: 14

  - id: 16
    category: "ESG/Physical-Climate"
    owner: 5
    cross_check: []
