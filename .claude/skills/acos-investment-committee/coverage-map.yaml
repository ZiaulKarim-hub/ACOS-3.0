# Seats 3 (Accounting), 8 (Strategy), and 9 (Deal Advocate) do NOT own any
# of the 16 risk categories above. This is intentional, not a gap — see
# roster.yaml (owns: cross-cutting / defense, owned_risk_categories: []).
exempt_seats:
  - n: 3
    name: "Accounting"
    reason: >
      Cross-cutting — cross-checks categories 1, 2, 8, and 14, and owns
      the shared normalized-NOI claim consumed by Seats 1 and 2 (a
      cross-cutting artifact, not a single risk category).
  - n: 8
    name: "Strategy"
    reason: >
      Cross-cutting — contributes a falsifiable strategic-fit/off-mandate
      objection lens outside the 16-category deal-risk taxonomy.
  - n: 9
    name: "Deal Advocate"
    reason: >
      Structurally separate defense/steelman role, not a risk-owning
      scrutiny seat, by design (owned_risk_categories: [] in roster.yaml).
