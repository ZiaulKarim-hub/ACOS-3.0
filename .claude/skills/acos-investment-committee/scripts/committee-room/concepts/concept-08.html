<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1480, initial-scale=1">
<title>Investment Committee — Concept 08 v2 / Swiss Minimalism</title>
<style>
  :root{
    --red:#e2001a;
    --ink:#111111;
    --hair:rgba(17,17,17,.16);
    --hair-soft:rgba(17,17,17,.08);
    --grey:#8a8a8a;
    --bg:#ffffff;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-width:1480px;
  }
  .wrap{ max-width:1480px; margin:0 auto; padding:44px 40px 64px; }

  /* ---------- top kicker ---------- */
  .live{ display:flex; align-items:center; gap:9px; margin-bottom:26px; }
  .live .dot{ width:6px; height:6px; border-radius:50%; background:var(--red); animation:pulse 1.7s ease-in-out infinite; }
  .live span{ font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--grey); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.22; } }

  /* ---------- header ---------- */
  .header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:2px solid var(--ink); padding-bottom:20px; margin-bottom:30px;
  }
  .header .deal-title{ font-size:23px; font-weight:700; letter-spacing:-.01em; }
  .header .deal-meta{ font-size:12.5px; color:#555; margin-top:8px; letter-spacing:.01em; }
  .leaning{ text-align:right; flex-shrink:0; padding-left:40px; }
  .leaning .lbl{ font-size:10px; letter-spacing:.18em; color:var(--grey); text-transform:uppercase; display:block; margin-bottom:6px; }
  .leaning .val{
    font-size:15px; font-weight:700; color:var(--red);
    border:1.5px solid var(--red); padding:5px 14px; letter-spacing:.05em; display:inline-block;
  }

  /* ---------- vote bar ---------- */
  .votebar{ margin-bottom:46px; }
  .votebar-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px; }
  .votebar-kicker{ font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey); }
  .votebar-counts{ font-size:12px; letter-spacing:.02em; }
  .votebar-counts .c-against{ color:var(--red); font-weight:700; }
  .votebar-counts .c-for{ color:var(--ink); font-weight:700; }
  .votebar-counts .sep{ color:#ccc; margin:0 6px; }
  .votebar-track{ display:flex; width:100%; height:10px; border:1px solid var(--ink); overflow:hidden; }
  .votebar-seg{ height:100%; transition:width .6s ease; }
  .votebar-seg.against{ background:var(--red); }
  .votebar-seg.for{ background:#fff; border-right:1px solid var(--ink); }
  .votebar-ticks{ display:flex; gap:5px; margin-top:8px; }
  .tick{ flex:1; height:5px; }
  .tick.against{ background:var(--red); }
  .tick.for{ background:#fff; border:1px solid var(--ink); }
  .votebar-caption{ margin-top:9px; font-size:11px; color:var(--grey); letter-spacing:.01em; }

  /* ---------- committee row (arc + podium) ---------- */
  .committee-row{ display:flex; justify-content:center; align-items:stretch; gap:16px; height:560px; }

  .arc-shell{ width:1168px; flex-shrink:0; }
  .arc{ position:relative; width:1168px; height:560px; }

  .divider{ width:1px; background:var(--hair); }

  .arc .seat{ position:absolute; left:0; top:0; width:0; height:0; }

  /* seat number tag */
  .arc .tag{ position:absolute; left:0; transform:translateX(-50%); font-size:9px; color:#aaa; letter-spacing:.08em; font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* face */
  .face-wrap{ position:absolute; left:0; transform:translate(-50%,-50%); width:60px; height:60px; }
  .face-wrap.static{ position:relative; left:auto; top:auto; transform:none; margin:0 auto; }
  .face{
    position:absolute; inset:0; border-radius:50%;
    background:#fff; border:1.5px solid var(--ink);
    transition:border-color .3s ease, border-width .3s ease;
  }
  .seat.active .face{ border-color:var(--red); border-width:2px; }
  .eye{ position:absolute; width:5px; height:5px; border-radius:50%; background:var(--ink); top:23px; animation:blink 4.2s ease-in-out infinite; }
  .eye.l{ left:18px; } .eye.r{ left:37px; }
  @keyframes blink{ 0%,90%,100%{ transform:scaleY(1); } 95%{ transform:scaleY(.12); } }
  .mouth{ position:absolute; left:50%; top:37px; width:16px; height:2px; background:var(--ink); border-radius:1px; transform:translateX(-50%); }
  .face.talking .mouth{ animation:talk .48s ease-in-out infinite; }
  @keyframes talk{ 0%,100%{ height:2px; border-radius:1px; } 50%{ height:8px; border-radius:4px; } }

  .emo{
    position:absolute; top:-5px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:#fff; border:1px solid var(--hair); display:flex; align-items:center; justify-content:center;
    font-size:11px; line-height:1;
  }
  .emo.raise{ animation:raise 1.15s ease-in-out infinite; }
  @keyframes raise{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-5px) rotate(-10deg); } }

  /* label */
  .arc .label{ position:absolute; left:0; transform:translateX(-50%); text-align:center; white-space:nowrap; }
  .label.static{ position:static; text-align:center; margin-top:2px; }
  .label-name{
    font-size:11px; font-weight:700; letter-spacing:.02em; color:#333;
    border-bottom:2px solid transparent; padding-bottom:2px; display:inline-block;
  }
  .seat.active .label-name{ border-bottom-color:var(--red); color:#000; }
  .label-stance{
    display:block; font-size:8.5px; letter-spacing:.14em; color:var(--grey);
    text-transform:uppercase; margin-top:3px;
  }
  .label-stance.nonvote{ color:var(--red); }

  /* connector stem (arc only) */
  .stem{ position:absolute; left:0; width:1px; background:var(--hair); transform:translateX(-50%); }

  /* chip / message card */
  .arc .chip-anchor{ position:absolute; left:0; transform:translateX(-50%); z-index:2; }
  .chip-anchor.static{ position:static; transform:none; display:flex; justify-content:center; margin-top:8px; }
  .seat.active .chip-anchor{ z-index:60; }

  .card{
    width:100px; background:#fff; border:1px solid var(--hair);
    padding:7px 9px; overflow:hidden;
    transition:width .38s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .seat.active .card{ width:160px; border-color:var(--red); box-shadow:0 3px 14px rgba(0,0,0,.08); }

  .card-head{ display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot.against{ background:var(--red); }
  .dot.for{ background:#fff; border:1.4px solid var(--ink); }
  .dot.advocate{ background:#fff; border:1.4px dashed var(--ink); }
  .card-name{ font-size:10px; font-weight:700; letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; min-width:0; }

  .rbadge{
    position:relative; display:inline-flex; align-items:center; justify-content:center;
    min-width:16px; height:16px; padding:0 4px; border-radius:8px;
    border:1px solid var(--ink); font-size:9px; font-weight:700; font-variant-numeric:tabular-nums;
    margin-left:auto; flex-shrink:0; background:#fff;
  }
  .rbadge::before{
    content:''; position:absolute; inset:-3px; border-radius:50%; border:1px solid var(--red);
    opacity:.55; animation:ring 2.2s ease-out infinite;
  }
  @keyframes ring{ 0%{ transform:scale(.65); opacity:.6; } 100%{ transform:scale(1.55); opacity:0; } }

  .card-text{
    display:block; font-size:0; line-height:1.5; color:#222;
    max-height:0; opacity:0; margin-top:0; overflow:hidden;
    transition:max-height .32s ease, opacity .28s ease, margin-top .32s ease, font-size .01s;
  }
  .seat.active .card-text{ font-size:11.5px; max-height:180px; opacity:1; margin-top:7px; }
  .cursor{ display:inline-block; width:1px; height:1em; background:var(--ink); vertical-align:-2px; margin-left:1px; animation:cblink .8s steps(1) infinite; }
  @keyframes cblink{ 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }

  /* ---------- defense podium ---------- */
  .podium-shell{ width:199px; flex-shrink:0; display:flex; }
  .podium{
    width:199px; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1px solid var(--hair); padding:22px 14px; gap:2px;
  }
  .podium::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--red); }
  .podium-kicker{ font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey); margin-bottom:14px; }
  .lectern{ display:flex; flex-direction:column; align-items:center; margin-bottom:12px; }
  .lectern-top{ width:46px; height:3px; background:var(--ink); }
  .lectern-stand{ width:3px; height:16px; background:var(--ink); }
  .seat.advocate{ display:flex; flex-direction:column; align-items:center; width:100%; }
  .seat.advocate .card{ margin-top:2px; }
  .podium-note{ margin-top:12px; font-size:9.5px; color:var(--grey); text-align:center; line-height:1.5; }

  /* ---------- chair bar ---------- */
  .chair-wrap{ display:flex; justify-content:center; margin-top:26px; }
  .chair{
    width:640px; display:flex; align-items:center; gap:16px;
    border-bottom:1.5px solid var(--ink); padding-bottom:11px;
  }
  .chair input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:inherit; font-size:14px; color:var(--ink); padding:8px 2px;
  }
  .chair input::placeholder{ color:#9a9a9a; }
  .chair button{
    border:1px solid var(--ink); background:#fff; color:var(--ink);
    font-family:inherit; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    padding:9px 20px; cursor:pointer; transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .chair button:hover{ background:var(--red); border-color:var(--red); color:#fff; }

  .foot-rule{ margin-top:40px; border-top:1px solid var(--hair-soft); padding-top:14px; display:flex; justify-content:space-between; }
  .foot-rule span{ font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:#bbb; }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="live"><div class="dot"></div><span>Investment Committee — Live Session</span></div>

  <div class="header">
    <div>
      <div class="deal-title" id="dealTitle"></div>
      <div class="deal-meta">8 Scrutiny Seats + 1 Deal Advocate (non-voting) · Committee in session</div>
    </div>
    <div class="leaning">
      <span class="lbl">Leaning</span>
      <span class="val" id="leaningVal"></span>
    </div>
  </div>

  <div class="votebar">
    <div class="votebar-top">
      <span class="votebar-kicker">Committee Vote — 8 Voting Seats</span>
      <span class="votebar-counts" id="voteCounts"></span>
    </div>
    <div class="votebar-track">
      <div class="votebar-seg against" id="segAgainst"></div>
      <div class="votebar-seg for" id="segFor"></div>
    </div>
    <div class="votebar-ticks" id="voteTicks"></div>
    <div class="votebar-caption">Deal Advocate presents the defense at a separate podium and is not counted in this tally.</div>
  </div>

  <div class="committee-row">
    <div class="arc-shell"><div class="arc" id="arc"></div></div>
    <div class="divider"></div>
    <div class="podium-shell"><div class="podium" id="podium"></div></div>
  </div>

  <div class="chair-wrap">
    <form class="chair" id="chairForm">
      <input id="chairInput" type="text" placeholder="Message the whole committee…" autocomplete="off">
      <button type="submit" id="chairSend">Send</button>
    </form>
  </div>

  <div class="foot-rule"><span>IC / Concept 08 v2</span><span>Swiss — International Minimalism</span></div>
</div>

<script>
  const COMMITTEE = {
   deal:{name:"1420 Alder Street Bridge Refinance",amount:"$1.15M",ltv:"65% LTV",leaning:"DECLINE"},
   vote:{for:2,against:6},
   scrutiny:[
    {n:1,name:"Credit & Valuation",short:"Credit",vote:"against",emotion:"angry",emoji:"😠",research:2,opinion:"The 65% LTV is unsupported — it's really 79% against the purchase price."},
    {n:2,name:"Finance",short:"Finance",vote:"against",emotion:"angry",emoji:"😠",research:1,opinion:"Negative carry with no defended exit — this loan cannot refinance itself."},
    {n:3,name:"Accounting",short:"Accounting",vote:"against",emotion:"skeptical",emoji:"🤨",research:3,opinion:"In-place NOI exceeds gross rent. The number is mathematically impossible."},
    {n:4,name:"Legal & Structural",short:"Legal",vote:"against",emotion:"thinking",emoji:"🤔",research:2,opinion:"First-lien position is asserted but entirely unverified — no title, no UCC."},
    {n:5,name:"Insurance & Climate",short:"Insurance",vote:"for",emotion:"worried",emoji:"😟",research:1,opinion:"Sub-1.0x DSCR is thin, but insurable if we condition on a binder."},
    {n:6,name:"Sponsor & Fraud",short:"Fraud",vote:"against",emotion:"angry",emoji:"😠",research:2,opinion:"The track record is wholly self-reported. Assume fabricated until proven."},
    {n:7,name:"Portfolio & Concentration",short:"Portfolio",vote:"for",emotion:"thinking",emoji:"🤔",research:1,opinion:"No fund tape provided — but in isolation the concentration is tolerable."},
    {n:8,name:"Strategy",short:"Strategy",vote:"against",emotion:"disapprove",emoji:"😕",research:1,opinion:"A sub-1.0x story credit breaches our secured-lender thesis."}
   ],
   advocate:{n:9,name:"Deal Advocate",short:"Advocate",emotion:"handraise",emoji:"🙋",research:1,opinion:"Condition it on an appraisal and audited T-12 and it may be salvageable."}
  };

  const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- header + vote bar ---------- */
  document.getElementById('dealTitle').textContent =
    COMMITTEE.deal.name + ' · ' + COMMITTEE.deal.amount + ' · ' + COMMITTEE.deal.ltv;
  document.getElementById('leaningVal').textContent = COMMITTEE.deal.leaning;

  const voteTotal = COMMITTEE.vote.for + COMMITTEE.vote.against;
  document.getElementById('segAgainst').style.width = (COMMITTEE.vote.against / voteTotal * 100) + '%';
  document.getElementById('segFor').style.width = (COMMITTEE.vote.for / voteTotal * 100) + '%';
  document.getElementById('voteCounts').innerHTML =
    '<b class="c-against">' + COMMITTEE.vote.against + ' AGAINST</b>' +
    '<span class="sep">·</span>' +
    '<b class="c-for">' + COMMITTEE.vote.for + ' FOR</b>';
  document.getElementById('voteTicks').innerHTML = COMMITTEE.scrutiny.map(function(d){
    return '<span class="tick ' + d.vote + '" title="' + d.short + ' — ' + d.vote.toUpperCase() + '"></span>';
  }).join('');

  /* ---------- half-moon arc geometry (trig) ---------- */
  const ARC_W = 1168, ARC_H = 560;
  const X_MIN = 90, X_MAX = 1078;
  const CENTER_X = 584, RX = 520, RY = 190, FACE_Y_BASE = 300;
  const CHIP_ROW_Y = 390;

  const arcEl = document.getElementById('arc');
  let arcHTML = '';

  COMMITTEE.scrutiny.forEach(function(d, i){
    const x = X_MIN + (X_MAX - X_MIN) * (i / (COMMITTEE.scrutiny.length - 1));
    const u = Math.max(-1, Math.min(1, (x - CENTER_X) / RX));
    const theta = Math.acos(u);                 /* half-moon dome via trig */
    const faceY = FACE_Y_BASE - RY * Math.sin(theta);
    const labelY = faceY + 40;
    const stemTop = labelY + 30;
    const stemH = Math.max(0, CHIP_ROW_Y - stemTop);
    const blinkDelay = ((d.n * 0.47) % 3.6).toFixed(2);
    const idx = String(d.n).padStart(2, '0');

    arcHTML +=
      '<div class="seat" data-seat="' + d.n + '" style="left:' + x.toFixed(1) + 'px;">' +
        '<div class="tag" style="top:' + (faceY - 48).toFixed(1) + 'px;">' + idx + '</div>' +
        '<div class="face-wrap" style="top:' + faceY.toFixed(1) + 'px;">' +
          '<div class="face">' +
            '<div class="eye l" style="animation-delay:' + blinkDelay + 's"></div>' +
            '<div class="eye r" style="animation-delay:' + blinkDelay + 's"></div>' +
            '<div class="mouth"></div>' +
          '</div>' +
          '<div class="emo">' + d.emoji + '</div>' +
        '</div>' +
        '<div class="label" style="top:' + labelY.toFixed(1) + 'px;">' +
          '<span class="label-name" title="' + d.name + '">' + d.short + '</span>' +
          '<span class="label-stance">' + d.vote.toUpperCase() + '</span>' +
        '</div>' +
        '<div class="stem" style="top:' + stemTop.toFixed(1) + 'px; height:' + stemH.toFixed(1) + 'px;"></div>' +
        '<div class="chip-anchor" style="top:' + CHIP_ROW_Y + 'px;">' +
          '<div class="card">' +
            '<div class="card-head">' +
              '<span class="dot ' + d.vote + '"></span>' +
              '<span class="card-name">' + d.short + '</span>' +
              '<span class="rbadge" title="Research threads open">' + d.research + '</span>' +
            '</div>' +
            '<div class="card-text"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
  });

  arcEl.innerHTML = arcHTML;

  /* ---------- defense podium (distinct position, outside the 8-seat arc) ---------- */
  const a = COMMITTEE.advocate;
  document.getElementById('podium').innerHTML =
    '<div class="podium-kicker">Defense Podium</div>' +
    '<div class="seat advocate" data-seat="' + a.n + '">' +
      '<div class="lectern"><div class="lectern-top"></div><div class="lectern-stand"></div></div>' +
      '<div class="face-wrap static">' +
        '<div class="face">' +
          '<div class="eye l"></div><div class="eye r"></div><div class="mouth"></div>' +
        '</div>' +
        '<div class="emo raise">' + a.emoji + '</div>' +
      '</div>' +
      '<div class="label static">' +
        '<span class="label-name" title="' + a.name + '">' + a.short + '</span>' +
        '<span class="label-stance nonvote">NON-VOTING</span>' +
      '</div>' +
      '<div class="chip-anchor static">' +
        '<div class="card">' +
          '<div class="card-head">' +
            '<span class="dot advocate"></span>' +
            '<span class="card-name">' + a.short + '</span>' +
            '<span class="rbadge" title="Research threads open">' + a.research + '</span>' +
          '</div>' +
          '<div class="card-text"></div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="podium-note">Argues the case for the deal &mdash; excluded from the vote tally above.</div>';

  /* ---------- unified speaking cycle (8 arc seats + advocate) ---------- */
  const seatEls = Array.prototype.slice.call(document.querySelectorAll('.seat'));
  const SEATS = seatEls.map(function(el){
    const n = +el.getAttribute('data-seat');
    const data = (n === a.n) ? a : COMMITTEE.scrutiny.filter(function(s){ return s.n === n; })[0];
    return { el: el, face: el.querySelector('.face'), textEl: el.querySelector('.card-text'), data: data };
  });

  let cycleTimer = null, typingTimer = null;

  function typeOut(el, text, done){
    el.textContent = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);
    const words = text.split(' ');
    let i = 0;
    function step(){
      if (i < words.length){
        el.insertBefore(document.createTextNode((i > 0 ? ' ' : '') + words[i]), cursor);
        i++;
        if (REDUCED){ step(); return; }
        typingTimer = setTimeout(step, 62 + Math.random() * 55);
      } else {
        cursor.remove();
        if (done) done();
      }
    }
    step();
  }

  function activateSeat(idx){
    clearTimeout(cycleTimer);
    clearTimeout(typingTimer);
    SEATS.forEach(function(s, i){
      const isActive = (i === idx);
      s.el.classList.toggle('active', isActive);
      s.face.classList.toggle('talking', isActive);
    });
    typeOut(SEATS[idx].textEl, SEATS[idx].data.opinion, function(){
      const hold = REDUCED ? 900 : 2200;
      cycleTimer = setTimeout(function(){ activateSeat((idx + 1) % SEATS.length); }, hold);
    });
  }

  activateSeat(0);

  /* ---------- chair input ---------- */
  const chairForm = document.getElementById('chairForm');
  const chairInput = document.getElementById('chairInput');
  chairForm.addEventListener('submit', function(e){
    e.preventDefault();
    if (!chairInput.value.trim()) return;
    chairInput.value = '';
    const original = 'Message the whole committee…';
    chairInput.placeholder = 'Message sent.';
    setTimeout(function(){ chairInput.placeholder = original; }, 1500);
  });
</script>
</body>
</html>
