<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investment Committee — Live Room · Concept 09</title>
<style>
  :root{
    --bone:#F3EEE4;
    --cream:#FBF7EF;
    --cream-2:#F6F0E4;
    --navy:#1E2A38;
    --navy-2:#141C26;
    --ink:#2B2620;
    --muted:#7A7263;
    --sage:#8FA382;
    --sage-dark:#5C7250;
    --coral:#E8735C;
    --coral-dark:#C1543F;
    --gold:#CDB77E;
    --line:rgba(30,42,56,0.10);
    --serif: Georgia, 'Palatino Linotype', Palatino, 'Book Antiqua', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(ellipse at 50% -10%, #FBF6EA 0%, var(--bone) 55%);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }

  .page{
    display:flex;
    justify-content:center;
    padding:36px 20px 60px;
  }

  .stage{
    width:clamp(1180px, 92vw, 1520px);
    background:var(--cream);
    border-radius:28px;
    box-shadow:0 26px 70px rgba(30,42,56,0.14), 0 2px 0 rgba(255,255,255,0.6) inset;
    padding:34px 46px 44px;
    position:relative;
  }

  .corner-tag{
    position:absolute;
    top:16px; right:22px;
    font-size:9.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    opacity:.55;
    font-weight:600;
  }

  /* ---------- HEADER ---------- */
  .header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
  }

  .eyebrow-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--sage-dark);
    font-weight:700;
  }

  .live-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:10px;
    letter-spacing:.1em;
    font-weight:700;
    color:var(--coral-dark);
    background:rgba(232,115,92,0.10);
    border:1px solid rgba(232,115,92,0.25);
    border-radius:999px;
    padding:3px 9px 3px 7px;
  }

  .live-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--coral);
    animation: livePulse 1.6s ease-in-out infinite;
  }

  @keyframes livePulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,115,92,.55); }
    50%{ box-shadow:0 0 0 4px rgba(232,115,92,0); }
  }

  .deal-name{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    color:var(--navy);
    margin:0 0 6px;
    letter-spacing:.005em;
  }

  .deal-meta{
    font-size:14px;
    color:var(--muted);
    font-weight:500;
  }
  .deal-meta .sep{ margin:0 8px; opacity:.5; }

  .leaning-badge{
    flex-shrink:0;
    text-align:right;
    padding:12px 18px;
    border-radius:14px;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    white-space:nowrap;
  }
  .leaning-badge strong{
    display:block;
    font-size:18px;
    font-family:var(--serif);
    text-transform:none;
    letter-spacing:0;
    margin-top:2px;
  }
  .leaning-decline{
    background:linear-gradient(160deg, rgba(232,115,92,0.14), rgba(232,115,92,0.06));
    color:var(--coral-dark);
    border:1px solid rgba(232,115,92,0.28);
  }
  .leaning-approve{
    background:linear-gradient(160deg, rgba(143,163,130,0.16), rgba(143,163,130,0.06));
    color:var(--sage-dark);
    border:1px solid rgba(143,163,130,0.3);
  }

  /* ---------- VOTE BAR ---------- */
  .vote-section{ margin-top:22px; }

  .vote-toprow{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }

  .vote-title{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--navy);
    font-weight:700;
    opacity:.75;
  }

  .research-total{
    font-size:12px;
    color:var(--sage-dark);
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .research-total .rt-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:rgba(143,163,130,0.13);
    border:1px solid rgba(143,163,130,0.28);
    border-radius:999px;
    padding:3px 10px;
    animation: badgePulse 2.6s ease-in-out infinite;
  }

  @keyframes badgePulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(143,163,130,.30); }
    50%{ box-shadow:0 0 0 5px rgba(143,163,130,0); }
  }

  .vote-bar{
    position:relative;
    display:flex;
    height:32px;
    border-radius:999px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:inset 0 1px 3px rgba(30,42,56,0.08);
    background:var(--cream-2);
  }

  .vote-seg{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:700;
    color:#fff;
    letter-spacing:.03em;
    position:relative;
    transition:width 1.1s cubic-bezier(.4,0,.2,1);
  }
  .vote-for{ background:linear-gradient(90deg, var(--sage-dark), var(--sage)); }
  .vote-against{ background:linear-gradient(90deg, var(--coral), var(--coral-dark)); }
  .vote-seg span{ text-shadow:0 1px 2px rgba(0,0,0,.18); white-space:nowrap; }
  .vote-divider{
    position:absolute; top:0; bottom:0; width:2px;
    background:rgba(255,255,255,0.55);
    z-index:2;
  }

  /* ---------- BOARDROOM ---------- */
  .boardroom{
    position:relative;
    height:260px;
    margin-top:30px;
  }

  .table-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    overflow:visible;
  }

  .arc{
    position:relative;
    width:100%;
    height:100%;
  }

  .seat{
    position:absolute;
    width:112px;
    transform:translate(-50%, -50%);
    z-index:3;
  }

  .seat-chip{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:14px;
    padding:6px 7px;
    box-shadow:0 2px 7px rgba(30,42,56,0.08);
    position:relative;
    transition:transform .4s cubic-bezier(.34,1.4,.64,1), box-shadow .4s ease, border-color .4s ease;
  }

  .seat.active .seat-chip{
    transform:scale(1.045);
    box-shadow:0 8px 22px rgba(232,115,92,0.30), 0 0 0 2px var(--coral);
    border-color:transparent;
  }

  .avatar-wrap{
    position:relative;
    width:30px;
    height:30px;
    flex-shrink:0;
  }
  .avatar-wrap svg{ width:100%; height:100%; display:block; }

  .emo-badge{
    position:absolute;
    top:-5px; right:-6px;
    width:16px; height:16px;
    border-radius:50%;
    background:var(--cream);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9.5px;
    line-height:1;
    box-shadow:0 1px 3px rgba(30,42,56,0.15);
  }

  .seat-text{
    min-width:0;
    flex:1;
  }
  .seat-name{
    font-size:9.5px;
    font-weight:700;
    color:var(--navy);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    letter-spacing:-0.01em;
  }
  .seat-subrow{
    display:flex;
    align-items:center;
    gap:4px;
    margin-top:2px;
  }
  .vote-dot{
    width:6px; height:6px;
    border-radius:50%;
    flex-shrink:0;
  }
  .vote-dot.for{ background:var(--sage); }
  .vote-dot.against{ background:var(--coral); }

  .research-badge{
    display:inline-flex;
    align-items:center;
    gap:2px;
    font-size:8px;
    font-weight:700;
    color:var(--sage-dark);
    background:rgba(143,163,130,0.14);
    border-radius:999px;
    padding:1px 5px;
    animation: badgePulse 2.8s ease-in-out infinite;
    white-space:nowrap;
  }

  .speaking-tag{
    display:none;
    align-items:center;
    gap:3px;
    font-size:8px;
    font-weight:700;
    letter-spacing:.05em;
    color:var(--coral-dark);
  }
  .seat.active .speaking-tag{ display:inline-flex; }
  .seat.active .research-badge{ display:none; }

  .bar{
    display:inline-block;
    width:2px;
    height:6px;
    background:var(--coral);
    border-radius:1px;
    margin-right:1px;
    animation: soundBar .6s ease-in-out infinite;
  }
  .bar:nth-child(2){ animation-delay:.15s; }
  .bar:nth-child(3){ animation-delay:.3s; }
  @keyframes soundBar{
    0%,100%{ transform:scaleY(0.5); }
    50%{ transform:scaleY(1.5); }
  }

  /* face animation */
  .eyes{ transform-box:fill-box; transform-origin:center; animation: blink 5s ease-in-out infinite; }
  .mouth{ transform-box:fill-box; transform-origin:center; }
  .seat.active .mouth{ animation: talk .28s ease-in-out infinite; }

  @keyframes blink{
    0%, 92%, 100%{ transform:scaleY(1); }
    96%{ transform:scaleY(0.08); }
  }
  @keyframes talk{
    0%,100%{ transform:scaleY(0.55); }
    50%{ transform:scaleY(1.7); }
  }

  /* ---------- SPOTLIGHT ---------- */
  .spotlight-wrap{
    position:relative;
    margin-top:6px;
  }

  .spotlight-caret{
    position:absolute;
    top:-2px;
    width:0; height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-bottom:8px solid var(--cream-2);
    transition:left .5s ease;
    z-index:1;
  }

  .spotlight{
    max-width:820px;
    margin:10px auto 0;
    background:var(--cream-2);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 24px;
    box-shadow:0 10px 26px rgba(30,42,56,0.06);
    min-height:100px;
    display:flex;
    gap:16px;
    align-items:flex-start;
  }

  .spotlight-avatar{
    width:46px; height:46px;
    flex-shrink:0;
    margin-top:2px;
  }
  .spotlight-avatar svg{ width:100%; height:100%; display:block; }

  .spotlight-body{ flex:1; min-width:0; }

  .spotlight-toprow{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:5px;
  }
  .spotlight-name{
    font-family:var(--serif);
    font-size:16px;
    font-weight:600;
    color:var(--navy);
  }
  .spotlight-status{
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:700;
    color:var(--coral-dark);
    display:flex;
    align-items:center;
    gap:5px;
  }
  .spotlight-emoji{ font-size:15px; }

  .spotlight-text{
    font-family:var(--serif);
    font-style:italic;
    font-size:16px;
    line-height:1.5;
    color:var(--ink);
    margin:0;
    min-height:1.6em;
  }
  .spotlight-text .cursor{
    display:inline-block;
    width:2px; height:15px;
    background:var(--coral);
    margin-left:2px;
    vertical-align:middle;
    animation: caretBlink 0.9s step-end infinite;
  }
  @keyframes caretBlink{ 50%{ opacity:0; } }

  /* ---------- ADVOCATE PODIUM ---------- */
  .podium-wrap{
    display:flex;
    justify-content:center;
    margin-top:26px;
  }

  .podium{
    position:relative;
    width:420px;
    max-width:92%;
    background:linear-gradient(165deg, var(--navy), var(--navy-2));
    border-radius:20px 20px 10px 10px;
    padding:16px 22px 16px;
    box-shadow:0 18px 34px rgba(20,28,38,0.35);
    border:1px solid rgba(205,183,126,0.30);
    transition:box-shadow .4s ease, transform .4s ease;
  }

  .podium.active{
    box-shadow:0 22px 44px rgba(232,115,92,0.28), 0 0 0 2px var(--coral);
    transform:translateY(-2px);
  }

  .podium::before{
    content:"";
    position:absolute;
    top:-8px; left:50%;
    transform:translateX(-50%);
    width:0; height:0;
    border-left:8px solid transparent;
    border-right:8px solid transparent;
    border-bottom:8px solid var(--navy);
  }

  .podium-trim{
    position:absolute;
    top:0; left:16px; right:16px;
    height:3px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius:0 0 3px 3px;
  }

  .podium-label{
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
    margin-bottom:10px;
  }

  .podium-row{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .podium-avatar{
    position:relative;
    width:48px; height:48px;
    flex-shrink:0;
  }
  .podium-avatar svg{ width:100%; height:100%; display:block; }

  .hand-badge{
    position:absolute;
    top:-8px; right:-9px;
    font-size:17px;
    animation: handRaise 2.3s ease-in-out infinite;
  }
  @keyframes handRaise{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-4px) rotate(-10deg); }
  }

  .podium-name{
    font-family:var(--serif);
    font-size:16px;
    font-weight:600;
    color:var(--cream);
  }

  .podium-opinion{
    margin:10px 0 0;
    font-family:var(--serif);
    font-style:italic;
    font-size:13.5px;
    line-height:1.5;
    color:rgba(251,247,239,0.82);
  }

  .podium-footrow{
    display:flex;
    justify-content:flex-end;
    margin-top:10px;
  }
  .podium-research{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:9.5px;
    font-weight:700;
    color:var(--gold);
    background:rgba(205,183,126,0.12);
    border:1px solid rgba(205,183,126,0.3);
    border-radius:999px;
    padding:2px 8px;
  }

  /* ---------- CHAIR INPUT ---------- */
  .chair-wrap{
    margin:34px auto 0;
    max-width:640px;
    text-align:center;
  }
  .chair-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:9px;
  }
  .chair-form{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 6px 6px 22px;
    box-shadow:0 8px 22px rgba(30,42,56,0.08);
  }
  .chair-input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    outline:none;
    font-size:14.5px;
    font-family:var(--sans);
    color:var(--ink);
  }
  .chair-input::placeholder{ color:var(--muted); }
  .chair-send{
    background:var(--coral);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:11px 24px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease;
    flex-shrink:0;
  }
  .chair-send:hover{ background:var(--coral-dark); transform:translateY(-1px); }
  .chair-send:active{ transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
  }
</style>
</head>
<body>
<div class="page">
  <div class="stage">
    <div class="corner-tag">Concept Mockup · Not for Production</div>

    <header class="header">
      <div>
        <div class="eyebrow-row">
          <span class="eyebrow">Investment Committee &middot; Live Room</span>
          <span class="live-badge"><span class="live-dot"></span>LIVE</span>
        </div>
        <h1 class="deal-name">1420 Alder Street Bridge Refinance</h1>
        <div class="deal-meta">$1.15M <span class="sep">&middot;</span> 65% LTV</div>
      </div>
      <div class="leaning-badge leaning-decline" id="leaningBadge">
        Leaning
        <strong id="leaningValue">DECLINE</strong>
      </div>
    </header>

    <section class="vote-section">
      <div class="vote-toprow">
        <span class="vote-title">Committee Vote</span>
        <span class="research-total"><span class="rt-badge">&#128269; <span id="researchTotal">0</span> research agents active</span></span>
      </div>
      <div class="vote-bar" id="voteBar">
        <div class="vote-seg vote-for" id="voteFor" style="width:0%"><span id="voteForLabel"></span></div>
        <div class="vote-divider" id="voteDivider"></div>
        <div class="vote-seg vote-against" id="voteAgainst" style="width:0%"><span id="voteAgainstLabel"></span></div>
      </div>
    </section>

    <section class="boardroom" id="boardroom">
      <svg class="table-svg" id="tableSvg" viewBox="0 0 100 260" preserveAspectRatio="none"></svg>
      <div class="arc" id="arc"></div>
    </section>

    <div class="spotlight-wrap">
      <div class="spotlight-caret" id="spotlightCaret" style="left:50%"></div>
      <div class="spotlight" id="spotlight">
        <div class="spotlight-avatar" id="spotlightAvatar"></div>
        <div class="spotlight-body">
          <div class="spotlight-toprow">
            <span class="spotlight-name" id="spotlightName">Committee</span>
            <span class="spotlight-status" id="spotlightStatus"><span class="bar"></span><span class="bar"></span><span class="bar"></span>SPEAKING</span>
            <span class="spotlight-emoji" id="spotlightEmoji"></span>
          </div>
          <p class="spotlight-text" id="spotlightText">Reviewing the file&hellip;<span class="cursor"></span></p>
        </div>
      </div>
    </div>

    <div class="podium-wrap">
      <div class="podium" id="podium">
        <div class="podium-trim"></div>
        <div class="podium-label">Defense &middot; Deal Advocate</div>
        <div class="podium-row">
          <div class="podium-avatar" id="podiumAvatar"></div>
          <div>
            <div class="podium-name" id="podiumName">Deal Advocate</div>
          </div>
        </div>
        <p class="podium-opinion" id="podiumOpinion"></p>
        <div class="podium-footrow">
          <span class="podium-research" id="podiumResearch">&#128269; 0</span>
        </div>
      </div>
    </div>

    <div class="chair-wrap">
      <div class="chair-label">The Chair</div>
      <form class="chair-form" id="chairForm">
        <input class="chair-input" id="chairInput" type="text" placeholder="Message the whole committee&hellip;" autocomplete="off">
        <button class="chair-send" type="submit" id="chairSend">Send</button>
      </form>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var COMMITTEE = {
    deal:{name:"1420 Alder Street Bridge Refinance",amount:"$1.15M",ltv:"65% LTV",leaning:"DECLINE"},
    vote:{for:2,against:6},
    scrutiny:[
      {n:1,name:"Credit & Valuation",short:"Credit",vote:"against",emotion:"angry",emoji:"😠",research:2,opinion:"The 65% LTV is unsupported — it's really 79% against the purchase price."},
      {n:2,name:"Finance",short:"Finance",vote:"against",emotion:"angry",emoji:"😠",research:1,opinion:"Negative carry with no defended exit — this loan cannot refinance itself."},
      {n:3,name:"Accounting",short:"Accounting",vote:"against",emotion:"skeptical",emoji:"🤨",research:3,opinion:"In-place NOI exceeds gross rent. The number is mathematically impossible."},
      {n:4,name:"Legal & Structural",short:"Legal",vote:"against",emotion:"thinking",emoji:"🤔",research:2,opinion:"First-lien position is asserted but entirely unverified — no title, no UCC."},
      {n:5,name:"Insurance & Climate",short:"Insurance",vote:"for",emotion:"worried",emoji:"😟",research:1,opinion:"Sub-1.0x DSCR is thin, but insurable if we condition on a binder."},
      {n:6,name:"Sponsor & Fraud",short:"Fraud",vote:"against",emotion:"angry",emoji:"😠",research:2,opinion:"The track record is wholly self-reported. Assume fabricated until proven."},
      {n:7,name:"Portfolio & Concentration",short:"Portfolio",vote:"for",emotion:"thinking",emoji:"🤔",research:1,opinion:"No fund tape provided — but in isolation the concentration is tolerable."},
      {n:8,name:"Strategy",short:"Strategy",vote:"against",emotion:"disapprove",emoji:"😕",research:1,opinion:"A sub-1.0x story credit breaches our secured-lender thesis."}
    ],
    advocate:{n:9,name:"Deal Advocate",short:"Advocate",emotion:"handraise",emoji:"🙋",research:1,opinion:"Condition it on an appraisal and audited T-12 and it may be salvageable."}
  };

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- geometry (trig arc) ---------- */
  var ARC = { Rx:45, Ry:150, apexY:55, tableRy:26, tableApexY:222, tableRx:52 };

  function seatY(xPct, Ry, apexY, Rx){
    Rx = Rx || ARC.Rx;
    var cosT = (xPct - 50) / Rx;
    cosT = Math.max(-1, Math.min(1, cosT));
    var theta = Math.acos(cosT);
    var sinT = Math.sin(theta);
    var centerY = apexY + Ry;
    return centerY - Ry * sinT;
  }

  var SEAT_X = [8, 20, 32, 44, 56, 68, 80, 92];

  var ACCENT = { "for": "#8FA382", "against": "#E8735C" };
  var GOLD = "#CDB77E";

  function faceSVG(accent){
    return '' +
      '<svg viewBox="0 0 56 56">' +
        '<circle cx="28" cy="28" r="27" fill="#1E2A38"/>' +
        '<circle cx="28" cy="23" r="15.5" fill="#F1E9DA"/>' +
        '<g class="eyes">' +
          '<ellipse cx="21.3" cy="23" rx="2.1" ry="2.5" fill="#2B2620"/>' +
          '<ellipse cx="34.7" cy="23" rx="2.1" ry="2.5" fill="#2B2620"/>' +
        '</g>' +
        '<rect class="mouth" x="21.5" y="30.4" width="13" height="2.3" rx="1.15" fill="#2B2620"/>' +
        '<path d="M12,45 L28,39 L44,45 L44,55 L12,55 Z" fill="' + accent + '"/>' +
      '</svg>';
  }

  /* ---------- boardroom table (decorative curve) ---------- */
  function buildTableSvg(){
    var svg = document.getElementById('tableSvg');
    var pts = [];
    for (var x = 0; x <= 100; x += 2){
      var y = seatY(x, ARC.tableRy, ARC.tableApexY, ARC.tableRx);
      pts.push(x + ',' + y.toFixed(1));
    }
    var lineD = 'M ' + pts.join(' L ');
    var fillD = lineD + ' L 100,260 L 0,260 Z';

    var ns = 'http://www.w3.org/2000/svg';
    var fillPath = document.createElementNS(ns, 'path');
    fillPath.setAttribute('d', fillD);
    fillPath.setAttribute('fill', 'rgba(30,42,56,0.045)');
    svg.appendChild(fillPath);

    var linePath = document.createElementNS(ns, 'path');
    linePath.setAttribute('d', lineD);
    linePath.setAttribute('fill', 'none');
    linePath.setAttribute('stroke', 'rgba(30,42,56,0.16)');
    linePath.setAttribute('stroke-width', '0.6');
    svg.appendChild(linePath);
  }

  /* ---------- render seats ---------- */
  var seatEls = [];

  function buildSeats(){
    var arc = document.getElementById('arc');
    COMMITTEE.scrutiny.forEach(function(person, idx){
      var xPct = SEAT_X[idx];
      var yPx = seatY(xPct, ARC.Ry, ARC.apexY);

      var seat = document.createElement('div');
      seat.className = 'seat';
      seat.style.left = xPct + '%';
      seat.style.top = yPx + 'px';
      seat.dataset.idx = idx;

      var accent = ACCENT[person.vote] || GOLD;

      seat.innerHTML =
        '<div class="seat-chip">' +
          '<div class="avatar-wrap">' + faceSVG(accent) +
            '<div class="emo-badge">' + person.emoji + '</div>' +
          '</div>' +
          '<div class="seat-text">' +
            '<div class="seat-name">' + person.short + '</div>' +
            '<div class="seat-subrow">' +
              '<span class="vote-dot ' + person.vote + '"></span>' +
              '<span class="research-badge">&#128269; ' + person.research + '</span>' +
              '<span class="speaking-tag"><span class="bar"></span><span class="bar"></span><span class="bar"></span></span>' +
            '</div>' +
          '</div>' +
        '</div>';

      var eyesEl = seat.querySelector('.eyes');
      if (!reduceMotion){
        var dur = (4.2 + Math.random() * 2.4).toFixed(2);
        var delay = (Math.random() * -6).toFixed(2);
        eyesEl.style.animationDuration = dur + 's';
        eyesEl.style.animationDelay = delay + 's';
      }

      arc.appendChild(seat);
      seatEls.push(seat);
    });
  }

  /* ---------- vote bar ---------- */
  function buildVoteBar(){
    var total = COMMITTEE.vote.for + COMMITTEE.vote.against;
    var forPct = (COMMITTEE.vote.for / total) * 100;
    var againstPct = (COMMITTEE.vote.against / total) * 100;

    document.getElementById('voteForLabel').textContent = 'FOR ' + COMMITTEE.vote.for;
    document.getElementById('voteAgainstLabel').textContent = 'AGAINST ' + COMMITTEE.vote.against;
    document.getElementById('voteDivider').style.left = forPct + '%';

    requestAnimationFrame(function(){
      document.getElementById('voteFor').style.width = forPct + '%';
      document.getElementById('voteAgainst').style.width = againstPct + '%';
    });
  }

  function buildResearchTotal(){
    var total = COMMITTEE.scrutiny.reduce(function(sum, p){ return sum + p.research; }, 0) + COMMITTEE.advocate.research;
    document.getElementById('researchTotal').textContent = total;
  }

  /* ---------- podium ---------- */
  function buildPodium(){
    document.getElementById('podiumAvatar').innerHTML =
      faceSVG(GOLD) + '<span class="hand-badge">' + COMMITTEE.advocate.emoji + '</span>';
    document.getElementById('podiumName').textContent = COMMITTEE.advocate.name;
    document.getElementById('podiumOpinion').textContent = COMMITTEE.advocate.opinion;
    document.getElementById('podiumResearch').innerHTML = '&#128269; ' + COMMITTEE.advocate.research;
  }

  /* ---------- spotlight cycle ---------- */
  var ORDER = [0,1,2,3,4,5,6,7,'advocate'];
  var turn = 0;
  var typeTimer = null;
  var holdTimer = null;

  function personFor(ref){
    return ref === 'advocate' ? COMMITTEE.advocate : COMMITTEE.scrutiny[ref];
  }

  function clearActive(){
    seatEls.forEach(function(s){ s.classList.remove('active'); });
    document.getElementById('podium').classList.remove('active');
  }

  function setCaretForSeat(idx){
    var caret = document.getElementById('spotlightCaret');
    var spotlight = document.getElementById('spotlight');
    var boardroom = document.getElementById('boardroom');
    if (idx === 'advocate' || idx == null){
      caret.style.left = '50%';
      return;
    }
    var xPct = SEAT_X[idx];
    var boardRect = boardroom.getBoundingClientRect();
    var spotRect = spotlight.getBoundingClientRect();
    var targetX = boardRect.left + boardRect.width * (xPct / 100);
    var localLeft = targetX - spotRect.left;
    localLeft = Math.max(16, Math.min(spotRect.width - 16, localLeft));
    caret.style.left = localLeft + 'px';
  }

  function activateSeat(ref){
    clearActive();
    var person = personFor(ref);

    if (ref === 'advocate'){
      document.getElementById('podium').classList.add('active');
    } else {
      seatEls[ref].classList.add('active');
    }
    setCaretForSeat(ref);

    document.getElementById('spotlightName').textContent = person.name;
    document.getElementById('spotlightEmoji').textContent = person.emoji;
    document.getElementById('spotlightAvatar').innerHTML = faceSVG(ref === 'advocate' ? GOLD : (ACCENT[person.vote] || GOLD));

    var textEl = document.getElementById('spotlightText');
    var words = person.opinion.split(' ');

    if (reduceMotion){
      textEl.innerHTML = person.opinion + '<span class="cursor"></span>';
      holdTimer = setTimeout(nextTurn, 2600);
      return;
    }

    var i = 0;
    textEl.innerHTML = '<span class="cursor"></span>';
    typeTimer = setInterval(function(){
      i++;
      textEl.innerHTML = words.slice(0, i).join(' ') + '<span class="cursor"></span>';
      if (i >= words.length){
        clearInterval(typeTimer);
        holdTimer = setTimeout(nextTurn, 2000);
      }
    }, 115);
  }

  function nextTurn(){
    var ref = ORDER[turn % ORDER.length];
    turn++;
    activateSeat(ref);
  }

  /* ---------- chair input ---------- */
  function buildChair(){
    var form = document.getElementById('chairForm');
    var input = document.getElementById('chairInput');
    var btn = document.getElementById('chairSend');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if (!input.value.trim()) return;
      var original = input.placeholder;
      input.value = '';
      input.placeholder = 'Message sent to the committee ✓';
      btn.style.background = 'var(--sage-dark)';
      setTimeout(function(){
        input.placeholder = original;
        btn.style.background = '';
      }, 2200);
    });
  }

  /* ---------- init ---------- */
  function init(){
    buildTableSvg();
    buildSeats();
    buildVoteBar();
    buildResearchTotal();
    buildPodium();
    buildChair();
    setTimeout(nextTurn, 900);
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
