<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Investment Committee — Live Session (Concept 10: Playful Emoji Bubbly v2)</title>
<style>
  :root{
    --maxw: 1500px;
    --bg1:#ffe259; --bg2:#ffa751; --bg3:#ff6f91; --bg4:#a35eea;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Segoe UI Rounded", "Segoe UI", Verdana, sans-serif;
    background: linear-gradient(120deg, var(--bg1), var(--bg2), var(--bg3), var(--bg4));
    background-size: 400% 400%;
    animation: bgFlow 22s ease infinite;
    display:flex; flex-direction:column; align-items:center;
    padding: 26px 20px 50px;
    overflow-x:hidden;
    color:#2d2140;
    position:relative;
  }
  @keyframes bgFlow{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }

  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .confetti{ position:absolute; opacity:.5; animation: floaty 8s ease-in-out infinite; filter: drop-shadow(0 2px 3px rgba(0,0,0,.10)); }
  @keyframes floaty{ 0%,100%{ transform: translateY(0) rotate(0deg);} 50%{ transform: translateY(-26px) rotate(16deg);} }

  /* ---------- Header ---------- */
  header.deal-header{
    width:100%; max-width:var(--maxw); margin:0 auto 16px; position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    background: rgba(255,255,255,.58);
    backdrop-filter: blur(6px);
    border: 3px solid rgba(255,255,255,.85);
    border-radius: 26px;
    padding: 16px 26px;
    box-shadow: 0 10px 26px rgba(120,60,20,.18);
  }
  .deal-info{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; font-weight:800; font-size:19px; }
  .deal-title{ background: linear-gradient(90deg,#ff5e8f,#ff9b3d,#ffce54); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .dot{ opacity:.5; font-weight:900; }
  .deal-amt,.deal-ltv{ color:#5b3b8c; }
  .leaning-pill{
    background: linear-gradient(135deg,#ff5b6e,#ff2e63);
    color:#fff; font-weight:900; letter-spacing:.4px;
    padding:10px 20px; border-radius:999px; font-size:16px;
    box-shadow: 0 6px 16px rgba(255,46,99,.45);
    animation: pillPulse 2.2s ease-in-out infinite;
    white-space:nowrap;
  }
  .leaning-pill strong{ font-size:17px; }
  @keyframes pillPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }

  /* ---------- Vote bar ---------- */
  .vote-bar-wrap{
    width:100%; max-width:var(--maxw); margin:0 auto 16px; position:relative; z-index:2;
    background: rgba(255,255,255,.55);
    border: 3px solid rgba(255,255,255,.85);
    border-radius: 22px;
    padding: 14px 24px 16px;
    box-shadow: 0 8px 20px rgba(120,60,20,.15);
  }
  .vote-bar-title-row{ display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px; margin-bottom:9px; }
  .vote-bar-title{ font-weight:900; font-size:13px; letter-spacing:.8px; color:#5b3b8c; text-transform:uppercase; }
  .vote-bar-sub{ font-weight:700; font-size:11.5px; color:#8074a0; }
  .vote-bar-track{ display:flex; height:38px; border-radius:999px; overflow:hidden; background:#f1e9fb; box-shadow:inset 0 2px 8px rgba(70,30,70,.18); }
  .vote-seg{ display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:13px; white-space:nowrap; width:0; transition:width 1.1s cubic-bezier(.22,1.2,.36,1); }
  .vote-seg.for{ background:linear-gradient(120deg,#33e28d,#0fb96b); }
  .vote-seg.against{ background:linear-gradient(120deg,#ff7a7a,#ff2e63); }

  /* ---------- Session / spotlight ---------- */
  .session-row{ display:flex; justify-content:center; margin-bottom:4px; position:relative; z-index:2; }
  .live-pill{ background:#ff2e63; color:#fff; font-weight:900; font-size:13px; padding:7px 18px; border-radius:999px; display:flex; align-items:center; gap:7px; box-shadow:0 8px 18px rgba(255,46,99,.4); white-space:nowrap; }
  .live-dot{ width:9px; height:9px; border-radius:50%; background:#fff; animation: dotPulse 1.2s ease-in-out infinite; }
  @keyframes dotPulse{ 0%,100%{ opacity:1; transform:scale(1);} 50%{ opacity:.3; transform:scale(.6);} }

  .spotlight-wrap{ width:100%; max-width:660px; margin:10px auto 18px; min-height:150px; display:flex; align-items:center; justify-content:center; position:relative; z-index:2; }
  .spotlight{ width:100%; background:rgba(255,255,255,.95); border:3px solid #fff; border-radius:26px; padding:16px 22px 18px; box-shadow:0 16px 34px rgba(70,30,70,.28); }
  .spotlight.pop{ animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both; }
  .spotlight-kicker{ font-size:10.5px; font-weight:900; letter-spacing:1.4px; color:#ff2e63; text-transform:uppercase; margin-bottom:6px; }
  .spotlight-head{ display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .spotlight-emoji{ font-size:42px; line-height:1; display:inline-block; }
  .spotlight-meta{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .spotlight-name{ font-weight:900; font-size:15.5px; color:#5b3b8c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .spotlight-vote-badge{ align-self:flex-start; margin-top:3px; font-size:10.5px; font-weight:900; padding:3px 10px; border-radius:999px; color:#fff; letter-spacing:.5px; }
  .spotlight-vote-badge.for{ background:linear-gradient(120deg,#33e28d,#0fb96b); }
  .spotlight-vote-badge.against{ background:linear-gradient(120deg,#ff7a7a,#ff2e63); }
  .spotlight-vote-badge.defending{ background:linear-gradient(120deg,#ffd76e,#ff9f43); color:#6b3e00; }
  .spotlight-text{ font-size:15px; line-height:1.55; font-weight:600; color:#33254a; min-height:1.6em; }
  .cursor{ display:inline-block; margin-left:1px; animation: caret .8s steps(1) infinite; }
  .spotlight-text:not(.typing) .cursor, .podium-bubble .bubble-text:not(.typing) .cursor{ opacity:0; }
  @keyframes caret{ 0%,49%{ opacity:1;} 50%,100%{ opacity:0;} }
  @keyframes popIn{ from{ transform:scale(.6) rotate(-4deg); opacity:0;} to{ transform:scale(1) rotate(0); opacity:1; } }

  /* ---------- Arc stage (8 scrutiny seats only) ---------- */
  main.stage{ position:relative; width:100%; max-width:var(--maxw); height:470px; margin:0 auto; z-index:1; }
  .stage-floor{ position:absolute; left:3%; right:3%; bottom:0; height:58%; background:rgba(255,255,255,.22); border-radius:54px 54px 0 0; z-index:0; box-shadow: inset 0 14px 32px rgba(255,255,255,.4); }
  .seat-layer{ position:absolute; inset:0; z-index:1; }

  .badge-wrap{ position:absolute; transform:translate(-50%,-50%); z-index:2; }
  .badge-circle{
    position:relative; width:104px; height:104px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 22px rgba(60,20,60,.28), inset 0 -6px 10px rgba(0,0,0,.12), inset 0 6px 10px rgba(255,255,255,.5);
    border: 4px solid rgba(255,255,255,.9);
    overflow:hidden;
  }
  .badge-circle::after{ /* blink sweep */
    content:""; position:absolute; left:8%; right:8%; top:28%; height:0;
    background: rgba(255,255,255,.8); border-radius:50%;
    animation: blink var(--blink-dur,4s) ease-in-out var(--blink-delay,0s) infinite;
  }
  @keyframes blink{
    0%,88%,100%{ height:0; opacity:0; }
    92%{ height:36%; opacity:.9; }
    95%{ height:0; opacity:0; }
  }
  .face-emoji{ position:relative; z-index:1; font-size:52px; line-height:1; user-select:none; display:inline-block; }
  .face-emoji.wave-anim{ animation: wave 1.7s ease-in-out infinite; transform-origin:70% 75%; }
  @keyframes wave{ 0%,100%{ transform:rotate(0deg) translateY(0);} 30%{ transform:rotate(-16deg) translateY(-5px);} 60%{ transform:rotate(11deg) translateY(-7px);} }
  .face-emoji.talk{ animation: talk .46s ease-in-out infinite; }
  @keyframes talk{ 0%,100%{ transform:scale(1,1);} 50%{ transform:scale(1.1,.78);} }

  .badge-circle.active{ animation: activeBounce 1.05s cubic-bezier(.34,1.56,.64,1) infinite; }
  @keyframes activeBounce{
    0%,100%{ transform:scale(1.18); box-shadow:0 10px 22px rgba(60,20,60,.28), inset 0 -6px 10px rgba(0,0,0,.12), inset 0 6px 10px rgba(255,255,255,.5), 0 0 0 6px rgba(255,255,255,.6); }
    50%{ transform:scale(1.28) translateY(-8px); box-shadow:0 18px 32px rgba(60,20,60,.36), inset 0 -6px 10px rgba(0,0,0,.12), inset 0 6px 10px rgba(255,255,255,.65), 0 0 0 11px rgba(255,255,255,.75); }
  }

  /* research badge — animated */
  .research-corner{
    position:absolute; top:-8px; right:-8px; z-index:4;
    display:inline-flex; align-items:center; gap:2px;
    background:linear-gradient(135deg,#ffd76e,#ff9f43); color:#6b3e00;
    border-radius:999px; padding:3px 8px; font-size:11.5px; font-weight:900;
    box-shadow:0 3px 8px rgba(255,159,67,.55); border:2px solid #fff;
    animation: researchPulse 1.9s ease-in-out infinite;
    white-space:nowrap;
  }
  @keyframes researchPulse{
    0%,100%{ transform:scale(1); box-shadow:0 3px 8px rgba(255,159,67,.5); }
    50%{ transform:scale(1.14); box-shadow:0 5px 14px rgba(255,159,67,.9); }
  }

  /* compact chip (idle default state: name + vote dot + research badge) */
  .seat-chip-wrap{ position:absolute; transform:translateX(-50%); text-align:center; z-index:2; }
  .compact-chip{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.88); border:2px solid #fff; border-radius:999px;
    padding:5px 11px 5px 9px; box-shadow:0 5px 12px rgba(70,30,70,.18);
    font-weight:800; font-size:12px; color:#3a2a55; white-space:nowrap;
  }
  .chip-name{ font-weight:900; }
  .vote-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 0 2px rgba(255,255,255,.85); }
  .vote-dot.for{ background:#0fb96b; }
  .vote-dot.against{ background:#ff2e63; }
  .research-pill{
    display:inline-flex; align-items:center; gap:2px; font-size:10.5px; font-weight:900;
    background:linear-gradient(135deg,#ffe08a,#ffb84d); color:#6b3e00;
    border-radius:999px; padding:2px 7px;
    animation: researchPulse 1.9s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition:none !important; }
  }

  /* ---------- Deal Advocate — distinct defense podium ---------- */
  section.advocate-podium{ width:100%; max-width:var(--maxw); margin:10px auto 6px; display:flex; justify-content:center; position:relative; z-index:2; }
  .podium-card{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background: linear-gradient(160deg, rgba(255,255,255,.72), rgba(255,236,190,.6));
    border: 3px dashed rgba(255,255,255,.95);
    border-radius: 28px;
    padding: 18px 34px 22px;
    box-shadow: 0 14px 30px rgba(120,60,20,.2);
    min-width: 320px; max-width: 460px;
  }
  .podium-kicker{ font-size:11px; font-weight:900; letter-spacing:1.6px; color:#c77b00; text-transform:uppercase; }
  .podium-badge-wrap{ position:relative; margin-top:4px; }
  .podium-badge{
    width:118px; height:118px;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.95), transparent 42%), linear-gradient(150deg,#ffe08a,#ffb84d);
  }
  .podium-badge .face-emoji{ font-size:58px; }
  .podium-stand{
    width:96px; height:30px; margin-top:-8px;
    background:linear-gradient(160deg,#e0a44a,#a86a1f);
    clip-path: polygon(14% 0%, 86% 0%, 100% 100%, 0% 100%);
    box-shadow: 0 6px 14px rgba(90,50,0,.35);
  }
  .podium-name{ font-weight:900; font-size:16px; color:#5b3b8c; margin-top:2px; }
  .podium-chip{ margin-top:2px; }
  .advocate-tag{ font-size:9.5px; font-weight:900; letter-spacing:.6px; padding:2px 8px; border-radius:999px; color:#6b3e00; background:linear-gradient(120deg,#ffd76e,#ff9f43); }
  .podium-bubble{ width:100%; max-height:0; opacity:0; overflow:hidden; transition:max-height .55s ease, opacity .4s ease, margin .4s ease; }
  .podium-bubble.open{ max-height:240px; opacity:1; margin-top:10px; }
  .podium-bubble .bubble-text{
    background:rgba(255,255,255,.92); border:2px solid #fff; border-radius:18px;
    padding:11px 15px; font-size:14px; font-weight:600; line-height:1.5; color:#33254a;
    box-shadow:0 8px 18px rgba(70,30,70,.2);
  }

  /* ---------- Chair input ---------- */
  footer.chair-row{ width:100%; max-width:var(--maxw); margin:14px auto 0; display:flex; justify-content:center; position:relative; z-index:2; }
  .chair-input{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.88); border:3px solid #fff; border-radius:999px; padding:9px 9px 9px 24px; width:560px; max-width:100%; box-shadow:0 14px 30px rgba(80,30,80,.22); }
  .chair-input input{ flex:1; border:none; outline:none; background:transparent; font-size:15px; font-weight:600; color:#3a2a55; }
  .chair-input input::placeholder{ color:#9a86b8; }
  .send-btn{ border:none; cursor:pointer; width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#ff9a3d,#ff5e8f); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px rgba(255,94,143,.5); transition: transform .15s; }
  .send-btn:hover{ transform:scale(1.1) rotate(8deg); }
  .send-btn:active{ transform:scale(.9); }
  .send-btn.sent{ animation: sendPop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes sendPop{ 0%{ transform:scale(1);} 50%{ transform:scale(1.35) rotate(20deg);} 100%{ transform:scale(1);} }
</style>
</head>
<body>

  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <header class="deal-header">
    <div class="deal-info">
      <span class="deal-title" id="dealName"></span>
      <span class="dot">·</span><span class="deal-amt" id="dealAmt"></span>
      <span class="dot">·</span><span class="deal-ltv" id="dealLtv"></span>
    </div>
    <div class="leaning-pill">Leaning: <strong id="leaningVal"></strong></div>
  </header>

  <div class="vote-bar-wrap">
    <div class="vote-bar-title-row">
      <span class="vote-bar-title">Committee Vote — For vs Against</span>
      <span class="vote-bar-sub">8 voting seats · Deal Advocate not counted</span>
    </div>
    <div class="vote-bar-track">
      <div class="vote-seg for" id="voteSegFor"></div>
      <div class="vote-seg against" id="voteSegAgainst"></div>
    </div>
  </div>

  <div class="session-row">
    <span class="live-pill"><span class="live-dot"></span>LIVE — Investment Committee Session</span>
  </div>

  <div class="spotlight-wrap">
    <div class="spotlight" id="spotlight">
      <div class="spotlight-kicker">🎙 Now Speaking</div>
      <div class="spotlight-head">
        <span class="spotlight-emoji" id="spotEmoji">😠</span>
        <div class="spotlight-meta">
          <span class="spotlight-name" id="spotName">—</span>
          <span class="spotlight-vote-badge" id="spotVoteBadge">—</span>
        </div>
        <span class="research-pill" id="spotResearch">🔎<b>0</b></span>
      </div>
      <div class="spotlight-text" id="spotTextWrap"><span class="txt" id="spotText"></span><span class="cursor">▍</span></div>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="stage-floor"></div>
    <div class="seat-layer" id="seatLayer"></div>
  </main>

  <section class="advocate-podium">
    <div class="podium-card">
      <div class="podium-kicker">Defense Podium</div>
      <div class="badge-wrap podium-badge-wrap">
        <div class="badge-circle podium-badge" id="advBadge">
          <span class="face-emoji wave-anim" id="advFace">🙋</span>
        </div>
        <span class="research-corner" id="advResearchCorner">🔎<b>1</b></span>
      </div>
      <div class="podium-stand"></div>
      <div class="podium-name">Deal Advocate</div>
      <div class="compact-chip podium-chip" id="advChip">
        <span class="chip-name">Advocate</span>
        <span class="advocate-tag">DEFENDING</span>
        <span class="research-pill">🔎<b>1</b></span>
      </div>
      <div class="podium-bubble" id="advBubble">
        <div class="bubble-text" id="advTextWrap"><span class="txt" id="advText"></span><span class="cursor">▍</span></div>
      </div>
    </div>
  </section>

  <footer class="chair-row">
    <form class="chair-input" id="chairForm">
      <input type="text" id="chairMsg" placeholder="Message the whole committee…" autocomplete="off" aria-label="Message the whole committee" />
      <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">➤</button>
    </form>
  </footer>

<script>
  const COMMITTEE = {
   deal:{name:"1420 Alder Street Bridge Refinance",amount:"$1.15M",ltv:"65% LTV",leaning:"DECLINE"},
   vote:{for:2,against:6},
   scrutiny:[
    {n:1,name:"Credit & Valuation",short:"Credit",vote:"against",emotion:"angry",emoji:"😠",research:2,opinion:"The 65% LTV is unsupported — it's really 79% against the purchase price."},
    {n:2,name:"Finance",short:"Finance",vote:"against",emotion:"angry",emoji:"😠",research:1,opinion:"Negative carry with no defended exit — this loan cannot refinance itself."},
    {n:3,name:"Accounting",short:"Accounting",vote:"against",emotion:"skeptical",emoji:"🤨",research:3,opinion:"In-place NOI exceeds gross rent. The number is mathematically impossible."},
    {n:4,name:"Legal & Structural",short:"Legal",vote:"against",emotion:"thinking",emoji:"🤔",research:2,opinion:"First-lien position is asserted but entirely unverified — no title, no UCC."},
    {n:5,name:"Insurance & Climate",short:"Insurance",vote:"for",emotion:"worried",emoji:"😟",research:1,opinion:"Sub-1.0x DSCR is thin, but insurable if we condition on a binder."},
    {n:6,name:"Sponsor & Fraud",short:"Fraud",vote:"against",emotion:"angry",emoji:"😠",research:2,opinion:"The track record is wholly self-reported. Assume fabricated until proven."},
    {n:7,name:"Portfolio & Concentration",short:"Portfolio",vote:"for",emotion:"thinking",emoji:"🤔",research:1,opinion:"No fund tape provided — but in isolation the concentration is tolerable."},
    {n:8,name:"Strategy",short:"Strategy",vote:"against",emotion:"disapprove",emoji:"😕",research:1,opinion:"A sub-1.0x story credit breaches our secured-lender thesis."}
   ],
   advocate:{n:9,name:"Deal Advocate",short:"Advocate",emotion:"handraise",emoji:"🙋",research:1,opinion:"Condition it on an appraisal and audited T-12 and it may be salvageable."}
  };

  const STAGE_H = 470;
  const VOTE_COLORS = { for: ['#33e28d','#0fb96b'], against: ['#ff7a7a','#ff2e63'] };
  const CONFETTI_EMOJI = ['🎉','✨','⭐','💛','🎊','💫'];
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let seatEls = [];

  function initHeader(){
    document.getElementById('dealName').textContent = COMMITTEE.deal.name;
    document.getElementById('dealAmt').textContent = COMMITTEE.deal.amount;
    document.getElementById('dealLtv').textContent = COMMITTEE.deal.ltv;
    document.getElementById('leaningVal').textContent = COMMITTEE.deal.leaning;
  }

  function initVoteBar(){
    const total = COMMITTEE.vote.for + COMMITTEE.vote.against;
    const pf = total ? (COMMITTEE.vote.for/total*100) : 0;
    const pa = 100 - pf;
    const segFor = document.getElementById('voteSegFor');
    const segAgainst = document.getElementById('voteSegAgainst');
    segFor.textContent = COMMITTEE.vote.for + ' FOR';
    segAgainst.textContent = COMMITTEE.vote.against + ' AGAINST';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        segFor.style.width = pf + '%';
        segAgainst.style.width = pa + '%';
      });
    });
  }

  function buildConfetti(){
    const layer = document.getElementById('confettiLayer');
    for(let i=0;i<14;i++){
      const s = document.createElement('span');
      s.className = 'confetti';
      s.textContent = CONFETTI_EMOJI[i % CONFETTI_EMOJI.length];
      s.style.left = (Math.random()*100).toFixed(1)+'%';
      s.style.top = (Math.random()*100).toFixed(1)+'%';
      s.style.fontSize = (16+Math.random()*18).toFixed(0)+'px';
      s.style.animationDuration = (6+Math.random()*6).toFixed(1)+'s';
      s.style.animationDelay = (Math.random()*5).toFixed(1)+'s';
      layer.appendChild(s);
    }
  }

  function buildSeats(){
    const stage = document.getElementById('stage');
    const layer = document.getElementById('seatLayer');
    layer.innerHTML = '';
    seatEls = [];

    const W = stage.getBoundingClientRect().width || 1240;
    const H = STAGE_H;
    const CX = W/2;
    const CY = H - 120;
    const RY = 250;
    const RX = Math.min(W*0.42, W/2-90);
    const n = COMMITTEE.scrutiny.length;

    COMMITTEE.scrutiny.forEach(function(e, i){
      const t = n>1 ? i/(n-1) : 0.5;
      const angle = Math.PI - Math.PI*t;
      const x = CX + RX*Math.cos(angle);
      const y = CY - RY*Math.sin(angle);
      const [c0,c1] = VOTE_COLORS[e.vote] || ['#ccc','#999'];

      const badgeWrap = document.createElement('div');
      badgeWrap.className = 'badge-wrap';
      badgeWrap.style.left = x+'px';
      badgeWrap.style.top = y+'px';

      const badge = document.createElement('div');
      badge.className = 'badge-circle';
      badge.style.background = 'radial-gradient(circle at 32% 26%, rgba(255,255,255,.95), transparent 42%), linear-gradient(150deg, '+c0+', '+c1+')';
      badge.style.setProperty('--blink-delay', (Math.random()*4).toFixed(2)+'s');
      badge.style.setProperty('--blink-dur', (3.4+Math.random()*2.2).toFixed(2)+'s');

      const face = document.createElement('span');
      face.className = 'face-emoji';
      face.textContent = e.emoji;

      const research = document.createElement('span');
      research.className = 'research-corner';
      research.innerHTML = '🔎<b>'+e.research+'</b>';

      badge.appendChild(face);
      badgeWrap.appendChild(badge);
      badgeWrap.appendChild(research);

      const chipWrap = document.createElement('div');
      chipWrap.className = 'seat-chip-wrap';
      chipWrap.style.left = x+'px';
      chipWrap.style.top = (y+58)+'px';
      chipWrap.innerHTML =
        '<div class="compact-chip">'+
          '<span class="chip-name">'+e.short+'</span>'+
          '<span class="vote-dot '+e.vote+'"></span>'+
          '<span class="research-pill">🔎<b>'+e.research+'</b></span>'+
        '</div>';

      layer.appendChild(badgeWrap);
      layer.appendChild(chipWrap);

      seatEls.push({ badge, face, opinion: e.opinion });
    });
  }

  function typeInto(wrapEl, txtId, text, onDone){
    const txtEl = document.getElementById(txtId);
    if(wrapEl._typeTimer){ clearInterval(wrapEl._typeTimer); wrapEl._typeTimer = null; }
    if(REDUCED){
      txtEl.textContent = text;
      if(onDone) onDone();
      return;
    }
    const words = text.split(' ');
    txtEl.textContent = '';
    wrapEl.classList.add('typing');
    let idx = 0;
    wrapEl._typeTimer = setInterval(function(){
      txtEl.textContent += (idx===0 ? '' : ' ') + words[idx];
      idx++;
      if(idx >= words.length){
        clearInterval(wrapEl._typeTimer);
        wrapEl._typeTimer = null;
        wrapEl.classList.remove('typing');
        if(onDone) onDone();
      }
    }, 130);
  }

  function renderSpotlightScrutiny(e){
    const spotlight = document.getElementById('spotlight');
    document.getElementById('spotEmoji').textContent = e.emoji;
    document.getElementById('spotName').textContent = e.name;
    const vb = document.getElementById('spotVoteBadge');
    vb.className = 'spotlight-vote-badge ' + e.vote;
    vb.textContent = e.vote.toUpperCase();
    document.getElementById('spotResearch').innerHTML = '🔎<b>'+e.research+'</b>';
    spotlight.classList.remove('pop'); void spotlight.offsetWidth; spotlight.classList.add('pop');
    typeInto(document.getElementById('spotTextWrap'), 'spotText', e.opinion);
  }

  function renderSpotlightAdvocate(){
    const spotlight = document.getElementById('spotlight');
    document.getElementById('spotEmoji').textContent = COMMITTEE.advocate.emoji;
    document.getElementById('spotName').textContent = COMMITTEE.advocate.name;
    const vb = document.getElementById('spotVoteBadge');
    vb.className = 'spotlight-vote-badge defending';
    vb.textContent = 'DEFENDING';
    document.getElementById('spotResearch').innerHTML = '🔎<b>'+COMMITTEE.advocate.research+'</b>';
    spotlight.classList.remove('pop'); void spotlight.offsetWidth; spotlight.classList.add('pop');
    typeInto(document.getElementById('spotTextWrap'), 'spotText', '↓ The Deal Advocate has the floor — see the defense podium below.');
  }

  function setScrutinyActive(idx){
    seatEls.forEach(function(s, i){
      const on = (i === idx);
      s.badge.classList.toggle('active', on);
      s.face.classList.toggle('talk', on);
    });
    renderSpotlightScrutiny(COMMITTEE.scrutiny[idx]);
    document.getElementById('advBadge').classList.remove('active');
    document.getElementById('advBubble').classList.remove('open');
  }

  function setAdvocateActive(){
    seatEls.forEach(function(s){
      s.badge.classList.remove('active');
      s.face.classList.remove('talk');
    });
    document.getElementById('advBadge').classList.add('active');
    renderSpotlightAdvocate();
    const bubble = document.getElementById('advBubble');
    bubble.classList.add('open');
    typeInto(document.getElementById('advTextWrap'), 'advText', COMMITTEE.advocate.opinion);
  }

  function startCycle(){
    const total = COMMITTEE.scrutiny.length + 1;
    let idx = 0;
    function tick(){
      if(idx < COMMITTEE.scrutiny.length){
        setScrutinyActive(idx);
      } else {
        setAdvocateActive();
      }
      idx = (idx + 1) % total;
    }
    tick();
    setInterval(tick, 5200);
  }

  function initChair(){
    const form = document.getElementById('chairForm');
    const input = document.getElementById('chairMsg');
    const btn = document.getElementById('sendBtn');
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      if(!input.value.trim()) return;
      btn.classList.remove('sent');
      void btn.offsetWidth;
      btn.classList.add('sent');
      input.value = '';
    });
  }

  let resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(buildSeats, 150);
  });

  document.addEventListener('DOMContentLoaded', function(){
    initHeader();
    initVoteBar();
    buildConfetti();
    buildSeats();
    startCycle();
    initChair();
  });
</script>
</body>
</html>
