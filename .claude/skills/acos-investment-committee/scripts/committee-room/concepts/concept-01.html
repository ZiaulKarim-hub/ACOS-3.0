<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concept 01 · Friendly Flat Cartoon — Investment Committee Room</title>
<style>
  :root{
    --cream:#FFF6EC;
    --panel:#FFFFFF;
    --ink:#4A3F35;
    --ink-soft:#8A7F74;
    --for-green:#3FAE74;
    --for-green-soft:#DFF4E8;
    --against-red:#E2635C;
    --against-red-soft:#FBE1DF;
    --gold:#F2A93B;
    --gold-soft:#FFE9B8;
    --shadow-soft:0 6px 16px rgba(74,63,53,.12);
    --bounce:cubic-bezier(.34,1.56,.64,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 20% 0%, #FFFDF7 0%, var(--cream) 55%, #FCEFDD 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-width:1280px;
  }
  .app-wrap{max-width:1600px;margin:0 auto;padding:28px 40px 48px;}

  /* ---------- HEADER ---------- */
  .deal-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    background:var(--panel);border-radius:20px;padding:18px 26px;
    box-shadow:var(--shadow-soft);
  }
  .deal-kicker{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink-soft);}
  .deal-name{font-size:22px;margin:4px 0 2px;font-weight:800;}
  .deal-meta{font-size:14px;color:var(--ink-soft);font-weight:600;}
  .deal-meta b{color:var(--ink);}
  .deal-status{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .leaning-badge{
    background:var(--against-red);color:#fff;font-weight:800;font-size:13px;letter-spacing:.04em;
    padding:8px 16px;border-radius:999px;box-shadow:0 4px 10px rgba(226,99,92,.4);
    animation:leaningPulse 2.2s ease-in-out infinite;
  }
  @keyframes leaningPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}
  .research-total{
    display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-soft);
    background:#FFF3D6;border-radius:999px;padding:5px 12px;
  }
  .research-total .icon{display:inline-block;animation:spinIcon 2.6s linear infinite;}

  /* ---------- VOTE BAR ---------- */
  .vote-section{margin-top:18px;background:var(--panel);border-radius:18px;padding:14px 24px;box-shadow:var(--shadow-soft);}
  .vote-label{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--ink-soft);margin-bottom:8px;}
  .vote-note{font-weight:600;text-transform:none;letter-spacing:normal;opacity:.8;}
  .vote-bar{display:flex;width:100%;height:36px;border-radius:12px;overflow:hidden;background:#F1EAE0;box-shadow:inset 0 1px 4px rgba(0,0,0,.08);}
  .vote-seg{display:flex;align-items:center;justify-content:center;height:100%;width:0;transition:width 1.1s var(--bounce);}
  .vote-for{background:linear-gradient(180deg,#59C98D,var(--for-green));}
  .vote-against{background:linear-gradient(180deg,#EA7B75,var(--against-red));}
  .vote-seg-text{color:#fff;font-weight:800;font-size:13px;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.15);}

  /* ---------- SPOTLIGHT ---------- */
  .spotlight-wrap{margin-top:24px;display:flex;justify-content:center;position:relative;height:172px;}
  .spotlight-bubble{
    position:relative;background:var(--panel);border-radius:26px;padding:16px 26px 18px;
    box-shadow:var(--shadow-soft);width:min(760px,80%);min-height:130px;
    border:2px solid #FFE7C2;
  }
  .spotlight-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .spotlight-emoji{font-size:26px;}
  .spotlight-name{font-weight:800;font-size:15px;}
  .spotlight-vote-dot{width:11px;height:11px;border-radius:50%;}
  .spotlight-text{font-size:16px;line-height:1.45;font-weight:600;margin:0;min-height:46px;}
  .bubble-tail{
    position:absolute;bottom:-15px;left:50%;width:0;height:0;
    border-left:15px solid transparent;border-right:15px solid transparent;
    border-top:17px solid var(--panel);transform:translateX(-50%);
    transition:left .55s var(--bounce);filter:drop-shadow(0 4px 3px rgba(74,63,53,.08));
  }

  /* ---------- ARC STAGE ---------- */
  .arc-stage{position:relative;height:460px;margin-top:6px;}
  .seat{
    position:absolute;width:104px;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }
  .face-wrap{position:relative;width:56px;height:56px;}
  .face{
    width:56px;height:56px;border-radius:50%;position:relative;
    box-shadow:0 3px 8px rgba(74,63,53,.2), inset 0 -4px 6px rgba(0,0,0,.06);
    transition:transform .5s var(--bounce), box-shadow .3s ease;
  }
  .eye{position:absolute;top:20px;width:7px;height:7px;border-radius:50%;background:#4a3f35;animation:blink 4.6s ease-in-out infinite;}
  .eye-l{left:14px;} .eye-r{right:14px;}
  .mouth{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);width:16px;height:7px;background:#4a3f35;}
  .mouth.smile{border-radius:0 0 14px 14px;}
  .mouth.frown{border-radius:14px 14px 0 0;}
  .mouth.talking{border-radius:50%;animation:talkMouth .32s ease-in-out infinite;}
  .seat-emoji{
    position:absolute;bottom:-3px;right:-6px;font-size:14px;background:#fff;border-radius:50%;
    width:22px;height:22px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.18);
  }
  .chip{
    margin-top:7px;background:rgba(255,255,255,.92);border-radius:14px;padding:4px 8px 5px;
    box-shadow:0 2px 6px rgba(74,63,53,.12);width:96px;transition:box-shadow .3s ease;
  }
  .chip-name{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip-row{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:3px;}
  .vote-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .vote-dot.for{background:var(--for-green);}
  .vote-dot.against{background:var(--against-red);}
  .badge-research{
    display:inline-flex;align-items:center;gap:2px;background:#FFF3D6;border-radius:999px;
    padding:1px 6px;font-size:9.5px;font-weight:800;color:#8a6d1f;
    animation:pulseBadge 1.8s ease-in-out infinite;
  }
  .badge-research .icon{display:inline-block;animation:spinIcon 2.4s linear infinite;}

  .seat.active .face{transform:scale(1.12);animation:activeGlow 1.3s ease-in-out infinite;z-index:5;}
  .seat.active .chip{box-shadow:0 5px 12px rgba(74,63,53,.22);background:#fff;}
  .seat.active{z-index:6;}

  /* idle emotion body-language */
  .emotion-angry .face-wrap{animation:emoAngry 2.4s ease-in-out infinite;}
  .emotion-skeptical .face-wrap{animation:emoSkeptical 3.6s ease-in-out infinite;}
  .emotion-thinking .face-wrap{animation:emoThinking 3.8s ease-in-out infinite;}
  .emotion-worried .face-wrap{animation:emoWorried 2.8s ease-in-out infinite;}
  .emotion-disapprove .face-wrap{animation:emoDisapprove 3.2s ease-in-out infinite;}

  /* ---------- ADVOCATE PODIUM ---------- */
  .podium-row{display:flex;flex-direction:column;align-items:center;margin-top:4px;}
  .podium-connector{font-size:12px;color:#c9a54a;letter-spacing:.3em;animation:floatConn 2.4s ease-in-out infinite;margin-bottom:2px;}
  .podium-card{
    position:relative;width:300px;background:linear-gradient(160deg,var(--gold-soft),#FFD37A 85%);
    border-radius:22px;padding:20px 22px 22px;text-align:center;
    box-shadow:0 10px 22px rgba(196,140,20,.28);border:2px solid #F0C063;
  }
  .podium-card::after{
    content:"";position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
    width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;
    border-top:18px solid #E3A93D;filter:drop-shadow(0 3px 3px rgba(196,140,20,.25));
  }
  .podium-label{
    display:inline-block;background:#8a5a13;color:#fff;font-size:10.5px;font-weight:800;
    letter-spacing:.14em;padding:4px 12px;border-radius:999px;margin-bottom:10px;
  }
  .podium-face-wrap{position:relative;width:66px;height:66px;margin:0 auto;}
  .podium-face{
    width:66px;height:66px;border-radius:50%;background:#FFB74D;
    box-shadow:0 4px 10px rgba(74,63,53,.22), inset 0 -4px 6px rgba(0,0,0,.06);position:relative;
  }
  .podium-hand{
    position:absolute;top:-22px;right:-14px;font-size:30px;display:inline-block;
    animation:handBob 1.7s ease-in-out infinite;
  }
  .podium-name{font-weight:800;font-size:15px;margin-top:8px;}
  .podium-role{font-size:11px;color:#7a5518;font-weight:700;margin-bottom:8px;}
  .podium-badge{margin:6px auto 8px;width:fit-content;}
  .podium-opinion{font-size:13.5px;line-height:1.45;font-weight:600;color:#5c4013;min-height:56px;margin:0;}

  /* ---------- CHAIR INPUT ---------- */
  .chair-row{display:flex;justify-content:center;margin-top:34px;}
  .chair-form{
    display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:999px;
    padding:8px 8px 8px 20px;box-shadow:var(--shadow-soft);width:min(640px,90%);border:2px solid #F0E4D3;
  }
  .chair-input{
    flex:1;border:none;outline:none;font-size:14px;font-family:inherit;color:var(--ink);background:transparent;
  }
  .chair-input::placeholder{color:#B8AB9C;}
  .chair-send{
    border:none;background:var(--ink);color:#fff;font-weight:800;font-size:13px;
    padding:10px 18px;border-radius:999px;cursor:pointer;transition:transform .2s var(--bounce);
  }
  .chair-send:hover{transform:scale(1.05);}

  /* ---------- KEYFRAMES ---------- */
  @keyframes blink{0%,94%,100%{transform:scaleY(1);}97%{transform:scaleY(.12);}}
  @keyframes talkMouth{0%,100%{transform:translateX(-50%) scaleY(1);}50%{transform:translateX(-50%) scaleY(2.3);}}
  @keyframes spinIcon{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes pulseBadge{0%,100%{transform:scale(1);}50%{transform:scale(1.09);}}
  @keyframes activeGlow{
    0%,100%{box-shadow:0 0 0 4px rgba(255,196,74,.55),0 8px 16px rgba(74,63,53,.2);}
    50%{box-shadow:0 0 0 9px rgba(255,196,74,.3),0 8px 22px rgba(74,63,53,.24);}
  }
  @keyframes emoAngry{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-2px) rotate(-3deg);}75%{transform:translateX(2px) rotate(3deg);}}
  @keyframes emoSkeptical{0%,100%{transform:rotate(0);}50%{transform:rotate(-6deg);}}
  @keyframes emoThinking{0%,100%{transform:rotate(0) translateY(0);}50%{transform:rotate(5deg) translateY(-2px);}}
  @keyframes emoWorried{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
  @keyframes emoDisapprove{0%,100%{transform:rotate(0);}30%{transform:rotate(-7deg);}70%{transform:rotate(7deg);}}
  @keyframes handBob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-7px) rotate(-10deg);}}
  @keyframes floatConn{0%,100%{transform:translateY(0);opacity:.7;}50%{transform:translateY(-3px);opacity:1;}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<div class="app-wrap">

  <header class="deal-header">
    <div class="deal-info">
      <div class="deal-kicker">LIVE INVESTMENT COMMITTEE</div>
      <h1 class="deal-name" id="dealName"></h1>
      <div class="deal-meta" id="dealMeta"></div>
    </div>
    <div class="deal-status">
      <div class="leaning-badge" id="leaningBadge"></div>
      <div class="research-total"><span class="icon">🔎</span><span id="researchTotalNum"></span> research agents live</div>
    </div>
  </header>

  <section class="vote-section">
    <div class="vote-label">COMMITTEE VOTE · 8 VOTING SEATS <span class="vote-note">(the Advocate is defense — not counted)</span></div>
    <div class="vote-bar" id="voteBar">
      <div class="vote-seg vote-for" id="voteFor"><span class="vote-seg-text" id="voteForText"></span></div>
      <div class="vote-seg vote-against" id="voteAgainst"><span class="vote-seg-text" id="voteAgainstText"></span></div>
    </div>
  </section>

  <section class="spotlight-wrap">
    <div class="spotlight-bubble" id="spotlightBubble">
      <div class="spotlight-head">
        <span class="spotlight-emoji" id="spotlightEmoji"></span>
        <span class="spotlight-name" id="spotlightName"></span>
        <span class="spotlight-vote-dot" id="spotlightDot"></span>
      </div>
      <p class="spotlight-text" id="spotlightText" aria-live="polite"></p>
      <div class="bubble-tail" id="bubbleTail"></div>
    </div>
  </section>

  <section class="arc-stage" id="arcStage" aria-label="Scrutiny panel, eight seats"></section>

  <section class="podium-row">
    <div class="podium-connector" aria-hidden="true">▲ ▲ ▲</div>
    <div class="podium-card">
      <div class="podium-label">DEFENSE</div>
      <div class="podium-face-wrap">
        <div class="podium-face"></div>
        <span class="podium-hand">🙋</span>
      </div>
      <div class="podium-name">Deal Advocate</div>
      <div class="podium-role">not a voting seat</div>
      <div class="podium-badge" id="podiumResearch"></div>
      <p class="podium-opinion" id="podiumOpinion"></p>
    </div>
  </section>

  <footer class="chair-row">
    <form class="chair-form" id="chairForm">
      <input type="text" class="chair-input" id="chairInput" placeholder="Message the whole committee…" aria-label="Message the whole committee" autocomplete="off">
      <button type="submit" class="chair-send" id="chairSend">Send ➤</button>
    </form>
  </footer>

</div>

<script>
const COMMITTEE = {
 deal:{name:"1420 Alder Street Bridge Refinance",amount:"$1.15M",ltv:"65% LTV",leaning:"DECLINE"},
 vote:{for:2,against:6},
 scrutiny:[
  {n:1,name:"Credit & Valuation",short:"Credit",vote:"against",emotion:"angry",emoji:"😠",research:2,opinion:"The 65% LTV is unsupported — it's really 79% against the purchase price."},
  {n:2,name:"Finance",short:"Finance",vote:"against",emotion:"angry",emoji:"😠",research:1,opinion:"Negative carry with no defended exit — this loan cannot refinance itself."},
  {n:3,name:"Accounting",short:"Accounting",vote:"against",emotion:"skeptical",emoji:"🤨",research:3,opinion:"In-place NOI exceeds gross rent. The number is mathematically impossible."},
  {n:4,name:"Legal & Structural",short:"Legal",vote:"against",emotion:"thinking",emoji:"🤔",research:2,opinion:"First-lien position is asserted but entirely unverified — no title, no UCC."},
  {n:5,name:"Insurance & Climate",short:"Insurance",vote:"for",emotion:"worried",emoji:"😟",research:1,opinion:"Sub-1.0x DSCR is thin, but insurable if we condition on a binder."},
  {n:6,name:"Sponsor & Fraud",short:"Fraud",vote:"against",emotion:"angry",emoji:"😠",research:2,opinion:"The track record is wholly self-reported. Assume fabricated until proven."},
  {n:7,name:"Portfolio & Concentration",short:"Portfolio",vote:"for",emotion:"thinking",emoji:"🤔",research:1,opinion:"No fund tape provided — but in isolation the concentration is tolerable."},
  {n:8,name:"Strategy",short:"Strategy",vote:"against",emotion:"disapprove",emoji:"😕",research:1,opinion:"A sub-1.0x story credit breaches our secured-lender thesis."}
 ],
 advocate:{n:9,name:"Deal Advocate",short:"Advocate",emotion:"handraise",emoji:"🙋",research:1,opinion:"Condition it on an appraisal and audited T-12 and it may be salvageable."}
};

const HEAD_COLORS = ['#FFD6A5','#FDFFB6','#CAFFBF','#9BF6FF','#A0C4FF','#BDB2FF','#FFC6FF','#FFADAD'];
const RX_FRAC = 0.44;   // horizontal radius, % of stage width
const RY = 310;         // vertical radius, px
const BASE_TOP = 380;   // px offset so the dome sits inside the 460px stage
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const seatLeftPct = [];

function renderHeader(){
  document.getElementById('dealName').textContent = COMMITTEE.deal.name;
  document.getElementById('dealMeta').innerHTML =
    '<b>' + COMMITTEE.deal.amount + '</b> · ' + COMMITTEE.deal.ltv;
  document.getElementById('leaningBadge').textContent = 'LEANING: ' + COMMITTEE.deal.leaning;
  const total = COMMITTEE.scrutiny.reduce((s,e)=>s+e.research,0) + COMMITTEE.advocate.research;
  document.getElementById('researchTotalNum').textContent = total;
}

function renderVoteBar(){
  const total = COMMITTEE.vote.for + COMMITTEE.vote.against;
  const forPct = (COMMITTEE.vote.for/total*100).toFixed(1);
  const againstPct = (COMMITTEE.vote.against/total*100).toFixed(1);
  const forEl = document.getElementById('voteFor');
  const againstEl = document.getElementById('voteAgainst');
  document.getElementById('voteForText').textContent = COMMITTEE.vote.for + ' FOR';
  document.getElementById('voteAgainstText').textContent = COMMITTEE.vote.against + ' AGAINST';
  requestAnimationFrame(()=>{
    forEl.style.width = forPct + '%';
    againstEl.style.width = againstPct + '%';
  });
}

function renderSeats(){
  const stage = document.getElementById('arcStage');
  COMMITTEE.scrutiny.forEach((expert,i)=>{
    const t = i/(COMMITTEE.scrutiny.length-1);
    const angleDeg = 180 + t*180;
    const angleRad = angleDeg * Math.PI/180;
    const leftPct = 50 + RX_FRAC*100*Math.cos(angleRad);
    const topPx = BASE_TOP + RY*Math.sin(angleRad);
    seatLeftPct.push(leftPct);

    const seat = document.createElement('div');
    seat.className = 'seat emotion-' + expert.emotion;
    seat.id = 'seat-' + i;
    seat.style.left = leftPct + '%';
    seat.style.top = topPx + 'px';

    const mouthClass = expert.vote === 'for' ? 'smile' : 'frown';
    const eyeDelay = (i*0.35).toFixed(2);

    seat.innerHTML =
      '<div class="face-wrap">' +
        '<div class="face" style="background:' + HEAD_COLORS[i] + '">' +
          '<div class="eye eye-l" style="animation-delay:' + eyeDelay + 's"></div>' +
          '<div class="eye eye-r" style="animation-delay:' + eyeDelay + 's"></div>' +
          '<div class="mouth ' + mouthClass + '" id="mouth-' + i + '"></div>' +
        '</div>' +
        '<div class="seat-emoji">' + expert.emoji + '</div>' +
      '</div>' +
      '<div class="chip">' +
        '<div class="chip-name">' + expert.short + '</div>' +
        '<div class="chip-row">' +
          '<span class="vote-dot ' + expert.vote + '"></span>' +
          '<span class="badge-research"><span class="icon">🔎</span>' + expert.research + '</span>' +
        '</div>' +
      '</div>';

    stage.appendChild(seat);
  });
}

function renderAdvocate(){
  document.getElementById('podiumResearch').innerHTML =
    '<span class="badge-research"><span class="icon">🔎</span>' + COMMITTEE.advocate.research + '</span>';
  typeWords(document.getElementById('podiumOpinion'), COMMITTEE.advocate.opinion, null, 70);
}

function typeWords(el, text, onDone, speed){
  el.textContent = '';
  if(reduced){ el.textContent = text; if(onDone) onDone(); return; }
  const words = text.split(' ');
  let i = 0;
  const timer = setInterval(()=>{
    el.textContent += (i===0 ? '' : ' ') + words[i];
    i++;
    if(i >= words.length){
      clearInterval(timer);
      if(onDone) onDone();
    }
  }, speed || 95);
}

let activeIdx = -1;
function activate(i){
  if(activeIdx >= 0){
    const prevSeat = document.getElementById('seat-' + activeIdx);
    if(prevSeat) prevSeat.classList.remove('active');
    const prevMouth = document.getElementById('mouth-' + activeIdx);
    if(prevMouth) prevMouth.classList.remove('talking');
  }
  activeIdx = i;
  const expert = COMMITTEE.scrutiny[i];
  const seat = document.getElementById('seat-' + i);
  seat.classList.add('active');
  const mouth = document.getElementById('mouth-' + i);
  mouth.classList.add('talking');

  document.getElementById('spotlightEmoji').textContent = expert.emoji;
  document.getElementById('spotlightName').textContent = expert.name;
  const dot = document.getElementById('spotlightDot');
  dot.style.background = expert.vote === 'for' ? 'var(--for-green)' : 'var(--against-red)';

  const clampedLeft = Math.min(92, Math.max(8, seatLeftPct[i]));
  document.getElementById('bubbleTail').style.left = clampedLeft + '%';

  typeWords(document.getElementById('spotlightText'), expert.opinion, ()=>{
    if(mouth) mouth.classList.remove('talking');
  });
}

function cycle(){
  const next = (activeIdx + 1) % COMMITTEE.scrutiny.length;
  activate(next);
}

function initChair(){
  const form = document.getElementById('chairForm');
  const input = document.getElementById('chairInput');
  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    input.value = '';
    input.blur();
  });
}

renderHeader();
renderVoteBar();
renderSeats();
renderAdvocate();
activate(0);
initChair();
setInterval(cycle, 5400);
</script>
</body>
</html>
