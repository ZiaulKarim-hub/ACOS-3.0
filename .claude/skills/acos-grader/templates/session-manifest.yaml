# acos-grader session manifest
# Generated by Phase 1 — single source of truth for the run.
# All downstream agents read this file.

session_id: "grader-YYYYMMDDTHHMMSS"              # UTC timestamp
created_at: "2026-04-18T14:30:00Z"
status: "active"                                  # active | complete | aborted

# --- Inputs from Phase 0 ----------------------------------------------------
rubric_path: "/absolute/path/to/rubric.docx"
scripts_folder: "/absolute/path/to/submissions/"
total_floor: 70
total_ceiling: 90
subject_subtype: "Investment Management"          # one of the 7 subtypes
batch_window: 5
max_iters: 5
output_path: "/absolute/path/to/grades.xlsx"

# --- Questions / Requirements (optional) -----------------------------------
# Populated only when --questions-file is supplied. When null, graders
# receive only the rubric + paper text (original skill behavior).
questions:
  enabled: false
  source_path: null                               # original file path (docx/pdf/xlsx/txt)
  extracted_text_path: null                      # e.g., "${SESSION_DIR}/questions.txt"
  extraction_method: null                        # "text_layer" | "ocr" | "docx" | "txt"
  chars: null

# --- Derived state ---------------------------------------------------------
rubric_parsed_path: ".acos/state/grader-sessions/{session_id}/rubric.yaml"
total_points: 100                                 # sum of all criterion points
target_mean: 80                                   # (floor + ceiling) / 2
target_stdev: 5                                   # (ceiling - floor) / 4

# --- Paper inventory --------------------------------------------------------
papers:
  - paper_id: "STUDENT_001"
    source_path: "/absolute/path/to/submissions/STUDENT_001.pdf"
    source_type: "typed"                          # typed | scan
    ingested_text_path: ".acos/state/grader-sessions/{session_id}/papers/STUDENT_001.txt"
    status: "ingested"                            # ingested | ocr_failed | skipped

  - paper_id: "STUDENT_002"
    source_path: "/absolute/path/to/submissions/STUDENT_002.pdf"
    source_type: "scan"
    ingested_text_path: ".acos/state/grader-sessions/{session_id}/papers/STUDENT_002.txt"
    status: "ingested"

# --- Per-criterion derived ranges ------------------------------------------
# Pro-rata: criterion_floor = (total_floor / total_points) × criterion_points
criterion_ranges:
  - criterion_id: "criterion_1"
    points_total: 10
    floor: 7.0
    ceiling: 9.0
  - criterion_id: "criterion_2"
    points_total: 15
    floor: 10.5
    ceiling: 13.5
  # ... one entry per rubric criterion

# --- Run config ------------------------------------------------------------
consensus:
  numerical_spread_pct: 0.05                      # ±5%
  near_zero_guardrail_absolute: 0.5               # absolute tolerance floor, ALWAYS applied: PASS if relative ≤5% OR absolute ≤ this
  reasoning_similarity_pct: 0.90                  # ≥90% LLM-judge

model_mix:
  graders:
    - role: "grader-opus-A"
      agent_type: "grader-opus"
    - role: "grader-opus-B"
      agent_type: "grader-opus"
    - role: "grader-sonnet"
      agent_type: "grader-sonnet"
  qa: "grader-qa"
  synth: "grader-synth"

# --- Calibration (only populated if --calibrate N was set) ----------------
calibration:
  enabled: false                                  # true if --calibrate set
  calibrate_n: null                               # sample size, if enabled
  calibration_paper_ids: []                       # paper IDs used for calibration
  calibration_complete: false
  report_path: null                               # .../audit/calibration-report.yaml

calibration_hints: []
  # When populated, each entry looks like:
  # - criterion_id: "criterion_3"
  #   hint: |
  #     Short 2-3 sentence addendum describing how to interpret this criterion.
  #     Injected into grader prompts for non-calibration papers.

# --- Progress tracking (updated as orchestrators complete) ----------------
progress:
  papers_total: 47
  papers_complete: 0
  papers_in_flight: 0
  papers_inconclusive: 0

# --- Output state (populated in Phase 3) ----------------------------------
output:
  xlsx_written: false
  xlsx_path: null
  cohort_raw_mean: null
  cohort_raw_stdev: null
  cohort_curved_mean: null
  cohort_curved_stdev: null
