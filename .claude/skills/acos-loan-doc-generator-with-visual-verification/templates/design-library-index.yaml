# ═══════════════════════════════════════════════════════════════════════════════
# ACOS Loan Document Generator — Design Library Index
# ═══════════════════════════════════════════════════════════════════════════════
#
# Location: .acos/loan-doc-generator/design-library/index.yaml
# Template: .claude/skills/acos-loan-doc-generator/templates/design-library-index.yaml
#
# This file is the master index of all extracted design patterns.
# Each entry represents one design extraction for one document type.
# The skill appends to this file automatically after Phase 1 completes.
#
# document_id values match entries in doc-type-catalog.yaml (hierarchical format):
#   credit-underwriting/internal-credit-memo | credit-underwriting/external-credit-memo |
#   credit-underwriting/term-sheet | credit-underwriting/deal-memo | etc.
#
# Step 0.3 filters entries by document_id to find available designs.
# ═══════════════════════════════════════════════════════════════════════════════

version: "2.0"
entries: []

# Entry schema (appended by skill after each Phase 1 extraction):
#
# - design_id: ""
#     # Unique identifier: {document_slug}-{YYYYMMDD}
#     # document_slug = part after "/" in document_id (e.g., "internal-credit-memo")
#
#   document_id: ""
#     # Hierarchical document identifier from doc-type-catalog.yaml
#     # e.g., "credit-underwriting/internal-credit-memo"
#     # Used by Step 0.3 to filter designs for the selected document type
#
#   category_id: ""
#     # Category grouping identifier (e.g., "credit-underwriting")
#     # Used for display grouping, not for filtering
#
#   label: ""
#     # Human-readable display name shown in Step 0.3 menu
#     # e.g., "Beehive Waldorf Style", "Lux 2 Portfolio Style"
#
#   date_added: ""
#     # YYYY-MM-DD
#
#   example_count: 0
#     # Number of example documents analyzed for this design
#
#   design_patterns_path: ""
#     # Relative path to design-patterns.yaml from project root
#
#   benchmark_criteria_path: ""
#     # Relative path to benchmark-criteria.yaml from project root
#
#   sample_files: []
#     # List of absolute paths to original sample documents
#     # Shown as file:// links when user requests preview in Step 0.3
