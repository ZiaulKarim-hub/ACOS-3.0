# ═══════════════════════════════════════════════════════════════════════════════
# ACOS Loan Document Generator — Benchmark Criterion Schema
# ═══════════════════════════════════════════════════════════════════════════════
#
# Output schema for Phase 1 Track B (Benchmark Extraction).
# Each benchmark extractor agent produces one of these per dimension.
# The synthesizer merges all findings into benchmark-criteria.yaml.
#
# validator_tier values:
#   structural — simple checklist checks, assigned to Haiku validators
#   quality    — judgment-based checks, assigned to Sonnet validators
#
# This file is a TEMPLATE showing the expected structure.
# ═══════════════════════════════════════════════════════════════════════════════

# Which benchmark dimension this covers
dimension: ""

# Agent that produced this extraction
agent_id: ""
date_analyzed: ""

# Sources analyzed for this dimension
sources_analyzed:
  - filename: ""
    path: ""

# Extracted criteria — each must be testable and objective
criteria:
  - id: ""
    # Short descriptive name
    name: ""
    # Detailed description of what this criterion checks
    description: ""
    # How important is this criterion
    # required: MUST pass for document to be accepted
    # recommended: SHOULD pass, failures noted but don't block
    # nice-to-have: MAY pass, informational only
    severity: "required|recommended|nice-to-have"
    # Which document section(s) this criterion applies to ("all" for cross-cutting)
    applies_to: []
    # Validator tier — determines which agent validates this criterion
    # structural: simple presence/format check → Haiku validator
    # quality: requires judgment or analysis → Sonnet validator
    validator_tier: "structural|quality"
    # How to test this criterion — must be objective and repeatable
    test_method: ""
    # What constitutes a pass
    pass_condition: ""
    # What constitutes a fail
    fail_condition: ""
    # Examples from analyzed documents demonstrating this criterion
    examples:
      - source: ""
        excerpt: ""

# Cross-cutting observations about this dimension
observations: ""

# Confidence in these criteria (0.0-1.0)
confidence: 0.0
