# ═══════════════════════════════════════════════════════════════════════════════
# ACOS Loan Document Generator — Loan Data Brief Schema
# ═══════════════════════════════════════════════════════════════════════════════
#
# Output schema for the compact per-section briefing document (OUTPUT 2)
# produced by the Phase 2 Loan Data Synthesizer.
#
# This compact brief is given to Phase 3 section designers instead of the
# full loan-data.yaml. It reduces Phase 3 token consumption by ~60k tokens
# per iteration while preserving quality for most sections.
#
# Sections with full_data_access: true in doc-type-catalog.yaml are NOT
# included in this brief — those designers receive loan-data.yaml directly.
#
# Rules for the synthesizer producing this file:
# - 3–8 key data points per section maximum
# - Essential entities and financial figures only (no duplicates)
# - Every fact must have a source citation
# - Summarize — do NOT truncate. Distill the most section-relevant facts.
# ═══════════════════════════════════════════════════════════════════════════════

# Metadata
loan_folder_path: ""
generated_from_session: ""
date_generated: ""
full_data_access_sections_excluded: []
  # List of sections NOT included here because they use full loan-data.yaml

# Per-section compact briefing
# Key: section name (matching canonical section names from design-patterns.yaml)
# Value: list of concise data points
sections:
  "[Section Name]":
    key_facts:
      - fact: ""
        value: ""
        source_document: ""
        source_page: ""
    key_entities:
      - name: ""
        role: ""
    key_financials:
      - metric: ""
        value: ""
        period: ""
    data_gaps:
      - "Description of expected data that was not found"

# Global quick-reference (available to all designers regardless of section)
global_reference:
  loan_amount: ""
  borrower_name: ""
  property_address: ""
  loan_type: ""
  interest_rate: ""
  maturity_date: ""
  lender_name: ""
