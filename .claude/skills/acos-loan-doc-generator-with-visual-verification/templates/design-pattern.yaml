# ═══════════════════════════════════════════════════════════════════════════════
# ACOS Loan Document Generator — Design Pattern Schema
# ═══════════════════════════════════════════════════════════════════════════════
#
# Output schema for Phase 1 Track A (Design Extraction).
# Each design extractor agent produces one of these per example document.
# The synthesizer merges all findings into design-patterns.yaml.
#
# This file is a TEMPLATE showing the expected structure.
# ═══════════════════════════════════════════════════════════════════════════════

# Metadata about the source document
source_document:
  filename: ""
  path: ""
  document_type: ""       # category_id this document represents
  page_count: 0
  date_analyzed: ""

# Section structure found in this example
sections:
  - name: ""
    order: 0
    # Approximate length in paragraphs
    typical_length: 0
    # What kind of content appears here
    content_type: "narrative|data-heavy|mixed|tabular|legal"
    # Subsections if any
    subsections: []
    # Specific content conventions for this section
    content_notes: ""

# Formatting patterns observed
formatting:
  # Header style (e.g., "## Title", "TITLE", "Title:")
  header_style: ""
  # How tables are presented
  table_style: "markdown|ascii|embedded"
  # Number formatting (e.g., "$1,234.56", "1234.56", "$1.2M")
  number_format: ""
  # Date formatting (e.g., "MM/DD/YYYY", "Month DD, YYYY")
  date_format: ""
  # Percentage formatting (e.g., "12.5%", "0.125")
  percentage_format: ""
  # Currency conventions
  currency_format: ""
  # Bullet point style
  bullet_style: ""
  # Page break conventions between sections
  section_separator: ""

# Language and tone patterns
language:
  # Overall tone (e.g., "formal-institutional", "technical-analytical", "marketing")
  tone: ""
  # Point of view (e.g., "third-person", "first-person-plural")
  point_of_view: ""
  # Tense (e.g., "present", "past", "mixed")
  tense: ""
  # Common phrases or constructions observed
  notable_phrases:
    - phrase: ""
      context: ""
  # Hedging language patterns (e.g., "approximately", "management estimates")
  hedging_patterns: []

# Data presentation conventions
data_presentation:
  # How financial figures are introduced
  financial_figure_style: ""
  # How comparisons are made (YoY, vs. budget, vs. peers)
  comparison_style: ""
  # How risk factors are presented
  risk_presentation: ""
  # How recommendations or conclusions are phrased
  conclusion_style: ""
  # How data gaps or unavailable info is noted
  data_gap_notation: ""

# Footer and document-level structure
# IMPORTANT: Document here only — do NOT include footer as a "section"
document_level:
  # How the document header/title is structured
  title_format: ""
  # Table of contents: present/absent, style
  toc_style: ""
  # Footer content and placement (signature block, certification, contact info)
  footer_convention: ""
  # Page numbering style if any
  page_numbering: ""
  # Page break conventions: where sections force new pages, how elements are kept together
  page_break_strategy: ""
  # Pagination quality: are headings protected from orphaning, do tables stay together
  pagination_quality: ""

# Additional observations
notes: ""
