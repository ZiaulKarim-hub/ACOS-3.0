# Epic Plan Template
# Created by The Architect

epic_id: "EPIC-[NNN]"
vision_id: "VISION-[PROJECT-NAME]"
created_date: "[YYYY-MM-DD]"
created_by: the-architect
status: "[planning | in_progress | complete]"

# Epic overview
title: "[Epic Title]"
description: |
  [Detailed description of what this epic delivers.
  What capability will users have when this is complete?]

# Why this epic matters
value_proposition: |
  [Why is this epic important? What user need does it address?]

# Acceptance criteria for the entire epic
acceptance_criteria:
  - "[ ] [Criterion 1 - What must be true when epic is complete]"
  - "[ ] [Criterion 2]"
  - "[ ] [Criterion 3]"

# Dependencies
dependencies:
  epics:
    - epic_id: "[EPIC-XXX]"
      what_it_provides: "[What we need from this epic]"
  external:
    - "[Any external dependencies]"

# Story breakdown
stories:
  - story_id: "STORY-[EPIC]-001"
    title: "[Story Title]"
    description: "[User-facing feature description]"
    priority: "[high | medium | low]"
    effort: "[S | M | L | XL]"
    dependencies: []

  - story_id: "STORY-[EPIC]-002"
    title: "[Story Title]"
    description: "[Description]"
    priority: "[priority]"
    effort: "[effort]"
    dependencies:
      - "STORY-[EPIC]-001"

# Execution order
execution_order:
  - phase: 1
    stories: ["STORY-[EPIC]-001"]
  - phase: 2
    stories: ["STORY-[EPIC]-002", "STORY-[EPIC]-003"]

# Technical considerations
technical_notes: |
  [Any technical considerations specific to this epic]

# Files likely to be involved
primary_files:
  - "[path/to/directory/]"
  - "[path/to/specific/file.ts]"

# Review considerations
review_focus:
  - "[What reviewers should pay special attention to]"

# Effort estimate
effort_estimate: "[S | M | L | XL]"

# Notes
notes: |
  [Any additional notes]
