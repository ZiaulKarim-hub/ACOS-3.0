# Story Plan Template
# Created by The Architect

story_id: "STORY-[EPIC]-[NNN]"
epic_id: "EPIC-[NNN]"
vision_id: "VISION-[PROJECT-NAME]"
created_date: "[YYYY-MM-DD]"
created_by: the-architect
status: "[planning | in_progress | complete]"

# Story overview
title: "[Story Title]"
description: |
  [Detailed description of this user-facing feature.
  What can the user do when this story is complete?]

# User story format
user_story: |
  As a [type of user],
  I want to [action/goal],
  So that [benefit/reason].

# Acceptance criteria
acceptance_criteria:
  - "[ ] [Criterion 1 - Specific, testable condition]"
  - "[ ] [Criterion 2]"
  - "[ ] [Criterion 3]"
  - "[ ] [Criterion 4]"

# Dependencies
dependencies:
  stories:
    - story_id: "[STORY-XXX-NNN]"
      what_it_provides: "[What we need from this story]"
  slices: []  # Populated as slices are created

# Slice breakdown
slices:
  - slice_id: "SLICE-[STORY]-001"
    title: "[Slice Title]"
    description: "[Atomic unit of work]"
    effort: "[S | M | L]"
    dependencies: []

  - slice_id: "SLICE-[STORY]-002"
    title: "[Slice Title]"
    description: "[Description]"
    effort: "[effort]"
    dependencies:
      - "SLICE-[STORY]-001"

# Execution order
execution_order:
  - phase: 1
    slices: ["SLICE-[STORY]-001"]
  - phase: 2
    slices: ["SLICE-[STORY]-002", "SLICE-[STORY]-003"]

# Files involved
files_involved:
  create:
    - "[path/to/new/file.ts]"
  modify:
    - "[path/to/existing/file.ts]"

# UI/UX notes (if applicable)
ui_notes: |
  [Any UI/UX considerations, mockup references, etc.]

# Technical notes
technical_notes: |
  [Any technical considerations specific to this story]

# Review considerations
review_focus:
  - "[What reviewers should focus on for this story]"

# Effort estimate
effort_estimate: "[S | M | L | XL]"

# Notes
notes: |
  [Any additional notes]
