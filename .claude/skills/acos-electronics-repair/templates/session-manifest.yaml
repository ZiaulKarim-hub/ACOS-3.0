# Electronics Repair Session Manifest
# Auto-generated by /acos-electronics-repair

session_id: "{session_id}"
created_at: "{timestamp}"
status: "in_progress"  # in_progress | paused | completed | abandoned

# Device Information (Phase 0)
device:
  type_category: ""      # battery | usb_low_voltage | wall_powered | mains_high_voltage | automotive | other
  brand: ""
  model: ""
  description: ""
  schematic_available: false

# Symptom & History (Phase 0)
symptom:
  category: ""           # no_power | partial_function | intermittent | overheating | smoke_damage | noise | other
  description: ""
  history: ""            # What happened before failure
  duration: ""           # How long has it been failing

# User Equipment (Phase 0)
tools:
  multimeter: true
  soldering_iron: false
  hot_air_station: false
  oscilloscope: false
  power_supply: false
  esd_protection: false

# Safety Assessment
safety:
  category: ""           # low_voltage | mains_connected | high_voltage | mixed
  warnings_displayed: false
  user_acknowledged: false

# Phase Tracking
phases:
  phase_0_safety: null         # null | completed | skipped
  phase_1_indexing: null
  phase_2_inspection: null
  phase_3_diagnostic: null     # null | in_progress | completed
  phase_4_repair: null
  phase_4_5_prevention: null

# Component Statistics
components:
  total_indexed: 0
  visually_suspect: 0
  tested: 0
  cleared: 0
  confirmed_faulty: 0

# Diagnosis (Phase 3 result)
diagnosis:
  confirmed: false
  faulty_components: []    # List of component IDs
  root_cause: ""
  root_cause_chain: []     # If one failure caused another

# Repair (Phase 4 result)
repair:
  components_replaced: []
  post_repair_validated: false
  device_functional: null  # null | true | false

# Completion
completion_date: null
total_tests_performed: 0
session_notes: ""
