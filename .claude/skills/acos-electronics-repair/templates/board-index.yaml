# Circuit Board Component Index
# Auto-generated by /acos-electronics-repair Phase 1

session_id: "{session_id}"
created_at: "{timestamp}"
last_updated: "{timestamp}"

# Board Information
board:
  description: ""
  dimensions_approx: ""    # e.g., "15cm x 10cm"
  layer_count_guess: ""    # e.g., "2-layer" or "4-layer"
  photos:
    - path: ""
      type: "top"          # top | bottom | closeup | damage
      description: ""

# Functional Zones
zones:
  - zone_id: "power"
    label: "Power Supply / Input"
    color: "#FF4444"       # Red
    components: []         # List of component IDs in this zone

  - zone_id: "regulation"
    label: "Voltage Regulation"
    color: "#FF8800"       # Orange
    components: []

  - zone_id: "logic"
    label: "Logic / MCU / Digital"
    color: "#4488FF"       # Blue
    components: []

  - zone_id: "output"
    label: "Output Stage / Drivers"
    color: "#44BB44"       # Green
    components: []

  - zone_id: "interface"
    label: "Connectors / Interface"
    color: "#AA44FF"       # Purple
    components: []

  - zone_id: "protection"
    label: "Protection Circuits"
    color: "#FFBB00"       # Yellow
    components: []

  - zone_id: "other"
    label: "Other / Unclassified"
    color: "#888888"       # Gray
    components: []

# Component Index
components:
  # Example entry:
  # - id: 1
  #   designator: "U1"              # Silkscreen marking (if readable)
  #   type: "Voltage Regulator"     # Component type
  #   subtype: "Linear (LDO)"      # Specific subtype
  #   description: "LM7805CT, TO-220 package"
  #   value: "5V output"
  #   marking: "LM7805CT"          # Text printed on component
  #   package: "TO-220"
  #   location: "Top-left, near DC input jack"
  #   zone: "regulation"
  #   position_approx:              # For SVG map placement
  #     x_pct: 15                   # Percentage from left edge
  #     y_pct: 20                   # Percentage from top edge
  #   visual_status: "OK"           # OK | SUSPECT | DAMAGED | CLEARED | FAULTY
  #   visual_notes: ""
  #   test_results: []              # Populated during Phase 3
  #   diagnosis: null               # null | "cleared" | "faulty"
