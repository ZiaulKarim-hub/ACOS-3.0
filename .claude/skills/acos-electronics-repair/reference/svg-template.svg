<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Arial, sans-serif">
  <!-- Board outline -->
  <rect x="50" y="30" width="700" height="420" rx="8" fill="#1a5c2a" stroke="#0d3318" stroke-width="2"/>

  <!-- Example: Component marker (numbered circle) -->
  <!-- Status: OK = green fill, SUSPECT = yellow fill, DAMAGED = red fill -->
  <circle cx="150" cy="120" r="16" fill="#FF4444" fill-opacity="0.3" stroke="#FF4444" stroke-width="2"/>
  <text x="150" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">1</text>

  <circle cx="250" cy="120" r="16" fill="#FFBB00" fill-opacity="0.3" stroke="#FFBB00" stroke-width="2"/>
  <text x="250" y="125" text-anchor="middle" fill="white" font-size="14" font-weight="bold">2</text>

  <circle cx="400" cy="200" r="16" fill="#4488FF" fill-opacity="0.3" stroke="#4488FF" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" fill="white" font-size="14" font-weight="bold">3</text>

  <circle cx="550" cy="300" r="16" fill="#44BB44" fill-opacity="0.3" stroke="#44BB44" stroke-width="2"/>
  <text x="550" y="305" text-anchor="middle" fill="white" font-size="14" font-weight="bold">4</text>

  <!-- Zone labels -->
  <rect x="70" y="60" width="200" height="120" rx="4" fill="none" stroke="#FF4444" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="75" y="55" fill="#FF8888" font-size="11">POWER</text>

  <rect x="310" y="140" width="200" height="120" rx="4" fill="none" stroke="#4488FF" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="315" y="135" fill="#88AAFF" font-size="11">LOGIC</text>

  <rect x="470" y="240" width="200" height="120" rx="4" fill="none" stroke="#44BB44" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="475" y="235" fill="#88DD88" font-size="11">OUTPUT</text>

  <!-- Legend -->
  <rect x="50" y="465" width="700" height="30" fill="#1a1a1a" rx="4"/>
  <circle cx="75" cy="480" r="6" fill="#FF4444" fill-opacity="0.5" stroke="#FF4444"/>
  <text x="85" y="484" fill="#ccc" font-size="10">Power</text>
  <circle cx="140" cy="480" r="6" fill="#4488FF" fill-opacity="0.5" stroke="#4488FF"/>
  <text x="150" y="484" fill="#ccc" font-size="10">Logic</text>
  <circle cx="200" cy="480" r="6" fill="#44BB44" fill-opacity="0.5" stroke="#44BB44"/>
  <text x="210" y="484" fill="#ccc" font-size="10">Output</text>
  <circle cx="270" cy="480" r="6" fill="#AA44FF" fill-opacity="0.5" stroke="#AA44FF"/>
  <text x="280" y="484" fill="#ccc" font-size="10">Interface</text>
  <text x="370" y="484" fill="#888" font-size="10">|</text>
  <circle cx="395" cy="480" r="6" fill="none" stroke="#FFBB00" stroke-width="2"/>
  <text x="405" y="484" fill="#FFBB00" font-size="10">SUSPECT</text>
  <circle cx="480" cy="480" r="6" fill="none" stroke="#FF0000" stroke-width="2"/>
  <text x="490" y="484" fill="#FF4444" font-size="10">DAMAGED</text>
  <circle cx="560" cy="480" r="6" fill="none" stroke="#44FF44" stroke-width="2"/>
  <text x="570" y="484" fill="#44FF44" font-size="10">CLEARED</text>
</svg>
