# ═══════════════════════════════════════════════════════════════════════════════
# ACOS Loan Document Generator — Design Library Index
# ═══════════════════════════════════════════════════════════════════════════════
#
# Location: .acos/loan-doc-generator/design-library/index.yaml
# Template: .claude/skills/acos-loan-doc-generator/templates/design-library-index.yaml
#
# This file is the master index of all extracted design patterns.
# Each entry represents one design (one extraction session) for one category.
# The skill appends to this file automatically after Phase 1 completes.
#
# category values match category_id fields in doc-type-catalog.yaml:
#   credit-memo-internal | credit-memo-external | loan-agreement |
#   guarantee-document | deal-document | foreclosure-document |
#   legal-litigation-document | closing-admin-document |
#   investor-reporting-document | other
# ═══════════════════════════════════════════════════════════════════════════════

version: "1.0"
entries: []

# Entry schema (appended by skill after each Phase 1 extraction):
#
# - design_id: ""
#     # Unique identifier: {category_id}-{YYYYMMDD} or user-provided label slug
#
#   category: ""
#     # category_id from doc-type-catalog.yaml — used for library filtering
#
#   label: ""
#     # Human-readable display name shown in Step 0.3 menu
#
#   source_path: ""
#     # Absolute path to example documents used for this extraction
#
#   source_fingerprint: ""
#     # sha256(category_id + ":" + resolved_absolute_source_path)
#     # Used for novelty detection — prevents duplicate extractions
#
#   date_added: ""
#     # YYYY-MM-DD
#
#   example_count: 0
#     # Number of example documents analyzed
#
#   extraction_session_id: ""
#     # Session ID of the Phase 1 extraction run
#
#   design_patterns_path: ""
#     # Absolute path to design-patterns.yaml from this extraction
#
#   benchmark_criteria_path: ""
#     # Absolute path to benchmark-criteria.yaml from this extraction
