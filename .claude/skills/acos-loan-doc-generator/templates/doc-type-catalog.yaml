# ===============================================================================
# ACOS Loan Document Generator — Document Type Catalog
# ===============================================================================
#
# Defines all supported document types using hierarchical document_id values.
# Each entry provides:
#   - document_id: hierarchical identifier (category/document-name)
#   - category_id: grouping category for the document
#   - default_sections: section list with full_data_access flag
#   - benchmark_dimensions: for Phase 1 Track B + Phase 4 quality validators
#   - structural_benchmark_items: simple checklist items for Haiku validators
#   - designer_tone_directive: injected into every Phase 3 section designer
#   - critical_figures: document-specific financial figures for human-in-the-loop
#     Each figure has: key, label, hint, group (for display), required (bool)
#     The skill generates a dynamic YAML template from these at runtime.
#
# full_data_access: true  -> section designer receives full loan-data.yaml
# full_data_access: false -> section designer receives section brief only
#                           (can still read loan-data.yaml via Read tool if needed)
#
# user_defined: true  -> entry was created in-wizard via Step 0.2N (not built-in)
#                        These entries are functionally identical to built-in types.
#                        The flag helps distinguish user-created types for potential
#                        cleanup or export. Omitted for built-in types (defaults to false).
# ===============================================================================

documents:

  # ============================================================================
  # CATEGORY A: Credit Underwriting
  # ============================================================================

  # -- A1. Internal Credit Memo ------------------------------------------------
  - document_id: credit-underwriting/internal-credit-memo
    category_id: credit-underwriting
    label: "Credit Memo — Internal"
    default_page_range: [8, 15]
    default_sections:
      - name: "Executive Summary"
        full_data_access: true
      - name: "Borrower & Sponsor Overview"
        full_data_access: false
      - name: "Transaction Summary"
        full_data_access: false
      - name: "Financial Analysis"
        full_data_access: false
      - name: "Collateral Analysis"
        full_data_access: false
      - name: "Risk Assessment"
        full_data_access: false
      - name: "Stress Testing"
        full_data_access: false
      - name: "Mitigants & Strengths"
        full_data_access: false
      - name: "Conditions & Covenants"
        full_data_access: false
      - name: "Recommendation"
        full_data_access: true
    benchmark_dimensions:
      - "Required Sections Completeness"
      - "Data Completeness & Accuracy"
      - "Risk Coverage"
      - "Financial Analysis Standards"
      - "Stress Testing Rigor"
      - "Recommendation Clarity"
      - "Language & Tone"
    structural_benchmark_items:
      - "All 10 required sections are present in order"
      - "Table of contents present and accurate"
      - "Single footer/signature block at document end only (STRUCT-001)"
      - "No footer or signature content embedded within section bodies"
      - "Date and loan reference on title page"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    must_have_charts:
      - { id: "recommendation_badge", section: "header", type: "matrix" }
      - { id: "key_metrics_table", section: "Executive Summary", type: "rag_table" }
      - { id: "capital_stack", section: "Transaction Summary", type: "bar" }
      - { id: "dscr_gauge", section: "Financial Analysis", type: "gauge" }
      - { id: "noi_waterfall", section: "Financial Analysis", type: "waterfall" }
      - { id: "pillar_radar", section: "Risk Assessment", type: "radar" }
    available_charts:
      - { id: "sensitivity_heatmap", label: "Sensitivity Heatmap", section: "Risk Assessment" }
      - { id: "cap_rate_comparison", label: "Cap Rate Comparison", section: "Collateral Analysis" }
      - { id: "cash_flow_trend", label: "Cash Flow Trend", section: "Financial Analysis" }
      - { id: "expense_breakdown", label: "Expense Breakdown", section: "Financial Analysis" }
      - { id: "amortization_schedule", label: "Amortization Schedule", section: "Financial Analysis" }
    recommendation_matrix:
      formula: "Composite = (Property * 0.30) + (Financial * 0.30) + (Sponsor * 0.25) + (Market * 0.15)"
      thresholds:
        approve: { min: 7.5, color: "#22C55E" }
        conditional: { min: 5.5, color: "#EAB308" }
        watchlist: { min: 4.5, color: "#F97316" }
        decline: { min: 0, color: "#EF4444" }
      research_file: ".acos/loan-doc-generator/research/pe-lending-ratios-research.yaml"
    critical_figures:
      # -- Loan Terms --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000"
        group: "Loan Terms"
        required: true
      - key: interest_rate
        label: "Interest Rate"
        hint: "e.g., 7.25% or SOFR + 350bps"
        group: "Loan Terms"
        required: true
      - key: loan_term_months
        label: "Loan Term"
        hint: "e.g., 36 months"
        group: "Loan Terms"
        required: true
      - key: maturity_date
        label: "Maturity Date"
        hint: "e.g., 2029-03-15"
        group: "Loan Terms"
        required: false
      - key: amortization
        label: "Amortization"
        hint: "e.g., 360 months or Interest Only"
        group: "Loan Terms"
        required: false
      # -- Property / Collateral --
      - key: property_value
        label: "Property Value (Appraised)"
        hint: "e.g., 22000000"
        group: "Collateral"
        required: true
      - key: property_type
        label: "Property Type"
        hint: "e.g., Multifamily, Office, Industrial"
        group: "Collateral"
        required: false
      - key: occupancy_rate
        label: "Occupancy Rate"
        hint: "e.g., 94.5%"
        group: "Collateral"
        required: false
      # -- Financial Metrics --
      - key: noi
        label: "NOI"
        hint: "Net Operating Income, e.g., 1650000"
        group: "Financial Metrics"
        required: true
      - key: dscr
        label: "DSCR"
        hint: "Debt Service Coverage Ratio, e.g., 1.35"
        group: "Financial Metrics"
        required: true
      - key: ltv
        label: "LTV"
        hint: "Loan-to-Value, e.g., 68.2%"
        group: "Financial Metrics"
        required: true
      - key: cap_rate
        label: "Cap Rate"
        hint: "e.g., 7.5%"
        group: "Financial Metrics"
        required: false
      - key: debt_yield
        label: "Debt Yield"
        hint: "e.g., 11.0%"
        group: "Financial Metrics"
        required: false
      # -- Borrower --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Borrower"
        required: true
      - key: sponsor_name
        label: "Sponsor Name"
        hint: "e.g., John Smith"
        group: "Borrower"
        required: false
    designer_tone_directive: |
      This is an INTERNAL credit memo for the credit committee. Be direct and
      analytical. Lead with risks, not strengths. Every material risk must be
      named, quantified where possible, and accompanied by a specific mitigant.
      Stress test scenarios must be conservative and specific. The recommendation
      must be unambiguous. Tone: formal institutional analysis. Do not soften or
      hedge around negative findings — the committee needs the full picture.

  # -- A2. External Credit Memo ------------------------------------------------
  - document_id: credit-underwriting/external-credit-memo
    category_id: credit-underwriting
