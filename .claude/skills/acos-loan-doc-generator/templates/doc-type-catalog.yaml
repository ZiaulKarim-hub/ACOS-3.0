  # -- F2. FIRPTA Certificate --------------------------------------------------
  - document_id: other/firpta-certificate
    category_id: other
    label: "FIRPTA Certificate"
    default_page_range: [1, 2]
    default_sections:
      - name: "Title"
        full_data_access: true
      - name: "Statutory Reference"
        full_data_access: true
      - name: "Certification Statements"
        full_data_access: true
      - name: "Penalty of Perjury Declaration"
        full_data_access: false
      - name: "Signature Block"
        full_data_access: false
    benchmark_dimensions:
      - "Statutory Reference Accuracy"
      - "Certification Statements Completeness"
      - "TIN/EIN Inclusion"
      - "Penalty of Perjury Language"
      - "IRS Compliance Standards"
      - "Legal Precision"
    structural_benchmark_items:
      - "All 5 required sections present in order"
      - "IRC Section 1445 and/or 897 correctly referenced"
      - "Non-foreign person certification explicitly stated"
      - "TIN or EIN included (marked SENSITIVE)"
      - "Entity address included"
      - "Penalty of perjury declaration present with standard language"
      - "Signature block at document end only (STRUCT-001)"
      - "No signature content embedded within section bodies"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Certifying Entity --
      - key: entity_name
        label: "Entity Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Certifying Entity"
        required: true
      - key: tin_ein
        label: "TIN/EIN (SENSITIVE)"
        hint: "e.g., 12-3456789"
        group: "Certifying Entity"
        required: true
      - key: entity_address
        label: "Entity Address"
        hint: "e.g., 123 Main St, Suite 100, City, ST 12345"
        group: "Certifying Entity"
        required: true
      # -- Transaction --
      - key: property_address
        label: "Property Address"
        hint: "e.g., 456 Oak Ave, City, ST 67890"
        group: "Transaction"
        required: true
      - key: transferee_name
        label: "Transferee Name"
        hint: "e.g., XYZ Acquisition Corp"
        group: "Transaction"
        required: true
    designer_tone_directive: |
      This is a FIRPTA (Foreign Investment in Real Property Tax Act) certificate —
      an IRS compliance document. Tone must follow statutory language precisely.
      The certificate must reference the correct IRC sections (1445, 897). The
      certification that the transferor is not a foreign person must be explicit
      and use standard FIRPTA language. The TIN/EIN must be included but flagged
      as SENSITIVE. The penalty of perjury declaration must use the standard IRS
      formulation. This is a compliance document — accuracy and statutory
      conformance are paramount. Do not improvise language; follow established
      FIRPTA certificate conventions.

