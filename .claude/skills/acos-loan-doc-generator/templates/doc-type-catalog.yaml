        group: "Deal Terms"
        required: true
      - key: ltv
        label: "LTV"
        hint: "Loan-to-Value, e.g., 68.2%"
        group: "Deal Terms"
        required: true
      - key: dscr
        label: "DSCR"
        hint: "Debt Service Coverage Ratio, e.g., 1.35"
        group: "Deal Terms"
        required: false
      # -- Collateral --
      - key: property_value
        label: "Property Value"
        hint: "e.g., 22000000"
        group: "Collateral"
        required: true
      - key: noi
        label: "NOI"
        hint: "Net Operating Income, e.g., 1650000"
        group: "Collateral"
        required: false
      # -- Principals --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Principals"
        required: true
      - key: sponsor_name
        label: "Sponsor Name"
        hint: "e.g., John Smith"
        group: "Principals"
        required: false
    designer_tone_directive: |
      This is a concise committee presentation — a deal memo. Lead with the
      investment thesis, not background. The committee has limited time: every
      sentence must earn its place. Risk factors must be specific and paired
      with concrete mitigants. The recommendation must be unambiguous. Tone:
      confident, analytical, direct. Avoid hedging language. If the deal has
      weaknesses, name them plainly and explain why the deal still works.

  # -- A5. Scoping Letter ------------------------------------------------------
  - document_id: credit-underwriting/scoping-letter
    category_id: credit-underwriting
    label: "Scoping Letter"
    default_page_range: [1, 3]
    default_sections:
      - name: "Introduction"
        full_data_access: true
      - name: "Proposed Terms"
        full_data_access: true
      - name: "Conditions & Assumptions"
        full_data_access: false
      - name: "Next Steps"
        full_data_access: false
      - name: "Disclaimer"
        full_data_access: false
    benchmark_dimensions:
      - "Preliminary Terms Clarity"
      - "Non-Binding Language Adequacy"
      - "Conditions & Assumptions Coverage"
      - "Next Steps Specificity"
      - "Disclaimer Completeness"
      - "Professional Tone"
    structural_benchmark_items:
      - "Non-binding / preliminary designation clearly stated"
      - "Proposed terms presented at high level (ranges acceptable)"
      - "Disclaimer section present and prominent"
      - "Next steps section present with actionable items"
      - "Single footer/signature block at document end only (STRUCT-001)"
      - "No footer or signature content embedded within section bodies"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Preliminary Terms --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000 (range acceptable, e.g., 12M-15M)"
        group: "Preliminary Terms"
        required: true
      - key: interest_rate
        label: "Interest Rate"
        hint: "e.g., 7.00%-7.50% or SOFR + 300-350bps"
        group: "Preliminary Terms"
        required: true
      - key: loan_term_months
        label: "Loan Term"
        hint: "e.g., 36 months"
        group: "Preliminary Terms"
        required: false
      # -- Parties --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Parties"
        required: true
      - key: property_address
        label: "Property Address"
        hint: "e.g., 123 Main St, City, ST 12345"
        group: "Parties"
        required: false
    designer_tone_directive: |
      This is a preliminary scoping letter expressing initial interest. Tone must
      be professional, preliminary, and explicitly non-binding. Use qualifying
      language throughout — "subject to," "preliminary," "indicative." Ranges are
      acceptable for rates and amounts at this stage. Do not make commitments or
      use language that could be construed as binding. The letter signals interest
      and outlines what further diligence is needed before formal terms can be
      offered.

