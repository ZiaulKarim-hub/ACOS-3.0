# ===============================================================================
# ACOS Loan Document Generator — Document Type Catalog
# ===============================================================================
#
# Defines all supported document types using hierarchical document_id values.
# Each entry provides:
#   - document_id: hierarchical identifier (category/document-name)
#   - category_id: grouping category for the document
#   - default_sections: section list with full_data_access flag
#   - benchmark_dimensions: for Phase 1 Track B + Phase 4 quality validators
#   - structural_benchmark_items: simple checklist items for Haiku validators
#   - designer_tone_directive: injected into every Phase 3 section designer
#   - critical_figures: document-specific financial figures for human-in-the-loop
#     Each figure has: key, label, hint, group (for display), required (bool)
#     The skill generates a dynamic YAML template from these at runtime.
#
# full_data_access: true  -> section designer receives full loan-data.yaml
# full_data_access: false -> section designer receives section brief only
#                           (can still read loan-data.yaml via Read tool if needed)
# ===============================================================================

documents:

  # ============================================================================
  # CATEGORY A: Credit Underwriting
  # ============================================================================

  # -- A1. Internal Credit Memo ------------------------------------------------
  - document_id: credit-underwriting/internal-credit-memo
    category_id: credit-underwriting
    label: "Credit Memo — Internal"
    default_page_range: [8, 15]
    default_sections:
      - name: "Executive Summary"
        full_data_access: true
      - name: "Borrower & Sponsor Overview"
        full_data_access: false
      - name: "Transaction Summary"
        full_data_access: false
      - name: "Financial Analysis"
        full_data_access: false
      - name: "Collateral Analysis"
        full_data_access: false
      - name: "Risk Assessment"
        full_data_access: false
      - name: "Stress Testing"
        full_data_access: false
      - name: "Mitigants & Strengths"
        full_data_access: false
      - name: "Conditions & Covenants"
        full_data_access: false
      - name: "Recommendation"
        full_data_access: true
    benchmark_dimensions:
      - "Required Sections Completeness"
      - "Data Completeness & Accuracy"
      - "Risk Coverage"
      - "Financial Analysis Standards"
      - "Stress Testing Rigor"
      - "Recommendation Clarity"
      - "Language & Tone"
    structural_benchmark_items:
      - "All 10 required sections are present in order"
      - "Table of contents present and accurate"
      - "Single footer/signature block at document end only (STRUCT-001)"
      - "No footer or signature content embedded within section bodies"
      - "Date and loan reference on title page"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Loan Terms --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000"
        group: "Loan Terms"
        required: true
      - key: interest_rate
        label: "Interest Rate"
        hint: "e.g., 7.25% or SOFR + 350bps"
        group: "Loan Terms"
        required: true
      - key: loan_term_months
        label: "Loan Term"
        hint: "e.g., 36 months"
        group: "Loan Terms"
        required: true
      - key: maturity_date
        label: "Maturity Date"
        hint: "e.g., 2029-03-15"
        group: "Loan Terms"
        required: false
      - key: amortization
        label: "Amortization"
        hint: "e.g., 360 months or Interest Only"
        group: "Loan Terms"
        required: false
      # -- Property / Collateral --
      - key: property_value
        label: "Property Value (Appraised)"
        hint: "e.g., 22000000"
        group: "Collateral"
        required: true
      - key: property_type
        label: "Property Type"
        hint: "e.g., Multifamily, Office, Industrial"
        group: "Collateral"
        required: false
      - key: occupancy_rate
        label: "Occupancy Rate"
        hint: "e.g., 94.5%"
        group: "Collateral"
        required: false
      # -- Financial Metrics --
      - key: noi
        label: "NOI"
        hint: "Net Operating Income, e.g., 1650000"
        group: "Financial Metrics"
        required: true
      - key: dscr
        label: "DSCR"
        hint: "Debt Service Coverage Ratio, e.g., 1.35"
        group: "Financial Metrics"
        required: true
      - key: ltv
        label: "LTV"
        hint: "Loan-to-Value, e.g., 68.2%"
        group: "Financial Metrics"
        required: true
      - key: cap_rate
        label: "Cap Rate"
        hint: "e.g., 7.5%"
        group: "Financial Metrics"
        required: false
      - key: debt_yield
        label: "Debt Yield"
        hint: "e.g., 11.0%"
        group: "Financial Metrics"
        required: false
      # -- Borrower --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Borrower"
        required: true
      - key: sponsor_name
        label: "Sponsor Name"
        hint: "e.g., John Smith"
        group: "Borrower"
        required: false
    designer_tone_directive: |
      This is an INTERNAL credit memo for the credit committee. Be direct and
      analytical. Lead with risks, not strengths. Every material risk must be
      named, quantified where possible, and accompanied by a specific mitigant.
      Stress test scenarios must be conservative and specific. The recommendation
      must be unambiguous. Tone: formal institutional analysis. Do not soften or
      hedge around negative findings — the committee needs the full picture.

  # -- A2. External Credit Memo ------------------------------------------------
  - document_id: credit-underwriting/external-credit-memo
    category_id: credit-underwriting
    label: "Credit Memo — External"
    default_page_range: [5, 10]
    default_sections:
      - name: "Opportunity Headline"
        full_data_access: true
      - name: "Deal at a Glance"
        full_data_access: false
      - name: "Why This Deal"
        full_data_access: true
      - name: "The Asset"
        full_data_access: false
      - name: "The Borrower"
        full_data_access: false
      - name: "The Numbers"
        full_data_access: false
      - name: "Market Context"
        full_data_access: false
      - name: "Structure & Protections"
        full_data_access: false
      - name: "Call to Action"
        full_data_access: true
    benchmark_dimensions:
      - "Headline & Hook Strength"
      - "Scannability"
      - "Thesis Coherence"
      - "Asset Presentation"
      - "Numbers Selection"
      - "Objection Handling"
      - "Call to Action Clarity"
      - "Professional Marketing Tone"
    structural_benchmark_items:
      - "All 9 sections present"
      - "Deal at a Glance is a scannable table or structured box — not prose"
      - "Why This Deal has 3-5 distinct bullet points — not a paragraph"
      - "Call to Action has a specific next step (contact, process, or deadline)"
      - "Single footer/contact block at document end only (STRUCT-001)"
      - "No footer content embedded within section bodies"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Loan Terms --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000"
        group: "Loan Terms"
        required: true
      - key: interest_rate
        label: "Interest Rate"
        hint: "e.g., 7.25% or SOFR + 350bps"
        group: "Loan Terms"
        required: true
      - key: loan_term_months
        label: "Loan Term"
        hint: "e.g., 36 months"
        group: "Loan Terms"
        required: true
      # -- Investment Thesis --
      - key: property_value
        label: "Property Value (Appraised)"
        hint: "e.g., 22000000"
        group: "Investment Thesis"
        required: true
      - key: purchase_price
        label: "Purchase Price"
        hint: "e.g., 20000000"
        group: "Investment Thesis"
        required: false
      - key: ltv
        label: "LTV"
        hint: "Loan-to-Value, e.g., 68.2%"
        group: "Investment Thesis"
        required: true
      - key: dscr
        label: "DSCR"
        hint: "Debt Service Coverage Ratio, e.g., 1.35"
        group: "Investment Thesis"
        required: false
      # -- Return Profile --
      - key: cap_rate
        label: "Cap Rate"
        hint: "e.g., 7.5%"
        group: "Return Profile"
        required: false
      - key: debt_yield
        label: "Debt Yield"
        hint: "e.g., 11.0%"
        group: "Return Profile"
        required: false
      - key: noi
        label: "NOI"
        hint: "Net Operating Income, e.g., 1650000"
        group: "Return Profile"
        required: false
      # -- Deal Principals --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Deal Principals"
        required: true
      - key: sponsor_name
        label: "Sponsor Name"
        hint: "e.g., John Smith"
        group: "Deal Principals"
        required: false
    designer_tone_directive: |
      This is an EXTERNAL credit memo — it is a marketing and advertising
      document. You are writing to attract capital partners and brokers, not
      to interrogate the deal. Advertising principles apply:
      - Lead with the opportunity and the return, not the structure or risk
      - Every section should make the reader want to participate
      - Use vivid, confident, specific language — not hedged financial prose
      - Risks exist only as "managed risks" with strong mitigants leading
      - Numbers are selected to support the thesis — do not dump all data
      - Headlines and subheadings should be compelling, not generic
      - The document must be visually scannable: short paragraphs, bullets,
        callout boxes, bolded key metrics
      - End with urgency and a clear, specific call to action
      Tone: professional investment marketing. NOT an internal memo.

  # -- A3. Term Sheet ----------------------------------------------------------
  - document_id: credit-underwriting/term-sheet
    category_id: credit-underwriting
    label: "Term Sheet"
    default_page_range: [2, 5]
    default_sections:
      - name: "Deal Overview"
        full_data_access: true
      - name: "Proposed Loan Terms"
        full_data_access: true
      - name: "Property Summary"
        full_data_access: false
      - name: "Borrower Summary"
        full_data_access: false
      - name: "Conditions Precedent"
        full_data_access: false
      - name: "Fees & Expenses"
        full_data_access: false
      - name: "Expiry & Acceptance"
        full_data_access: false
    benchmark_dimensions:
      - "Terms Completeness & Precision"
      - "Table Format & Scannability"
      - "Conditions Precedent Coverage"
      - "Fee Schedule Clarity"
      - "Binding vs. Non-Binding Designation"
      - "Expiry & Acceptance Mechanics"
      - "Conciseness"
    structural_benchmark_items:
      - "Proposed Loan Terms presented in table format, not prose"
      - "All key economic terms listed (amount, rate, term, fees)"
      - "Binding/non-binding designation explicitly stated"
      - "Expiry date or validity period stated"
      - "Acceptance signature block at document end (STRUCT-001)"
      - "No signature content within section bodies"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Deal Terms --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000"
        group: "Deal Terms"
        required: true
      - key: interest_rate
        label: "Interest Rate"
        hint: "e.g., 7.25% or SOFR + 350bps"
        group: "Deal Terms"
        required: true
      - key: loan_term_months
        label: "Loan Term"
        hint: "e.g., 36 months"
        group: "Deal Terms"
        required: true
      - key: ltv
        label: "LTV"
        hint: "Loan-to-Value, e.g., 68.2%"
        group: "Deal Terms"
        required: false
      # -- Property --
      - key: property_value
        label: "Property Value"
        hint: "e.g., 22000000"
        group: "Property"
        required: false
      # -- Fees --
      - key: origination_fee
        label: "Origination Fee"
        hint: "e.g., 1.0% or 150000"
        group: "Fees"
        required: false
      - key: exit_fee
        label: "Exit Fee"
        hint: "e.g., 0.5% or 75000"
        group: "Fees"
        required: false
      # -- Parties --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Parties"
        required: true
      - key: lender_name
        label: "Lender Name"
        hint: "e.g., XYZ Capital Partners"
        group: "Parties"
        required: true
    designer_tone_directive: |
      This is a term sheet. Be concise, tabular, and precise. The Proposed Loan
      Terms section MUST be a structured table — never prose. Every rate, fee,
      condition, and deadline must be specific and unambiguous. Non-binding
      provisions must be clearly distinguished from binding ones. Avoid narrative
      — let the terms speak for themselves. The reader should be able to scan
      every material term in under two minutes.

  # -- A4. Deal Memo -----------------------------------------------------------
  - document_id: credit-underwriting/deal-memo
    category_id: credit-underwriting
    label: "Deal Memo"
    default_page_range: [3, 6]
    default_sections:
      - name: "Deal Summary"
        full_data_access: true
      - name: "Investment Thesis"
        full_data_access: true
      - name: "Transaction Structure"
        full_data_access: false
      - name: "Borrower & Sponsor"
        full_data_access: false
      - name: "Collateral Overview"
        full_data_access: false
      - name: "Risk Factors & Mitigants"
        full_data_access: false
      - name: "Recommendation"
        full_data_access: true
    benchmark_dimensions:
      - "Thesis Clarity & Conviction"
      - "Transaction Structure Completeness"
      - "Risk-Mitigant Balance"
      - "Borrower & Sponsor Analysis"
      - "Collateral Coverage"
      - "Recommendation Specificity"
      - "Committee-Ready Conciseness"
    structural_benchmark_items:
      - "All 7 required sections present in order"
      - "Investment Thesis leads with the core thesis, not background"
      - "Risk Factors paired with specific mitigants"
      - "Recommendation is unambiguous (approve/decline/conditional)"
      - "Single footer/signature block at document end only (STRUCT-001)"
      - "No footer or signature content embedded within section bodies"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Deal Terms --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000"
        group: "Deal Terms"
        required: true
      - key: interest_rate
        label: "Interest Rate"
        hint: "e.g., 7.25% or SOFR + 350bps"
        group: "Deal Terms"
        required: true
      - key: ltv
        label: "LTV"
        hint: "Loan-to-Value, e.g., 68.2%"
        group: "Deal Terms"
        required: true
      - key: dscr
        label: "DSCR"
        hint: "Debt Service Coverage Ratio, e.g., 1.35"
        group: "Deal Terms"
        required: false
      # -- Collateral --
      - key: property_value
        label: "Property Value"
        hint: "e.g., 22000000"
        group: "Collateral"
        required: true
      - key: noi
        label: "NOI"
        hint: "Net Operating Income, e.g., 1650000"
        group: "Collateral"
        required: false
      # -- Principals --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Principals"
        required: true
      - key: sponsor_name
        label: "Sponsor Name"
        hint: "e.g., John Smith"
        group: "Principals"
        required: false
    designer_tone_directive: |
      This is a concise committee presentation — a deal memo. Lead with the
      investment thesis, not background. The committee has limited time: every
      sentence must earn its place. Risk factors must be specific and paired
      with concrete mitigants. The recommendation must be unambiguous. Tone:
      confident, analytical, direct. Avoid hedging language. If the deal has
      weaknesses, name them plainly and explain why the deal still works.

  # -- A5. Scoping Letter ------------------------------------------------------
  - document_id: credit-underwriting/scoping-letter
    category_id: credit-underwriting
    label: "Scoping Letter"
    default_page_range: [1, 3]
    default_sections:
      - name: "Introduction"
        full_data_access: true
      - name: "Proposed Terms"
        full_data_access: true
      - name: "Conditions & Assumptions"
        full_data_access: false
      - name: "Next Steps"
        full_data_access: false
      - name: "Disclaimer"
        full_data_access: false
    benchmark_dimensions:
      - "Preliminary Terms Clarity"
      - "Non-Binding Language Adequacy"
      - "Conditions & Assumptions Coverage"
      - "Next Steps Specificity"
      - "Disclaimer Completeness"
      - "Professional Tone"
    structural_benchmark_items:
      - "Non-binding / preliminary designation clearly stated"
      - "Proposed terms presented at high level (ranges acceptable)"
      - "Disclaimer section present and prominent"
      - "Next steps section present with actionable items"
      - "Single footer/signature block at document end only (STRUCT-001)"
      - "No footer or signature content embedded within section bodies"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Preliminary Terms --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000 (range acceptable, e.g., 12M-15M)"
        group: "Preliminary Terms"
        required: true
      - key: interest_rate
        label: "Interest Rate"
        hint: "e.g., 7.00%-7.50% or SOFR + 300-350bps"
        group: "Preliminary Terms"
        required: true
      - key: loan_term_months
        label: "Loan Term"
        hint: "e.g., 36 months"
        group: "Preliminary Terms"
        required: false
      # -- Parties --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Parties"
        required: true
      - key: property_address
        label: "Property Address"
        hint: "e.g., 123 Main St, City, ST 12345"
        group: "Parties"
        required: false
    designer_tone_directive: |
      This is a preliminary scoping letter expressing initial interest. Tone must
      be professional, preliminary, and explicitly non-binding. Use qualifying
      language throughout — "subject to," "preliminary," "indicative." Ranges are
      acceptable for rates and amounts at this stage. Do not make commitments or
      use language that could be construed as binding. The letter signals interest
      and outlines what further diligence is needed before formal terms can be
      offered.

  # ============================================================================
  # CATEGORY B: Closing & Administration
  # ============================================================================

  # -- B1. Closing Summary -----------------------------------------------------
  - document_id: closing-admin/closing-summary
    category_id: closing-admin
    label: "Closing Summary"
    default_page_range: [3, 8]
    default_sections:
      - name: "Transaction Summary"
        full_data_access: true
      - name: "Parties & Contacts"
        full_data_access: true
      - name: "Conditions Precedent Checklist"
        full_data_access: false
      - name: "Required Documents Checklist"
        full_data_access: false
      - name: "Outstanding Items"
        full_data_access: false
      - name: "Closing Timeline"
        full_data_access: false
    benchmark_dimensions:
      - "Checklist Completeness"
      - "Conditions Precedent Coverage"
      - "Party & Contact Accuracy"
      - "Outstanding Items Tracking"
      - "Timeline Specificity"
      - "Procedural Clarity"
    structural_benchmark_items:
      - "Checklist items are numbered and actionable"
      - "Responsible party assigned to each checklist item"
      - "Closing date or timeline stated"
      - "Outstanding items clearly flagged with owner and deadline"
      - "Single footer/signature block at document end only (STRUCT-001)"
      - "No footer or signature content embedded within section bodies"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Transaction --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000"
        group: "Transaction"
        required: true
      - key: purchase_price
        label: "Purchase Price"
        hint: "e.g., 20000000"
        group: "Transaction"
        required: false
      # -- Parties --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Parties"
        required: true
      - key: lender_name
        label: "Lender Name"
        hint: "e.g., XYZ Capital Partners"
        group: "Parties"
        required: true
      - key: title_company
        label: "Title Company"
        hint: "e.g., First American Title"
        group: "Parties"
        required: false
      - key: escrow_agent
        label: "Escrow Agent"
        hint: "e.g., National Escrow Services"
        group: "Parties"
        required: false
      # -- Dates --
      - key: closing_date
        label: "Closing Date"
        hint: "e.g., 2026-05-15"
        group: "Dates"
        required: true
      - key: funding_date
        label: "Funding Date"
        hint: "e.g., 2026-05-15"
        group: "Dates"
        required: false
    designer_tone_directive: |
      This is a closing summary document. Completeness and procedural clarity
      take priority over narrative. Every checklist item must be specific,
      actionable, and assigned to a responsible party. Timelines must be specific
      (dates, not durations). Use checklists and tables wherever possible —
      avoid prose where a list serves better. The reader should be able to
      track every outstanding item and its owner at a glance.

  # -- B2. Settlement Statement ------------------------------------------------
  - document_id: closing-admin/settlement-statement
    category_id: closing-admin
    label: "Settlement Statement"
    default_page_range: [2, 5]
    default_sections:
      - name: "Transaction Summary"
        full_data_access: true
      - name: "Sources of Funds"
        full_data_access: true
      - name: "Uses of Funds"
        full_data_access: true
      - name: "Prorations & Adjustments"
        full_data_access: false
      - name: "Net Disbursement"
        full_data_access: true
      - name: "Certification"
        full_data_access: false
    benchmark_dimensions:
      - "Sources & Uses Balance"
      - "Line-Item Detail"
      - "Proration Accuracy"
      - "Net Disbursement Calculation"
      - "Certification Completeness"
      - "Financial Precision"
    structural_benchmark_items:
      - "Sources of Funds total equals Uses of Funds total"
      - "Every line item has a specific dollar amount"
      - "Prorations show calculation basis (per-diem, period)"
      - "Net disbursement clearly stated"
      - "Certification/signature block at document end only (STRUCT-001)"
      - "No signature content embedded within section bodies"
      - "No orphaned headings at page bottom (STRUCT-002)"
      - "Tables and figures do not split across page boundaries (STRUCT-002)"
    critical_figures:
      # -- Transaction --
      - key: loan_amount
        label: "Loan Amount"
        hint: "e.g., 15000000"
        group: "Transaction"
        required: true
      - key: purchase_price
        label: "Purchase Price"
        hint: "e.g., 20000000"
        group: "Transaction"
        required: false
      - key: net_disbursement_amount
        label: "Net Disbursement Amount"
        hint: "e.g., 14650000"
        group: "Transaction"
        required: true
      # -- Fees & Costs --
      - key: origination_fee
        label: "Origination Fee"
        hint: "e.g., 1.0% or 150000"
        group: "Fees & Costs"
        required: false
      - key: title_insurance_premium
        label: "Title Insurance Premium"
        hint: "e.g., 25000"
        group: "Fees & Costs"
        required: false
      - key: escrow_deposit
        label: "Escrow Deposit"
        hint: "e.g., 150000"
        group: "Fees & Costs"
        required: false
      - key: recording_fees
        label: "Recording Fees"
        hint: "e.g., 5000"
        group: "Fees & Costs"
        required: false
      # -- Prorations --
      - key: prorated_taxes
        label: "Prorated Taxes"
        hint: "e.g., 12500"
        group: "Prorations"
        required: false
      - key: prorated_insurance
        label: "Prorated Insurance"
        hint: "e.g., 3500"
        group: "Prorations"
        required: false
      # -- Parties --
      - key: borrower_name
        label: "Borrower Name"
        hint: "e.g., ABC Holdings LLC"
        group: "Parties"
        required: true
      - key: lender_name
        label: "Lender Name"
        hint: "e.g., XYZ Capital Partners"
        group: "Parties"
        required: true
    designer_tone_directive: |
      This is a settlement statement — a precise financial document. Every dollar
      must be accounted for. Sources of Funds must equal Uses of Funds exactly.
      Present all figures in tabular format with clear line-item detail. Prorations
      must show the calculation basis (daily rate, period covered). The net
      disbursement must be unambiguous. Tone: precise, financial, authoritative.
      No narrative — let the numbers speak.

  # -- B3. Escrow Instructions -------------------------------------------------
  - document_id: closing-admin/escrow-instructions
    category_id: closing-admin
