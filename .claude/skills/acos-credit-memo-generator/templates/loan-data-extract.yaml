# ═══════════════════════════════════════════════════════════════════════════════
# SEOS Credit Memo — Loan Data Extraction Schema
# ═══════════════════════════════════════════════════════════════════════════════
#
# Output schema for Phase 2 (Loan Folder Analysis).
# Each analyzer agent produces one of these per document or document group.
# The synthesizer merges all findings into loan-data.yaml.
#
# This file is a TEMPLATE showing the expected structure.
# ═══════════════════════════════════════════════════════════════════════════════

# Metadata about the analyzed document(s)
source_documents:
  - filename: ""
    path: ""
    document_type: ""
    # financial-statement|appraisal|tax-return|legal-doc|insurance|
    # environmental|borrower-application|third-party-report|other
    page_count: 0
    date_of_document: ""

# Agent that produced this extraction
agent_id: ""
date_analyzed: ""

# Extracted data points — mapped to memo sections
data_by_section:
  executive_summary:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

  borrower_overview:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

  transaction_summary:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

  financial_analysis:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

  collateral_analysis:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

  risk_assessment:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

  mitigants_strengths:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

  conditions_covenants:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

  recommendation:
    - fact: ""
      value: ""
      source_document: ""
      source_page: ""
      confidence: 0.0

# Entity directory — all entities mentioned in this document
entities:
  - name: ""
    type: "person|organization|property|loan|other"
    role: ""
    details: ""

# Key financial figures extracted (exact values, no rounding)
financial_figures:
  - metric: ""
    value: ""
    unit: ""
    period: ""
    source_document: ""
    source_page: ""

# Risk factors identified
risk_factors:
  - risk: ""
    severity: "high|medium|low"
    source_document: ""
    details: ""

# Conditions or requirements found
conditions:
  - condition: ""
    type: "precedent|subsequent|ongoing"
    source_document: ""
    details: ""

# Cross-reference issues (contradictions or inconsistencies found)
cross_reference_issues:
  - issue: ""
    documents_involved: []
    details: ""

# Data completeness — what's present and what's missing
data_completeness:
  present: []
  missing: []
  notes: ""
