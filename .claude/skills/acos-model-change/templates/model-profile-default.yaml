# ═══════════════════════════════════════════════════════════════════════════════
# Model Profile System — Agent Model Assignments
# ═══════════════════════════════════════════════════════════════════════════════
#
# Controls which model each ACOS agent uses when spawned. Supports Claude (bare
# name, dispatched via Task()) AND external providers (provider:model, dispatched
# via run-external-agent.py).
# Location: .acos/config/model-profile.yaml (per-project, user-editable)
#
# How it works:
#   1. Orchestration skills call resolve-agent-model.sh <agent-name>
#   2. The script checks session state first (.acos/state/model-session.yaml)
#   3. Then falls back to this config file's active profile
#   4. Then falls back to the agent's frontmatter default
#
# Session state is ephemeral — cleared by session-cleanup.sh at SessionEnd.
# To change profile mid-session: /acos-model-change
# To set profile at startup:     /acos-start includes a model selection step
#
# Available Claude models: opus, sonnet, haiku
# External models use provider:model syntax (e.g. openai:gpt-4o,
#   google:gemini-2.5-pro, openrouter:google/gemini-2.0-flash-exp:free).
#   External providers require .acos/config/providers.yaml (endpoints + keys).
#   architect and developer are FORCED to Claude (tool access); external
#   assignments for them silently fall back to the Claude default.
# ═══════════════════════════════════════════════════════════════════════════════

# Which profile to use by default when no session override exists
default_profile: premium

# ── Profile Definitions ─────────────────────────────────────────────────────
#
# Each profile maps agent names to models.
# "main" is advisory only — Claude Code's main model requires /model to change.
#
# Cost guidance (approximate, relative):
#   opus   = 1.0x (baseline — highest quality, highest cost)
#   sonnet = 0.2x (good balance of quality and cost)
#   haiku  = 0.05x (fastest, cheapest, good for simple tasks)

profiles:
  budget:
    description: "Minimize token spend. Haiku for implementation, Sonnet for critical review."
    main: haiku
    architect: sonnet
    developer: haiku
    qa-reviewer: sonnet
    security-reviewer: sonnet
    performance-reviewer: haiku
    integration-reviewer: haiku
    memory-agent: haiku
    learning-agent: haiku

  standard:
    description: "Balanced cost and quality. Sonnet across the board, Haiku for memory."
    main: sonnet
    architect: sonnet
    developer: sonnet
    qa-reviewer: sonnet
    security-reviewer: sonnet
    performance-reviewer: sonnet
    integration-reviewer: sonnet
    memory-agent: haiku
    learning-agent: sonnet

  premium:
    description: "Maximum quality. Opus everywhere, Sonnet for memory. Current default."
    main: opus
    architect: opus
    developer: opus
    qa-reviewer: opus
    security-reviewer: opus
    performance-reviewer: opus
    integration-reviewer: opus
    memory-agent: sonnet
    learning-agent: opus

  auto:
    description: "Smart allocation. Opus for critical decisions, Sonnet for implementation, Haiku for support."
    main: sonnet
    architect: opus
    developer: sonnet
    qa-reviewer: opus
    security-reviewer: opus
    performance-reviewer: sonnet
    integration-reviewer: sonnet
    memory-agent: haiku
    learning-agent: sonnet

  # ── Multi-provider profiles ──────────────────────────────────────────────
  # These require .acos/config/providers.yaml (API endpoints + keys).
  # architect/developer stay on Claude (forced); external falls back silently.

  hybrid-review:
    description: "Claude for implementation, multi-provider diversity for review."
    main: opus
    architect: opus
    developer: sonnet
    qa-reviewer: openai:gpt-4o
    security-reviewer: openrouter:google/gemini-2.5-pro-exp-03-25
    performance-reviewer: openrouter:meta-llama/llama-3.3-70b-instruct
    integration-reviewer: sonnet
    memory-agent: haiku
    learning-agent: openrouter:deepseek/deepseek-chat

  free-tier:
    description: "Free models via OpenRouter for review. Zero external cost."
    main: sonnet
    architect: sonnet
    developer: sonnet
    qa-reviewer: openrouter:google/gemini-2.0-flash-exp:free
    security-reviewer: openrouter:google/gemini-2.0-flash-exp:free
    performance-reviewer: openrouter:google/gemini-2.0-flash-exp:free
    integration-reviewer: openrouter:google/gemini-2.0-flash-exp:free
    memory-agent: haiku
    learning-agent: openrouter:google/gemini-2.0-flash-exp:free

  openai-review:
    description: "Claude for implementation, OpenAI for all reviews."
    main: opus
    architect: opus
    developer: sonnet
    qa-reviewer: openai:gpt-4o
    security-reviewer: openai:gpt-4o
    performance-reviewer: openai:gpt-4o-mini
    integration-reviewer: openai:gpt-4o-mini
    memory-agent: haiku
    learning-agent: openai:gpt-4o-mini

  gemini-review:
    description: "Claude for implementation, Google Gemini for all reviews."
    main: opus
    architect: opus
    developer: sonnet
    qa-reviewer: google:gemini-2.5-pro
    security-reviewer: google:gemini-2.5-pro
    performance-reviewer: google:gemini-2.5-flash
    integration-reviewer: google:gemini-2.5-flash
    memory-agent: haiku
    learning-agent: google:gemini-2.5-flash
