# S0 — Threat sketch (one per task). Validated by: nemesis task sketch <task> <this file>
# Rules: every field filled; six STRIDE lines each non-empty ("none because …" is allowed);
# abuse_case at least two sentences; checklists lists every Part-3 domain this task touches.
task: <id / title>
data_touched: [<table or object>: <public|internal|confidential|sensitive>, ...]
actors: [<role>: <what they may do>, ...]
stride:
  spoofing: <one line or "none because ...">
  tampering: <...>
  repudiation: <...>
  information_disclosure: <...>
  denial_of_service: <...>
  elevation_of_privilege: <...>
abuse_case: <two sentences from the attacker's view.>
checklists: [3.1, 3.2, 3.3]
