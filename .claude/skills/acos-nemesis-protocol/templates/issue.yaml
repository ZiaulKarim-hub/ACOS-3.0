# 4.3 — Security issue (Nemesis writes these as .nemesis/issues/<id>.json; shown here in the
# protocol's YAML shape for reading). Ids: SEC-<n> (PSC) or FUN-<n> (PFC).
id: SEC-<n>
severity: critical|high|medium|low
lens: PSC|PFC
found_by: judge|scan|review|holdout|watchdog
where: <file:line or table/policy or endpoint>
what: <one sentence>
root_cause: <one sentence — the real cause, not the symptom>
rung: 1
attempts: []        # {at, diff_sha256, verdict_id, outcome, rung}
repro: null         # {file, name} — registered with: nemesis issue repro <id> <file> <name>
review: null        # {at, by, confirmed_fixed, findings}
closed_at: null     # only after: repro passes, suite passes, two clean S3, review confirmed
