# Review considerations
review_focus:
  - "Output format: verify DOCX+PDF are both generated and visually correct for every code path"
  - "No fallback to .md or raw .html — must fail loudly if conversion tools missing"
  - "XLSX extraction accuracy: test with real loan folder spreadsheets"
  - "Data verification table: every number must trace to a source with clickable link"
