# Story breakdown
stories:
  - story_id: "STORY-003-001"
    title: "HTML ingest + parts-bin extractor"
    description: |
      Pure data layer. DOM walker that takes an HTML file path, parses
      with browser DOMParser (sandboxed, scripts disabled), and emits a
      typed list of "container" records — one per visible element. Each
      record carries node-type (text/image/svg/table/bg), source-DOM
      path, computed styles (font-size, family, color, dimensions),
      inner content, and Brad-class metadata when present. No UI in
      this story; testable via unit tests on Brad fixture HTML.
    priority: "high"
    effort: "M"
    dependencies: []

  - story_id: "STORY-003-002"
    title: "Two-pane shell + canvas + drag-drop + corner gestures"
    description: |
      Core editor UI. Vite + React + TypeScript shell. Right pane
      renders the parts-bin hierarchy with collapse + search +
      thumbnail previews. Left pane renders multi-page US Letter
      portrait canvas. react-rnd (or Konva fallback) provides
      draggable + corner-resizable boxes with the five gesture
      variants: text-reflow, image-scale (aspect-locked),
      SVG-scale-vector, table-scale-uniform-with-column-handles,
      background-cover-fit-with-focal-point. State managed by Zustand
      or Redux Toolkit (chosen in slice planning).
    priority: "high"
    effort: "L"
    dependencies:
      - "STORY-003-001"

  - story_id: "STORY-003-003"
    title: "Numeric font controls + snap-grid + magnetic guides + project file persistence"
    description: |
      Polish UX layer. Per-container numeric font-size input in right
      sidebar with +/- keyboard shortcuts. Background 8px grid toggle
      and snap-to-grid behavior on drag. Magnetic alignment guides
      that render when edges/centers align with other containers or
      page edges. JSON project file format (.layoutproj) with schema
      versioning, save-as-explicit + open-by-path, source-HTML SHA-256
      hash for re-ingest detection.
    priority: "high"
    effort: "M"
    dependencies:
      - "STORY-003-002"

  - story_id: "STORY-003-004"
    title: "Four-stage polish pipeline (snap → typography → sizing → Opus vision loop)"
    description: |
      The product's magic moment. Triggered by a "Finalize" button.
      Stage 1 (deterministic, instant): snap-to-grid and edge
      alignment. Stage 2 (heuristic, fast): typography harmonization
      across same-class containers per page. Stage 3 (heuristic,
      fast): sizing equalization for same-class image containers.
      Stage 4 (Opus 4.7 vision review): reuses the acos-doc-design-qa
      engine — screenshot each page, score 10 dimensions, loop until
      100/100 per page or 5 iterations. Pipeline log captured for the
      deviation sidebar in STORY-003-005.
    priority: "high"
    effort: "L"
    dependencies:
      - "STORY-003-003"

  - story_id: "STORY-003-005"
    title: "Brand-deviation sidebar + PDF export integration"
    description: |
      Final mile. Renders the polish-pipeline log as a "Brand drift"
      sidebar: each deviation from Brad's design tokens, its delta
      magnitude, the visual-score rationale, and Approve / Snap-back
      controls per deviation. PDF export wiring: serializes finalized
      layout to a print-stylesheet HTML and invokes the existing
      html-to-pdf.js Puppeteer sidecar via Node child process. Output
      PDF saved alongside the project file. This is the shipping gate
      — when this story completes, the MVP is shippable end-to-end.
    priority: "high"
    effort: "M"
    dependencies:
      - "STORY-003-004"

