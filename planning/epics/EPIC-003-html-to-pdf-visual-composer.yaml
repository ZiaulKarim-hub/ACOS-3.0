# Technical considerations
technical_notes: |
  Tech stack (locked by vision document):
    - Frontend: Vite + React + TypeScript
    - State: Zustand or Redux Toolkit (decide in STORY-003-002 slice planning)
    - Canvas + interaction: react-rnd as primary; Konva/react-konva as fallback
      if richer canvas needs surface; interact.js if multi-touch becomes relevant
    - HTML parsing: native browser DOMParser (sandboxed)
    - Charts: inline SVG preserved as-is; html2canvas at 2x DPI as third-party
      fallback
    - PDF export: existing html-to-pdf.js Puppeteer pipeline invoked as Node
      sidecar via child process
    - AI vision polish: Anthropic Messages API (Opus 4.7) via Claude Code Max
      subscription auth (no separate API key)
    - Project file: JSON, schema-versioned, sibling of source HTML

  Polish pipeline ordering is load-bearing:
    Deterministic stages (snap, edge alignment) MUST run before heuristic
    stages (typography harmonization, sizing equalization), which MUST run
    before vision review. Vision review on an un-snapped page produces noisy,
    contradictory feedback; running it last gives it clean input.

  Parallelization opportunities (deferred unless a second developer joins):
    STORY-003-005's PDF export wiring is largely independent of polish-pipeline
    completion — could overlap with the tail of STORY-003-004 if needed. The
    deviation-sidebar piece of 005 does need 004 done first.

  Reuse over rebuild:
    - acos-doc-design-qa engine is the stage-4 brain transplant; do NOT
      reimplement vision-review-loop logic
    - html-to-pdf.js is the export pipeline; do NOT reimplement Puppeteer
      orchestration
    - Brad design tokens drive polish hints; do NOT re-derive typographic
      scale, palette, or spacing grid

  Risk surfaces (rank-ordered):
    1. Text-container reflow performance — re-laying 100+ text boxes on every
       drag frame must stay under 16ms; may require requestAnimationFrame
       throttling or virtual-scroll-style culling of off-page containers
    2. SVG-to-PDF fidelity in the existing html-to-pdf.js pipeline — must
       verify charts render at full vector fidelity, not rasterized
    3. Opus vision-review cost in real time — 10-page document = 5-15 min
       wall-clock; UX must communicate progress clearly to avoid "did it
       freeze?" anxiety
    4. JSDOM/DOMParser behavior on third-party HTML — generic web pages may
       contain malformed markup; sandbox must fail-soft, not crash the editor

  Out of scope for this epic (vision document Phase 2 / Future / Excluded):
    - Threaded text containers (manual continuation only in MVP)
    - Custom page geometry (Letter portrait only)
    - Polish-pipeline toggles (always runs all 4 stages)
    - Brand-deviation batch snap-back
    - Undo/redo
    - Alternative-format export (DOCX, EPUB)
    - Multi-document templates
    - Live HTML-source sync
    - AI auto-layout suggestions

