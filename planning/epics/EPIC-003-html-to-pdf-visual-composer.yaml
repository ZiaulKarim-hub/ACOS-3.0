# Epic overview
title: "HTML-to-PDF Visual Composer MVP"
description: |
  A single-user, browser-hosted visual editor that ingests an HTML file,
  decomposes it into a freeform "parts bin" of draggable containers
  (text, images, tables, inline SVG charts, background images), and lets
  the user lay them out across multi-page PDF canvases. A four-stage AI
  polish pipeline (snap-to-grid → typography harmonization → sizing
  equalization → Opus 4.7 vision review) auto-corrects approximate
  placements into a finished PDF that meets institutional quality
  standards.

  When this epic is complete, the editor replaces the current
  hand-composed HTML → Puppeteer-rendered PDF workflow at Okoa Capital.
  Brad's design system remains the source of style; the editor handles
  the layout, composition, and quality-assurance steps that are
  currently manual.

# Why this epic matters
value_proposition: |
  The current OKOA document workflow requires Zee to hand-compose HTML
  against Brad's design system and run html-to-pdf.js, performing all
  layout decisions manually inside the HTML source. This is slow and
  error-prone — a 10-page report can take hours, and small layout
  inconsistencies (font sizes drifting by 0.3pt, image widths off by
  4px, gutters of unequal width) are common.

  This epic delivers a tool where the layout step is visual, gestural,
  and AI-polished. Single-user benefit: 10-page Brad-style reports
  composed in 15 minutes that ship to credit-committee / investor /
  counterparty audiences without further edits.

# Acceptance criteria for the entire epic
acceptance_criteria:
  - "[ ] Opening an OKOA Brad-style HTML report exposes every visible element as a draggable container in the parts bin (hierarchical tree + search)"
  - "[ ] Drag-and-drop placement and corner-resize on the multi-page Letter portrait canvas behave per the gesture model: text reflows, images/SVG scale aspect-locked, tables scale uniformly, backgrounds cover-fit with focal-point control"
  - "[ ] Numeric font-size input + keyboard shortcuts (+/-) function on selected text containers"
  - "[ ] Snap-to-grid (8px) plus magnetic inter-container alignment guides render during drag"
  - "[ ] Saving a .layoutproj file and reopening it restores layout state, container positions/sizes, font-size overrides, polish-pipeline log, and brand-deviation flags with identical fidelity"
  - "[ ] Clicking 'Finalize' executes the 4-stage polish pipeline (snap → typography → sizing → Opus vision loop) end-to-end without errors on a 10-page document"
  - "[ ] Brand-deviation sidebar populates from polish-pipeline log and accurately shows each deviation, its delta, and rationale"
  - "[ ] PDF export via Node sidecar (reusing existing html-to-pdf.js) produces output at fidelity equivalent to the current baseline"
  - "[ ] PRIMARY SUCCESS GATE: a real OKOA 10-page Brad-style report is laid out in ≤15 minutes and ships to stakeholders without further edits"
  - "[ ] QUALITY GATE: output PDF scores ≥95/100 average on the acos-doc-design-qa 10-dimension rubric for the v1 acceptance document"

