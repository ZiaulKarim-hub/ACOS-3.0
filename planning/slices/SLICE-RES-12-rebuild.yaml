# Slice overview
title: "rebuild-registry.py: reproduce the 16/16 baseline reading no registry file (+ DP5 seeder)"
objective: |
  Implement rebuild-registry.py so a derived index can never dangle: rebuild
  DELETES the 55%-dangling-pointer class instead of mitigating it. Reading NO
  registry file, reproduce the proven 16/16-row baseline from disk alone.
description: |
  In scope:
  - Enumerate find */memory/handoffs (authoritative) + */CLAUDE.md + */.acos
    across BOTH parents (Vibe Coding, OKOA).
  - Use ~/.claude.json project paths as a lossy hint (glob-disambiguation
    only, never a decoder).
  - Reproduce the proven 16/16 baseline; flag (never auto-enroll) the
    Vibe Coding-root anomaly.
  Out of scope (guardrails):
  - Auto-enrolling the parent-folder anomaly without confirmation.
  - Treating ~/.claude.json path-mangled keys as authoritative.
  # TODO: confirm — the title includes "+ DP5 seeder" but the task body does not
  # specify seeder behavior for this slice (DP5 curation lives in SLICE-13-seed-curate);
  # confirm whether any seeding logic belongs here before implementation.

