# Slice overview
title: "Seed + one ~10-minute human curation pass (DP5)"
objective: |
  Seed the registry (run the seeder to populate the book), then perform one
  ~10-minute human curation pass in which junk/anomaly rows are tombstoned
  by hand. Day-one value covering everything: a human confirms each row is
  a real project (explicit enrollment spirit). Demo: Demo 1 (enrollment).
description: |
  In scope: run the seeder; one ~10-min human curation pass with junk/anomaly
  rows tombstoned by hand. Out of scope: any age-based reaper; auto-deletion
  of rows (deletion is a human act only).

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Book lists the real active projects after the seeder runs — before/after row listing archived in the evidence bundle"
  - "[ ] Anomaly rows (incl. the Vibe Coding-root row) tombstoned, NOT deleted — tombstone events visible in the audit log"
  - "[ ] Tombstoned rows still exist on disk (tombstone-never-delete) — QA spot-check confirms rows present after curation"
  - "[ ] No row was auto-deleted — deletion occurred only as a human act during the curation pass"
  - "[ ] Evidence bundle populated at .acos/evidence/[DATE]/SLICE-13-seed-curate/ (7-part bundle: implementation summary, requirements traceability, structural quality, functional checks, security/compliance notes, operational notes, self-assessment)"
  - "[ ] Dev Learnings and QA Learnings sections updated in the source task file (slice is not Done until they are — preeng §0.7)"

