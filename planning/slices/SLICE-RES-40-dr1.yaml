# Slice overview
title: "DR-1 ship gate: one recorded close->resume round-trip on a real project"
objective: |
  DR-1 ship gate: prove ONE recorded close->resume round-trip on a real project.
  Run the full cycle: /acos-safe-close -> receipt "SAFE TO CLOSE THIS TAB" ->
  tab gone -> later /acos-resurrect -> pick -> work demonstrably continues ->
  USER confirms continuity. Save the recording/receipts to .acos/evidence/.
description: |
  Permission-to-close is the product and it must be a demonstration, not a
  promise; one silent loss ends the tool. In scope: the full close->resume
  cycle on a real project plus archiving the recording/receipts to
  .acos/evidence/. Out of scope: shipping on a promise/placebo, and any step
  that is not on a real project. Until this evidence exists, the skill is
  NOT shipped.

# Acceptance criteria (from task Definition-of-Done + QA evidence gates)
acceptance_criteria:
  - "[ ] Full cycle executed on a REAL project (not a throwaway): /acos-safe-close issued, receipt 'SAFE TO CLOSE THIS TAB' received, tab gone, later /acos-resurrect -> pick, work demonstrably continues — captured in the recording archived at .acos/evidence/[DATE]/SLICE-40-dr1/"
  - "[ ] USER explicitly confirms continuity — the user's confirmation itself is captured in the evidence bundle (self-asserted continuity does NOT pass)"
  - "[ ] Recording and receipts archived to .acos/evidence/[DATE]/SLICE-40-dr1/ — if any piece is missing, the gate is NOT met and nothing ships"
  - "[ ] 7-part Evidence Bundle populated at .acos/evidence/[DATE]/SLICE-40-dr1/: (1) Implementation Summary; (2) Requirements Traceability (spec FR-* / tech_prd TR-*); (3) Structural Quality Evidence; (4) Functional/structural checks (verification_method below); (5) Security/Compliance notes; (6) Operational/Runtime considerations; (7) Self-assessment (confidence + known limitations)"
  - "[ ] '## Dev Learnings' and '## QA Learnings' sections updated in planning/preeng/005-resurrection-protocol/tasks/SLICE-40-dr1.md (slice is not Done until they are — §0.7)"
  # TODO: confirm — task says "a real project" but does not name WHICH real project to run the round-trip on
