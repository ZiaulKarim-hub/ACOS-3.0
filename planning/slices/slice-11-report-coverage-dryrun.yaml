# Slice overview
title: "Report + coverage/limits footer + dry-run hardening (Demo 3)"
objective: |
  Render the full Markdown dossier and harden the pipeline with a real-name dry run. The
  dossier: compliance header -> High-confidence tier -> Candidate tier -> per-parcel
  {APN, county/state, situs, owner-of-record, mailing, matched-through evidence chain,
  confidence score + signals, per-record freshness, source URLs} -> estimated portfolio
  value/debt/equity -> "Coverage & limits" footer (counties searched, hops reached, hubs
  pruned, stated limitations incl. licensing-out-of-scope) -> manual-review flags, with
  hedged language throughout. The dry run probes real portal availability and the
  false-positive rate at the 75/50 cutoffs, validates the audit trail, and re-validates
  H1/H2/H3.

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] The dossier renders all required sections (compliance header -> tiers -> per-parcel chain -> estimated portfolio -> coverage/limits footer -> review flags) — pass: structure test"
  - "[ ] Hedged language is used throughout; 'owns' only with direct title support — pass: hedged-language test (REQUIRED)"
  - "[ ] The coverage/limits footer reports counties searched, hops reached, hubs pruned, and stated limitations (incl. licensing-out-of-scope) — pass: coverage-footer test (REQUIRED)"
  - "[ ] Per-record freshness + source URLs appear on every parcel — pass: provenance/freshness test"
  - "[ ] A documented real-name dry run records portal availability + the false-positive rate at 75/50 and re-validates H1/H2/H3 — pass: dry-run findings recorded"
  - "[ ] Dev Learnings and QA Learnings sections updated"

