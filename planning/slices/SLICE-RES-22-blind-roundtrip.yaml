# Slice overview
title: "Blind round-trip verifier (close step 5)"
objective: |
  Wire close step 5 to dispatch a blind round-trip verifier: a fresh
  general-purpose Task given the handoff text ONLY (no repo, no cwd access),
  which must state the next step. The single most likely silent failure is a
  repo-reading verifier passing a bad handoff — deny it the repo.
description: |
  In scope:
  - Fresh general-purpose Task, handoff text ONLY; must state the next step.
  - Wigum cap 5 then DEGRADE (close still allowed, receipt marks DEGRADED).
  - Test the tester: a gutted handoff must FAIL; the real one must yield a
    next-step quote that appears in the receipt.
  Out of scope (guardrails):
  - Any repo/cwd access for the verifier.
  - New .claude/agents/ files.
  - Halting the close on cap (DEGRADE instead).

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] A deliberately gutted handoff FAILS the verifier — gutted-handoff test transcript archived in the evidence bundle"
  - "[ ] The real handoff yields a next-step quote that appears in the receipt — receipt's quoted next step shown to match the verifier output"
  - "[ ] Wigum cap 5 reached -> DEGRADE: receipt marks DEGRADED, close still allowed (never halted)"
  - "[ ] No new .claude/agents/ definition files created — verifier dispatched as a fresh general-purpose Task with handoff text only (dispatch inspectable)"
  - "[ ] Evidence bundle populated at .acos/evidence/[DATE]/SLICE-22-blind-roundtrip/ with the 7-part bundle (implementation summary, traceability, structural quality, functional checks, security notes, operational notes, self-assessment)"
  - "[ ] Dev Learnings and QA Learnings sections of the preeng task file updated (slice not Done until both are)"

