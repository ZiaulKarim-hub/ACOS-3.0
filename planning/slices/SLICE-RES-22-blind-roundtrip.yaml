  - "Test-the-tester case 2: the real handoff must yield a next-step quote that appears in the receipt."

# Verification method (QA — zero-trust; skill-mandated extension of the template)
verification_method: |
  - Both test-the-tester transcripts archived; the receipt's quoted next step
    shown to match the verifier output.
  - Confirm the verifier truly had no repo/cwd access (inspect the dispatch).
  - Confirm a gutted handoff fails (do not trust a single pass).
  - Confirm DEGRADE, never halt, on cap.
  - QA assumes the Dev did NOT do the work correctly: verify scope respect and
    evidence authenticity (no fabricated logs — spot-check and recompute).
    QA may REJECT and require rework until the gates pass.

