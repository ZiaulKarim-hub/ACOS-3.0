# Slice overview
title: "Dedup on APN + per-owner aggregation"
objective: |
  Implement dedup.py: canonicalize APN and merge cross-channel duplicate parcels —
  UNIONING provenance + freshness across the channels that found them — then aggregate
  holdings per owner / controlled entity. One parcel found via assessor + recorder + ArcGIS
  becomes one row carrying all three sources. Out of scope: scoring (slice-09), equity
  rollup (slice-10).

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] The same parcel found via 3 channels collapses to one record that retains all 3 source_refs + the freshest stamp — pass: merge-unions-provenance test (REQUIRED; dropped provenance = REJECT)"
  - "[ ] APN canonicalization handles county format variants (dashes/spaces/leading zeros) deterministically — pass: canonicalization test"
  - "[ ] Distinct APNs are never merged — pass: no-false-merge test"
  - "[ ] Holdings aggregate per owner / controlled entity — pass: aggregation test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

