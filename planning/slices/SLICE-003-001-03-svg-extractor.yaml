# Notes
notes: |
  Brad's chart SVGs are the highest-fidelity element in the entire
  document — they are vector all the way through the pipeline (HTML →
  this parser → editor canvas → Puppeteer PDF export). Any quality
  loss in this slice cascades to the final PDF.

  Do NOT introduce an SVG parsing library (svgo, svg-parser, etc.).
  rawMarkup as a string + viewBox metadata is all downstream needs.
