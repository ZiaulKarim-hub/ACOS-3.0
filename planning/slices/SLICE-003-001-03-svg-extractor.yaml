# Context for the developer
context:
  - "SVG preservation must be byte-faithful. Brad's chart SVGs use precise dasharrays, gradients, and embedded fonts. ANY mutation of the markup breaks chart rendering."
  - "Use el.outerHTML to capture rawMarkup. Do not reconstruct from el.innerHTML — you'll lose attributes on the root <svg>."
  - "viewBox parsing: SVGSVGElement.viewBox.baseVal is an SVGRect with x/y/width/height as numbers. Width OR height of 0 means viewBox is absent."
  - "aspectRatio derivation order: (1) viewBox.width / viewBox.height if both > 0; (2) attribute width / attribute height if both > 0; (3) fallback 1.0 + warn."
  - "Walker dispatch: when the walker hits an <svg>, it should call extractSvg and then NOT descend into the SVG's children. Otherwise text extractors will mis-fire on <text> SVG elements."
  - "Brad's chart pipeline emits SVGs without a viewBox sometimes (only width/height attributes). The default-fallback path is important — don't treat 'no viewBox' as an error."

# Technical requirements
technical_requirements:
  - "extractSvg is a pure function — no DOM mutation, no side effects beyond logging"
  - "Walker is updated minimally: one new conditional branch + early-return"
  - "Round-trip integrity test serializes via outerHTML, re-parses via DOMParser, and asserts deep equality"
  - "Performance: parsing 10 SVGs adds <20ms to walker total"

# Testing requirements
testing_requirements:
  - "Vitest unit tests for extractSvg covering: with-viewBox, with-width-height-attrs, with-neither, with-nested-defs"
  - "Round-trip test: rawMarkup → DOMParser → outerHTML → assert structural equality"
  - "Integration through extract(): full brad-chart.html parse returns N records of kind='svg' where N = number of <svg> in fixture"

