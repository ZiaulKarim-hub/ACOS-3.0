# Slice overview
title: "Inline SVG extractor"
objective: |
  Capture every <svg> element in the source HTML as a single
  ContainerRecord with kind='svg'. SVG markup is preserved verbatim
  (no traversal of internal <path>/<circle>/<g> nodes) so the editor
  and PDF export pipeline can re-render the chart at any size without
  quality loss. Intrinsic dimensions derived from viewBox or width/height
  attributes; aspect ratio computed for downstream aspect-locked corner
  drag.

# Acceptance criteria
acceptance_criteria:
  - "[ ] apps/visual-composer/src/parser/extractors/svg.ts exports extractSvg(el: SVGSVGElement): ContainerRecord with kind='svg'"
  - "[ ] ContainerRecord.content for kind='svg' includes: rawMarkup (string, the full <svg>…</svg> source), viewBox ({x,y,width,height} | null), aspectRatio (number)"
  - "[ ] Walker (dom-walker.ts from slice 02) is updated to dispatch <svg> elements to extractSvg() and skip walking SVG internals"
  - "[ ] SVG with explicit viewBox=\"0 0 100 50\" produces aspectRatio = 2.0"
  - "[ ] SVG without viewBox but with width=\"200\" height=\"100\" attributes produces aspectRatio = 2.0 and viewBox = null"
  - "[ ] SVG with neither viewBox nor width/height defaults to aspectRatio = 1.0 (square) and an info-level warning is logged"
  - "[ ] Unit tests in tests/parser/svg.test.ts pass against tests/fixtures/brad-chart.html (assertion: every <svg> appears as a record, rawMarkup preserves <path>/<g> children byte-for-byte)"
  - "[ ] tests/fixtures/brad-chart.html exists: a Brad-style document containing at least 3 <svg> nodes representing a bar chart, a line chart, and an icon; one with viewBox, one with explicit dimensions, one with neither"
  - "[ ] Round-trip integrity: parsing rawMarkup back through DOMParser produces an equivalent SVG (assert via outerHTML equality after parse → serialize)"

