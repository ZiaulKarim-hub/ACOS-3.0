# Slice overview
title: "Two-tier data model + raw-response cache"
objective: |
  Implement the two-tier data model: Tier-1 RawApiResponse cache = immutable
  source of truth keyed for provenance lookup, and the Tier-2 NormalizedAnswerRecord
  derived view where every normalized field carries a back-pointer (raw_response_id
  + json_field_path) to its Tier-1 source. This is what makes provenance
  structurally guaranteed. In scope: hca-cache.py (persist/lookup Tier-1 records
  keyed by raw_response_id; immutable once written); hca-normalize.py (build Tier-2
  records from Tier-1, typed projection, with per-field bindings — unit/currency
  normalization wiring stubbed here, fully implemented in slice-05); the on-disk
  cache store. Out of scope: provenance refusal logic (slice-04), the gate suite
  math (slice-05), consensus.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Tier-1 cache writes immutable RawApiResponse records (re-write of same key is rejected or no-op) and looks them up by raw_response_id — pass-condition: immutability + lookup tests pass"
  - "[ ] Tier-2 NormalizedAnswerRecord built from Tier-1 with field_bindings mapping each field -> {raw_response_id, json_field_path} and derived_from[] — pass-condition: 100% of Tier-2 field bindings resolve to a real Tier-1 source + correct path (binding-resolution test); any unresolvable binding = REJECT"
  - "[ ] Each agent can be handed a minimal Tier-1 slice (scoping helper) rather than the full cache — artifact: scoping helper + test verifying no full-cache dump and no extra PII (PII/token minimization)"
  - "[ ] Cache is durable/resumable (re-run finds prior Tier-1 without re-fetch) — pass-condition: resume test"
  - "[ ] Cache dir under .acos/state/hca-cache/ is git-ignored and PII-minimized; no secrets persisted — pass-condition: scope/PII check"
  - "[ ] Dev Learnings and QA Learnings sections updated"

