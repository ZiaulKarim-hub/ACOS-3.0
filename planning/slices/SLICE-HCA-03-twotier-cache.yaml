# Context for the developer
context:
  - "Bridged from planning/preeng/001-hypercore-ask/tasks/slice-03-twotier-cache.md"
  - "Tier-1 is the immutable source of truth; Tier-2 is a derived view whose every field carries a back-pointer to Tier-1 (this is what makes provenance structural)."
  - "Gotcha (hard gate): 100% of Tier-2 field bindings must resolve to a real Tier-1 record at the correct json_field_path; any unresolvable binding = REJECT."
  - "Gotcha: never mutate a Tier-1 record after write (write-once); minimize PII in cache; persist no secrets; cache dir is git-ignored."

# Technical requirements
technical_requirements:
  - "Python 3 stdlib only; immutability enforced (write-once JSON store keyed by raw_response_id; reject silent overwrite)"
  - "hca-cache.py provides get(raw_response_id) and put(raw_api_response)"
  - "hca-normalize.py walks a Tier-1 body, projects typed fields, records json_field_path for each (e.g. $.data[3].outstanding_principal), sets derived_from"
  - "Scoping helper extracts the minimal Tier-1 slice for a given value/question (PII/token minimization)"
  - "Cache durable/resumable; AES-256-at-rest noted as posture TODO"

# Testing requirements
testing_requirements:
  - "QA attempts to mutate a written Tier-1 record via the API; confirm rejected (immutability)"
  - "QA independently resolves every field_bindings entry of a sample Tier-2 record back to a real Tier-1 record and verifies json_field_path points at the value; any unresolvable binding = REJECT"
  - "QA confirms the scoping helper returns only the minimal slice (no full-cache dump, no extra PII)"
  - "QA confirms resume finds cached Tier-1 without re-fetch (durability)"

