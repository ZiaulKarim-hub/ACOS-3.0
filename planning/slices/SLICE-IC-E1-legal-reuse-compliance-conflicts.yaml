# Slice overview
title: "Legal-analyst reuse + compliance companion + conflicts-disclosure"
objective: |
  Wire the Legal & Structural seat to reuse legal-analyst via /acos-legal-analysis --mode
  lending, re-project red-flags.yaml into IC voting format, run the compliance companion for
  legal-analyst's four gaps, and emit the per-run conflicts-disclosure.yaml.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] scripts/legal_seat.py dispatches legal-analyst via /acos-legal-analysis --mode lending"
  - "[ ] legal_seat.py parses findings-manifest.yaml + red-flags.yaml and maps each red flag to an Objection (+ Axis S + deal-breaker-vs-curable classification per spec Appendix D)"
  - "[ ] every legal Objection traces back to a real red-flags.yaml entry (no parallel/invented legal framework)"
  - "[ ] the compliance companion runs the four gap checks: lender-side usury/licensing per-deal jurisdiction (+ Utah CFR), AML/KYC/OFAC/beneficial-ownership, structured foreclosure fields (foreclosure_type/timeline_days/deficiency_available), and the ASTM E1527-21 Phase I currency gate"
  - "[ ] the Phase I currency gate flags a pre-2024-02-13 / E1527-13 report"
  - "[ ] OKOA governance unknowns (e.g. Advisers Act / SPE-threshold rules) are Assumption-marked, never hardcoded"
  - "[ ] scripts/conflicts_disclosure.py emits conflicts-disclosure.yaml per run, listing each seat's disclosure + process attestations + reduced-independence flag"
  - "[ ] evidence bundle includes the legal delegation transcript, the four-gap checks, and the conflicts artifact"

# Dependencies
dependencies:
  slices:
    - slice_id: "SLICE-IC-A2-expert-agent-defs"
      what_it_provides: "TODO: confirm -- the Legal & Structural seat definition this slice wires legal-analyst reuse into (not an explicit READ-ONLY reference in the task file; inferred from the \"wire the Legal & Structural seat\" objective wording)"
