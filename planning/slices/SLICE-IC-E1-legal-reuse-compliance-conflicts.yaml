  - "Assumption note from task file: do NOT hardcode Advisers Act / SPE-threshold rules; surface OKOA governance unknowns as gaps"
  - "REUSE, don't rebuild -- re-derivation of legal-analyst's framework is a defect; subscription-only via Task()/skill dispatch; do not confabulate OKOA registration status"

# Technical requirements
technical_requirements:
  - "red-flag re-projection must be 1:1 traceable to legal-analyst's own red-flags.yaml output"
  - "per-deal jurisdiction usury/licensing footprint is Assumption-marked, not hardcoded"

# Testing requirements
testing_requirements:
  - "QA confirms every legal Objection maps to a real red-flags.yaml entry (no invented legal framework -- recomputes the mapping)"
  - "QA confirms all four compliance gaps produce a check and the Phase I gate rejects a stale/E1527-13 report"
  - "QA confirms OKOA governance unknowns are Assumption-marked, NOT hardcoded as rules"
  - "QA confirms conflicts-disclosure.yaml exists and lists each seat's disclosure"

