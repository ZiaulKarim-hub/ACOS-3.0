# Slice overview
title: "Cache + fetch + scraping posture"
objective: |
  Implement cache.py: a JSON cache with freshness TTLs that wraps EVERY external lookup,
  keyed by person/entity/address/parcel/query. It must survive 403s and rate limits, make
  re-runs cheap and resumable, and surface per-record freshness stamps. Enforce the
  scraping posture (public no-login pages only; respect robots/rate limits; per-datum
  provenance). In scope: scripts/cache.py + posture helper. Out of scope: specific
  channels (slice-05) and the graph (slice-04).

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] A second identical lookup within TTL is served from cache (fetch_fn called once) — pass: cache-hit test"
  - "[ ] A lookup past its TTL is marked stale and re-fetched — pass: staleness test"
  - "[ ] A 403 / rate-limit is captured as a cache status without crashing the run — pass: block-resilience test (re-authored 403 fixture)"
  - "[ ] Every cache entry carries fetched_at + source_url (freshness stamp) — pass: stamp test"
  - "[ ] No external lookup proceeds while COMPLIANCE_BLOCKED — pass: gate-respect test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

# Dependencies (from depends_on in stories.json)
