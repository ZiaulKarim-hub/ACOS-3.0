# Slice overview
title: "Diagnostics + validation (problem-before-solution)"
objective: |
  Confirm the trust-failure diagnosis and lock build ground rules BEFORE writing
  any solution code. Validate hypothesis H1 (the dominant trust failure is
  aggregation / units / currency / silent-truncation errors that look plausible —
  not raw text fabrication), and record the Python 3 stdlib and stubbed-access
  decisions. In scope: a written diagnostic record (symptoms S1–S4, affected
  roles, current-vs-desired table, hypotheses H1–H3, unknowns U1–U5); a decision
  log entry; a gate-priority recommendation derived from H1. Out of scope: any
  solution code, adapter/cache/gate implementation, or Hypercore API call.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Diagnostic record produced covering symptoms (S1–S4), affected roles, current-vs-desired table, hypotheses (H1–H3), and unknowns (U1–U5) — artifact: diagnostic section in this slice's evidence bundle"
  - "[ ] H1 explicitly marked confirmed or still-Assumption; if still-Assumption, a validation hook is pointed at SLICE-HCA-11-completeness-hardening — pass-condition: H1 status recorded with rationale"
  - "[ ] Decision record written confirming Python 3 stdlib only (no third-party deps) and the stubbed-client-until-access ground rules — artifact: memory/decisions/<id>-hca-build-ground-rules.md"
  - "[ ] Gate-priority recommendation recorded (ranked list of highest-leverage gates given H1) — pass-condition: ranked list present and consistent with H1"
  - "[ ] No solution code written; NO files created under .claude/skills/acos-hypercore-ask/ or .claude/scripts/ (scope) — fail = REJECT"
  - "[ ] Evidence bundle authentic (no fabricated logs); independent re-derivation of symptoms/hypotheses from spec.md §Diagnostics confirms the record invented no new claims"
  - "[ ] Dev Learnings and QA Learnings sections updated"

