# Slice Plan Template
# Created by The Architect

slice_id: "SLICE-[STORY]-[NNN]"
story_id: "STORY-[EPIC]-[NNN]"
epic_id: "EPIC-[NNN]"
vision_id: "VISION-[PROJECT-NAME]"
created_date: "[YYYY-MM-DD]"
created_by: the-architect
status: "[planned | assigned | in_progress | review | complete]"

# Slice overview
title: "[Slice Title]"
objective: |
  [Clear, specific description of what this slice accomplishes.
  This should be achievable in a single work session.]

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] [Criterion 1 - Very specific, testable]"
  - "[ ] [Criterion 2 - Can be verified objectively]"
  - "[ ] [Criterion 3]"

# Dependencies
dependencies:
  slices:
    - slice_id: "[SLICE-XXX-NNN]"
      what_it_provides: "[What we need from this slice]"
      status: "[complete | in_progress]"

# File permissions
files_allowed:
  - "[path/to/file1.ts]"
  - "[path/to/directory/]"

files_prohibited:
  - "[path/to/protected/config.ts]"
  - "[path/to/unrelated/]"

# Skills recommended
skills_recommended:
  - "[frontend-coding | backend-coding | database-design | etc.]"

# Flow to use
flow: "slice-execution-flow"

# Context for the developer
context:
  - "[Relevant context item 1]"
  - "[Relevant context item 2]"
  - "[Any gotchas or edge cases to watch for]"

# Technical requirements
technical_requirements:
  - "[Specific technical requirement 1]"
  - "[Specific technical requirement 2]"

# Testing requirements
testing_requirements:
  - "[What tests should be written/updated]"

# Review triggers (which reviewers will be assigned)
# Based on review-rules.yaml - this is informational only
expected_reviewers:
  - "ACOS-qa-reviewer"  # Always
  - "[ACOS-security-reviewer if security-related]"
  - "[ACOS-performance-reviewer if performance-related]"

# Effort estimate
effort_estimate: "[S | M | L]"
# S = < 1 hour of work
# M = 1-3 hours of work
# L = 3-8 hours of work

# Assignment
assigned_to: "[ACOS-developer | null if not yet assigned]"
assigned_date: "[YYYY-MM-DD | null]"

# Handoff reference (populated when assigned)
handoff_path: "[memory/handoffs/architect-to-developer/HANDOFF-XXX.yaml | null]"

# Notes
notes: |
  [Any additional notes for the developer]
