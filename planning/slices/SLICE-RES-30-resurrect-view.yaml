# Slice overview
title: "resurrect-view.py: fresh book, liveness joins, tiers, BROKEN red, no green"
objective: |
  Implement resurrect-view.py: an honest book computed FRESH per request (no
  persisted master markdown), so a stale registry can never be a lying registry.
  Liveness is computed live via lsof PID->cwd + ps tty joined to
  `cmux tree --all --json`. Workspaces join to rows via the [key:<uuid>] tag
  with a process-join fallback for untagged workspaces — never cwd-string,
  never title. Rows render in tiers (OPEN NOW / RECENT / COLD(>30d) /
  NO HANDOFF / ARCHIVED) with dirty as a COUNT, amber staleness, and a
  clickable file:// handoff link. BROKEN rows render red and are never
  hidden; a green badge is NEVER emitted.
description: |
  The way IN for the Resurrection Protocol (Demo 1 + Demo 3 — the book).
  Fresh render over registry.d; read-only against cmux tree/rpc and
  registry.d. Out of scope: any stored liveness flag, cwd-string or title
  matching, and any green badge / health score / verdict.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Renders today's real state — FruitSync + ACOS 3.0 appear as OPEN NOW; rendered output archived against the known live state in .acos/evidence/[DATE]/SLICE-RES-30-resurrect-view/"
  - "[ ] ACOS 3.0's two live workspaces (4 and 5) render as ONE row — the two-workspaces-one-row case shown in the archived rendered output"
  - "[ ] A deliberately broken row renders BROKEN in red, not hidden — broken-row injection + resulting render archived as evidence"
  - "[ ] No green anything is emitted anywhere — grep of the render for green/checkmark/verdict archived with zero hits (a hit is a QA REJECT)"
  - "[ ] Evidence bundle populated at .acos/evidence/[DATE]/SLICE-RES-30-resurrect-view/ with the 7 parts: implementation summary, requirements traceability (spec FR-* / tech_prd TR-*), structural quality evidence, functional/structural checks, security/compliance notes, operational/runtime considerations, self-assessment"
  - "[ ] '## Dev Learnings' and '## QA Learnings' sections of the preeng task file updated — the slice is not Done until they are (per §0.7)"

