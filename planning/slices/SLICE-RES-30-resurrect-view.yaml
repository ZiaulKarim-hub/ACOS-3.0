# Verification method (skill-mandated extension; from task QA section)
verification_method: |
  Zero-trust QA — assume the Dev did not do the work correctly. Verify scope
  respect and evidence authenticity (no fabricated logs — spot-check and
  recompute). Rendered output archived against the known live state; the
  two-workspaces-one-row case shown; a broken row injected and shown BROKEN.
  QA checks:
  - Confirm liveness is computed live: kill a session and re-render; the row
    updates without any stored flag.
  - Confirm the two-workspaces-one-row join is by uuid tag / process, never
    cwd or title.
  - Grep the render for any green/checkmark/verdict; if present, REJECT.
  A QA REJECT blocks the slice like an INCONCLUSIVE reviewer until rework
  passes the gates.

