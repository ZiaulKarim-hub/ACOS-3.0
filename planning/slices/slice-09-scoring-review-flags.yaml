# Slice overview
title: "Scoring + confidence tiers + review-flag taxonomy"
objective: |
  Implement score.py: the merged scoring rubric -> score + per-signal breakdown;
  confidence tiers (>=75 high / 50-74 candidate / <50 weak, configurable); the hub cap
  (score <=40 if the only graph link runs through a hub); the common-name penalty; and
  emission of manual-review flags from the taxonomy (references/review-flags.md). Rubric:
  +40 owner-of-record exact / +25 tax-mailing / +25 manager-member-officer / +20 shared
  phone-email / +10 spouse-associate / +10 per independent corroborating channel (cap +20);
  -40 registered-agent-only / -30 common-name-only / -20 hub-virtual-office mailing / -10
  inactive-dissolved / -10 conflicting owner names; cap <=40 through a hub.

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] The rubric produces the exact documented score for fixture cases, with each +/- signal itemized — pass: rubric test (hand-recomputed)"
  - "[ ] Tiers assigned at the 75/50 cutoffs (configurable) — pass: tier-cutoff test"
  - "[ ] An attribution whose only link runs through a hub is capped at <=40 (candidate at best) — pass: hub-cap test (REQUIRED)"
  - "[ ] A common-name-only match is penalized (-30) and flagged — pass: common-name test"
  - "[ ] Conflicting owner names emit a review flag (never silently resolved) — pass: conflict-flag test (REQUIRED)"
  - "[ ] Scoring is deterministic given identical inputs — pass: determinism test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

