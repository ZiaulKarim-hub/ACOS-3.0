# Slice overview
title: "Full question->plan->fetch->verify->answer orchestration (report tier)"
objective: |
  Assemble the full report/aggregation-tier pipeline in SKILL.md: question -> plan ->
  fetch (fixture adapter) -> Tier-1 cache -> normalize -> N blind agents -> consensus
  -> deterministic gate suite -> provenance binder -> deliver | refuse | escalate.
  This is the complete state machine RECEIVED -> TIER_ROUTED -> FETCH_OR_CACHE ->
  RAW_CACHED -> EXTRACT -> CONSENSUS -> GATES -> BOUND -> DELIVERED | REFUSED |
  ESCALATED | NO_LIVE_DATA. In scope: the report-tier orchestration composing
  slices 02-06; the full state machine with checkpointing/resume; the report/table
  answer envelope (per-figure provenance + confidence); escalate/refuse/no-live-data
  terminal states for the report tier. Out of scope: downstream feed formats +
  manifest (slice-09), PII/security hardening (slice-10), completeness stress-fixtures
  (slice-11) — basic versions exist from upstream slices.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] An aggregation question (UC3, e.g. 'total committed vs funded across the construction book by borrower') runs the full report-tier pipeline on fixtures and returns a report where every figure carries its own resolvable provenance + confidence — pass-condition: report-pipeline walkthrough; per-figure provenance resolves (fail = REJECT)"
  - "[ ] Report tier REQUIRES consensus: a figure without quorum is escalated/refused, not delivered — pass-condition: consensus-required test (REQUIRED; fail = REJECT)"
  - "[ ] The full gate suite runs on consensus-agreed figures; any hard gate failure refuses that figure (while others may proceed) — pass-condition: gate-integration test"
  - "[ ] State machine is checkpointable: re-run resumes from the last persisted Tier-1 cache without re-fetch — pass-condition: resume test"
  - "[ ] Terminal states (DELIVERED/REFUSED/ESCALATED/NO_LIVE_DATA) all reachable and correct — pass-condition: state-coverage test"
  - "[ ] No live API call; no report figure delivered without per-figure provenance — pass-condition: QA re-resolves provenance + re-does arithmetic"
  - "[ ] Dev Learnings and QA Learnings sections updated"

