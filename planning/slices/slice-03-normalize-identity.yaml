# Slice overview
title: "Normalize/classify + Stage-1 identity resolution"
objective: |
  Implement normalize.py (person-vs-entity classification; alias / maiden / Jr-Sr /
  middle-name variants; deterministic fuzzy match) and Stage-1 identity resolution:
  expand aliases, prior addresses, spouse/relatives/associates from free people-search as
  LEADS ONLY (corroborate against a primary record before scoring), and require >=2
  anchors for common names. Reconcile the existing scripts/normalize.py stub to this.

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] Person vs. entity classified correctly across a fixture set — pass: classification test"
  - "[ ] Alias / maiden / Jr-Sr / middle-name variants generated; fuzzy match deterministic — pass: variant + fuzzy test"
  - "[ ] People-search-derived seeds are tagged leads_only and NOT scorable until corroborated — pass: leads-only test (REQUIRED; a lead used as a fact = REJECT)"
  - "[ ] A common name without >=2 anchors is refused / down-ranked, not broadly searched — pass: anchor-enforcement test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

