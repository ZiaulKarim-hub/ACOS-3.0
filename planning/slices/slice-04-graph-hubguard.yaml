# Context for the developer
context:
  - "Bridged from planning/preeng/002-acos-property-search/tasks/slice-04-graph-hubguard.md"
  - "The graph is the spine and it must NOT explode: a commercial registered agent / shared address is a hub (one hub ~ N^2 false links)."
  - "Gotcha (hard gates): the edge-schema invariant AND the hub-prune test are REQUIRED; fail = REJECT."
  - "Gotcha: log EVERY prune so coverage stays honest. Keep the inverse signal — a lone individual agent on a few entities is a strong link, not a hub."

# Technical requirements
technical_requirements:
  - "Python 3 stdlib only"
  - "add_edge rejects an edge missing source/source_url/date_last_verified (and the rest of the temporal/provenance schema)"
  - "Hub detection: stop-list match OR frequency >= threshold; expansion skips hub edges and appends to the prune log"
  - "Bound expansion to the hop limit from each seed; strength_rank + inverse-frequency weighting applied"

# Testing requirements (from QA verification steps)
verification_method:
  - "QA re-authors a CT-Corporation-style hub; confirm siblings are NOT expanded through it and the prune is logged"
  - "QA tries to persist an edge with no source_url; confirm rejection"
  - "QA confirms expansion stops at the hop limit (a deep seed cannot reach 3+ hops)"
  - "QA confirms a lone individual agent on 3 related entities is kept as a strong link"

