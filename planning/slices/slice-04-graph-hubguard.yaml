# Slice overview
title: "Entity graph engine + hub-guard"
objective: |
  Implement graph.py: the entity-graph engine with the temporal/provenance edge schema on
  EVERY edge, edge-strength ordering, inverse-frequency weighting, and the hub-guard —
  registered-agent stop-list (hub_agents.txt) + dynamic hub detection (>=25, configurable)
  + bounded hops (2, configurable) + log-every-prune. Keep the inverse signal: a
  non-commercial agent on a few related entities is a strong control link. In scope:
  scripts/graph.py + references/hub_agents.txt. Out of scope: channel lookups (slice-05),
  swarm/round logic (slice-06).

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] Every persisted edge carries the full temporal/provenance schema; an edge missing source/url/date is rejected — pass: edge-schema invariant test (REQUIRED; fail = REJECT)"
  - "[ ] Expansion through a stop-listed registered agent is pruned and logged — pass: hub-prune test (REQUIRED); a sibling expanded through a hub = REJECT"
  - "[ ] An agent/address at/over the frequency threshold (default 25) is detected as a hub and pruned — pass: dynamic-hub test"
  - "[ ] Expansion never exceeds the hop limit (default 2); every prune is logged — pass: hop-limit + prune-log test"
  - "[ ] A non-commercial agent on a few entities is kept as a strong link (inverse signal) — pass: inverse-signal test"
  - "[ ] Edge-strength ordering + inverse-frequency weighting applied — pass: strength/weight test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

# Dependencies (from depends_on in stories.json)
