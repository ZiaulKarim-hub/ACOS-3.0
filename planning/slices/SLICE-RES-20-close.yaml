# Slice overview
title: "close-project.sh steps 0-10 + four guards + last-workspace guard + agent-03 7-check gate"
objective: |
  Implement close-project.sh steps 0-10 in order with four guards plus the
  last-workspace guard and the agent-03 7-check verification gate, so that
  closing a project tab is verified zero-loss: the tab vanishing IS the
  success signal; the tab staying open IS the failure signal.
description: |
  In scope:
  - Step 0 writes state/stop-<sid> FIRST (the only daemon-dir write).
  - Step 1: the parent writes the intent core (never delegated).
  - Enrich from disk; delegate to handoff-agent only if context-starved,
    via Bash heredoc not Write.
  - Write co-located handoff.yaml + <slug>.reentry.md + git-state/drift
    under memory/handoffs/closed/<slug>/.
  - Wire the 7-check verification gate (agent-03); the blind round-trip
    (step 5) is a separate slice (SLICE-RES-22-blind-roundtrip).
  - Atomic row upsert (enrich, never create); read-back sha256 assert;
    inline cleanup.
  - Validated workspace.close as the literal last statement; four guards
    plus the last-workspace guard.
  Out of scope (guardrails):
  - Any identify --surface fallback (fails open).
  - Auto-stash (record state, never mutate the tree).
  - Creating a registry row at close (enrollment already did).
  - Writing .resume.md or top-level memory/handoffs/*.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Tamper test: delete the handoff between write and read-back -> receipt refuses SAFE and the tab stays open (archived tamper-test transcript in .acos/evidence/[DATE]/SLICE-20-close/)"
  - "[ ] Unvalidatable CMUX_WORKSPACE_ID -> fail closed: no close, no identify fallback (archived transcript; code inspection shows no identify --surface path exists)"
  - "[ ] Last-workspace case -> close skipped with an explicit message (archived transcript)"
  - "[ ] state/stop-<sid> exists BEFORE step 1 and is the ONLY daemon-dir write (before/after directory diff of the daemon dir archived)"
  - "[ ] Receipt listed N of M == git status --porcelain | wc -l (N of M independently recomputed by QA)"
  - "[ ] Artifacts co-located under memory/handoffs/closed/<slug>/ with status: parked, type: close-project, and glob-invisible to Eternity (ls -t memory/handoffs/*.md *.yaml output unchanged, archived before/after)"
  - "[ ] pending-resume-*.txt population unchanged before/after (diff archived)"
  # TODO: confirm — exact contents of the agent-03 7-check gate (task defers to agent-03/findings.md "at build time"; the 7 checks are not enumerated in the task file)
  # TODO: confirm — last-workspace guard parameterization (task says "parameterized by SLICE-00 DP2 result"; the DP2 result is not stated in the task file)

