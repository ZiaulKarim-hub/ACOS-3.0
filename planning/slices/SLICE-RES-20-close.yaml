# Verification method (skill-mandated extension; from the task's QA section)
verification_method: |
  QA assumes the Dev did NOT do the work correctly:
  - Independently re-run all tamper tests; archive each transcript.
  - Recompute the receipt's listed N of M against git status --porcelain | wc -l.
  - Diff the whole daemon dir to confirm the ONLY daemon write is state/stop-<sid>.
  - Inspect the code to confirm no identify fallback path exists.
  - Read the script tail to confirm close is literally the last statement.
  - Confirm the Eternity glob (ls -t memory/handoffs/*.md *.yaml) is unchanged
    and show the sha256 read-back assert output.
  Evidence bundle populated at .acos/evidence/[DATE]/SLICE-20-close/ with the
  7-part Dev bundle (implementation summary, requirements traceability to
  spec FR-* / tech_prd TR-*, structural quality, functional checks, security/
  compliance notes, operational notes, self-assessment). QA may REJECT and
  require rework; a reject blocks the slice like an INCONCLUSIVE reviewer.

