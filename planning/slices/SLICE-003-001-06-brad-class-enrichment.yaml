# Notes
notes: |
  This separation is what makes the vision document's "OKOA-primary,
  generic-fallback" promise auditable. The off-mode test in this slice
  is the proof. Reviewer should run it explicitly.

  If the Brad design system adds classes in the future, this is the
  ONE file to update — taxonomy is centralized here intentionally.

  Note that extractors (slices 02–05) are intentionally prohibited
  from modification in this slice. If a downstream slice review reveals
  a needed extractor change, that's a separate slice (or a re-spawn of
  the upstream slice), not a scope expansion here.
