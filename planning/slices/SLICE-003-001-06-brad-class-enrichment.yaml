# Slice overview
title: "Brad-class metadata enrichment pass"
objective: |
  Implement a separate semantic post-pass that tags ContainerRecord
  values with brad_class metadata when an OKOA design-system class is
  recognized. Keeps Brad knowledge out of every extractor (slices 02–05
  are Brad-agnostic). Implemented as enrich(records, {enabled}) so
  generic-HTML fallback mode is testable by passing enabled: false.

  The Brad class taxonomy is read from a static lookup table maintained
  in this slice — additions to the taxonomy happen here, not scattered
  across extractors.

# Acceptance criteria
acceptance_criteria:
  - "[ ] apps/visual-composer/src/parser/brad-enrichment.ts exports enrich(records: ContainerRecord[], opts: { enabled: boolean }): ContainerRecord[]"
  - "[ ] When opts.enabled === true, every record whose source element bears a known Brad class is tagged with bradClass = that class name"
  - "[ ] When opts.enabled === false, no records are modified — output is structurally identical to input"
  - "[ ] Brad class taxonomy lives in apps/visual-composer/src/parser/brad-taxonomy.ts as a const string array (or Set), at minimum 12 entries from the documented Brad design system (.heading-display, .heading-subhead, .body-lead, .body-default, .metric-grid, .metric-card, .chapter-divider, .pull-quote, .caption, .footnote, .data-table, .photo-break)"
  - "[ ] Container records expose source-element class lists in some form (note: ContainerRecord.computedStyle or a new dom-classes field — defined in slice 01 or extended minimally here). If a new field is needed, types.ts is editable for this single addition."
  - "[ ] Multiple Brad classes on one element: bradClass is set to the most specific match per a priority table (heading > metric > chapter > data > body > caption > footnote); ties broken by taxonomy order"
  - "[ ] Unit tests in tests/parser/brad-enrichment.test.ts pass against tests/fixtures/brad-classed.html"
  - "[ ] tests/fixtures/brad-classed.html exists: a Brad-style document with at least 8 different Brad classes applied across various elements"
  - "[ ] Off-mode test: same fixture parsed with enabled: false produces records with all bradClass values === undefined"
  - "[ ] Generic-HTML fallback test: a fixture WITHOUT any Brad classes, parsed with enabled: true, produces records with bradClass === undefined throughout (no false positives)"

