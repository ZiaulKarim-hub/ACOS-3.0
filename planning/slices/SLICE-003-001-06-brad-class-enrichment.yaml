# Context for the developer
context:
  - "DELIBERATE design: this is a SEPARATE pass, not inlined into extractors. Reason: keeps slices 02–05 Brad-agnostic, allows generic-HTML fallback to be tested by toggling one flag."
  - "If ContainerRecord doesn't already carry the source element's class list, this slice can extend types.ts to add a `domClasses: string[]` field on the base ContainerRecord. Update dom-walker.ts to populate it. This is the only mid-story type extension permitted."
  - "Priority table for resolving multi-class elements: const PRIORITY = ['heading-display', 'heading-subhead', 'metric-grid', 'metric-card', 'chapter-divider', 'data-table', 'photo-break', 'pull-quote', 'body-lead', 'body-default', 'caption', 'footnote']; first match in this list wins."
  - "Brad taxonomy is documented in acos-document-design-brad. Use that as the source of truth for class names. If you can't find a documented list, the 12 entries in the acceptance criteria are sufficient for v1; expand later."
  - "Off-mode determinism: enrich(records, { enabled: false }) MUST return records ===-equal to input. Do not even clone. The test asserts referential equality."
  - "False-positive guard: only match exact Brad class names. Substring matches (.body matching .body-default) are NOT allowed. Use Set.has() lookup, not regex."

# Technical requirements
technical_requirements:
  - "enrich is a pure function — no mutation of input records when enabled, returns new array of new records when modifying"
  - "Taxonomy is a const data structure exported separately so reviewers can audit it without reading enrichment logic"
  - "Type extension to ContainerRecord (if needed) is BACKWARD-COMPATIBLE: optional fields only"
  - "Performance: enrich() on 200 records completes in <5ms (synchronous, in-memory)"

# Testing requirements
testing_requirements:
  - "Test: every Brad class in taxonomy → corresponding record bears bradClass = class name"
  - "Test: multi-class element resolves to highest-priority match"
  - "Test: enabled=false → records unchanged (referential equality)"
  - "Test: generic HTML (no Brad classes) → bradClass undefined throughout"
  - "Test: false-positive guard — class 'body-paragraph' (not in taxonomy) does NOT match 'body-default' or 'body-lead'"

