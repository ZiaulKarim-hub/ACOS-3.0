# Slice overview
title: "acos-safe-close/SKILL.md thin router"
objective: |
  Author .claude/skills/acos-safe-close/SKILL.md as a thin router over
  close-project.sh: the parent writes the intent core, calls the script,
  and prints the script's receipt verbatim. The skill never composes its
  own receipt.
description: |
  Safety-critical logic stays in the script (ran 8/8), not skill prose
  (8/18); the receipt is script-printed, never composed. In scope: the
  thin-router SKILL.md only. Out of scope (guardrails): any safety-critical
  logic in prose; delegating the intent core to a sub-agent by default.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Full end-to-end run on a THROWAWAY project: receipt says SAFE only after all checks; tab closes as the literal last act — run transcript archived in .acos/evidence/[DATE]/SLICE-21-safe-close-skill/"
  - "[ ] The skill prints the script's receipt verbatim and composes nothing — printed receipt byte-identical to close-project.sh output; any model-composed receipt line is a QA REJECT"
  - "[ ] SKILL.md contains no safety-critical logic (SPINE 4) — QA inspection of SKILL.md confirms no load-bearing logic in prose"
  - "[ ] Evidence bundle at .acos/evidence/[DATE]/SLICE-21-safe-close-skill/ populated with the 7-part bundle (Implementation Summary; Requirements Traceability to spec FR-* / tech_prd TR-*; Structural Quality; Functional/structural checks; Security/Compliance; Operational/Runtime; Self-assessment)"
  - "[ ] '## Dev Learnings' and '## QA Learnings' updated in the preeng task file — the slice is not Done until they are (§0.7)"
  # TODO: confirm — the intent-core content/format the parent must write is not specified in this task file (defined by the close-project.sh contract from SLICE-RES-20-close)

