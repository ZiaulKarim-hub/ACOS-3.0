# Slice overview
title: "Estimated equity / value / debt rollup"
objective: |
  Implement rollup.py: per confirmed parcel, compute an ESTIMATED equity picture from FREE
  data — assessed value (flag 'assessed, not market; assessment ratio varies by state'),
  last sale price + date, original recorded mortgage/deed-of-trust amount + date with a
  STATED amortization assumption for the remaining balance, and estimated equity = value -
  estimated encumbrances. Flag 'no mortgage data found' where relevant. Every figure is
  labeled 'estimated'; true AVM / current payoff is stated as a limitation, never
  fabricated. Roll up per portfolio.

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] Each figure (assessed value, last sale, mortgage, remaining balance, equity) is explicitly labeled 'estimated' — pass: labeling test (REQUIRED; an unlabeled figure = REJECT)"
  - "[ ] Estimated equity = value - estimated encumbrances, using the stated amortization assumption — pass: equity-math test (hand-recomputed)"
  - "[ ] A parcel with no mortgage data carries a 'no mortgage data found' flag (no fabricated debt) — pass: no-data flag test (REQUIRED)"
  - "[ ] True AVM / current payoff is stated as a limitation, never produced — pass: no-AVM test"
  - "[ ] Portfolio rollup sums per-parcel estimates with the same labeling — pass: portfolio test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

