# Slice overview
title: "Thin end-to-end verified-answer path (Demo 1)"
objective: |
  Wire the thin deterministic-tier path end to end against fixtures, with zero live
  API: NL question -> tier router -> stubbed/fixture adapter -> Tier-1 cache ->
  provenance-bound value -> deterministic gates -> answer envelope with provenance +
  confidence + freshness + tier. Also prove the no-live-data degradation path. This
  is Demo 1. In scope: the orchestration glue in SKILL.md for the trivial-lookup
  tier only; the answer envelope renderer (value + provenance + confidence +
  freshness + tier); the NO_LIVE_DATA envelope; the REFUSED envelope (no binding /
  gate fail); a demo script/walkthrough using a single-value fixture (UC1). Out of
  scope: consensus (slice-06), report/aggregation orchestration (slice-08), feed
  formats (slice-09).

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] A single-value question (UC1) flows end-to-end on fixtures and returns an answer envelope containing value + >=1 resolvable provenance citation + confidence + freshness stamp + tier — pass-condition: Demo 1 walkthrough reproducible; envelope schema-complete"
  - "[ ] With the adapter not live, the same question returns the explicit 'no live data — Hypercore access not yet provisioned' envelope and NEVER a fabricated number — pass-condition: no-live-data test (REQUIRED; fail = REJECT)"
  - "[ ] A value that fails a gate or has no binding returns a REFUSED envelope with reason, not a guess — pass-condition: refusal test"
  - "[ ] The path is non-bypassable: delivery cannot occur without passing binder + gates — pass-condition: bypass-attempt test fails to deliver"
  - "[ ] No live API call anywhere in the path — pass-condition: QA confirms no network call"
  - "[ ] Dev Learnings and QA Learnings sections updated"

# Dependencies (taken from depends_on in stories.json)
dependencies:
  slices:
