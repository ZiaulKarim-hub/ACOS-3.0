# Slice overview
title: "Security / PII / GDPR + secret handling + read-only enforcement hardening"
objective: |
  Harden the safety posture so the skill is safe to point at live data once
  provisioned: PII-scrubbed logs/evidence, credentials loaded ONLY from env/secret
  store, and a structural read-only guard that makes Hypercore mutation impossible.
  Honor TLS 1.2+, AES-256 at rest, RBAC, GDPR. In scope: a PII-scrubber applied to
  all logs + evidence-bundle writes; env/secret-store credential loader (no creds in
  repo); the read-only guard test elevated to a CI/quality-gate; AES-256-at-rest note
  + least-privilege on the Tier-1 cache; RBAC scope pass-through hook on the adapter
  (TBD specifics behind contract). Out of scope: live auth scheme (TBD until access);
  feed formats (slice-09); consensus.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] PII scrubber redacts borrower PII / financials in logs + evidence bundles to need-to-know — pass-condition: PII-scrub test on a sample containing planted PII (REQUIRED; nothing leaks; fail = REJECT)"
  - "[ ] Credentials read only from env/secret store; absence yields a clear error and the NO_LIVE_DATA path, never a crash that leaks or a fabricated answer — pass-condition: secrets-loader test; grep proves no credential string in repo (REQUIRED; fail = REJECT)"
  - "[ ] Read-only guard test elevated so adding any mutating verb to the adapter fails the gate — pass-condition: guard test fails on a planted mutating method"
  - "[ ] AES-256-at-rest + least-privilege documented for the Tier-1 cache; RBAC scope pass-through hook present (TBD behind contract) — artifact: security notes + hook"
  - "[ ] Subscription-only re-confirmed: no ANTHROPIC_API_KEY anywhere — pass-condition: repo grep gate"
  - "[ ] hca-secrets.py never logs the secret; no mutating adapter method added"
  - "[ ] Dev Learnings and QA Learnings sections updated"

