# Technical requirements
technical_requirements:
  - "Python 3 stdlib only"
  - "hca-pii.py redacts known PII fields (legal_name, contact, financial detail) before any log/evidence write; default-deny unknown fields flagged sensitive"
  - "hca-secrets.py reads HYPERCORE_API_* from env/secret store; never prints; clear error on absence -> NO_LIVE_DATA"
  - "Reinforce the slice-02 read-only guard into a standing gate; add RBAC pass-through hook (minimal, no contract change, no mutating method)"
  - "Document AES-256-at-rest / least-privilege / TLS 1.2+ posture; no credential committed to repo"

# Testing requirements
