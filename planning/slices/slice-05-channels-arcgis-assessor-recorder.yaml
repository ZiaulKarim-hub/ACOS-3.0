# Slice overview
title: "Discovery channels 1-4 + recorder index (ArcGIS / assessor / recorder / mailing pivot)"
objective: |
  Implement the v1 discovery channels: arcgis_query.py (query county/state parcel layers
  by OWNER or MAIL_ADDR LIKE), the assessor owner-name search (free states FL/TX/AZ/NV +
  statewide MD/MA/MT), the recorder grantor-grantee index (highest-yield; the name-blocked
  workaround), and the owner-search-by-state routing matrix. Name-blocked states
  (CA 7928.205 / Cook / NJ Daniel's Law) route to the recorder index. All lookups go
  through the slice-02 cache and respect the slice-01 gate. Out of scope: swarm (slice-06),
  channels 5-9 (v2/v3).

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] ArcGIS REST query by OWNER and by MAIL_ADDR LIKE returns normalized parcel records (against a fixture layer) — pass: arcgis query test"
  - "[ ] The owner-search-by-state router picks statewide / friendly / name-blocked correctly — pass: routing test (CA/NJ/Cook -> recorder; MD/MA/MT -> statewide; FL/TX/AZ/NV -> friendly)"
  - "[ ] Name-blocked states use the recorder grantor-grantee index instead of owner-name search — pass: name-blocked-routing test (REQUIRED)"
  - "[ ] Every returned parcel carries provenance (source_url) + a freshness stamp from cache — pass: provenance test"
  - "[ ] Channels feed the graph (parcels + edges), not a flat list — pass: graph-integration test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

