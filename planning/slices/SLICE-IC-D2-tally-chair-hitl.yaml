# Slice overview
title: "Deterministic tally + Gap-Hunter selection + chair menu + ESC interject + one-to-one"
objective: |
  Add the deterministic tally (mechanical-only, plain Python, NEVER an LLM), Gap-Hunter (#10,
  procedural/no-vote) per-round speaker selection, the Deal Advocate's (#9) participation as
  deliberation defense (mitigant turns against scrutiny objections, same falsification gate, no
  vote), the round-boundary chair pause+menu (chair addresses seats BY NUMBER, incl.
  exclude/include only active-roster commands), an ESC mid-turn interject path, and a
  one-to-one sidebar toggle -- with the chair's authority procedural, never evidentiary, in
  both team deliberation and 1:1.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] scripts/tally.py is pure Python and answers ONLY mechanical questions (responded? majority/veto? stagnation -- 2 rounds with no new claim?)"
  - "[ ] tally.py NEVER declares a verdict and NEVER terminates a round/session on \"all agree\" or on stagnation"
  - "[ ] tally.py hides numeric confidence between agents"
  - "[ ] every Turn conforms to the stance schema {round, seat, stance in SUPPORT|REBUT|ABSTAIN|CONDITIONAL|FLAG_RISK, argument, addresses_prior_turn_ids, would_change_mind_if}"
  - "[ ] reversals render a visible UPDATED marker"
  - "[ ] Gap-Hunter (#10, procedural, no vote) selects each round which seat(s) have something material to add; unselected seats stay silent; Gap-Hunter never selects a seat excluded from the session's active roster"
  - "[ ] the Deal Advocate (#9) may respond to a scrutiny objection when Gap-Hunter (#10) calls on it, submitting a mitigant claim that passes the SAME falsification gate as an objection (survives -> downgrades that objection's severity; refuted -> discarded); the Advocate hunts no holes, casts no scrutiny vote, and never appears in the tally"
  - "[ ] the loop pauses after EVERY round and shows the chair menu: Continue / call <n> / challenge <n> <claim> / ask <n[,n]> <q> / vote / premortem / one to one #n / exclude #n[, #n ...] / include only #n[, ...] / end, plus a plain-English fallback"
  - "[ ] the chair can address seats BY NUMBER against the stable 1-14 roster"
  - "[ ] `exclude #n[, #n ...]` / `include only #n[, ...]` set the session's ACTIVE roster (manifest.yaml active_seats) at session start OR mid-session; excluded seats are skipped by Gap-Hunter selection and never open; on exclusion, Gap-Hunter (#10) logs what coverage is left unowned that session"
  - "[ ] ESC interjects at any time mid-turn: the in-flight turn is aborted and discarded (not saved); the tagged seat (or else the last seat that spoke) resumes, marks an UPDATED <- CHAIR marker, folds in the new fact, and re-comments"
  - "[ ] after an ESC interject, Gap-Hunter re-selects any other seat the new fact now affects; already-spoken seats are re-called only if Gap-Hunter deems the fact material"
  - "[ ] an ESC interject during the parallel Round 1 opening re-issues the openers, then proceeds to Round 2"
  - "[ ] \"one to one #n\" sets manifest.mode to one_to_one:n, pauses all other seats, and saves the exchange to sidebars/chair-with-<n>.md"
  - "[ ] \"team deliberation\" resumes normal mode and injects a sidebar summary (new facts + seat #n's position changes) into transcript.md as a first-class entry visible to all seats; the raw 1:1 chat stays only in the sidebar file"
  - "[ ] chair authority is procedural, NEVER evidentiary, in team deliberation AND in 1:1 -- a chair statement like \"I like this deal\" does NOT raise any claim's grade in either mode"
  - "[ ] the loop never terminates on consensus; dissent is preserved through to the memo"
  - "[ ] evidence bundle includes a tally transcript + a Gap-Hunter selection example + a Deal Advocate mitigant example + an exclude/include roster example + an ESC-interject UPDATED <- CHAIR example + a one-to-one sidebar round-trip example"

