# Notes
notes: |
  Verification method (from QA section): reject on consensus-termination,
  stance-schema violation, capitulation-to-chair, a lost/duplicated ESC turn, or sidebar-privacy
  leakage; the mechanical-only property of the tally must be proven by hand-recomputing a
  fixture, not by trusting the code's self-description. Excluded-seat selection, a missing
  Gap-Hunter uncovered-risk log line on exclusion, and an Advocate mitigant bypassing the
  falsification gate (or appearing in a vote count) are added reject conditions this pass.
  Stance enum: this slice's Turn stance schema (SUPPORT|REBUT|ABSTAIN|CONDITIONAL|FLAG_RISK) is
  now matched by SLICE-D1's per-turn schema (previously narrower; aligned this pass) -- no
  remaining cross-slice stance-enum inconsistency.
  Scope growth note: Gap-Hunter selection, the round-boundary chair menu redesign, ESC
  mid-turn interject, and the one-to-one sidebar toggle were added to this slice's canonical
  design after the original M effort estimate was set; architect should confirm sizing.
  Scope growth note (cont'd): the Deal Advocate's (#9) deliberation-defense participation and
  the exclude/include active-roster chair commands were added to this slice's canonical design
  in the same pass that renumbered Gap-Hunter to #10 -- further scope growth on top of the
  already-flagged growth above; architect should confirm M sizing still holds.
