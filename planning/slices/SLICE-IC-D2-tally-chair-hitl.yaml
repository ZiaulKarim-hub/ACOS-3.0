# Technical requirements
technical_requirements:
  - "tally.py must be reusable in the consensus_check.py style but purpose-built for mechanical-only questions, including stagnation detection (2 rounds, no new claim)"
  - "the chair menu vocabulary is canonical: Continue / call <n> / challenge <n> <claim> / ask <n[,n]> <q> / vote / premortem / one to one #n / exclude #n[, #n ...] / include only #n[, ...] / end (plus plain-English fallback) -- seats addressed by number"
  - "ESC interject must be a hard abort of the in-flight turn (discarded, never persisted) followed by a deterministic resume target (tagged seat, else last speaker)"
  - "one-to-one sidebar files (sidebars/chair-with-<n>.md) hold the raw 1:1 chat; only a summary crosses back into transcript.md"
  - "active_seats in manifest.yaml is the single source of truth for the session's roster; exclude/include commands are the only way to mutate it; Gap-Hunter's per-round selection must filter against it before choosing speakers"
  - "the Deal Advocate's mitigant turns are persisted via the identical Turn schema as any seat (round, seat=9, stance, argument, addresses_prior_turn_ids, would_change_mind_if); the falsification-gate grading of a mitigant reuses the same mechanism as an objection's (owned by axiom-synthesis / the fact-builder, not re-implemented here) -- this slice wires the Advocate's turn into the round loop and excludes it from tally.py's vote count"

# Testing requirements
testing_requirements:
  - "QA greps tally.py to confirm it NEVER outputs a verdict and NEVER short-circuits on unanimity or stagnation (recomputes the tally by hand on a fixture)"
  - "QA confirms every turn matches the stance schema and reversals show the UPDATED marker"
  - "QA confirms Gap-Hunter silences seats with nothing material and re-selects correctly after an ESC interject"
  - "QA triggers an ESC interject mid-turn and confirms the in-flight turn is discarded, the correct seat resumes with UPDATED <- CHAIR, and a Round-1 ESC re-issues openers before Round 2"
  - "QA confirms the round-boundary menu matches the canonical vocabulary and seats are addressable by number"
  - "QA toggles one-to-one and confirms other seats pause, raw chat lands only in the sidebar file, and a sidebar summary (not raw chat) is injected into transcript.md on return"
  - "QA confirms a chair \"I like this deal\" comment (team OR 1:1) does not raise any claim's grade"
  - "QA confirms exclude/include correctly set manifest.yaml active_seats at session start and mid-session, that Gap-Hunter never selects or opens an excluded seat, and that Gap-Hunter logs what coverage is left unowned on exclusion"
  - "QA confirms the Deal Advocate's mitigant turns clear the same falsification gate as objections (survive -> downgrade severity, refuted -> discarded), that the Advocate casts no scrutiny vote, and that the Advocate never appears in tally.py's counts"

