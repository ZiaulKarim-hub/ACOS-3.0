# Context for the developer
context:
  - "Bridged from planning/preeng/001-hypercore-ask/tasks/slice-05-gates.md"
  - "These six deterministic gates catch the dominant non-text failure modes (aggregation/units/currency/truncation) that H1 names; they run on consensus-agreed values."
  - "Gotcha (hard gates): pagination gate must FAIL the deliberately-truncated fixture (no silent truncation) and freshness gate must FAIL the stale fixture; both REQUIRED. Freshness window must come from config, not a hardcoded value."
  - "Gotcha: implement each gate as a pure function returning (ok, detail); compose into run_gates(...) -> VerificationGateResult with outcome=refuse if any hard gate fails. Reuse the truncated/stale/drifted fixtures from slice-02."

# Technical requirements
technical_requirements:
  - "Python 3 stdlib only; each gate a pure function returning (ok: bool, detail: str)"
  - "Compose into run_gates(value, source, schema, config) -> VerificationGateResult; outcome = refuse if any hard gate fails"
  - "Unit/currency normalization (canonical currency + scale) reused from hca-normalize.py, applied before any comparison/aggregation"
  - "ConfidenceRecord with single-source cap from config (single_source_cap: 0.7)"
  - "Pagination gate cannot pass when fetched_count < reported_total; freshness uses per-entity-class window from config"

# Testing requirements
testing_requirements:
  - "For each of the six gates, run the failing fixture and confirm the gate fails and outcome == refuse; QA re-authors the truncated and stale fixtures independently"
  - "QA adversarially crafts a near-miss to confirm pagination gate cannot pass when fetched_count < reported_total"
  - "QA confirms freshness gate uses the per-entity-class window from config, not a hardcoded value"
  - "QA confirms a single-source value's confidence is never > 0.7 regardless of agent self-confidence"
  - "QA confirms reconciliation catches a planted arithmetic inconsistency"

