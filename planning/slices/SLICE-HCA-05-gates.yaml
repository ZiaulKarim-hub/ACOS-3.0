# Slice overview
title: "Deterministic gate suite"
objective: |
  Implement the six deterministic gates that sit underneath consensus and run on
  the consensus-agreed value(s) before binding/delivery. Any hard failure => REFUSE.
  Gates: (1) schema validation, (2) pagination-completeness, (3) freshness window,
  (4) cross-field reconciliation, (5) unit/currency normalization, (6) single-source
  confidence cap <= 0.7. In scope: hca-gates.py producing a VerificationGateResult
  (schema_ok, pagination_complete, freshness_ok, reconciliation_ok,
  normalization_applied, confidence_capped, outcome, failures[]) + a ConfidenceRecord;
  uses the expected schemas (slice-02) and config.yaml freshness windows +
  single_source_cap. Out of scope: consensus dispatch (slice-06); schema-drift
  detection hardening (slice-11; basic schema validation here); delivery rendering.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Schema gate validates the source record against the expected entity schema; invalid => fail — pass-condition: positive + failing-fixture tests"
  - "[ ] Pagination-completeness gate reconciles fetched count / cursor exhaustion against reported_total; mismatch => fail — pass-condition: passes on complete fixture, FAILS on the deliberately-truncated fixture (REQUIRED; no silent truncation)"
  - "[ ] Freshness gate checks Tier-1 timestamp within the configured per-entity-class window; stale => fail/flag-refresh — pass-condition: passes fresh fixture, FAILS the stale fixture (REQUIRED); window comes from config not a hardcoded value"
  - "[ ] Reconciliation gate checks related fields agree (e.g. drawdowns - repayments vs outstanding; sum-of-parts vs reported total) — pass-condition: passes consistent fixture, fails a planted inconsistency"
  - "[ ] Unit/currency normalization applied before any comparison/aggregation; mixed units normalized — pass-condition: normalization test"
  - "[ ] Single-source confidence cap forces confidence <= 0.7 and flags single-source values regardless of agent self-confidence — pass-condition: cap test"
  - "[ ] VerificationGateResult.outcome == refuse whenever any hard gate fails; failures[] names the gate(s) — pass-condition: aggregate refusal test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

