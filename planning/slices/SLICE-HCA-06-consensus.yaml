# Slice overview
title: "Adversarial multi-model consensus orchestrator (Demo 2)"
objective: |
  Implement the blind adversarial-consensus engine: dispatch N blind general-purpose
  agents via Task() (subscription-only — never ANTHROPIC_API_KEY), each given only
  its scoped Tier-1 slice + the question, no shared context, no sight of each other's
  output. Deliver only on substance consensus (agreement on the normalized
  number/name/date) at the configured quorum; disagreement => bounded blind
  re-dispatch => still no quorum => ESCALATE. Never a silent pick. This is Demo 2.
  In scope: hca-consensus.py (dispatch envelope spec + result aggregation producing
  a ConsensusResult); substance-equality after normalization; quorum evaluation
  (default 2-of-3 asymmetric from config); bounded re-dispatch (default 1 retry);
  ESCALATE state; single-source cap interplay with the gate suite. hca-consensus.py
  does NOT itself call any model API — the orchestrating skill spawns the blind
  agents via Task(). Out of scope: the gate suite itself (slice-05), full report
  orchestration (slice-08), delivery rendering beyond the escalate envelope.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] N blind agents each receive ONLY their scoped Tier-1 slice + the question; no shared context (prompt + dispatch envelope enforce this) — pass-condition: prompt review + envelope test; any cross-leak = REJECT"
  - "[ ] Substance consensus computed on normalized values (not prose); quorum from config (default 2-of-3) — pass-condition: consensus reached when >=quorum agree on substance (different prose, same number)"
  - "[ ] Disagreement triggers bounded blind re-dispatch (fresh agents, default 1 retry); still no quorum => agreement_status == escalated — pass-condition: re-dispatch + escalate test (REQUIRED)"
  - "[ ] No silent pick ever: on disagreement the engine NEVER returns an agreed_value without quorum (escalate with agreed_value == null) — pass-condition: no-silent-pick test (REQUIRED; fail = REJECT)"
  - "[ ] Single-source / single-response values flagged and confidence-capped <= 0.7 (interplay with slice-05) — pass-condition: cap test"
  - "[ ] Subscription-only: scripts contain no ANTHROPIC_API_KEY / direct model API call — pass-condition: grep gate (fail = REJECT)"
  - "[ ] Dev Learnings and QA Learnings sections updated"

