  - "QA feeds exactly quorum agreement on substance (different prose, same number); confirm consensus"
  - "QA greps all scripts for ANTHROPIC_API_KEY and direct HTTP-to-model calls — must find none (subscription-only)"
  - "QA confirms single-source path caps confidence <= 0.7"

