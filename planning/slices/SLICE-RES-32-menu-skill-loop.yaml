# Slice overview
title: "acos-resurrect/SKILL.md menu + finish verb + loop mechanics"
objective: |
  Author the acos-resurrect/SKILL.md menu (terminal-first per DP1) as a router
  over resurrect-view.py + launch-project.sh; implement the finish verb
  (status: completed — hidden in ARCHIVED, never deleted) and the loop
  mechanics: resume flips parked->active and last_verified_at refreshes on
  render contact. /acos-complete is left untouched.
description: |
  Demo 3 (the loop) — the loop with inverted economics: resume flips
  parked->active; finish sets completed; /acos-complete untouched.
  In scope: the terminal-first menu over the two scripts, the finish verb ->
  status: completed (hidden in ARCHIVED, never deleted), and the loop status
  transitions (via registry_lib). Out of scope: any nagger/notifier, deleting
  a finished row, auto-close at a token threshold.

