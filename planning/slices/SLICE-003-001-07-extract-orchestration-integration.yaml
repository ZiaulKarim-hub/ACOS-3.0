# Context for the developer
context:
  - "FINAL slice in STORY-003-001. After this, the parser module is shipped — STORY-003-002 (canvas) will consume extract() as a black-box."
  - "Real Brad fixtures: ask the user to provide 2–3 actual recently-produced Brad documents to copy into tests/fixtures/. If none are available, generate plausible-looking Brad-style HTML by hand (use acos-document-design-brad as a template) — flag this to the user as a known-limitation in the slice review."
  - "Perf budget is a HARD gate. If it fails on real fixtures, do NOT cheat by reducing fixture size — profile and fix. Common culprit: synchronous getComputedStyle calls inside the walker (each one is a layout flush). Cache once per element."
  - "XSS sandbox: DOMParser('text/html') already disables scripts. The test PROVES this contract. window.alert mock is the canary."
  - "Public API enforcement: tsc --noUnusedLocals catches dead exports. The reviewer should also do a visual check of index.ts re-export list."
  - "Generic-HTML fixture: a real news article (e.g., a saved BBC or NYT page) tests robustness against malformed markup, unfamiliar classes, and unexpected element trees. If the parser crashes, fail-soft (skip the bad element, log warning) — do not throw all the way up."

