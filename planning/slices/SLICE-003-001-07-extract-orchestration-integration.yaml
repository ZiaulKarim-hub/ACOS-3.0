# Plan addenda — added 2026-05-26 after SLICE-003-001-01 completion review
# Source: SLICE-003-001-01 integration-reviewer finding F2
plan_addenda:
  - finding_id: "BG1"
    severity: LOW
    source: "SLICE-003-001-05 perf-reviewer + integration-reviewer (forward-look)"
    description: |
      Background image load on 5s timeout doesn't cancel the underlying
      Image bitmap decode (img.src = '' idiom not used). Wastes bandwidth +
      CPU until GC. Worst case ~5MB wasted decode for 10 backgrounds on
      slow CDN.
    action: |
      In slice 07, when running real-fixture integration tests, add a
      one-line fix to background.ts loadNaturalDimensions: in the timeout
      branch, set img.src = '' before settle(null). No-op in happy-dom;
      cancels real-browser decode.
    additional_acceptance_criterion: |
      "[ ] Image load timeout cancels the underlying decode (img.src=''
       idiom in background.ts loadNaturalDimensions timeout branch)"

  - finding_id: "BG2"
    severity: LOW
    source: "SLICE-003-001-05 perf-reviewer (forward-look)"
    description: |
      Background extractor doesn't deduplicate identical URLs within a
      single extract() call. Brad documents often reuse the same hero
      background across multiple sections — current code triggers
      independent loads + bitmap decodes for each reference.
    action: |
      Optional perf optimization for slice 07: memoize loadNaturalDimensions
      by URL within a single extract() call (Map<string, Promise<{w,h}|null>>).
      Defer if slice 07 perf benchmarks show no actual hot path.

  - finding_id: "BG3"
    severity: LOW
    source: "SLICE-003-001-05 integration-reviewer (forward-look)"
    description: |
      MVP background extractor takes only the FIRST comma-separated url()
      layer. Multi-layer backgrounds (texture-over-photo) are silently
      dropped. Brad fixtures so far appear single-layer but unverified
      against real reference documents.
    action: |
      Slice 07: audit the 2-3 real Brad reference documents for multi-layer
      background-image rules. If present, either (a) emit one record per
      layer with id suffix `bg-<hash>-l0`, `bg-<hash>-l1`, OR (b) extend
      BackgroundContent with `layers: string[]`. (b) is a TYPE CONTRACT
      CHANGE — must happen here in slice 07 before STORY-003-002 starts.

  - finding_id: "BG4"
    severity: LOW
    source: "SLICE-003-001-05 qa-reviewer + integration-reviewer (forward-look)"
    description: |
      The new Image() general path is NEVER exercised under happy-dom
      (Image is inert there). All slice 05 tests run through the data:
      URI header sniffer. The real-browser image-load path will execute
      for the first time during slice 07 integration tests if any
      fixture uses http(s) URLs, AND during STORY-003-002 runtime.
    action: |
      Slice 07: add a real-browser integration test (Playwright or jsdom
      with a tiny local fixture server) that exercises the new Image()
      path against a known image. Verify load success + handler null-out
      + timer clear. Without this, the production path is untested.
    additional_acceptance_criterion: |
      "[ ] New Image() general path in background.ts is exercised by at
       least one integration test that uses an http(s) or local-server
       URL (not data:)"

  - finding_id: "BG5"
    severity: LOW
    source: "SLICE-003-001-05 qa-reviewer (forward-look)"
    description: |
      Malformed-URI no-throw test in background.test.ts uses Promise.race
      against a 200ms fallback, so the 5s timeout branch is never actually
      exercised end-to-end. Code-review confirmed it settles to null, but
      runtime coverage is zero.
    action: |
      Slice 07: add a vi.useFakeTimers() test that advances 5001ms and
      asserts the timeout path resolves to null (not throws or hangs).
      Small but meaningful coverage addition.

  - finding_id: "BG6"
    severity: LOW
    source: "SLICE-003-001-04 perf-reviewer (deferred from slice 04)"
    description: |
      dom-walker.ts comment at lines 19-20 claims "O(N) regardless of
      depth or same-tag sibling fanout" but the per-emit pathSegments.join
      + parents.slice() remain O(d). Total is O(N*d), effectively O(N)
      for bounded depth but the comment overstates the guarantee.
    action: |
      Slice 07: soften comment to "O(N) for Brad-shaped documents
      (shallow depth). Per-emit join/slice remain O(d); total work is
      O(N*d), effectively O(N) when d is bounded."

  - finding_id: F2
    source: "SLICE-003-001-01 integration-reviewer (PASS, minor finding)"
    description: |
      ContainerRecord uses two parallel `kind` discriminators — one on
      ContainerRecord itself, one on each ContainerContent variant.
      TypeScript cannot enforce structural agreement between them, so
      a buggy parser slice (02–05) could emit a record with mismatched
      kinds (e.g., record.kind='text' paired with record.content.kind='image').
      The smoke test in slice 01 documented this limitation but cannot
      catch runtime drift.
    action: |
      Add a runtime invariant check to this slice's integration tests:

        for (const record of result) {
          expect(record.kind).toBe(record.content.kind);
        }

      Apply this assertion in EVERY integration test that runs extract()
      against a real fixture (brad-full-10pg, brad-credit-memo,
      generic-news-article). Catches any future parser-slice bug where
      the two discriminators desync.

      Alternative (preferred long-term): factor a helper
        function assertKindCoherent(r: ContainerRecord): void
      into a new src/parser/invariants.ts module and call it inside
      extract() itself before returning. This makes the invariant a
      runtime guarantee, not just a test assertion. Out of scope for
      this slice if it pushes complexity — add to acceptance criteria
      as optional.
    additional_acceptance_criterion: |
      "[ ] Every record returned by extract() satisfies record.kind ===
       record.content.kind, asserted in every integration test (verified
       by adding the assertion to the test loop or via a parser-internal
       invariant helper)"
