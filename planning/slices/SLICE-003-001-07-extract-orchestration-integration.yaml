# Slice overview
title: "extract() orchestration + integration tests + sandbox + perf budget"
objective: |
  Finalize the top-level extract(html: string, opts?: { bradEnrichment?:
  boolean }): Promise<ContainerRecord[]> function. Wire walker (02),
  text/image extractors (02), SVG (03), table (04), background (05),
  and the Brad-enrichment pass (06) into a single pipeline. Add
  integration tests against 2–3 real OKOA Brad reference documents.
  Verify performance budget (<3s on a 30 KB document). Verify XSS
  sandbox (no script execution from ingested HTML). Lock the public
  API surface — only extract() and ContainerRecord (+ NodeKind) are
  exported from the parser module.

# Acceptance criteria
acceptance_criteria:
  - "[ ] apps/visual-composer/src/parser/index.ts exports ONLY extract() and re-exports ContainerRecord, NodeKind from types.ts. Internal walker, individual extractors, and enrichment are NOT exported."
  - "[ ] extract() accepts an optional opts argument: { bradEnrichment?: boolean }; default bradEnrichment = true. opts is optional for ergonomic happy-path; opts.bradEnrichment === false triggers generic-HTML fallback mode."
  - "[ ] Pipeline order is documented and enforced: parse → walk → extract per element kind → await background loads → enrich → return"
  - "[ ] Integration test: tests/integration/brad-full-10pg.test.ts parses tests/fixtures/brad-full-10pg.html (a real OKOA Brad reference document, ~30 KB) in <3 seconds; record count > 50; assert at least 1 of each NodeKind is produced"
  - "[ ] Integration test: tests/integration/brad-credit-memo.test.ts parses tests/fixtures/brad-credit-memo.html (different doc type) and produces a valid, non-empty result"
  - "[ ] Integration test: tests/integration/generic-news-article.test.ts parses tests/fixtures/generic-news-article.html (a generic web page, NOT Brad) with opts.bradEnrichment = false; result is non-empty; no bradClass values present"
  - "[ ] Sandbox test: tests/integration/xss-sandbox.test.ts parses tests/fixtures/xss-sandbox.html (contains <script>alert(1)</script>, onload handlers, inline event listeners); window.alert is mocked and never called; no extracted record contains executable script source"
  - "[ ] Performance test: extract() on brad-full-10pg.html completes in <3000ms (3-run average; flake tolerance: 2 of 3 runs must pass)"
  - "[ ] Parser module has NO unused exports — verified by running tsc with --noUnusedLocals and the export-tree match against the public API list"
  - "[ ] tests/fixtures/brad-full-10pg.html, tests/fixtures/brad-credit-memo.html, tests/fixtures/generic-news-article.html, tests/fixtures/xss-sandbox.html all exist"
  - "[ ] All previously-written unit tests still pass; total test suite green"
  - "[ ] Story-level acceptance criterion 'a 10-page Brad document parses in <3 seconds' is officially verified by the perf test in this slice"

