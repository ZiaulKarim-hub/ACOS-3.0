# Slice overview
title: "Diagnostics + decision lock (problem-before-solution)"
objective: |
  Lock the problem before any build. Confirm symptoms/hypotheses/unknowns from spec.md
  Diagnostics; validate H1 (widest net = union of channels/pivots, not one search),
  H2 (blind isolation makes "Verified = 2+ sources" non-circular), H3 (no hub-guard
  => N^2 blow-up); and record PLAN.md decisions D1-D8 plus the free-only / stdlib-only /
  blocking-compliance / hedged-language ground rules in an acos-decide ADR. No solution code.

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] H1/H2/H3 explicitly confirmed (or refined) against PLAN.md, each with a written verdict"
  - "[ ] An acos-decide ADR records D1-D8 with chosen defaults + at least one alternative each"
  - "[ ] Free-only / stdlib-only / blocking-compliance / hedged-language ground rules recorded"
  - "[ ] Open unknowns (portal availability, false-positive rate at the 75/50 cutoffs) routed to slice-11"
  - "[ ] No scripts / SKILL.md / reference files produced and no network call made (scope respect)"
  - "[ ] Dev Learnings and QA Learnings sections updated"

