# Context for the developer
context:
  - "Port 8820 is FIXED — on EADDRINUSE reuse the existing singleton via GET /api/whoami; NEVER port-hop"
  - "Skill-started only, never launchd; NO idle reaper — leave a comment in code saying so"
  - "POST /api/launch takes an opaque ID only — a path must be rejected with 400"
  - "Validate Origin+Host+Content-Type on requests; never emit ACAO:*"
  - "Render with textContent, never innerHTML — hostile project names must be inert"
  - "Open the dashboard with: open -a 'Google Chrome'"
  - "Client polling: 5s, visible-only (pause when tab hidden)"

# Technical requirements
technical_requirements:
  - "Python stdlib ThreadingHTTPServer bound to 127.0.0.1:8820 (fixed)"
  - "GET /api/whoami singleton handshake on EADDRINUSE"
  - "POST /api/launch — opaque-ID-only contract, path input -> 400"
  - "Origin + Host + Content-Type validation; no ACAO:* header"
  - "textContent-only DOM rendering; 5s visible-only polling; open -a 'Google Chrome'"

# Testing requirements
testing_requirements:
  - "Run the security tests: cross-origin POST rejection, path-not-ID 400 at /api/launch, hostile-name inert render"

# Verification method (QA — zero-trust; skill-mandated extension of the template)
verification_method: |
  Assume the Dev did not do the work correctly. Verify scope respect and
  evidence authenticity (no fabricated logs — spot-check and recompute), then:
  - Singleton reuse shown (EADDRINUSE -> /api/whoami, no port-hop)
  - Hostile-name render inspected and confirmed inert (textContent)
  - Cross-origin POST rejection + path-not-ID 400 rejections archived
  - Confirm no idle reaper and no launchd hosting anywhere in the code
  - Confirm no ACAO:* and no innerHTML anywhere
  - Confirm /api/launch rejects a path and only accepts an opaque ID
  QA may REJECT and require rework until all gates pass (a reject blocks the
  slice like an INCONCLUSIVE reviewer).

