# Slice overview
title: "(DP1-conditional) resurrection-server.py: the 8820 browser window"
objective: |
  Build resurrection-server.py — an always-glanceable browser dashboard on a
  stdlib ThreadingHTTPServer at 127.0.0.1:8820 (FIXED port) that does not
  occupy a Claude session. Skill-started, never launchd-hosted, with NO idle
  reaper (documented by comment in code). DP1-conditional: adopted only if
  the DP1 menu decision selects it.
description: |
  In scope:
  - stdlib ThreadingHTTPServer at 127.0.0.1:8820 FIXED; skill-started, never
    launchd; NO idle reaper (comment in code)
  - Singleton via GET /api/whoami on EADDRINUSE, never port-hop;
    POST /api/launch accepts an opaque ID only
  - Validate Origin+Host+Content-Type; no ACAO:*; textContent never
    innerHTML; open -a 'Google Chrome'; 5s visible-only polling
  Out of scope (guardrails):
  - launchd hosting
  - idle reaper / port-hopping
  - ACAO:* / innerHTML
  - Accepting a path (not an ID) at /api/launch

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] EADDRINUSE singleton reuse works via GET /api/whoami — server never port-hops; singleton-reuse demonstration archived in .acos/evidence/[DATE]/SLICE-50-browser/"
  - "[ ] A hostile project name renders inert (textContent, never innerHTML); hostile-name render inspection archived in .acos/evidence/[DATE]/SLICE-50-browser/"
  - "[ ] Cross-origin POST is rejected AND /api/launch given a path instead of an opaque ID returns 400; both rejection transcripts archived in .acos/evidence/[DATE]/SLICE-50-browser/"
  - "[ ] Evidence bundle at .acos/evidence/[DATE]/SLICE-50-browser/ populated with the 7-part Dev bundle (implementation summary, requirements traceability to FR-*/TR-*, structural quality, functional checks, security/compliance notes, operational notes, self-assessment)"
  - "[ ] Dev Learnings and QA Learnings sections updated in the source task file (slice is not Done until both are — preeng §0.7)"
  # TODO: confirm — DP1 has actually selected the browser-window option (slice is DP1-conditional; do not execute otherwise)
  # TODO: confirm — pass-condition for the '5s visible-only polling' requirement (in scope but no acceptance test defined in the task file)

