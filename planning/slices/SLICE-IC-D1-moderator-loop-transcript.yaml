# Slice overview
title: "Mode B moderator loop + append-only transcript"
objective: |
  Implement the Mode B moderated-relay loop in the top-level SKILL.md (main conversation) --
  the main conversation IS the moderator; subagents cannot pause or call AskUserQuestion, so no
  dispatched seat may own the loop -- blind openings (Round 1), then bounded Gap-Hunter-directed
  (#10) serial rebuttal rounds (cap 5-6, Rounds 2+), including the Deal Advocate's (#9) defense
  turns when called, with every turn persisted to an append-only transcript on disk IMMEDIATELY
  (survives /clear + resume) BEFORE the next dispatch.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] the SKILL.md Mode B branch dispatches implicated seats per round via Task() -- for Rounds 2+, \"implicated\" means the seats Gap-Hunter (#10) selects that round (selection logic owned by SLICE-D2; this slice dispatches/persists against it)"
  - "[ ] the moderator loop lives ONLY in the main conversation -- no spawned agent owns/calls the round loop, and no subagent invokes AskUserQuestion"
  - "[ ] Round 1 is the blind parallel two-line opener pass per seat (line 1: number of gaps found + why the chair should care; line 2: overall recommendation), rendered one-line-per-seat in transcript.md"
  - "[ ] Rounds 2+ are serial rebuttal turns among the Gap-Hunter-selected (#10) seats, including the Deal Advocate (#9) when called to defend against a just-raised objection; each returned Turn is recorded to rounds/round-NN/*.json (one file per seat turn) and conforms to {round, seat, stance: SUPPORT|REBUT|ABSTAIN|CONDITIONAL|FLAG_RISK, argument (<=250w), addresses_prior_turn_ids, would_change_mind_if}"
  - "[ ] the Deal Advocate's (#9) turns persist and render via the IDENTICAL Turn schema/pipeline as any other seat's turn -- no bespoke advocate-only code path; the Advocate is never treated as an \"implicated\" scrutiny seat by the dispatch logic and casts no vote"
  - "[ ] each turn is appended to the human-readable transcript.md"
  - "[ ] the on-disk session layout under .acos/investment-committee/<session>/ includes manifest.yaml (mode: deliberation|one_to_one:<n>, status: open|paused|closed, current_round), transcript.md, rounds/, sidebars/, ledger/, evidence/"
  - "[ ] manifest.status / manifest.current_round is updated after each round"
  - "[ ] the round cap (5-6) is enforced and halts the loop"
  - "[ ] rolling-synthesis + last-K verbatim context window bounds per-call cost"
  - "[ ] every turn's JSON is on disk IMMEDIATELY, BEFORE the next dispatch (durability proof: interrupt mid-round, confirm the last turn survived and would survive /clear + resume)"
  - "[ ] the transcript.md render is faithful to (matches) the per-turn JSON records, including the Round 1 one-line-per-seat opener render"
  - "[ ] evidence bundle includes a multi-round fixture run transcript (incl. at least one Deal Advocate turn) + a durability proof"

# Dependencies
dependencies:
  slices:
    - slice_id: "SLICE-IC-B1-deal-intake"
      what_it_provides: "manifest.yaml / session scaffold the moderator loop dispatches and updates against"
      status: "complete"
    - slice_id: "SLICE-IC-A2-expert-agent-defs"
      what_it_provides: "seats/*.md templates used to dispatch implicated seats via Task()"
      status: "complete"
    - slice_id: "SLICE-IC-B2-blind-opening-pass"
      what_it_provides: "blind_openings.py / Round 1 two-line opener output that this slice's round loop persists and renders, then builds Rounds 2+ from"
      status: "complete"

# File permissions
files_allowed:
