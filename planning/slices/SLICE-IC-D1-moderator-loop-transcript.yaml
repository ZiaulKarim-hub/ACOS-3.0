# Notes
notes: |
  Verification method (from QA section): reject if the moderator is nested (any
  spawned agent owns the loop), if a subagent calls AskUserQuestion, or if a turn is lost on
  interrupt; durability and transcript-fidelity must be proven by an interrupt test, not a claim.
  Stance enum aligned: this slice's per-turn schema now uses the full set
  (SUPPORT|REBUT|ABSTAIN|CONDITIONAL|FLAG_RISK), matching SLICE-D2's Turn stance schema --
  resolves the prior narrower-enum flag.
  Renumbering delta (this pass): Gap-Hunter/Chair-agent is now seat #10 (was #9); seat #9 is now
  the Deal Advocate, which participates in deliberation via mitigant turns (subject to the same
  falsification gate as objections) but casts no scrutiny vote. This slice's round-flow language
  reflects the new numbering. SLICE-A1/A2/A3 and spec.md/tech_prd.md still show the pre-delta
  #9-Gap-Hunter numbering as of this writing and need their own reconciliation pass (out of
  scope here).
