  - ".claude/skills/acos-investment-committee/scripts/transcript_append.py"

files_prohibited:
  - "context note: the tally + chair vocabulary (SLICE-D2), resume (SLICE-D3), and the verdict (reuses SLICE-C3) are out of scope"

# Skills recommended
skills_recommended:
  - "backend-coding"
  - "testing"

# Flow to use
flow: "slice-execution-flow"

# Context for the developer
context:
  - "READ-ONLY inputs: manifest.yaml, seats/*.md, blind_openings.py, tech_prd section 1.7 + 2, domain-lattice proc-mode-b + pattern-main-convo-moderator + pattern-transcript-on-disk"
  - "ONLY the main conversation moderates (subagents can't pause or call AskUserQuestion); disk-first is load-bearing for resume (SLICE-D3); subscription-only; respect Oracle/check-scope hooks"
  - "seat numbering per architect delta (this pass): Deal Advocate is #9 (participates via mitigant turns, no vote); Gap-Hunter/Chair-agent is #10 (procedural per-round selection, no vote) -- supersedes the #9-Gap-Hunter numbering still on disk in SLICE-A1/A2/A3 and spec.md/tech_prd.md as of this writing; those files need their own reconciliation pass (out of scope here)"

# Technical requirements
technical_requirements:
  - "no nested moderator agent -- architecture must be verifiable via grep for a moderator Task() (must find none) and grep for any subagent AskUserQuestion call (must find none)"
  - "context window must use rolling synthesis + last-K verbatim to bound per-call cost"
  - "per-turn JSON path is rounds/round-NN/*.json -- one file per seat turn, not a shared per-round file"
  - "Rounds 2+ seat selection (Gap-Hunter #10) and the Deal Advocate's (#9) mitigant-turn triggering are owned by SLICE-D2; this slice's dispatch loop must accept an externally-selected seat list per round rather than hardcoding which seats speak"

# Testing requirements
testing_requirements:
  - "QA confirms the loop is in SKILL.md and NO spawned agent owns the round loop (grep-based architecture check)"
  - "QA interrupts mid-round and confirms the last turn's JSON survived on disk before the next dispatch"
  - "QA recomputes whether transcript.md render is faithful to the JSON records, including the Round 1 opener render"
  - "QA confirms the round cap halts the loop"
  - "QA confirms a Deal Advocate (#9) turn, when present, persists and renders through the identical Turn schema/pipeline as any scrutiny seat's turn (no bespoke advocate-only code path)"

# Review triggers (which reviewers will be assigned)
