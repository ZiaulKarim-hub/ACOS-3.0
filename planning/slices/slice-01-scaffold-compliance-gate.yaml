# Slice overview
title: "Skill scaffold + BLOCKING compliance gate"
objective: |
  Scaffold the project skill (SKILL.md, explicit-invocation-only:
  disable-model-invocation:true / user-invocable:true) and implement the BLOCKING
  compliance gate. Until a complete, valid ComplianceRecord is captured the run state is
  COMPLIANCE_BLOCKED and NO external lookup is permitted; GLBA anti-pretexting is a HARD
  block. The record maps permissible purpose to statute (DPPA 2721(b)(3)/(b)(4); FCRA
  1681b; dossier flagged "asset location — NOT for eligibility"), classifies debt
  (consumer/commercial -> FDCPA scope), captures the GLBA acknowledgment, and sets the
  scraping posture. In scope: SKILL.md skeleton, references/compliance.md, aps_compliance.py.

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] Skill frontmatter sets disable-model-invocation:true + user-invocable:true — pass: frontmatter assertion test"
  - "[ ] An incomplete/absent ComplianceRecord leaves state COMPLIANCE_BLOCKED and refuses all downstream work — pass: negative-case block test (REQUIRED; fail = REJECT)"
  - "[ ] A complete record transitions out of the blocked state — pass: positive-case test"
  - "[ ] A GLBA-pretexting request is refused outright — pass: GLBA hard-block negative test (REQUIRED; fail = REJECT)"
  - "[ ] references/compliance.md documents the statute mapping + per-run record schema"
  - "[ ] Dev Learnings and QA Learnings sections updated"

