# Context for the developer
context:
  - "ContainerRecord is FROZEN — defined in slice 01 and referenced verbatim in STORY-003-001 technical_notes. Do not change its shape."
  - "Use native browser DOMParser; do NOT introduce JSDOM, Cheerio, or any other parsing library — parser must run in-browser without a Node sidecar."
  - "DOMParser('text/html') already disables script execution by default — verify this assumption with the XSS sandbox fixture (will be added in slice 07)."
  - "Source-DOM path format: CSS-selector-like, derived by walking parent chain. Stable across re-ingest of the same HTML — must be deterministic, not random IDs."
  - "Hidden detection: use window.getComputedStyle(el) (or the equivalent against a detached document); inline style/class can lie. Aria-hidden='true' counts as hidden."
  - "Text-bearing detection: emit a 'text' record for an element only if it has non-empty trimmed direct text content (childNodes filtered to Node.TEXT_NODE). Skip text inside <table>/<svg> — those are handled by their own extractor slices."
  - "Image natural dimensions: <img>.naturalWidth/naturalHeight are 0 if the image hasn't loaded. For the unit test, use data: URIs or local-file fixtures so dimensions are available synchronously."

# Technical requirements
technical_requirements:
  - "All extractors are pure functions (no side effects, no mutation of input element)"
  - "Walker is a single-pass tree traversal (O(n) over visible nodes)"
  - "Hidden-element pruning happens at walker level — extractors never see hidden elements"
  - "computedStyle capture uses window.getComputedStyle once per element, not per-property"
  - "Source-DOM path is stable: re-running walker on the same input must produce identical path strings"

# Testing requirements
testing_requirements:
  - "Vitest unit tests for each extractor + walker"
  - "Fixture brad-minimal.html exercises: paragraphs, headings, images, hidden elements, script tags"
  - "Type-narrowing test: switch on record.kind, ensure 'text' branch can access TextContent payload, 'image' branch can access ImageContent payload"
  - "Edge case test: empty HTML string → walker returns empty array, no errors"
  - "Edge case test: HTML with only hidden elements → walker returns empty array"

