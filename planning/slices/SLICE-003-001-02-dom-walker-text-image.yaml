# Plan addenda — added 2026-05-26 after SLICE-003-001-01 completion review
# Source: SLICE-003-001-01 reviewer findings F1 + F3
plan_addenda:
  - finding_id: F1
    source: "SLICE-003-001-01 integration-reviewer (PASS, minor finding)"
    description: |
      vite.config.ts currently sets test.environment: 'node'. This slice
      introduces DOM-walking code that requires window/Document at test
      time. Pick one of these patterns:
        (a) Add happy-dom or jsdom as a devDep and set test.environment:
            'happy-dom' globally in vite.config.ts.
        (b) Use a per-file pragma: `// @vitest-environment jsdom` at the
            top of each walker test file, keeping the global env as 'node'
            for pure-type tests.
      Pattern (a) is simpler; pattern (b) keeps the type-only tests fast.
      Architect recommends (a) — happy-dom over jsdom (3x faster startup,
      sufficient API for DOMParser).
    action: |
      During slice 02 execution:
        1. pnpm add -D happy-dom
        2. Set test.environment: 'happy-dom' in vite.config.ts
        3. Verify existing slice-01 types.test.ts still passes under the
           new environment

