# Slice overview
title: "DOM walker + text + image extractors (core)"
objective: |
  Implement the foundation walker that traverses an HTML document
  parsed by sandboxed DOMParser and emits ContainerRecord values for
  text-bearing and image elements. This slice establishes the walker
  pattern that subsequent extractor slices (03, 04, 05) plug into.

  Text extraction covers <p>, <h1>–<h6>, and <div>/<span> with direct
  text content. Image extraction covers <img>. Hidden elements (display
  none, visibility hidden, aria-hidden=true) are skipped. <script> and
  <style> are skipped unconditionally.

# Acceptance criteria
acceptance_criteria:
  - "[ ] apps/visual-composer/src/parser/dom-walker.ts exports walkDom(doc: Document) that yields raw element + parent-chain references for downstream extractors"
  - "[ ] apps/visual-composer/src/parser/extractors/text.ts exports extractText(el: Element): ContainerRecord | null that returns a 'text'-kind record for <p>, <h1>–<h6>, and text-bearing leaf <div>/<span>, or null when the element should not become a text container"
  - "[ ] apps/visual-composer/src/parser/extractors/image.ts exports extractImage(el: HTMLImageElement): ContainerRecord that returns an 'image'-kind record with src, alt, intrinsic bounds (naturalWidth/Height), and computed styles"
  - "[ ] Walker skips <script>, <style>, <noscript>, <template>, and elements with display: none, visibility: hidden, opacity: 0, or aria-hidden='true'"
  - "[ ] Walker captures the source-DOM path as a CSS-selector-like path string (e.g., 'body > section:nth-of-type(2) > p:nth-of-type(3)') for each emitted record"
  - "[ ] Computed styles captured per record: font-family, font-size (px), color, background-color, line-height, text-align, font-weight"
  - "[ ] extract() in src/parser/index.ts now wires the walker + text + image extractors and returns a populated ContainerRecord[]"
  - "[ ] Unit tests in tests/parser/text.test.ts pass against tests/fixtures/brad-minimal.html (assertion: ≥1 'text'-kind record per <p>, every <img> appears as 'image'-kind, no hidden elements emitted)"
  - "[ ] Unit tests in tests/parser/image.test.ts pass against the same fixture"
  - "[ ] tests/fixtures/brad-minimal.html exists: a hand-authored 50–150 line Brad-style document with at least 3 paragraphs, 2 headings, 1 visible <img>, 1 hidden <p> (display:none), and 1 <script> block"
  - "[ ] Performance smoke: walker completes on brad-minimal.html in <50ms"

