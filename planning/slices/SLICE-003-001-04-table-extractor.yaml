# Context for the developer
context:
  - "Tables in Brad documents are typically financial summaries — Sources & Uses, Cap Stack, Cash Flow. They are NEVER decorative; cell values are load-bearing."
  - "colSpan and rowSpan matter: a financial footer often spans 3 columns with a 'Total' label. columnCount must account for the widest effective row, not just the literal cell count."
  - "Per-column naturalWidth: in MVP, approximate by the FIRST <tr>'s cell widths (sum equals table width). Full pro-rata averaging across all rows is overkill for v1."
  - "Walker dispatch: same pattern as SVG — early-return after extracting the table to prevent text extractor from re-emitting individual <td> contents as text records."
  - "computedStyle on cells: only capture the small subset listed in acceptance criteria. Capturing every CSS property bloats the record by 100x."
  - "Section detection: el.querySelector('thead'), el.querySelector('tbody'), el.querySelector('tfoot') — if absent, default all rows to 'tbody'."

# Technical requirements
technical_requirements:
  - "extractTable is pure (no mutation)"
  - "Single-pass per row, single-pass per cell — no nested re-traversal"
  - "Walker dispatch adds at most 10 lines of code"
  - "Performance: 20-row × 10-col table parses in <30ms"

# Testing requirements
testing_requirements:
  - "Unit tests covering: simple table, table with thead/tbody/tfoot, table with colSpan, empty table"
  - "Assertion on row count, column count, section labels, cell text, colSpan/rowSpan values"
  - "Performance smoke: 20×10 table parses in <30ms"

