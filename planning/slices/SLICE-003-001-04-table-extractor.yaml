# Slice overview
title: "Table extractor"
objective: |
  Capture every <table> element as a single ContainerRecord with
  kind='table' and full structural metadata: row × column dimensions,
  per-column natural widths (for the future column-handle UI in
  STORY-003-002), cell text content, cell computed styles, and section
  classification (thead vs tbody vs tfoot). Tables are NOT flattened
  into per-cell containers — the table is one draggable unit.

# Acceptance criteria
acceptance_criteria:
  - "[ ] apps/visual-composer/src/parser/extractors/table.ts exports extractTable(el: HTMLTableElement): ContainerRecord with kind='table'"
  - "[ ] ContainerRecord.content for kind='table' includes: rowCount, columnCount, columns ({ naturalWidth: number }[]), rows (TableRowRecord[]); each row has section ('thead'|'tbody'|'tfoot') and cells (TableCellRecord[])"
  - "[ ] TableCellRecord includes: textContent (string), computedStyle (subset: font-family, font-size, color, background-color, padding, text-align), colSpan, rowSpan"
  - "[ ] columnCount equals max number of effective cells in any row, accounting for colSpan"
  - "[ ] columns[i].naturalWidth captures the rendered width of column i (sum of cell widths divided by row count, or first row's width as approximation)"
  - "[ ] Walker (dom-walker.ts) dispatches <table> elements to extractTable() and does NOT descend into table internals (cells handled by extractor)"
  - "[ ] <thead>/<tbody>/<tfoot> distinction preserved per row"
  - "[ ] Unit tests in tests/parser/table.test.ts pass against tests/fixtures/brad-table.html (assertion: row/column counts match, cell text matches, sections labeled correctly)"
  - "[ ] tests/fixtures/brad-table.html exists: a Brad-style document containing at least 2 tables — one simple 3×4 financial summary, one with thead/tbody/tfoot and colSpan in the footer"
  - "[ ] Edge case: <table> with zero rows produces rowCount=0, columnCount=0, rows=[], columns=[] (no error)"

