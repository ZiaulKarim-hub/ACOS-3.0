# Notes
notes: |
  Tables are the second-highest-fidelity element after SVG charts. A
  cell value loss between parser and PDF is a v1 failure (because that
  cell value is investor-facing).

  Do NOT flatten tables into per-cell containers. The table is one
  unit; cell-level layout adjustments are NOT supported in MVP.
  Per-column width adjustments (in STORY-003-002) operate on the
  columns metadata captured here, not on the cell records directly.

# Plan addenda — added 2026-05-26 after SLICE-003-001-02 performance review
# Source: SLICE-003-001-02 performance-reviewer MAJOR finding
plan_addenda:
  - finding_id: "P1"
    severity: MAJOR
    source: "SLICE-003-001-02 performance-reviewer (overall verdict PASS but algorithmic_complexity sub-score FAIL)"
    description: |
      The DOM walker shipped in slice 02 has a latent O(N · d · k) source-DOM
      path builder. Empirically benchmarked:
        - depth=800, 1 record → 242ms (4× scaling for 2× depth = O(d²) per emit)
        - depth=20, siblings 50→100 → 168ms→580ms (~3.4× = super-linear fanout)
      Brad-shaped real-world docs (depth ~10, modest fanout) ship safely:
      30KB measured at 7ms median, 60KB at 12ms — far under STORY-003-001's
      3-second budget. BUT this slice (table extractor) introduces exactly
      the shape that exposes the quadratic: wide same-tag siblings. A 50-row
      × 10-column table = 500 same-tag <td> children at <tr> level, plus
      same-tag <tr> fanout at <tbody> level. The trap WILL be sprung if the
      walker is not refactored before this slice's perf test runs.
      The story-level 3-second budget at slice 07 has ~430× headroom on
      Brad-shaped input, but a heavy-table fixture would consume that
      headroom rapidly.
    action: |
      Before implementing table extraction, refactor the walker (file:
      apps/visual-composer/src/parser/dom-walker.ts):
        1. Replace recursive visit() with iterative DFS using an explicit
           stack and a mutable shared parents array (push on descend, pop
           on ascend). Eliminates the per-call parents.slice() / parents.
           concat() allocations and the per-emit chain rebuild.
        2. Build sourceDomPath incrementally: maintain a `pathSegments:
           string[]` parallel to the parents stack. Push segmentFor()
           result on descend, pop on ascend. Final path =
           pathSegments.join(' > ').
        3. Replace per-segment sibling re-scan with a per-parent
           tag-counter that's O(1) amortized:
             - On push, scan the parent's children once to compute the
               current node's nth-of-type index, OR
             - Maintain a per-tag counter on the parent during the walk
               and consume it as each child is visited in order. The
               latter is preferable: O(1) amortized per child.
        4. Hoist an "inside-skip-zone" flag onto WalkedNode (set once
           when walker crosses into <table>/<svg> subtree) so text/image
           extractor dispatch can branch in O(1) instead of an O(d)
           ancestor scan per node.
      After refactor, re-verify slice 02's perf smoke test still passes
      AND slice 04's new table fixture (50×10) completes in well under
      the story-level 3-second budget. Recommended target: <200ms on a
      50×10 table fixture.
    additional_acceptance_criterion: |
      "[ ] Walker is truly O(N) over visible elements (no super-linear scaling
       with depth OR sibling fanout). Verified by re-running the slice 02
       perf benchmark suite and an additional 50×10 table perf test."
    files_allowed_addition:
      - "apps/visual-composer/src/parser/dom-walker.ts"  # to enable the refactor

  - finding_id: "P2"
    severity: MINOR
    source: "SLICE-003-001-02 performance-reviewer"
    description: |
      Walker triple-allocates parent chain per element (parents.slice() on
      WalkedNode store, parents.concat(el) for recursive call, chain =
      parents.concat(el) inside buildSourceDomPath). At Brad-typical depth
      ~8 and ~260 records, this is 3 × 260 × 8 = 6240 allocations — fine
      in absolute terms but eliminable.
    action: |
      Addressed automatically by the iterative-DFS refactor in P1 (one
      shared parents stack mutated via push/pop replaces all three
      allocations). If the P1 refactor is split out, capture this
      cleanup with it.

  - finding_id: "P3"
    severity: MINOR
    source: "SLICE-003-001-02 performance-reviewer"
    description: |
      extractText scans the full parent chain on every text-eligible
      element to check SKIP_TEXT_INSIDE membership (O(d) per element).
      This slice's table extractor will duplicate the ancestor check
      from its own side, multiplying the per-element constant.
    action: |
      Addressed by P1 action item 4 (inside-skip-zone flag on
      WalkedNode). If the P1 refactor is deferred, at minimum hoist
      the SKIP_TEXT_INSIDE check out of the per-element extractor and
      into the walker dispatch.

  - finding_id: "P4"
    severity: MINOR
    source: "SLICE-003-001-02 performance-reviewer"
    description: |
      Slice 02's perf smoke test (text.test.ts:106-111) is a single
      sample with no warm-up. Variance under CI load can flake-fail a
      typical 5-10ms run over the 50ms threshold.
    action: |
      Slice 04 should land its own table-perf assertion as a
      median-of-5 with one warm-up extract() call. If time permits,
      retrofit the slice-02 perf smoke at the same time.
    files_allowed_addition:
      - "apps/visual-composer/tests/parser/text.test.ts"  # optional retrofit
