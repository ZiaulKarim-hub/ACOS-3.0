# Slice overview
title: "registry_lib.py: atomic write, schema, casefold index, inode re-link, tombstone, audit"
objective: |
  Implement registry_lib.py — the durable per-project registry substrate: an atomic
  write that a crash or a second writer can never corrupt silently, plus the row
  read/upsert API, casefold lookup index, (st_dev,st_ino) re-link/heal, tombstone,
  and audit append.
description: |
  In scope:
  - Atomic write: mkstemp(dir=target's own dir) -> write -> fsync(tmp) -> os.replace
    -> fsync(dir); never a fixed .tmp
  - Row schema (data-model E1); realpath().casefold() lookup index; (st_dev,st_ino) re-link
  - Tombstone-never-delete; audit append (one os.write per JSONL line) to
    ~/.acos/registry-audit.jsonl
  - Loud failure on truncated/invalid JSON load
  Out of scope (guardrails):
  - Any lock that blocks (LOCK_EX) or survives SIGKILL (mkdir-lock)
  - YAML/SQLite; a shared master file
  - Deleting rows (deletion is a human act only)

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Contention crash-test 6 processes x 60 writes -> 0 errors, 0 torn (mirrors the measured 180/360 -> 0); crash-test output archived in the evidence bundle"
  - "[ ] A truncated row file load fails LOUDLY (JSON error raised), never a silent partial; loud-truncation unit check passes"
  - "[ ] Re-link by (st_dev,st_ino) heals a moved root instead of tombstoning it; inode re-link unit check passes"
  - "[ ] Audit append is one os.write per JSONL line with ordering preserved; verified in the archived crash-test/audit output"
  - "[ ] Evidence bundle at .acos/evidence/[DATE]/SLICE-10-registry-lib/ is populated (7-part bundle: implementation summary, requirements traceability to spec FR-*/tech_prd TR-*, structural quality, functional checks, security/compliance notes, operational notes, self-assessment)"
  - "[ ] '## Dev Learnings' and '## QA Learnings' sections in the source task file are updated (slice is not Done until they are)"

