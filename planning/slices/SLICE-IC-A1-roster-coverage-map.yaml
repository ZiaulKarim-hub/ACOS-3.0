  - ".claude/skills/acos-investment-committee/scripts/check_coverage.py"

files_prohibited:
  - "context note: the seat *prompt* content is owned by SLICE-A2, not this slice; intake and synthesis logic are out of scope"

# Skills recommended
skills_recommended:
  - "backend-coding"
  - "testing"

# Flow to use
flow: "slice-execution-flow"

# Context for the developer
context:
  - "READ-ONLY inputs: spec Appendix A, domain-lattice seat-* + metric-risk-coverage nodes"
  - "stdlib-only Python; YAML fixtures; mirror the numbered roster + coverage table verbatim -- do not invent risk categories, do not renumber seats"
  - "final roster: 1 Credit & Valuation, 2 Finance, 3 Accounting, 4 Legal & Structural, 5 Insurance & Climate, 6 Sponsor & Fraud-Forensics, 7 Portfolio & Concentration (fund), 8 Strategy, 9 Deal Advocate (NEW, no vote, defense/steelman role, owns no risk category), 10 Gap-Hunter/Chair-agent (renumbered from the former #9, no vote, procedural), 11-15 deal-triggered optionals (Construction/Completion, Tax, Market/Macro, Compliance, Environmental/Physical-Condition)"

# Technical requirements
technical_requirements:
  - "check_coverage.py must fail (non-zero exit) if any of the 16 risk categories is unowned"
  - "roster.yaml optional-seat trigger conditions must be encoded alongside seats #11-15"
  - "roster.yaml must encode an explicit exemption mechanism (e.g. owned_risk_categories: [] plus a cross_checks / owns_shared_artifact / is_defense_role field) for seats #3, #8, and #9 so check_coverage.py does not misreport any of them as coverage gaps"
  - "roster.yaml must keep seat #9 (Deal Advocate) and seat #10 (Gap-Hunter/Chair-agent) as two distinct seat_ids -- structurally separate defense vs procedural roles, never merged"

# Testing requirements
testing_requirements:
  - "QA recomputes the coverage count from the map itself, not from a summary claim"
  - "QA runs check_coverage.py independently and confirms exit 0"
  - "QA confirms Portfolio (#7) fund-scoped, Deal Advocate (#9) non-voting, and Gap-Hunter (#10) non-voting are all present in the schema"
  - "QA confirms seat #4's default Environmental ownership is the legal-materiality sub-lens only, not a full physical/environmental review"
  - "QA confirms seats #3, #8, and #9 are explicitly exempted from the 'must own >=1 category' check, not silently unowned"
  - "QA confirms seat #9 (Deal Advocate) and seat #10 (Gap-Hunter) are distinct seat_ids and were not collapsed into one seat"

