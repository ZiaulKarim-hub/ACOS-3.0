# Slice overview
title: "Seat roster schema + 16-risk coverage map"
objective: |
  Define the Seat + ExpertProfile schema for the numbered, stable roster -- 8 core voting
  seats (#1-8), the non-voting Deal Advocate (#9), the non-voting Gap-Hunter/Chair-agent
  (#10), and 5 deal-triggered optionals (#11-15) -- and a machine-checkable 16-risk coverage
  map asserting every risk category has a named default owner (zero uncovered), with the
  Portfolio seat (#7) marked scope: fund.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] roster.yaml encodes the numbered seats #1-8 (voting) + #9 Deal Advocate (voting: false) + #10 Gap-Hunter/Chair-agent (voting: false) with seat_id, scope, owned_risk_categories, and optional-seat trigger conditions for #11-15"
  - "[ ] seat #1 (Credit & Valuation) documents merging the former separate Credit and Valuation seats and its TWO sub-passes (collateral-value, repayment-capacity)"
  - "[ ] seat #2 (Finance) core-owns risk category #9 (Interest-Rate/Refi/Exit) -- no longer a Credit fold-in"
  - "[ ] seat #3 (Accounting) is explicitly documented as owning the shared normalized-NOI claim consumed by #1 and #2, and is exempted (not silently unowned) from the 'must own >=1 of the 16 categories' check"
  - "[ ] seat #4 (Legal & Structural) owns risk category #6 (Environmental) ONLY as a legal-materiality sub-lens (CERCLA / Phase I currency), not the full physical/environmental review"
  - "[ ] seat #8 (Strategy) is explicitly documented as outside the 16-risk-category taxonomy (strategic-fit lens) and exempted (not silently unowned) from the 'must own >=1 category' check"
  - "[ ] seat #9 (Deal Advocate) is a NEW, structurally separate seat: owned_risk_categories == [], voting == false, documented as the good-faith steelman/mitigant role (not a risk-owning scrutiny seat), and explicitly exempted from the 'must own >=1 category' check"
  - "[ ] seat #10 (Gap-Hunter/Chair-agent, renumbered from the former #9) remains voting == false and procedural (round-by-round seat-selection / risk-hunting), and is a distinct seat_id from the Deal Advocate (#9) -- the two roles must not be collapsed"
  - "[ ] coverage-map.yaml maps all 16 risk categories -> owning seat_id exactly per the SLICE-A1 task-file coverage table (Exit/Refi -> seat 2; Tax fold-in -> seat 4, promotable to optional #12; Environmental default -> seat 4 legal sub-lens, full review promotable to optional #15; Construction/Completion default -> seat 1, promotable to optional #11; Market/Macro default -> seat 1, promotable to optional #13; Regulatory/Compliance default -> seat 4, promotable to optional #14)"
  - "[ ] scripts/check_coverage.py exits 0 with zero unowned risk categories"
  - "[ ] check_coverage.py asserts Portfolio seat (#7) scope == fund"
  - "[ ] check_coverage.py asserts Deal Advocate (#9) voting == false and owned_risk_categories == []"
  - "[ ] check_coverage.py asserts Gap-Hunter seat (#10) voting == false"
  - "[ ] evidence bundle includes a coverage-check transcript showing all 16 categories mapped and seat numbers unchanged from THIS slice's numbering (1-15 stable; #9 Deal Advocate and #10 Gap-Hunter supersede any prior #9-Gap-Hunter draft)"
  - "[ ] QA independently recomputes the 16-category count from the map (not from the summary) and confirms no seat claims a category outside the coverage table"

