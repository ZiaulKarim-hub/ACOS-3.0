slice_id: "SLICE-001"
story_id: "standalone"
epic_id: "loan-doc-generator-improvements"
vision_id: "ACOS-3.0"
created_date: "2026-03-15"
created_by: the-architect
status: "planned"

title: "Design Library: One Sample Per Design, On-Demand Preview"
objective: |
  Restructure the design library so that each sample document is its own
  independent design entry — not merged with other samples. Update the
  Step 0.3 selection UI so users pick from multiple designs per document
  type, with sample preview links shown only on request.

  Current state: 23 entries in index.yaml, each with 1-3 samples merged
  into a single synthesized design-patterns.yaml. Users see one "Okoa PE
  Style" entry per doc type with all sample links shown inline.

  Target state: ~44 entries (one per sample file), each with its own
  design-patterns.yaml extracted from that single sample. Users see
  multiple named designs per doc type and can preview any design's
  sample on request.

acceptance_criteria:
  - "[ ] Each sample file has its own design library entry with a unique design_id"
  - "[ ] Each entry has its own design-patterns.yaml extracted from that single sample"
  - "[ ] Each entry has its own benchmark-criteria.yaml"
  - "[ ] Each entry has exactly one sample_file (not sample_files array)"
  - "[ ] Design labels are descriptive (derived from deal/borrower name, not generic 'Okoa PE Style')"
  - "[ ] Step 0.3 shows numbered list of available designs per document type"
  - "[ ] Sample file:// links are NOT shown by default in Step 0.3"
  - "[ ] Step 0.3 offers a [V] View sample option that shows the file:// link for a selected design"
  - "[ ] Batch mode design resolution table does NOT show sample links inline"
  - "[ ] external-credit-memo existing extraction (Lux 2 PDF) preserved as-is, not re-extracted"
  - "[ ] index.yaml version bumped to 3.0"
  - "[ ] Design library directories renamed from {slug}/ to {design_id}/ to avoid collisions"

