notes: |
  The key UX change: currently the design selection shows all sample links
  upfront which is noisy. The new flow is:

  Step 0.3 (single doc):
    [1]  Beehive Waldorf Style   │  Added 2026-03-15
    [2]  Lux 2 Portfolio Style   │  Added 2026-03-15
    ─────────────────────────────────────────────────
    [V]  View sample for a design
    [3]  Use New Design

  If user picks [V]:
    Which design? [1-2]: 1
    Sample: file:///Users/zee/.../Beehive - Waldorf Credit Memo 2024.08.13.pptx

  Step 0.3 (batch mode summary):
    #   DOCUMENT                  DESIGN                    PHASE 1
    A1  Internal Credit Memo      Beehive Waldorf Style      Skip
    A3  Term Sheet                Wolfgramm V5 Style         Skip

  No inline links in batch — clean summary table.
