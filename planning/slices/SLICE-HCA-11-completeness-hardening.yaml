# Slice overview
title: "Completeness / freshness / schema-drift hardening"
objective: |
  Harden the completeness, freshness, and schema-drift handling under adversarial
  conditions, and validate hypothesis H1 (aggregation/units/currency/truncation
  dominate the trust failure). Prove the gates catch each failure mode with
  deliberately hostile fixtures, and implement freshness invalidation (webhook stub /
  polling fallback) and schema-drift surfacing (not silent absorption). In scope:
  adversarial fixtures (deeply-truncated multi-page list, rate-limit cutoff mid-cursor,
  stale-just-past-window, drifted-schema with added/removed/retyped fields);
  pagination-completeness hardening across multi-page + cursor exhaustion; freshness
  invalidation (webhook stub + polling fallback) wiring on the adapter; schema-drift
  detection that surfaces drift_details rather than absorbing; H1 validation write-up.
  Out of scope: new gates (the six exist from slice-05 — this hardens them); feed
  formats (slice-09); security (slice-10).

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Pagination-completeness blocks every hostile truncation fixture (mid-cursor cutoff, rate-limit stop, multi-page short count) — pass-condition: ALL hostile-truncation fixtures => refuse (REQUIRED; no silent truncation; fail = REJECT)"
  - "[ ] Freshness gate + invalidation: stale-just-past-window fixtures are refused/flag-refreshed; invalidation hook (webhook stub/polling fallback) marks affected cache entries stale — pass-condition: stale fixtures refused; invalidation test"
  - "[ ] Schema-drift detection surfaces drift_detected: true + drift_details[] for added/removed/retyped fields and does NOT silently absorb — pass-condition: drift fixtures surface details (REQUIRED; fail = REJECT)"
  - "[ ] H1 validated: evidence shows aggregation/units/currency/truncation are the dominant catch vs raw text fabrication; result recorded (confirm or refine gate weighting) — pass-condition: H1 write-up with data, backed by fixture outcomes (not hand-waved)"
  - "[ ] Freshness-invalidation hook introduces NO mutating call (stays read-only) — pass-condition: QA confirms no mutating call"
  - "[ ] Dev Learnings and QA Learnings sections updated"

