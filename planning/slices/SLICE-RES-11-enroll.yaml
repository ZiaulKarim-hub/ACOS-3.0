# Slice overview
title: "enroll-project.sh + additive SessionStart hook + cwd==root assertion"
objective: |
  Build .claude/scripts/resurrection/enroll-project.sh and register it as an
  ADDITIVE user-level SessionStart hook so every session started in a real
  project directory enrolls that project in the registry: marker gate
  (<root>/.acos/ OR CLAUDE.md OR memory/handoffs/), uuid4 minted once into
  <root>/.acos/project-id (git-ignored), row upserted with derived fields via
  registry_lib.py, and a realpath(cwd)==registry.root assertion that logs
  loudly on mismatch. Vertical value: membership on first sight — the book is
  populated before any close ever runs (survives force-quit, DR-8).
description: |
  Epic EPIC-1 / Story STORY-1.1 — Demo 1 (enrollment).
  In scope: the marker gate; mint uuid4 once -> <root>/.acos/project-id;
  upsert row with derived fields via registry_lib.py; assert
  realpath(cwd)==registry.root with a loud log on mismatch (risk #7);
  O(1), fail-open, never blocks session start; registered as an ADDITIVE
  SessionStart hook whose name is distinct from autopilot-enroll-project.sh.
  Out of scope (guardrails): naive filesystem scan; close-time row creation;
  touching the existing hook chain or the daemon dir.

# Acceptance criteria (from the preeng Definition-of-Done + QA evidence gates)
acceptance_criteria:
  - "[ ] New session in a marker dir -> a row file appears in ~/.acos/registry.d/ with all fields derived (archived transcript, case 1)"
  # TODO: confirm the exact derived-field set against the SLICE-RES-10 registry_lib.py schema
  - "[ ] Session in a scratchpad/non-marker dir -> no row created (archived transcript, case 2)"
  - "[ ] Second session in the same project -> same uuid, no duplicate row; .acos/project-id written exactly once across re-runs (archived transcript, case 3)"
  - "[ ] cwd!=root logs loudly and does not silently continue (forced-mismatch transcript, case 4 — protects the f639310 fix)"
  - "[ ] SessionStart hook shown ADDITIVE via diff of ~/.claude/settings.json; register-session-pid.sh and the existing hook chain untouched"
  - "[ ] Marker gate rejects a naive-scan candidate (memory/ stray) — rejection transcript archived"
  - "[ ] Enrollment timed O(1) (timing evidence archived)"
  - "[ ] Evidence bundle populated at .acos/evidence/[DATE]/SLICE-11-enroll/ (7-part bundle) and the task file's Dev Learnings + QA Learnings sections updated (slice not Done without them — §0.7)"

