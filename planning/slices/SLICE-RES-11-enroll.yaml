# Verification method (skill-mandated extension — from the task's QA section)
verification_method: |
  Archived transcripts of the four acceptance cases; the SessionStart hook
  shown additive (diff of settings.json); enrollment timed O(1).
  QA runs zero-trust (assume the Dev did NOT do the work correctly; spot-check
  and recompute — no fabricated logs):
  - Confirm the hook is additive and does not touch register-session-pid.sh
    or the existing chain
  - Force a cwd!=root case and confirm the loud log fires (protects the
    f639310 fix)
  - Confirm the marker gate rejects a naive-scan candidate (memory/ stray)
  - Confirm .acos/project-id is written exactly once (re-run enrollment)
  Evidence bundle at .acos/evidence/[DATE]/SLICE-11-enroll/ (7-part:
  implementation summary; requirements traceability to spec FR-* / tech_prd
  TR-*; structural quality; functional/structural checks; security/compliance
  notes; operational/runtime considerations; self-assessment).
  QA may REJECT and require rework; a reject blocks the slice like an
  INCONCLUSIVE reviewer.

