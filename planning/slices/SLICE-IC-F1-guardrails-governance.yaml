  - "guardrails are ASSERTIONS, not advice -- a violated guardrail fails the run; the autopilot check is a simple pre-flight assertion (abort only, no fallback branch, no mode-detection logic); subscription-only"

# Technical requirements
technical_requirements:
  - "kill_criteria.py execution order is enforced ahead of any mitigant reasoning path"
  - "autopilot pre-flight assertion reads .acos/state/autopilot-active per the existing ACOS autopilot convention and has exactly one behavior on match: abort with a clear message -- no batch-mode or degraded-pause fallback branch may exist in the code"

# Testing requirements
testing_requirements:
  - "QA feeds a cross-seat-context round-0 fixture and confirms independence enforcement rejects it"
  - "QA confirms kill_criteria.py runs before any mitigant reasoning (ordering check) and that an override leaves a logged policy exception"
  - "QA feeds a lopsided approve distribution and confirms the 10th-man fires"
  - "QA forces single-provider and confirms the reduced_independence flag"
  - "QA creates .acos/state/autopilot-active and confirms Mode B entry ABORTS immediately with a clear message and that no fallback branch executes"
  - "QA confirms the standing hole-checklist cannot be silently skipped"

