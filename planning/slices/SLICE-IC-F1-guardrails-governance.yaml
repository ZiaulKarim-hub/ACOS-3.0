# Slice overview
title: "Guardrail suite + autopilot pre-flight assertion + governance"
objective: |
  Mechanically enforce the anti-groupthink guardrail suite and an autopilot-active pre-flight
  assertion so accuracy rests on structure, not persona: independence enforcement, kill criteria
  FIRST, anti-sycophancy schema, 10th-man on lopsided distribution, reduced-independence flag,
  and an autopilot pre-flight ABORT (no fallback branch).

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] scripts/guardrails.py enforces independence: asserts no cross-seat context exists in round 0, rejecting any fixture where it does"
  - "[ ] scripts/kill_criteria.py runs FIRST, before any narrative mitigant reasoning; a kill match short-circuits to a logged deal-breaker; any override requires an explicit, separately-logged policy-exception entry"
  - "[ ] the anti-sycophancy schema forbids agreement without a named new fact, uses derived (not self-reported) confidence, and hides mid-debate numeric confidence"
  - "[ ] a consensus-triggered 10th-man contrarian pass fires on a lopsided approve-leaning distribution"
  - "[ ] the reduced_independence flag is set correctly when all seats resolve to a single provider"
  - "[ ] the autopilot pre-flight assertion checks test -f .acos/state/autopilot-active at Mode B entry; if the file exists, the run ABORTS IMMEDIATELY with a clear message and takes NO fallback action (no batch mode, no degraded-pause path, no menu shown)"
  - "[ ] the standing hole-checklist (concentration, leverage exceptions, statement veracity, tenant concentration, refi/maturity) is explicitly cleared and cannot be silently skipped"
  - "[ ] evidence bundle includes each guardrail's fire/no-fire transcript + the autopilot pre-flight-abort proof"

# Dependencies
