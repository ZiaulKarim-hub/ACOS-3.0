# Notes
notes: |
  Verification method (from QA section): verify each guardrail by trying to BREAK it
  (adversarial fixture per guardrail); reject if any guardrail can be bypassed or if the
  autopilot check takes any action other than a clean abort (no fallback code path permitted).
  Design change note: the prior "detect autopilot-active and fall back to batch mode" behavior
  is REPLACED by a simple pre-flight assertion (file exists -> abort, full stop). There is no
  "(Recommended)" safe-option concern anymore because no menu is ever shown when autopilot is
  active.
