# Notes
notes: |
  Signature change is intentional. After this slice, extract() is
  async — slices 06 and 07 will keep it async. STORY-003-002 (canvas)
  will treat extract() as a Promise from day one; the type contract
  defined in slice 01 already accommodates this (return type is the
  same array shape; only the wrapping Promise is new).

  data: URI test is important — Brad's pipeline sometimes inlines
  small backgrounds (gradients, textures) as data: URIs to avoid
  extra HTTP requests.
