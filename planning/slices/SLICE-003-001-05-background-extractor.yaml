# Context for the developer
context:
  - "ASYNC: this is the first async extractor. extract() in index.ts must become async to await background image loads. Update its return type to Promise<ContainerRecord[]>. This is a deliberate API change for this slice."
  - "Promise.all parallelism: collect all background extraction promises during the walk, await them once at the end. Do NOT await mid-walk — that serializes loads and kills perf."
  - "Background-image URL extraction: getComputedStyle(el).backgroundImage returns 'url(\"…\")' or 'none' (literal string). Strip the url(\"…\") wrapper with a regex; unquote; resolve relative to document base URL."
  - "Multiple backgrounds per element (CSS spec allows comma-separated) — for MVP, take only the first. Add a TODO comment for future multi-background support."
  - "Same-element-both-kinds case is real: a Brad <section class=\"hero\"> has background-image AND text inside. Both must appear in parts bin so user can drag them independently."
  - "Failure mode: image fails to load (404, CORS) — return null and log info. Do not throw. The user might still want to drag the OTHER containers from the document."
  - "data: URIs: should work transparently with new Image(); use one in the fixture to prove it."

# Technical requirements
technical_requirements:
  - "extractBackground is async, pure (no DOM mutation)"
  - "Walker accumulates background promises, awaits via Promise.all at end of walk"
  - "extract() signature changes: extract(html: string): Promise<ContainerRecord[]> (was sync in slices 01–04; this slice flips it to async)"
  - "Image load timeout: 5 seconds. On timeout, resolve to null with warning."
  - "URL resolution: relative URLs in CSS resolve against the document base URL (typically file:// or http://localhost during dev); use new URL(rawUrl, baseUrl) to compute"

# Testing requirements
testing_requirements:
  - "Unit tests covering: cover-fit, contain-fit, with background-position, data: URI, missing image (404 simulation)"
  - "Same-element-two-kinds test: a div with background-image + text content produces both a text record and a background record"
  - "Performance test: 5 backgrounds load in parallel in <500ms"
  - "Async correctness: extract() returns a Promise that resolves after all background loads complete"

