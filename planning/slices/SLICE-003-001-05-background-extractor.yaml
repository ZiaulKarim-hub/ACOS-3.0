# Slice overview
title: "Background image extractor"
objective: |
  Detect elements whose computed style includes a background-image
  (CSS url() reference), load each background image to read its natural
  dimensions, and emit a ContainerRecord with kind='background'. The
  separate 'background' kind tells downstream gesture logic to use
  cover-fit + focal-point drag-inside-container behavior (vs the
  aspect-locked scale used by <img>).

  Brad documents use background-image for full-bleed cover photos,
  section dividers, and decorative spreads. They must be draggable
  onto the canvas as separate units, distinct from inline <img>.

# Acceptance criteria
acceptance_criteria:
  - "[ ] apps/visual-composer/src/parser/extractors/background.ts exports extractBackground(el: Element): Promise<ContainerRecord | null>; returns null if the element's computed background-image is 'none' or empty"
  - "[ ] ContainerRecord.content for kind='background' includes: url (string, the resolved image URL), naturalWidth (number), naturalHeight (number), backgroundSize ('cover'|'contain'|'auto'|string), backgroundPosition (string)"
  - "[ ] Image natural dimensions are read by constructing `new Image(); img.src = url; await load`. Failures (404, CORS, malformed URL) resolve to null with a warning log, not an exception"
  - "[ ] Walker (dom-walker.ts) is updated to call extractBackground on every visited element AFTER the kind-specific dispatch. Same element CAN be both a text container AND a background container (e.g., a styled <div> with background and text inside)"
  - "[ ] When the same element produces both a text record and a background record, both are emitted with distinct ids (e.g., 'el-7-text' and 'el-7-bg')"
  - "[ ] Walker accumulates background-extraction Promises and awaits them in parallel via Promise.all at the end of the walk — does NOT serialize"
  - "[ ] Unit tests in tests/parser/background.test.ts pass against tests/fixtures/brad-background.html"
  - "[ ] tests/fixtures/brad-background.html exists: a Brad-style document with at least 3 elements bearing background-image — one full-bleed div, one with background-size: cover, one with explicit background-position. Backgrounds reference local fixture image files (apps/visual-composer/tests/fixtures/img/*.png)"
  - "[ ] Edge case: data: URI backgrounds are handled (e.g., a tiny inline PNG)"
  - "[ ] Performance: a page with 5 background images parses in <500ms (bottlenecked by image load, run in parallel)"

