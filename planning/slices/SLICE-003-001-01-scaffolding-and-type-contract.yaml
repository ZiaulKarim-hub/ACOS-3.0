# Context for the developer
context:
  - "ContainerRecord is THE API surface for the entire EPIC-003. Any change after this slice cascades into 6 downstream slices in this story alone, plus 4 downstream stories. Treat it as frozen once merged."
  - "Use discriminated unions — each NodeKind has a corresponding content payload type. The compiler must reject `if (kind === 'unknown')` and force exhaustive narrowing."
  - "The exact type signature is documented in STORY-003-001 technical_notes. Implement it verbatim."
  - "Use pnpm (not npm) per the repo's existing convention. Check the root for a package-manager preference; default to pnpm if unclear."
  - "Vite + React template via `pnpm create vite@latest apps/visual-composer --template react-ts` is the canonical init path."
  - "Smoke test purpose: prove the type compiles and narrows; not to test extraction (that's slice 02+)."
  - "DO NOT add unused dependencies — only Vite, React, React-DOM, TypeScript, Vitest, and their @types. Resist the urge to add zustand, react-rnd, etc. — those come in later stories."

# Technical requirements
technical_requirements:
  - "Node 18+ runtime (verify on user's macOS)"
  - "pnpm as package manager"
  - "Vite 5.x or 6.x"
  - "React 18 (NOT 19) — React 18 has the best ecosystem support for react-rnd in STORY-003-002"
  - "TypeScript 5.4+"
  - "Vitest 1.x or 2.x"
  - "strict: true in tsconfig.json (no implicit any, strict null checks)"
  - "ES2022 target for tsconfig.json (DOMParser, structuredClone available natively)"

# Testing requirements
testing_requirements:
  - "tests/parser/types.test.ts contains one type-level test that exhaustively switches on NodeKind and asserts each branch returns a string label. This proves the discriminated union narrows."
  - "Test must compile without `// @ts-expect-error` or `as any`."
  - "pnpm run test must show 1 passed, 0 failed."

