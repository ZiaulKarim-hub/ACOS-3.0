# Notes
notes: |
  This is the most leveraged slice in the entire epic. The
  ContainerRecord type defined here becomes the contract every other
  story builds against. Reviewer paranoia is justified.

  If pnpm is not installed on the system, the developer should pause
  and ask the user before falling back to npm — the project's existing
  scripts assume pnpm.

  React 18 (not 19) is deliberate: react-rnd's React 19 support is
  marked experimental as of 2026-05. Re-evaluate at STORY-003-002 time.
