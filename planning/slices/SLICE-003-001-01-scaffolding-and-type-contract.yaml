# Slice overview
title: "Project scaffolding + ContainerRecord type contract"
objective: |
  Initialize the Vite + React + TypeScript project at apps/visual-composer/
  with all base configuration. Define and export the canonical
  ContainerRecord discriminated-union TypeScript type. The type is the
  epic-wide API surface; every downstream story consumes it. No walker
  logic in this slice — only the project skeleton and the frozen type.

  Includes an extract() stub that takes an HTML string and returns an
  empty ContainerRecord[]. The stub exists so downstream slices have a
  function to fill in, and so the public-API shape is locked from
  slice 01 onward.

# Acceptance criteria
acceptance_criteria:
  - "[ ] apps/visual-composer/package.json exists with Vite, React, React-DOM, TypeScript, and Vitest as direct deps; lockfile committed"
  - "[ ] apps/visual-composer/vite.config.ts and tsconfig.json present and successfully compile an empty src/main.tsx"
  - "[ ] pnpm install && pnpm run typecheck && pnpm run build all succeed with zero errors"
  - "[ ] apps/visual-composer/src/parser/types.ts exports ContainerRecord as a discriminated union over NodeKind ('text' | 'image' | 'svg' | 'table' | 'background')"
  - "[ ] ContainerRecord includes: id (string), kind (NodeKind), sourceDomPath (string), bounds ({ width: number; height: number }), computedStyle (ComputedStyle), content (kind-discriminated payload), bradClass (string | undefined)"
  - "[ ] apps/visual-composer/src/parser/index.ts exports extract(html: string): ContainerRecord[] as a stub that returns []"
  - "[ ] apps/visual-composer/.gitignore covers node_modules/, dist/, .vite/, *.local"
  - "[ ] Root .gitignore updated to also cover apps/visual-composer/node_modules/ and apps/visual-composer/dist/"
  - "[ ] One smoke test in tests/parser/types.test.ts that imports ContainerRecord and asserts the discriminated union narrows correctly for each NodeKind"
  - "[ ] pnpm run test passes (one smoke test, zero failures)"

