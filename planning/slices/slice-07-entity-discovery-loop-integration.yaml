# Slice overview
title: "Entity discovery wiring + graph-expansion loop integration (Demo 1)"
objective: |
  Wire SoS + OpenCorporates entity discovery into the graph
  (person->officer/agent->entities->siblings) and integrate the full thin pipeline in
  SKILL.md: compliance gate -> normalize -> identity -> entity discovery -> channels ->
  swarm -> synthesizer, looping until dry. Produce a hedged thin Markdown report plus the
  audit trail on a sample name. This is Demo 1 (the compliant thin slice end to end).
  Out of scope: dedup (slice-08), scoring (slice-09), equity rollup (slice-10), full
  dossier (slice-11).

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] Entity discovery resolves a seed person to controlled entities (officers/agents/siblings) and feeds the graph, hub-guarded — pass: entity-discovery test"
  - "[ ] The end-to-end thin loop runs gate->normalize->identity->discovery->channels->swarm->synthesizer and terminates — pass: e2e thin-path test on a sample fixture"
  - "[ ] The report uses hedged language throughout ('likely controlled by'; 'owns' only with direct title) — pass: hedged-language test (REQUIRED)"
  - "[ ] An audit trail (workspace/<sid>/round-NN/agent-NN/findings.md + synthesis/) is written and resumable — pass: audit-trail test"
  - "[ ] Nothing runs while COMPLIANCE_BLOCKED — pass: gate-respect test"
  - "[ ] Dev Learnings and QA Learnings sections updated"

