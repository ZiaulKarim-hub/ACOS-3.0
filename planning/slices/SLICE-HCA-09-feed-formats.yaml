# Slice overview
title: "Downstream trusted-input feed formats + provenance/confidence display (Demo 3)"
objective: |
  Render verified deliverables in report / table / dataset (JSON/CSV) formats and a
  trusted-input feed schema with embedded per-value provenance + confidence + a
  manifest (source-of-truth pointers, freshness, schema version, completeness proof),
  and demonstrate a downstream skill consuming it as a trusted input. This is Demo 3.
  In scope: feed renderers (JSON + CSV) emitting per-value provenance/confidence;
  the manifest schema + generator; a documented consumer contract; a Demo 3
  walkthrough where a downstream skill (e.g. acos-dataroom-v2) ingests the dataset.
  Out of scope: modifying downstream consumer skills' internals (only demonstrate
  consumption via the documented contract); security hardening (slice-10); live API.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Dataset export in JSON and CSV where every value row carries its provenance + confidence — pass-condition: feed-render test; a sample row independently resolves to Tier-1 (fail = REJECT)"
  - "[ ] Manifest generated and schema-valid: includes source-of-truth pointers, freshness, schema version, and a completeness proof (pagination-complete evidence) — pass-condition: manifest validates against feed-manifest.schema.json (REQUIRED; fail = REJECT)"
  - "[ ] A downstream consumer ingests the feed via the documented contract and accepts it as a trusted input (Demo 3) — pass-condition: Demo 3 walkthrough reproducible"
  - "[ ] CSV is well-formed (stdlib csv, quoted, no field corruption) and round-trips with the JSON — pass-condition: round-trip test"
  - "[ ] Feed is PII-minimized (no borrower PII beyond need) — pass-condition: PII-scan of sample feed"
  - "[ ] Completeness proof in the manifest is real (matches the pagination-completeness gate result), not a placeholder"
  - "[ ] Dev Learnings and QA Learnings sections updated"

