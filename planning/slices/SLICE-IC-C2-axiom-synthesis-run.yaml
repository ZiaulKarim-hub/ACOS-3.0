# Slice overview
title: "Run the vendored synthesis engine over IC facts"
objective: |
  Drive the objection facts through the VENDORED synthesis engine copy at
  .claude/skills/acos-investment-committee/scripts/synthesis/ (decircularize -> grade -> fuse ->
  falsify -> resolve -> hash-chained ledger), including the independent DIFFERENT-discipline
  refuter step, producing a per-claim ledger with truth states and preserved dissent -- with NO
  runtime dependency on the acos-axiom-synthesis skill directory. The IC fact-builder's Axis-S
  severity field flows through the run untouched and orthogonal to the engine's truth-grading.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] the vendored copy (substrate + pipeline + tests) exists at scripts/synthesis/ with a VENDORED_FROM.md recording the source path + git commit"
  - "[ ] scripts/run_synthesis.py feeds ledger/facts-input.json into the VENDORED orchestrate.run() (stages 2-7), imported ONLY from the local scripts/synthesis/ copy"
  - "[ ] run_synthesis.py has ZERO import/reference to .claude/skills/acos-axiom-synthesis/ at runtime (grep-clean)"
  - "[ ] the vendored test_pipeline.py passes IN-TREE, proving the engine copy is intact"
  - "[ ] the falsification-gate refuter is assigned to a DIFFERENT discipline than the raiser (or a fresh steelman pass) -- never an aggregator-LLM prose blend"
  - "[ ] a hash-chained ledger + settled-objections.md are persisted for the fixture run"
  - "[ ] verify_ledger confirms the hash chain is intact"
  - "[ ] every objection fact reaches a truth state"
  - "[ ] at least one same-fact conflict is preserved as `conflict` and NOT arbitrated away by a narrator"
  - "[ ] the reduced-independence flag from de-circularization propagates correctly"
  - "[ ] the Axis-S severity field (informational|limitation|material-risk|deal-breaker-candidate) is present on fact/claim records and is orthogonal to (does not alter) the engine's truth-grade"
  - "[ ] zero edits to the vendored copy's logic relative to VENDORED_FROM.md's recorded source commit"
  - "[ ] evidence bundle includes the synthesis transcript, verify_ledger output, the vendored test_pipeline.py pass log, VENDORED_FROM.md contents, and a preserved CONTESTED/UNRESOLVED example"

# Dependencies
dependencies:
  slices:
    - slice_id: "SLICE-IC-C1-objection-fact-adapter-axis-s"
      what_it_provides: "ledger/facts-input.json (the fact records this slice feeds into orchestrate.run()), including the Axis-S severity field this slice must carry through unmodified"
      status: "complete"
    - slice_id: "SLICE-IC-DIAG-01"
      what_it_provides: "the one-time vendored synthesis-engine copy at scripts/synthesis/ + VENDORED_FROM.md this slice runs against (re-vendored here only if absent or stale)"
      status: "complete"

# File permissions
