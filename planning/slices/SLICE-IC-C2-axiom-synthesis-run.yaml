  - ".claude/skills/acos-investment-committee/scripts/synthesis/"

files_prohibited:
  - ".claude/skills/acos-axiom-synthesis/scripts/"

# Skills recommended
skills_recommended:
  - "backend-coding"
  - "testing"

# Flow to use
flow: "slice-execution-flow"

# Context for the developer
context:
  - "READ-ONLY (one-time vendoring SOURCE only, NOT a runtime dependency): acos-axiom-synthesis scripts + tests, ledger/facts-input.json, domain-lattice engine-axiom-synthesis + proc-falsification-gate + anti-llm-aggregator-blend"
  - "refuter MUST be a different discipline (falsification is the cross-examination step); subscription-only for any Task() refuter spawns"
  - "Axis-S severity is domain-owned by the IC fact-builder (SLICE-IC-C1); this slice's role is to carry it through the synthesis run unmodified, not to redefine it"

# Technical requirements
technical_requirements:
  - "orchestrate.run() is invoked as-is (stages 2 through 7) from the VENDORED scripts/synthesis/ copy, no engine logic modification"
  - "ledger append-only; hash-chain must remain valid"
  - "no runtime import path may resolve to .claude/skills/acos-axiom-synthesis/"

# Testing requirements
testing_requirements:
  - "QA runs the vendored test_pipeline.py in-tree and confirms it passes"
  - "QA greps run_synthesis.py and its imports to confirm zero references to acos-axiom-synthesis/ at runtime"
  - "QA runs verify_ledger independently and confirms the hash chain is intact (recompute)"
  - "QA confirms every objection fact reached a truth state"
  - "QA confirms at least one same-fact conflict is preserved as `conflict`, greps for any aggregator blend"
  - "QA confirms the refuter discipline differs from the raiser"
  - "QA confirms the Axis-S severity field exists on fact records and does not move the truth-grade"
  - "QA confirms VENDORED_FROM.md records a real source path + git commit"

# Review triggers (which reviewers will be assigned)
expected_reviewers:
  - "ACOS-qa-reviewer"
  - "ACOS-integration-reviewer"

