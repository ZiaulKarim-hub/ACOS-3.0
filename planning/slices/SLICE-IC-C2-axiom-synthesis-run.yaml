# Notes
notes: |
  Verification method (from QA section): reject on a failing vendored test, a live runtime
  dependency on acos-axiom-synthesis/, hash break, blended conflict, or any edit to the vendored
  copy's logic; verify_ledger and the refuter-discipline check must both be recomputed
  independently.
  Ownership note: Axis-S severity is treated here as owned by SLICE-IC-C1's fact-builder (per
  its slice_id suffix "-axis-s"); this slice only preserves/surfaces it through the synthesis
  run. Flagged for architect confirmation since C1 is outside this update's scope.
  Vendoring-sequencing note: the canonical design places the FIRST vendoring event in
  SLICE-IC-DIAG-01 (the walking skeleton, which must prove reachability of a vendored engine
  before any expert logic exists); this slice assumes that copy is already present and only
  re-vendors defensively if it is missing or stale. Flagged for architect confirmation.
