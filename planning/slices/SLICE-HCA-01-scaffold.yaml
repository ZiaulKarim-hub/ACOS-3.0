  - ".claude/skills/acos-hypercore-ask/config.yaml"  # consensus/freshness/confidence/adapter defaults; NO secrets
  - ".claude/skills/acos-hypercore-ask/README.md"
  - ".claude/scripts/hca-route.py"  # tier router; Python 3 stdlib only
  - ".acos/evidence/"
  - "planning/preeng/001-hypercore-ask/tasks/slice-01-scaffold.md"  # learnings update only

files_prohibited:
  - "review-rules/"       # framework-restricted (human-editable only)
  - ".claude/agents/"     # framework infrastructure; no agent file may be added
  - ".claude/scripts/hca-adapter.py"  # later slice (slice-02)

# Skills recommended
skills_recommended:
  - "backend-coding"        # Python 3 stdlib router + config
  - "api-documentation"     # SKILL.md command-surface + pipeline overview

# Flow to use
flow: "slice-execution-flow"

# Context for the developer
context:
  - "Bridged from planning/preeng/001-hypercore-ask/tasks/slice-01-scaffold.md"
  - "Carried guardrails: Python 3 stdlib ONLY, subscription-only (never ANTHROPIC_API_KEY), stubbed-until-access. No network/API call and no secret in config."
  - "Gotcha: the router must NOT fetch data — it is a deterministic rule-based classifier (single id/field => trivial; aggregation/list/'total'/'across'/'by' => report tier) with a --selftest."
  - "Gotcha: QA re-authors the router truth set and will not trust Dev's; classifications must match QA's independent set."

# Technical requirements
technical_requirements:
  - "Python 3 stdlib only; no third-party deps; no network imports (urllib/http.client/socket) in hca-route.py"
  - "Deterministic rule-based classifier with inline --selftest exiting 0"
  - "config.yaml carries tech_prd §5 defaults; comment noting secrets come from env/secret store only"
  - "SKILL.md frontmatter valid (name/description); forward references for downstream pipeline stages"
  - "Evidence-bundle directory-creation helper stub"

# Testing requirements
testing_requirements:
  - "Run python3 .claude/scripts/hca-route.py --selftest; confirm exit 0 and classifications match a QA-authored truth set"
  - "Grep config.yaml for secret-looking keys — must find none"
  - "Confirm no .claude/agents/ file added; confirm no network import in hca-route.py"
  - "Confirm evidence bundle exists and is authentic"

