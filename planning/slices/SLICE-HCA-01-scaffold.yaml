slice_id: "SLICE-HCA-01-scaffold"
story_id: "STORY-HCA-01"
epic_id: "EPIC-HCA-01"
vision_id: "VISION-HCA-01"  # PROPOSED — vision/epic not yet formally planned via /acos-plan
created_date: "2026-06-17"
created_by: acos-preeng-classic-bridge
status: "planned"

# Slice overview
title: "Skill scaffold + ACOS integration"
objective: |
  Scaffold the acos-hypercore-ask skill so it is discoverable and loadable in
  ACOS/Claude Code, exposes the natural-language command surface, classifies a
  question into a verification tier, surfaces the skill config, and wires per-slice
  evidence bundles. No data access yet. In scope: SKILL.md (frontmatter + command
  surface + forward pipeline overview); the tier-router script classifying a
  question as trivial-lookup vs report/aggregation/analysis; the skill config file
  (consensus/freshness/confidence/adapter defaults from tech_prd §5); evidence-bundle
  wiring stub. Out of scope: adapter, cache, gates, consensus, provenance, delivery.
  The router must NOT fetch data.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] SKILL.md loads with valid frontmatter (name/description); documents the NL command surface and the forward pipeline (router -> adapter -> cache -> normalize -> consensus -> gates -> binder -> deliver); states read-only + subscription-only + stubbed-until-access guardrails — artifact: SKILL.md"
  - "[ ] hca-route.py deterministically classifies a question into trivial-lookup or report/aggregation/analysis and prints the tier; covered by an inline self-test (python3 hca-route.py --selftest exits 0) — pass-condition: self-test passes against QA-authored truth set (not Dev's) = REJECT on fail"
  - "[ ] config.yaml present with the tech_prd §5 keys (consensus.default_quorum, agent_count, redispatch_retries, freshness_windows_days.*, confidence.single_source_cap: 0.7, adapter.backend: fixture) and NO secrets — artifact: config.yaml"
  - "[ ] No secret-looking key (API key, token, password) found in config.yaml; no network import (urllib/http/socket) in hca-route.py; no .claude/agents/ file added"
  - "[ ] Evidence-bundle wiring writes to .acos/evidence/[DATE]/[SLICE-ID]/ — pass-condition: bundle dir created"
  - "[ ] Dev Learnings and QA Learnings sections updated"

# Dependencies (taken from depends_on in stories.json)
dependencies:
  slices:
    - slice_id: "SLICE-HCA-00-diagnostic"
      what_it_provides: "Confirmed trust-failure diagnosis, Python 3 stdlib + stubbed-access ground rules, and gate-priority ranking that shape the scaffold"
      status: "planned"

