# Slice overview
title: "Embedded blind swarm + between-rounds synthesizer"
objective: |
  Implement the embedded blind isolated swarm + the between-rounds synthesizer.
  swarm_dispatch.py builds the channel x jurisdiction x entity agent matrix for a round;
  each agent runs isolated/blind (no shared context), dispatched subscription-only via
  Task(), and writes workspace/<sid>/round-NN/agent-NN/findings.md. synthesize_round.py
  cross-references findings -> confidence (Verified = 2+ INDEPENDENT isolated agents),
  PRESERVES conflicts as manual-review flags (never harmonize), hub-prunes + enforces the
  hop limit (holds the stop-list + hop counter), and emits next-round seeds; the loop stops
  when a round yields no new high-confidence nodes.

# Acceptance criteria (from task DoD + QA gates; testable)
acceptance_criteria:
  - "[ ] Two INDEPENDENT isolated agents landing on the same parcel mark it Verified; a single agent does not — pass: corroboration test (REQUIRED)"
  - "[ ] Conflicting owner names are PRESERVED as a manual-review flag, never harmonized — pass: conflict-preservation test (REQUIRED; a silent merge = REJECT)"
  - "[ ] The synthesizer hub-prunes + enforces the hop limit before seeding the next round; prunes logged — pass: prune/hop test"
  - "[ ] The loop stops when a round yields no new high-confidence nodes — pass: loop-termination test"
  - "[ ] Agents are isolated (no shared context) and dispatched subscription-only via Task() — pass: isolation + no-API-key test (REQUIRED)"
  - "[ ] Dev Learnings and QA Learnings sections updated"

