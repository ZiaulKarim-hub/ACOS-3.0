# Slice overview
title: "Provenance-binding engine (refuse-on-missing)"
objective: |
  Implement the universal provenance-binding engine: bind EVERY delivered value
  to a ProvenanceBinding = {endpoint, request_params, timestamp, json_field_path,
  raw_response_id} resolving to a cached Tier-1 RawApiResponse. Missing or
  unresolvable binding => REFUSE delivery; never guess. Aggregated values carry
  one binding per contributing source. In scope: hca-provenance.py (build a binding
  for a value from its Tier-2 record's field_bindings; verify it resolves to a real
  Tier-1 record at the cited path; emit a REFUSED result with reason when it
  cannot); aggregate binding (collect contributing bindings). Out of scope: the
  deterministic gate suite (slice-05), consensus (slice-06), delivery rendering
  (slice-07/09).

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] For a bound value, the engine produces a ProvenanceBinding that resolves to a real Tier-1 record and the json_field_path points at the cited value — pass-condition: positive-case resolution test"
  - "[ ] For a value with missing/unresolvable binding, the engine returns REFUSED with a machine-readable reason — pass-condition: negative-case refusal test (REQUIRED; this is the core guarantee; fail = REJECT)"
  - "[ ] Aggregates carry a contributing[] list with one resolvable binding per source; aggregate is REFUSED if any contributor is unbindable — pass-condition: aggregate-binding test"
  - "[ ] Invariant enforced: no value object can leave the engine in a deliverable state without >=1 resolvable binding — pass-condition: invariant test"
  - "[ ] Value-mismatch is caught: a binding whose json_field_path does not contain the bound value yields REFUSED (path walked + value compared) — pass-condition: mismatch negative test"
  - "[ ] No fabricated binding to satisfy the check; no value with an unresolvable binding ever returned"
  - "[ ] Dev Learnings and QA Learnings sections updated"

