# Context for the developer
context:
  - "Bridged from planning/preeng/001-hypercore-ask/tasks/slice-04-provenance.md"
  - "Core guarantee: refuse-on-missing. A value cannot leave the engine deliverable without >=1 resolvable binding; this is proven by NEGATIVE tests, not just positive ones."
  - "Gotcha (hard gate): the negative-case refusal test is REQUIRED and fail = REJECT. Three negative cases QA re-authors: no binding, binding to nonexistent raw_response_id, and a binding whose path does not contain the value."
  - "Gotcha: resolve-and-verify means actually walking json_field_path in the Tier-1 record and comparing the value; a path mismatch must REFUSE."

# Technical requirements
technical_requirements:
  - "Python 3 stdlib only"
  - "Read the Tier-2 record's field_bindings; construct ProvenanceBinding pulling endpoint/request_params/timestamp from the resolved Tier-1 record"
  - "Resolve-and-verify: load Tier-1 by raw_response_id, walk json_field_path, assert the value at the path matches the value being bound; mismatch => REFUSE"
  - "Aggregate path: collect bindings for every contributor; any unbindable contributor => REFUSE the aggregate"
  - "Machine-readable REFUSED reason"

# Testing requirements
testing_requirements:
  - "QA re-authors the negative cases (no binding; binding to nonexistent raw_response_id; binding whose path does not contain the value) — all three MUST yield REFUSED; any silent delivery = REJECT"
  - "QA independently walks json_field_path in the cited Tier-1 record for a positive case and confirms the value matches"
  - "QA attempts to coax a deliverable value past the engine without a binding; confirm impossible"
  - "QA confirms aggregates refuse when any contributor is unbindable"

