# Slice overview
title: "Hypercore client/adapter contract + fixture/mock backend (stubbed-until-access)"
objective: |
  Define the ONLY module that talks to Hypercore: a stable, read-only adapter
  contract with a FixtureBackend (active now) and a stubbed LiveBackend (TODO).
  Absence of credentials must degrade to an explicit NO_LIVE_DATA state — never
  fabricate. In scope: the adapter contract surface (is_live, get_entity,
  list_entities, get_schema, subscribe_events) per tech_prd §2; FixtureBackend
  serving canned RawApiResponse JSON; LiveBackend raising the documented
  NotImplementedError; NoLiveDataError; config/env-driven backend selection; a
  read-only guard test; the initial fixture set (incl. paginated, truncated,
  stale, drifted). Out of scope: real endpoints/auth (TBD until access); cache
  persistence (slice-03); gates/consensus.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Adapter exposes exactly the read-only contract surface; NO mutating method exists — pass-condition: read-only guard test asserts no mutating verb (create/update/delete/post/put/patch/write/mutate) is callable (REQUIRED hard gate; fail = REJECT)"
  - "[ ] FixtureBackend returns well-formed RawApiResponse-shaped dicts (endpoint, request_params, timestamp, http_status, cursor, reported_total, body, backend: 'fixture') for each modeled entity A1–A11 — artifact: fixtures/ + passing adapter test"
  - "[ ] is_live() returns false absent creds; requesting live data while not live raises/returns NoLiveDataError cleanly — pass-condition: degradation test passes (no fabrication)"
  - "[ ] LiveBackend is import-safe but raises the documented NotImplementedError('Hypercore live backend TODO — access not yet provisioned') if invoked — pass-condition: stub test passes"
  - "[ ] Backend is selectable via config/env; default fixture — pass-condition: config-driven selection test"
  - "[ ] Adversarial fixtures present and labeled (one paginated-list, one deliberately-truncated, one stale, one drifted) for downstream gate slices — artifact check"
  - "[ ] No network call on the FixtureBackend path; LiveBackend network code (if any) is unreachable while is_live() is false (no urllib/http.client/requests/socket reachable) — pass-condition: QA grep"
  - "[ ] Dev Learnings and QA Learnings sections updated"

