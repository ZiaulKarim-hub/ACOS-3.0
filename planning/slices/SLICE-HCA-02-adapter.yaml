# Technical requirements
technical_requirements:
  - "Python 3 stdlib only; typed RawApiResponse shape"
  - "Contract implemented as a small class/protocol with read-only methods only; backends implement it"
  - "FixtureBackend loads JSON from fixtures/, wraps each into the RawApiResponse shape with backend: 'fixture', supports cursor-based paging from fixture pages"
  - "LiveBackend stubbed (NotImplementedError) and gated behind is_live() (checks env/secret presence — none now -> false)"
  - "NoLiveDataError raised when live requested and not live"
  - "Author expected entity schemas (slice-05 validates against them) and the adversarial fixtures (truncated/stale/drifted)"
  - "TLS-on-live noted as TODO; no credential in repo"

# Testing requirements
testing_requirements:
  - "QA independently introspects hca-adapter.py for any mutating-verb method name; ANY match = REJECT"
  - "QA greps the module for network imports (urllib/http.client/requests/socket); FixtureBackend path must have no live network call; LiveBackend network code must be unreachable while is_live() is false"
  - "QA re-authors at least the read-only guard test and confirms it fails loudly if a mutating method is added"
  - "Confirm is_live() false with no creds and NoLiveDataError / NO_LIVE_DATA path triggers"
  - "Confirm adversarial fixtures (truncated/stale/drifted) exist and are labeled"

