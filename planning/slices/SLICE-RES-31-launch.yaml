# Context for the developer
context:
  - "cmux does no dedup — a routing bug here creates a 5th ACOS 3.0 workspace"
  - "cmux send / surface.send_text shreds multi-line prompts at \\n — the prompt must go via argv, never send_text"
  - "newest .reentry.md must be re-resolved AT OPEN TIME, not cached"
  - "Trust gate ('Quick safety check') can swallow delivery — detect and report, never assume delivered"
  - "Recency is never a selector — exact identity match first"
  - "[ -d \"$CWD\" ] precheck before any launch"
  - "cmux rpc invoked via absolute binary path (workspace.select / new-workspace / read-screen)"

# Technical requirements
technical_requirements:
  - "Three-way routing: same-root inline reentry load; open-elsewhere workspace.select focus (never a second workspace); not-open new-workspace launch"
  - "Argv reentry delivery with read-screen marker verification plus exactly one retry"
  - "Trust-gate detection ('Quick safety check') on launch"
  - "--name/--description written from the registry via list-form subprocess; only the reentry file PATH enters --command"

# Testing requirements
testing_requirements:
  - "SPINE 1 acceptance test: open-pick keeps workspace count constant"
  - "Throwaway-directory launch test: multi-line reentry arrives as ONE message (read-screen marker found)"

# Verification method (QA — zero-trust; skill-mandated extension of the template)
verification_method:
  - "Archive workspace count before/after an open pick; independently confirm the count is constant (cmux does no dedup)"
  - "Show the read-screen marker for a throwaway launch; confirm delivery is verified via read-screen + retry, not assumed"
  - "Show trust-gate detection for an untrusted-dir launch"
  - "Inspect --command: confirm the reentry PATH, not its contents or any registry-derived string, is what enters it"
  - "Verify scope respect and evidence authenticity — spot-check and recompute; no fabricated logs. QA may REJECT (blocks like INCONCLUSIVE) until gates pass"

