# Slice overview
title: "launch-project.sh: focus-or-launch + SPINE 1 acceptance + verified argv delivery"
objective: |
  launch-project.sh implements focus-or-launch three-way routing with SPINE 1
  acceptance and verified argv reentry delivery. Focus-never-launch kills the
  duplicate-workspace pile-up at its source.
description: |
  In scope:
  - (a) same-root -> newest .reentry.md re-resolved AT OPEN TIME, loaded inline
  - (b) open elsewhere -> cmux rpc workspace.select focus, NEVER a second workspace
  - (c) not open -> new-workspace with argv reentry delivery, read-screen delivery
    verification + one retry, trust-gate detection ('Quick safety check'),
    [ -d "$CWD" ] precheck
  - Write --name/--description from the registry (<next_action> [key:<uuid>])
    via list-form subprocess
  Out of scope (guardrails):
  - cmux send / surface.send_text for the prompt (shred at \n)
  - Any registry-derived string entering --command (only the reentry file PATH)
  - Recency as a selector (exact identity match first)

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] Picking ACOS 3.0 while open changes focus and the workspace count stays CONSTANT (SPINE 1) — artifact: before/after workspace counts archived in the evidence bundle"
  - "[ ] Launch on a throwaway delivers the multi-line reentry as ONE message — artifact: read-screen marker output captured in the evidence bundle"
  - "[ ] Untrusted-dir launch is detected and reported, not silently assumed delivered — artifact: trust-gate ('Quick safety check') detection shown"
  - "[ ] No registry-derived string enters --command; names/next_action go via --name/--description list-form — artifact: --command invocation inspected and archived"
  - "[ ] Evidence bundle at .acos/evidence/[DATE]/SLICE-31-launch/ populated with the 7-part bundle (Implementation Summary; Requirements Traceability to FR-*/TR-*; Structural Quality Evidence; Functional/structural checks; Security/Compliance notes; Operational/Runtime considerations; Self-assessment)"
  - "[ ] '## Dev Learnings' and '## QA Learnings' sections updated in the source preeng task file (slice is not Done until they are — §0.7)"

