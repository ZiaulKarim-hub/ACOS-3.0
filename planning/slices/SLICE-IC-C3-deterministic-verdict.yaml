  - "the verdict word is COMPUTED, never written by a model; deal-breaker is a derived predicate at compute time, not an engine field; subscription-only"

# Technical requirements
technical_requirements:
  - "deal-breaker set must be recomputed at verdict time (not read from a stored field)"
  - "resolve.py's asymmetric_veto path gates specifically on deal-breaker-flagged claims"

# Testing requirements
testing_requirements:
