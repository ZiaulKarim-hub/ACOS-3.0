  - "QA recomputes the deal-breaker set by hand from the ledger and confirms it matches"
  - "QA confirms a fabricated unmitigated deal-breaker yields DECLINE via asymmetric veto"
  - "QA greps the entire verdict path for any LLM/Task() call that writes the verdict word -- must find NONE"
  - "QA confirms engine git diff --stat is empty"

