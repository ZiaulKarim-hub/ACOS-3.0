# Slice overview
title: "Deterministic verdict + deal-breaker rule"
objective: |
  Compute the overall verdict deterministically via resolve.py as one resolve_conflict()
  over per-discipline roll-ups -- asymmetric-veto polarity on deal-breaker-flagged claims,
  quorum/ladder otherwise -- terminating in UNRESOLVED. The verdict is NEVER narrated by an
  LLM.

# Acceptance criteria (specific and testable)
acceptance_criteria:
  - "[ ] scripts/compute_verdict.py derives the deal-breaker set as: state in {ESTABLISHED, CORROBORATED} AND axis_s in {material-risk, deal-breaker-candidate} AND no depends_on mitigant reaches {CORROBORATED, ESTABLISHED} -- computed, not stored"
  - "[ ] the verdict-fact is built with candidates = per-discipline roll-ups; polarity = asymmetric_veto on deal-breaker claims, quorum/ladder for ordinary limitations"
  - "[ ] resolve.py is run and mapped to PROCEED | PROCEED-WITH-CONDITIONS | DECLINE | UNRESOLVED, written to verdict.md citing the deciding rung/polarity"
  - "[ ] running compute_verdict.py twice on the same ledger produces an identical verdict.md (NFR-3 reproducibility)"
  - "[ ] a fabricated unmitigated deal-breaker fixture yields DECLINE via asymmetric veto"
  - "[ ] a no-deciding-rung fixture yields UNRESOLVED"
  - "[ ] NO LLM/Task() call writes the verdict word anywhere in the verdict path"
  - "[ ] git diff --stat on acos-axiom-synthesis/ is empty"
  - "[ ] evidence bundle includes two identical verdict runs on the same ledger + a DECLINE fixture + an UNRESOLVED fixture transcript"

# Dependencies
dependencies:
  slices:
    - slice_id: "SLICE-IC-C2-axiom-synthesis-run"
      what_it_provides: "the hash-chained ledger (truth states + Axis S) this slice reads to compute the verdict"
      status: "complete"

