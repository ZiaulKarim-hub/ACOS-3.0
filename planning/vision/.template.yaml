# Vision Plan Template
# Created by The Architect based on vision interview

vision_id: "VISION-[PROJECT-NAME]"
created_date: "[YYYY-MM-DD]"
created_by: the-architect
status: "[planning | in_progress | complete]"

# Reference to source documents
source_of_truth:
  vision_interview: "memory/source-of-truth/vision-interview.md"
  vision_document: "memory/source-of-truth/vision-document.md"

# High-level description
summary: |
  [2-3 sentence summary of what this project will deliver]

# Who this is for
target_users:
  primary:
    description: "[Primary user description]"
    needs:
      - "[Need 1]"
      - "[Need 2]"
  secondary:
    description: "[Secondary user description]"
    needs:
      - "[Need 1]"

# Platform requirements
platforms:
  - name: "[web | mobile | desktop]"
    requirements:
      - "[Requirement 1]"

# Success criteria (from vision interview)
success_criteria:
  - criterion: "[Criterion 1]"
    measurable: "[How to measure]"
  - criterion: "[Criterion 2]"
    measurable: "[How to measure]"

# Epic breakdown
epics:
  - epic_id: "EPIC-001"
    title: "[Epic Title]"
    description: "[What this epic delivers]"
    priority: "[high | medium | low]"
    dependencies: []

  - epic_id: "EPIC-002"
    title: "[Epic Title]"
    description: "[Description]"
    priority: "[priority]"
    dependencies:
      - "EPIC-001"

# Execution order (respecting dependencies)
execution_order:
  - phase: 1
    epics: ["EPIC-001"]
    description: "Foundation"
  - phase: 2
    epics: ["EPIC-002", "EPIC-003"]
    description: "Core Features"
  - phase: 3
    epics: ["EPIC-004"]
    description: "Polish"

# Technical decisions
technology_stack:
  frontend: "[Technology choice]"
  backend: "[Technology choice]"
  database: "[Technology choice]"
  hosting: "[Technology choice]"

# Risk assessment
risks:
  - risk: "[Risk description]"
    likelihood: "[high | medium | low]"
    impact: "[high | medium | low]"
    mitigation: "[How to mitigate]"

# Notes
notes: |
  [Any additional notes or context]
