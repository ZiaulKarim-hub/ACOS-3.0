# UI/UX notes
ui_notes: |
  Layout
    Two-pane horizontal split. Left pane (~70% width): scrollable viewport
    holding stacked US-Letter-portrait pages. Right pane (~30% width):
    parts-bin tree at top, selection details panel below (placeholder in
    this story; populated in STORY-003-003 with font controls).

  Parts-bin tree
    Hierarchical group: first 2 segments of `sourceDomPath` form the
    parent node, the leaf is the record. Each leaf shows: NodeKind icon,
    short label (text snippet OR alt text OR svg viewBox OR table dims OR
    background filename), thumbnail (slice 07). Collapse arrow per group;
    debounced search box at top of pane (debounce 150ms; filters by record
    text content, domClasses, NodeKind name).

  Canvas
    US Letter portrait at 96 DPI base (8.5" × 11" → 816 × 1056 px). Pages
    stacked vertically with a 32px gutter. Page background white, 1px
    border, drop-shadow to suggest page elevation. No grid overlay yet
    (STORY-003-003 adds the 8px grid toggle).

  Selection + handles
    Selected container shows 8 corner+edge handles (4 corner + 4 edge).
    Text containers only render the 4 edge handles on the left/right
    (width-only resize). Table containers render 4 corner handles + per
    column vertical drag handles on the right edge of each column.
    Background containers render 4 corner handles + a focal-point crosshair
    inside the container.

  Drag-and-drop affordance
    Parts-bin leaves get a drag-source cursor + 50% opacity ghost while
    dragging. Canvas pages get a 2px dashed inset border when a drag is
    hovering over them as a valid drop target.

# Technical notes
technical_notes: |
  Library decisions
    - State: ZUSTAND. Rationale: single-user editor; no time-travel-debug
      need; ergonomic selector subscriptions that let parts-bin pane
      subscribe to records/partsBin slices while the drag-frame writes to
      a separate placements/dragGhost slice — keeping parts-bin off the
      hot path is structurally simpler in Zustand than in Redux Toolkit.
      Bundle size also smaller (~3 KB vs ~12 KB). If slice 02 surfaces
      a reason to revisit, document and switch.
    - Drag/resize: REACT-RND as primary. Konva is the documented fallback
      if react-rnd cannot satisfy the per-kind gesture variants cleanly
      (specifically table column handles + background focal-point); first
      try react-rnd with custom resize handle components.
    - SVG sanitize: DOMPURIFY. Mature, widely audited, has an explicit
      SVG profile (`USE_PROFILES: { svg: true, svgFilters: true }`).
      Alternative considered (DOMParser-strip pattern): rejected because
      enumerating all unsafe attributes is open-ended and we cannot match
      DOMPurify's coverage in a hand-rolled stripper.

  Security boundary (mandatory AC)
    `apps/visual-composer/src/editor/canvas/render/SvgRender.tsx` is THE
    one file allowed to render `rec.content.rawMarkup` into the live DOM.
    It MUST go through `src/editor/lib/sanitizeSvg.ts` (a thin DOMPurify
    wrapper) BEFORE any innerHTML / outerHTML / document.write. The
    `tests/editor/forbidden-patterns.test.ts` grep-asserts:
      1. No file in `src/editor/` (other than SvgRender.tsx) contains
         `innerHTML\s*=\s*[^;]*rawMarkup` OR `outerHTML\s*=\s*[^;]*rawMarkup`
         OR `document\.write\s*\(`.
      2. In SvgRender.tsx, every `innerHTML = ` assignment of a rawMarkup-
         derived value is preceded by a call to `sanitizeSvg(...)`.
    The test fails CI on any match. A custom ESLint rule was considered
    but rejected in favor of the grep test because it is auditable in
    30 seconds by the security-reviewer and requires no eslint-plugin
    authoring overhead.

  State store shape (drafted; refined in slice 02 planning)
    {
      records: ContainerRecord[],
      placements: Record<recordId, {
        pageIndex: number,
        x: number, y: number,
        w: number, h: number,
        focalPoint?: { x: number, y: number },  // background only; normalized 0-1
      }>,
      selection: recordId | null,
      partsBin: {
        search: string,
        collapse: Record<groupKey, boolean>,
      },
      pageCount: number,
      // Hot-path-isolated slice (subscribed only by the dragged container):
      dragGhost: { recordId: string, x: number, y: number } | null,
    }

  Performance
    Drag-frame writes must touch ONLY `dragGhost`, not `placements`.
    `placements` is updated on `onDragStop` (single write at the end).
    Parts-bin pane subscribes to `state.records` + `state.partsBin` only;
    a React render-counter test verifies the parts-bin component does NOT
    re-render during a drag-frame sequence. If this fails on a real
    selection model, fall back to React.memo + manual selector splitting
    rather than relaxing the budget.

  Re-validate STORY-003-001 perf claim (fixture-size finding)
    Slice 01 pulls a real ~30-50 KB Brad fixture and re-times extract().
    Expected headroom: 60–100× (vs the ~85-100× claimed against the
    18 KB hand-authored fixture). Record exact number in this story's
    notes block AND amend `planning/stories/STORY-003-001-*.yaml`
    `perf_envelope` so future readers see the recalibrated figure.

  BG3-audit kickoff gate
    Run real Brad CSS through:
      grep -E 'background-image\s*:\s*[^;]*,' <css-files>
    If any match, BackgroundContent needs a `layers: string[]` field
    BEFORE slice 02. The conditional slice 01b ships that contract change.
    The reason this is upfront-planned rather than reactive: changing
    BackgroundContent mid-story (after slice 03 renders the field, slice
    04 drags it, slice 06 implements focal-point on it) means rewriting
    every consumer. Upfront contract stability is cheaper than mid-story
    refactor.

