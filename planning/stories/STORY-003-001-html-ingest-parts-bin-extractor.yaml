    effort: "S"
    dependencies: []

  - slice_id: "SLICE-003-001-02"
    title: "DOM walker — text + image extractors (core)"
    description: |
      Foundation walker using sandboxed browser DOMParser. Visits every
      visible element. Emits ContainerRecord for paragraphs (<p>, <h1>–<h6>),
      images (<img>), and generic divs with text content. Skips <script>,
      <style>, hidden elements (display:none, visibility:hidden, aria-hidden).
      Computed styles captured (font-family, font-size, color, dimensions).
      Unit tests against a minimal Brad fixture.
    effort: "M"
    dependencies:
      - "SLICE-003-001-01"

  - slice_id: "SLICE-003-001-03"
    title: "Inline SVG extractor"
    description: |
      Detects <svg> nodes and captures each as a single container with
      raw SVG markup, viewBox-derived intrinsic dimensions, and aspect
      ratio. SVGs are preserved verbatim (no traversal of internal
      elements) for lossless vector preservation. Unit tests against a
      Brad chart-output fixture.
    effort: "S"
    dependencies:
      - "SLICE-003-001-02"

  - slice_id: "SLICE-003-001-04"
    title: "Table extractor"
    description: |
      Captures <table> nodes with full structural metadata: row count,
      column count, per-column natural widths (for future column-handle
      UI in STORY-003-002), cell text content, and cell computed styles.
      <thead>/<tbody>/<tfoot> distinctions preserved. Unit tests against
      a Brad table fixture.
    effort: "S"
    dependencies:
      - "SLICE-003-001-02"

  - slice_id: "SLICE-003-001-05"
    title: "Background image extractor"
    description: |
      Detects background-image CSS on container elements. Loads each
      background image (browser Image element) to read natural width
      and height. Emits as a distinct 'background' container type so
      downstream gesture logic knows to use cover-fit + focal-point
      behavior. Unit tests on a Brad fixture with backgrounds.
    effort: "S"
    dependencies:
      - "SLICE-003-001-02"

  - slice_id: "SLICE-003-001-06"
    title: "Brad-class metadata enrichment pass"
    description: |
      Separate semantic post-pass that tags ContainerRecord values with
      brad_class metadata when a known OKOA design-system class is
      detected (.heading-display, .metric-grid, .chapter-divider, and
      the full Brad class taxonomy). Implemented as enrich(records,
      {enabled: boolean}) so the 'generic-HTML fallback' mode is testable
      by passing enabled: false. Unit tests verify Brad classes are
      recognized and propagated, and that generic HTML still produces
      valid records when enrichment is disabled.
    effort: "S"
    dependencies:
      - "SLICE-003-001-02"
      - "SLICE-003-001-03"
      - "SLICE-003-001-04"
      - "SLICE-003-001-05"

  - slice_id: "SLICE-003-001-07"
    title: "Top-level extract() orchestration + integration tests"
    description: |
      Top-level extract(html: string) => ContainerRecord[] function
      that orchestrates walker (02), each specialized extractor (03–05),
