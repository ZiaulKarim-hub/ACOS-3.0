# Story overview
title: "HTML ingest + parts-bin extractor"
description: |
  Pure data layer for the visual composer. A DOM walker takes an HTML
  source string (parsed by sandboxed browser DOMParser with scripts
  disabled), traverses every visible element, and produces a typed list
  of ContainerRecord values — one per draggable unit. Each record carries
  node-type (text | image | svg | table | background), source-DOM path,
  computed styles, intrinsic dimensions, inner content, and optional
  Brad-class metadata when an OKOA design-system class is recognized.

  When this story is complete, the parser module exposes a single
  extract(html: string) => ContainerRecord[] function that downstream
  stories (canvas, polish pipeline, project file) consume as their
  authoritative input. No editor UI in this story.

# User story format
user_story: |
  As Zee (single user, OKOA Capital),
  I want to open any HTML file (especially Brad-system OKOA documents)
    and have every visible element extracted into a typed, queryable
    list of ContainerRecord values,
  So that I can hand those records to the editor canvas as drag-source
    items in STORY-003-002 without doing any parsing work there.

# Acceptance criteria
acceptance_criteria:
  - "[ ] ContainerRecord type is defined and exported from apps/visual-composer/src/parser/types.ts; downstream consumers import it without referencing any internal parser symbol"
  - "[ ] extract(html: string) returns ContainerRecord[] for any well-formed HTML input"
  - "[ ] All visible elements in a reference OKOA Brad document are captured with zero significant omissions (verified by integration test fixture)"
  - "[ ] Inline SVG, tables, and background images each produce distinct typed records (text | image | svg | table | background)"
  - "[ ] Brad-class metadata is propagated when present; with enrichment disabled, generic HTML still produces valid container records"
  - "[ ] ≥80% line coverage on the parser module via unit tests (Vitest)"
  - "[ ] Integration test: a 10-page Brad document parses in <3 seconds"
  - "[ ] Sandbox verified — no script execution from ingested HTML; XSS attempt fixture confirms scripts are skipped"
  - "[ ] Public API surface limited to extract() + ContainerRecord (+ enum members); internal walker functions not exported"

