# Technical notes
technical_notes: |
  ContainerRecord type contract (drafted in SLICE-003-001-01; refined as
  the canonical export):

    type NodeKind = 'text' | 'image' | 'svg' | 'table' | 'background';

    interface ContainerRecord {
      id: string;                        // stable, derived from source-DOM path hash
      kind: NodeKind;
      sourceDomPath: string;             // CSS-selector path back to source
      bounds: { width: number; height: number };  // intrinsic, at source render
      computedStyle: ComputedStyle;      // subset: font-family, font-size, color, etc.
      content: TextContent | ImageContent | SvgContent | TableContent | BackgroundContent;
      bradClass?: string;                // populated by enrichment pass only
    }

  Each kind has a discriminated content payload. The type union is
  exhaustive; downstream switch statements must compile-error on new kinds.

  Sandboxing:
    DOMParser('text/html') is used (scripts non-executing by default).
    Background images are loaded via new Image() in the parser host page,
    not by re-executing the source HTML. XSS sandbox test fixture
    includes <script>alert(1)</script> and verifies no execution.

  Performance:
    Walker is a single-pass O(n) DOM traversal. Background images are
    loaded in parallel via Promise.all. Brad enrichment is a single
    array.map() over the produced records (no second DOM traversal).

  Reuse / non-reuse:
    DOMParser is browser-native, no library. Vitest is the test runner
    (locked by the testing skill). No JSDOM in this story — kept native
    so the parser can run in-browser without a Node sidecar.

# Review considerations
review_focus:
  - "Type contract stability: ContainerRecord is THE epic-wide API; any change after SLICE-01 cascades. Reviewer should be paranoid about it."
  - "Sandbox correctness: XSS fixture must not execute. No fetch() or eval() in any extractor."
  - "Brad-class enrichment off-mode: explicit test that disabling enrichment still produces valid records (proves generic-HTML fallback)."
  - "Performance: integration-test perf budget (<3s on 30KB doc) is a HARD gate; flakiness implies hidden quadratic behavior."
  - "Public API surface: only extract() + ContainerRecord + NodeKind enum exported. No internal walker leaks. Reviewer verifies via the index.ts re-export list."

