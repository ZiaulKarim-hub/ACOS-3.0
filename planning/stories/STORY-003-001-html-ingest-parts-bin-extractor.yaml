      OKOA Brad reference documents (different doc types). Performance
      budget verified: a 30 KB Brad document parses in <3 seconds.
      XSS-sandbox integration test confirms scripts in ingested HTML
      are not executed. Public API frozen at extract() + ContainerRecord.
    effort: "M"
    dependencies:
      - "SLICE-003-001-02"
      - "SLICE-003-001-03"
      - "SLICE-003-001-04"
      - "SLICE-003-001-05"
