technical_notes: |
  - Page-as-canvas composition: every page is `<div class="page">` with fixed
    8.5in × 11in dimensions, page-break-after: always, overflow: hidden.
    Do NOT use flow layout — this is NOT a web page that paginates.
  - Use @page { size: Letter; margin: 0; } — zero margin. All margin work
    happens inside the .page div.
  - Cormorant italic accents: the v3 example uses phrases like "Flexible
    Capital." (with Capital italicized), "Debt Solutions." (Solutions
    italicized), "first dollar." (whole phrase italicized). The italic span
    typically carries the key noun. The decomposer picks it heuristically.
  - Photo slots are empty at this stage — Story 2 fills them. Emit with
    data-photo-slot="{semantic_tags}" placeholder.
  - Reference but do NOT copy the v3 tearsheet-v3.html — extract the
    compositional ideas, rebuild cleanly using Brad's token system.

review_focus:
  - "Verify all 22 Brad QA items enforced by the gate"
  - "Verify coffee-table rhythm rules are mechanically checked, not just documented"
  - "Verify tokens.css doesn't duplicate Brad's spec — it EXTRACTS from it; Brad remains source of truth"

effort_estimate: "L"

notes: |
  This story is the foundation. Stories 2–6 all consume its outputs. The
  emitter must be clean and composable — later stories extend it, not rewrite it.
