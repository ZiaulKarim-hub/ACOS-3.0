    - "~/.claude/skills/acos-ultimate-designer/templates/template.pptx (built once by build-template-pptx.py)"
    - "~/.claude/skills/acos-ultimate-designer/scripts/build-template-pptx.py"
    - "~/.claude/skills/acos-ultimate-designer/scripts/emit-pptx-content.py"
    - "~/.claude/skills/acos-ultimate-designer/scripts/render-pptx.sh"
    - "~/.claude/skills/acos-ultimate-designer/scripts/pptx-cleanup.py (theme-shadow strip + explicit background verification)"

technical_notes: |
  - This is the heaviest story in the epic. If time is constrained, the PDF
    path (Story 3) should be shipped first and PPTX follows.
  - data-to-pptx.py expects a specific YAML schema — read it first at
    ~/Documents/Vibe Coding/ACOS 3.0/.claude/scripts/data-to-pptx.py and
    match that schema exactly.
  - Template masters are built ONCE by build-template-pptx.py and committed
    as templates/template.pptx. Runtime generation consumes the template,
    doesn't rebuild it.
  - Cormorant Garamond embedding: python-pptx does NOT directly support font
    embedding (it's an OOXML feature that requires manipulating the .pptx
    zip directly). Attempt embedding via lxml manipulation of /ppt/fonts/.
    If that fails, degrade gracefully with a fallback note.
  - Page-as-canvas translates cleanly to PPTX: every HTML page → one slide.
    The 9 layouts map 1:1.

review_focus:
  - "Verify editability: open PPTX in PowerPoint, click on a text element, confirm it's a text frame not a rasterized image"
  - "Verify palette match: extract RGB values from the PPTX theme and verify against Brad tokens (no drift)"
  - "Verify no drop shadows on cards: the python-pptx theme bug causes default shadows; the cleanup must strip them"
  - "Verify Cormorant rendering: install or uninstall the font locally, open the PPTX, confirm fallback behavior matches expectations"

effort_estimate: "XL"

notes: |
  Biggest implementation risk in the epic. The 9 slide masters are substantial
  work — each needs positioning, sizing, text frame configuration, placeholder
  types set correctly. Plan 2-3 sessions for SLICE-004-02 alone.

  If the PPTX path becomes a blocker, there's a documented fallback in the
  epic planning discussion: "Option 1" — image-only PPTX via rendering HTML
  pages to PNG and dropping each on a blank slide. NOT preferred (not editable)
  but unblocks the end-to-end delivery if Option 2 stalls.
