title: "Coffee-table visual checklist"
objective: |
  Author templates/visual-checklist.yaml — ~25 visual criteria an opus-model
  agent will evaluate against each page screenshot of the rendered PDF/PPTX.
  Categories: page_rhythm, typography, palette, photo_quality, logo,
  cross_page_consistency, brad_inherited. Every criterion is evaluable from
  pixels alone — no reference to source HTML or markup.

acceptance_criteria:
  - "[ ] templates/visual-checklist.yaml exists, valid YAML"
  - "[ ] Contains ~25 criteria organized by category"
  - "[ ] Each criterion has fields: {id, category, description, severity_default (ERROR|WARNING), pass_condition, fail_condition, fix_instruction_template}"
  - "[ ] Category page_rhythm (~5 items): (1) ≥1 full-bleed photo per 3 content pages; (2) chapter divider between parts if content has multiple parts; (3) closing dark panel on last page; (4) photo-break pages have full-width image; (5) cover has full-bleed image"
  - "[ ] Category typography (~5 items): (1) Cormorant italic accent on every section title; (2) coral mono eyebrow in 'NN NAME' format; (3) roman page numbers 'N / total' in footer; (4) headings use serif (Cormorant), body uses sans (Plex Sans), labels use mono (Plex Mono); (5) no text is clipped by page edges or overflow"
  - "[ ] Category palette (~3 items): (1) only Brad token colors visible in output; (2) sufficient contrast on text (body vs background ≥4.5:1 WCAG AA); (3) coral accent color consistent across pages"
  - "[ ] Category photo_quality (~3 items): (1) every photo visible (not a placeholder); (2) no pixelation or blur; (3) photos fit slot (not stretched or letterboxed badly)"
  - "[ ] Category logo (~3 items): (1) OKOA logo present on every page (or appropriate subset per design); (2) white variant on dark backgrounds, dark variant on light; (3) logo scale consistent within same page role"
  - "[ ] Category cross_page_consistency (~3 items): (1) running header identical across content pages; (2) running footer identical (except page number); (3) margin/spacing identical between content pages"
  - "[ ] Category brad_inherited (~3 items): top brad-items that only manifest visually — e.g., dark panels have explicit background (not transparent), eyebrow color matches coral token, page dimensions 8.5×11 (verified by aspect ratio)"
  - "[ ] fix_instruction_template is specific + actionable: 'Add a full-bleed photo between page {N} and page {N+1}' — NOT 'fix rhythm'"
  - "[ ] Each criterion description phrased in screenshot-only language: 'A full-bleed photo occupies all 4 edges of at least one page in every 3-page window' — not 'page template is photo-break'"

