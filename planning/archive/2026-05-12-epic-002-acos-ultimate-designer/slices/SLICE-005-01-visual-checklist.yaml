  - "~/.claude/skills/acos-ultimate-designer/templates/page-templates/"
  - "/Users/zee/Documents/Vibe Coding/ACOS 3.0/.claude/skills/acos-loan-doc-generator-with-visual-verification/"

skills_recommended:
  - "frontend-coding"

flow: "slice-execution-flow"

context:
  - "This checklist is the VISUAL QUALITY FLOOR. The reviewer agent reads pages + checklist, flags ERRORs, and triggers Wigum iteration."
  - "Screenshot-only means the reviewer cannot assume knowledge of HTML source. 'Section title has italic accent' must be verifiable by looking at pixels (e.g., part of the title is rendered in italic Cormorant glyphs)."
  - "Severity: ERROR must be fixed; WARNING is a yellow flag but doesn't block. WARNINGs that persist 2 iterations escalate to ERROR on iteration 3 (severity stability rule from epic)."
  - "Do NOT import criteria from loan-doc's benchmark-criteria.yaml (hard constraint). Write these fresh for the coffee-table context."

technical_requirements:
  - "Valid YAML parseable by pyyaml.safe_load"
  - "Criterion IDs are stable: PR-01, PR-02 (page_rhythm); TY-01, TY-02 (typography); etc. — so fix-mapper can route"

testing_requirements:
  - "Unit: load the file, assert ≥20 criteria total, assert all categories present"
  - "Unit: each criterion has all required fields (id, category, description, severity_default, pass_condition, fail_condition, fix_instruction_template)"

expected_reviewers:
  - "ACOS-qa-reviewer"

effort_estimate: "M"

assigned_to: null
assigned_date: null
handoff_path: null

notes: |
  The quality of this checklist directly determines output quality. Time spent
  crafting specific, measurable criteria pays off dramatically — vague criteria
  produce vague reviewer output and bad Wigum feedback loops.
