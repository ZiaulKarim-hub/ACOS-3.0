flow: "slice-execution-flow"

context:
  - "The Wigum loop is the CORE QUALITY MECHANISM. Without it, every generated document is best-effort with hope. With it, every output is mechanically verified and iteratively improved."
  - "Loop shape is inspired by loan-doc's phase4-validate.md, but this is a NEW implementation — feedback channels are different (loan-doc doesn't have a content decomposer). Re-implement, don't import."
  - "Severity escalation solves a real failure mode: an LLM reviewer sometimes inconsistently flags the same defect as WARNING or ERROR. If a WARNING keeps appearing, it's real and the loop should force a fix."
  - "Hard ceiling of 10 is a safety valve. In practice, well-designed pipelines converge in 2-3 iterations. Ceiling of 5 with hard ceiling of 10 gives room for occasional stubborn cases."
  - "Fix-instruction routing to target stage lets the pipeline skip re-running stages that don't need to change. E.g., palette defect = re-run emitter only, not decomposer."

technical_requirements:
  - "Python 3.9+; pyyaml, subprocess (for invoking other stage scripts)"
  - "Idempotent on success: running wigum-loop.py again on a completed session is a no-op (check for existing PASS verdict)"
  - "Clean failure mode: on any exception, save all iteration state to session dir before exiting — user should be able to resume"

testing_requirements:
  - "Integration: simulate a known-bad content (e.g., only 2 pages, which breaks photo rhythm) — verify loop iterates, decomposer gets fix context, next iteration passes"
  - "Unit: severity escalation — feed mock defects with (id, page) repeated 2 iterations as WARNING, verify iteration 3 escalates to ERROR"
  - "Unit: hard ceiling — mock a never-passing pipeline, verify loop exits at iteration 10 with code 2"
  - "Integration: run against v3 input, verify loop converges in ≤3 iterations with final output visually matching v3 reference"

