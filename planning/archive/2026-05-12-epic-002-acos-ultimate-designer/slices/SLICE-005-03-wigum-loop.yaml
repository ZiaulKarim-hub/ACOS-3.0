title: "Fix-feedback mapper + Wigum loop"
objective: |
  Build scripts/wigum-loop.py — the orchestrator that wraps the full pipeline
  (Story 1 + 2 + 3|4 + 5). On each iteration: run Stories 1+2, render via
  Story 3 or 4, verify via SLICE-005-02. If PASS: return success. If FAIL:
  classify each defect (decomposer / emitter / image / template issue), emit
  fix-instructions.yaml, re-run affected stages with fix context. Enforce
  severity escalation rule. Terminate on PASS or iteration > 10.

acceptance_criteria:
  - "[ ] scripts/wigum-loop.py exists, Python 3, executable"
  - "[ ] Accepts --content (path), --format (pdf|pptx), --session-dir (path), --max-iterations (default 5), --hard-ceiling (default 10)"
  - "[ ] Main loop: for iteration in range(1, max_iterations+1): run pipeline; run render-and-verify.sh (SLICE-005-02); if PASS, break; else classify defects + build fix context + continue"
  - "[ ] Defect classifier: given a visual-defects.yaml entry, route to one of {decomposer, emitter, template, image, qa-gate}. Routing rules: photo_rhythm defect → decomposer; typography defect → emitter or template; palette defect → template (tokens.css); photo_quality defect → image (fill-photo-slots); page_dimensions → render script"
  - "[ ] Fix-context file: writes fix-instructions.yaml per iteration — {target_stage, specific_fixes: [list]}. Passed as context to the target stage when re-run."
  - "[ ] Severity escalation: a defect marked WARNING on iteration N AND iteration N+1 with same (id, page) escalates to ERROR on iteration N+2. Implementation: track (criterion_id, page) across iterations."
  - "[ ] Hard ceiling: if iteration > hard_ceiling, exit with code 2 + save all iteration outputs + print aggregated defects list + advise user to manually review"
  - "[ ] PASS termination: on PASS verdict, copy output.{pdf|pptx} to session root + exit 0"
  - "[ ] Resume support: --resume-from-iteration <N> picks up after iteration N (useful for debugging)"
  - "[ ] Verbose logging: each iteration's start, end, defect count, and fix targets logged to session/wigum.log"

dependencies:
  slices:
    - slice_id: "SLICE-005-02"
      what_it_provides: "render-and-verify.sh producing visual-defects.yaml"
      status: "complete"
    - slice_id: "SLICE-001-06"
