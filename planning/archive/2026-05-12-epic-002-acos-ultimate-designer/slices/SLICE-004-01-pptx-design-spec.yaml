  - "/Users/zee/Documents/Vibe Coding/ACOS 3.0/.claude/skills/acos-loan-doc-generator-with-visual-verification/templates/"

skills_recommended:
  - "frontend-coding"

flow: "slice-execution-flow"

context:
  - "EMU (English Metric Units): 914400 per inch. 13.33in wide = 12192000 EMU. This is OOXML's native unit."
  - "The design-spec is the BRIDGE between Brad's design language (web tokens + classes) and python-pptx's expectation (RGB tuples + font names + layout params). Every token in tokens.css needs a translation row here."
  - "data-to-pptx.py's expected schema is the ground truth — this file has to match what the script reads. Non-negotiable to inspect the script first."
  - "If a Brad token has a clamp() font-size, pick the nominal (mid-point) pt size for PPTX — PPTX doesn't support responsive sizing."

technical_requirements:
  - "Valid YAML parseable by pyyaml.safe_load"
  - "RGB hex values are 6-character lowercase"
  - "EMU values are integers (not floats)"

testing_requirements:
  - "Unit: pyyaml-load the file, assert no errors"
  - "Unit: every token name present in tokens.css also appears in design-spec theme_colors"
  - "Integration: pass design-spec + a minimal content YAML to data-to-pptx.py, assert it runs without schema errors (even if output is minimal)"

expected_reviewers:
  - "ACOS-qa-reviewer"

effort_estimate: "M"

