title: "PPTX design-spec schema"
objective: |
  Define templates/pptx-design-spec.yaml — the PPTX-native translation of Brad's
  token system. Captures slide_dimensions (EMU), theme_colors (Brad token names
  mapped to RGB hex), font_scheme (heading/body/mono family + fallback chains),
  and background_fills per layout type (surface-white, surface-warm, surface-ink,
  surface-sage, surface-navy). Must be consumable by loan-doc's data-to-pptx.py.

acceptance_criteria:
  - "[ ] FIRST: read /Users/zee/Documents/Vibe Coding/ACOS 3.0/.claude/scripts/data-to-pptx.py to determine its expected design-spec schema. Match that schema exactly — this slice's output is INPUT to that script."
  - "[ ] templates/pptx-design-spec.yaml exists, valid YAML"
  - "[ ] slide_dimensions field: {width_emu: <int>, height_emu: <int>} — decide 13.33×7.5 widescreen OR 10×7.5 standard based on content density (lean toward widescreen unless v3 reference suggests standard)"
  - "[ ] theme_colors block maps every Brad token used in page-templates to {name, rgb_hex, comment}. Examples: ink-100: 0A0A0A, coral-accent: E85D45, sage-50: A8B5A0, etc. — ALL tokens used in page-templates must be present"
  - "[ ] font_scheme block: heading: {family: 'Cormorant Garamond', fallback_chain: ['Georgia', 'serif']}, body: {family: 'IBM Plex Sans', fallback_chain: ['Helvetica', 'Arial', 'sans-serif']}, mono: {family: 'IBM Plex Mono', fallback_chain: ['Courier New', 'monospace']}"
  - "[ ] background_fills block: one entry per layout type — each maps to a Brad surface token"
  - "[ ] Header comment in file: '# Translation of acos-document-design-brad tokens to PPTX format. Source of truth: acos-document-design-brad/SKILL.md + tokens.css'"
  - "[ ] No design content from loan-doc is referenced or imported (hard constraint from epic)"

dependencies:
  slices:
    - slice_id: "SLICE-001-02"
      what_it_provides: "tokens.css (token values to translate)"
      status: "complete"

