context:
  - "The v3 tearsheet-v3.html at /Users/zee/Desktop/Private Credit Capabilities/v3/ is the gold-standard composition reference. READ it to understand layout decisions; do NOT copy its code verbatim."
  - "Every page is a canvas, not a flowable web page. Fixed dimensions; no media queries; no responsive behavior."
  - "Cormorant italic accents carry the key noun: 'Flexible Capital.' (Capital italicized), 'Debt Solutions.' (Solutions italicized). The template gets an {{italic_accent_phrase}} placeholder; the decomposer (SLICE-001-04) picks the word."
  - "Photo slots are empty at this stage — use data-photo-slot='{semantic_tags}' as a placeholder attribute. SLICE-002-04 fills them."

technical_requirements:
  - ".page div fixed at 8.5in × 11in with page-break-after: always"
  - "overflow: hidden on .page to prevent runaway content"
  - "Every <div>, <section>, <article> containing text must have background-color set explicitly (even if white)"
  - "Each template must render standalone when wrapped in <html><body>...</body></html> with tokens.css loaded — no dependencies on surrounding pages"

testing_requirements:
  - "Manual: open each template wrapped in a minimal HTML shell in Chrome, verify layout is correct and dimensions are 8.5×11in at 100% zoom"
  - "Manual: render template via Puppeteer with @page {size: Letter; margin: 0;} and verify edge-to-edge page"
  - "Manual: compare visual hierarchy to the corresponding page type in v3 PDF reference"

expected_reviewers:
