title: "Coffee-table page template library (9 templates)"
objective: |
  Build 9 self-contained HTML page templates in templates/page-templates/, each
  a single .page div with fixed 8.5×11in dimensions and its own art-directed
  layout. Templates: cover, two-column-narrative, metric-grid, timeline,
  chapter-divider, product-detail, portfolio-grid, photo-break, closing.
  Templates reference tokens.css from SLICE-001-02; no cross-page dependencies.

acceptance_criteria:
  - "[ ] 9 files exist in templates/page-templates/: cover.html, two-column-narrative.html, metric-grid.html, timeline.html, chapter-divider.html, product-detail.html, portfolio-grid.html, photo-break.html, closing.html"
  - "[ ] Each template is a standalone HTML fragment — a single <div class='page'> with 8.5in × 11in dimensions, page-break-after: always, overflow: hidden"
  - "[ ] cover.html: full-bleed background image + dark scrim + oversized Cormorant title with italic accent span + coral mono eyebrow + bottom metadata bar"
  - "[ ] two-column-narrative.html: eyebrow + section title (with italic accent) + italic pull-quote + two body columns"
  - "[ ] metric-grid.html: 3×3 grid of cards, each card has coral accent bar + mono label + large Cormorant value + small body description"
  - "[ ] timeline.html: 5 rows with coral step number + day range + italic subhead + body"
  - "[ ] chapter-divider.html: full-bleed image + 'PART N' eyebrow + oversized italic-accent title + subtitle"
  - "[ ] product-detail.html: left column product names + right column descriptions separated by <hr> dividers"
  - "[ ] portfolio-grid.html: 2×2 hero-photo cards with eyebrow + title + location + body + stat grid per card"
  - "[ ] photo-break.html: full-width photo band with caption label bottom-left"
  - "[ ] closing.html: two-column summary + dark topographic panel + dark footer with OKOA logo (white variant)"
  - "[ ] Every text container has an explicit background-color style (Brad's Explicit Background Rule)"
  - "[ ] All colors reference tokens.css via var(--token-name); no raw hex values in templates"
  - "[ ] Each template has template-variable placeholders in a consistent syntax (e.g., {{title}}, {{eyebrow}}, {{photo_slot:cover_image|tags=city,sunset,architecture}}) that the emitter (SLICE-001-05) will substitute"

