notes: |
  This is the largest single slice in the epic. Each template needs careful
  attention to typography, spacing, color choice, photo slot positioning.
  Budget real time — do NOT rush. If a template's aesthetic misses the mark,
  every downstream output will carry the defect.

  Template-variable syntax proposal: use {{var_name}} for simple substitution
  and {{photo_slot:slot_name|tags=tag1,tag2}} for photo slots. Keep it parseable
  by a simple regex in SLICE-001-05's emitter.
