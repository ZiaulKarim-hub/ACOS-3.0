skills_recommended:
  - "backend-coding"

flow: "slice-execution-flow"

context:
  - "The python-pptx default theme applies subtle drop shadows via theme1.xml's effectStyleLst. Brad's design has no shadows on cards. Every PPTX run needs the shadow-strip cleanup."
  - "Cormorant Garamond embedding is a known sharp edge — python-pptx has no API for it. Direct OOXML manipulation via zipfile + lxml is the only path. If /Library/Fonts/ doesn't have the TTF, graceful degrade: note in closing slide that 'PPTX designed for Cormorant Garamond; install from Google Fonts for proper rendering.'"
  - "Reuse of data-to-pptx.py is at the SCRIPT level — we invoke it as a subprocess, don't import or modify it. This keeps the dependency surface small and respects the 'reuse, don't enhance loan-doc' constraint."
  - "Explicit background check: python-pptx's default shape has fill.type=None, which in PowerPoint renders as whatever the theme background is. Brad's rule (explicit background on every text container) requires .solid() with actual color."

technical_requirements:
  - "Python 3.9+; python-pptx, lxml, zipfile (stdlib)"
  - "bash 4+"
  - "pptx-cleanup.py uses file atomicity: work on a copy, swap on success"
  - "Never modify data-to-pptx.py (strictly read/invoke only)"

testing_requirements:
  - "Unit: pptx-cleanup.py on a test pptx with drop shadows, assert shadows removed after"
  - "Unit: cleanup on a pptx with bare text frames (no fill), assert shape.fill.type == MSO_FILL.SOLID after"
  - "Integration: full render-pptx.sh on sample content, open in PowerPoint, click a text element, confirm it's editable (not a rasterized image)"
  - "Integration: compare output PPTX theme colors to pptx-design-spec.yaml — no drift"

expected_reviewers:
  - "ACOS-qa-reviewer"
  - "ACOS-integration-reviewer"

effort_estimate: "L"

