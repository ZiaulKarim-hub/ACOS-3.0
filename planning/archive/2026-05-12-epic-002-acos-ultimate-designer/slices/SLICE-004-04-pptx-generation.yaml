title: "PPTX generation + post-build cleanup"
objective: |
  Build scripts/render-pptx.sh that invokes loan-doc's data-to-pptx.py with the
  content YAML (from SLICE-004-03) + design-spec + template + output path, then
  applies post-generation cleanup: (a) strip python-pptx default theme shadows,
  (b) ensure every text shape has explicit fill.solid() background, (c) attempt
  Cormorant Garamond font embedding via OOXML /ppt/fonts/ manipulation (with
  graceful fallback if embedding fails).

acceptance_criteria:
  - "[ ] scripts/render-pptx.sh exists, bash, executable"
  - "[ ] scripts/pptx-cleanup.py exists, Python 3, executable — invoked by render-pptx.sh after data-to-pptx.py"
  - "[ ] render-pptx.sh invokes: python3 /Users/zee/Documents/Vibe Coding/ACOS 3.0/.claude/scripts/data-to-pptx.py --content <content.yaml> --design-spec <design-spec.yaml> --template <template.pptx> --output <output.pptx>"
  - "[ ] On data-to-pptx.py success, render-pptx.sh calls pptx-cleanup.py --pptx <output.pptx>"
  - "[ ] pptx-cleanup.py theme-shadow strip: open the pptx zip, modify theme1.xml to remove outerShdw from effectStyleLst, reset effectRef idx=0 — same fix as loan-doc's phase3-design.md:48-68"
  - "[ ] pptx-cleanup.py background verification: iterate every slide, every shape; if shape has a text frame and shape.fill.type is None, call shape.fill.solid() with default background (white or the layout's surface token)"
  - "[ ] pptx-cleanup.py Cormorant embedding attempt: locate Cormorant Garamond font file (check /Library/Fonts/, ~/Library/Fonts/ on macOS, /usr/share/fonts on Linux, else use fontconfig); if found, inject into /ppt/fonts/ subdir of the pptx zip with font1.fntdata reference in presentation.xml; if not found or injection fails, write a clear advisory note as a small text frame on the final (closing) slide"
  - "[ ] render-pptx.sh exits 0 on full success, non-zero on any failure"
  - "[ ] --skip-cleanup flag for debugging: produces raw data-to-pptx.py output without post-processing"

