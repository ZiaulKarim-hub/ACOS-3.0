skills_recommended:
  - "backend-coding"
  - "security-audit"

flow: "slice-execution-flow"

context:
  - "Both APIs require attribution. v3 ATTRIBUTION.md at /Users/zee/Desktop/Private Credit Capabilities/v3/ATTRIBUTION.md shows the canonical attribution format — match it."
  - "Remote image downloads MUST hit local disk before Puppeteer renders — networkidle0 + remote image loads = flaky render timing."
  - "Unsplash first because image quality is consistently higher; Pexels as backup when Unsplash query returns nothing."
  - "API keys missing is a common user state. Skill should warn + continue; the visual gate will catch empty slots downstream."

technical_requirements:
  - "Python 3.9+; requests (for HTTP), hashlib (stdlib)"
  - "HTTPS only for API calls + image downloads (never http://)"
  - "User-Agent header identifies the skill: 'acos-ultimate-designer/0.1'"
  - "Never log API keys; log requests with [REDACTED] substituted"
  - "Handle timeouts gracefully: 30s connect, 60s read; on timeout, try next provider"

testing_requirements:
  - "Unit (mocked): feed query 'mountain sunset', assert call order is Unsplash → Pexels"
  - "Unit (mocked): API returns 401, assert function falls through to next provider"
  - "Unit: unset both keys, assert empty_slot response + warning (no crash)"
  - "Integration (live, opt-in): one real call per provider to verify shape — keep behind a TEST_FETCH_LIVE=1 guard"

expected_reviewers:
  - "ACOS-qa-reviewer"
  - "ACOS-security-reviewer"

effort_estimate: "M"

assigned_to: null
assigned_date: null
handoff_path: null

notes: |
  Two security concerns: (1) never log API keys; (2) only trust image URLs
  returned by the APIs (don't follow redirects to arbitrary hosts). Both
  Unsplash and Pexels serve from their own CDNs, so restrict downloads to
  *.unsplash.com and *.pexels.com hosts.
