title: "Unsplash/Pexels fallback fetcher"
objective: |
  Build scripts/fetch-image-fallback.py that, given a semantic query string,
  calls Unsplash API first and Pexels API second, downloads the top landscape-
  oriented result (≥2000px wide) to the session image cache, and returns
  {local_path, source, photographer, url} for attribution. Degrades gracefully
  if API keys are unset or both APIs fail.

acceptance_criteria:
  - "[ ] scripts/fetch-image-fallback.py exists, Python 3, executable"
  - "[ ] Reads UNSPLASH_ACCESS_KEY and PEXELS_API_KEY from env"
  - "[ ] Accepts --query (str), --orientation (default 'landscape'), --min-width (default 2000), --cache-dir (path)"
  - "[ ] Calls Unsplash /search/photos API first; if no results or key missing, calls Pexels"
  - "[ ] Downloads top result's full-resolution URL to {cache_dir}/<hash-of-url>.jpg"
  - "[ ] Returns JSON on stdout: {local_path, source: 'unsplash'|'pexels', photographer, photographer_url, image_url, query, attribution_string}"
  - "[ ] If both APIs fail or both keys missing: logs warning to stderr, returns {action: 'empty_slot', reason: <cause>}, exit code 0 (skill wizard decides whether to fail)"
  - "[ ] Respects API rate limits (Unsplash: 50/hour demo, 5000/hour production; Pexels: 200/hour free)"
  - "[ ] Caches query → URL mapping so identical queries within a session don't hit the API twice"

dependencies:
  slices:
    - slice_id: "SLICE-002-01"
      what_it_provides: "manifest-schema (shared attribution field shape)"
      status: "complete"

files_allowed:
