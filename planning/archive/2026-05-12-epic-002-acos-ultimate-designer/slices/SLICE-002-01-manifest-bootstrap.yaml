title: "Manifest schema + bootstrap script"
objective: |
  Define the manifest schema (templates/manifest-schema.yaml) and build
  scripts/bootstrap-manifest.py that scans a user-supplied brand-asset directory,
  hashes each image, spawns Claude vision agents in parallel to describe +
  semantically tag each image, and writes manifest.yaml (keyed by file hash).
  Idempotent — re-running only processes new or changed files.

acceptance_criteria:
  - "[ ] templates/manifest-schema.yaml defines entry fields: file_hash (sha256), filename, path, description (2-3 sentences), semantic_tags (list), deal_match (optional — named entity if image depicts a specific property/location), aesthetic_tags (mood/colors), user_rejected_for (list of {context, reason, timestamp}), date_analyzed, source (brand|unsplash|pexels)"
  - "[ ] scripts/bootstrap-manifest.py exists, Python 3, executable"
  - "[ ] Globs supported image formats (.jpg, .jpeg, .png, .webp, .heic) from target directory recursively"
  - "[ ] For each image, computes sha256 hash from file contents — this is the manifest key"
  - "[ ] Reads existing manifest at {asset_dir}/.acos-ultimate-designer-manifest.yaml; reuses existing entries by hash (idempotent)"
  - "[ ] For new/changed files only, spawns Task(vision_agent, model=sonnet) with the image + a tagging prompt template"
  - "[ ] Tagging prompt: 'Describe this image in 2-3 sentences. Provide tags for: subject, setting, mood, primary colors, real-estate-related tags (architecture/landscape/construction/portfolio/etc.), and any identifiable named entity (property name, location).' Returns structured YAML with description + all tag categories"
  - "[ ] Supports parallel vision agent spawns (N at a time, default 5) via asyncio or subprocess.Pool — respects API rate limits"
  - "[ ] Writes updated manifest atomically (write to .tmp, rename) — never leaves manifest in partial state"
  - "[ ] --force flag reprocesses all images even if hash unchanged"
  - "[ ] --dry-run flag lists what would be processed without making vision calls"
  - "[ ] Reports total cost estimate at end: N new images × ~$0.01 per vision call"

dependencies:
  slices: []

files_allowed:
  - "~/.claude/skills/acos-ultimate-designer/templates/manifest-schema.yaml"
  - "~/.claude/skills/acos-ultimate-designer/scripts/bootstrap-manifest.py"

files_prohibited:
  - "~/.claude/skills/acos-ultimate-designer/templates/page-templates/"
  - "~/.claude/skills/acos-ultimate-designer/scripts/match-image.py"
  - "~/.claude/skills/acos-ultimate-designer/scripts/fetch-image-fallback.py"

skills_recommended:
  - "backend-coding"

flow: "slice-execution-flow"

context:
  - "The manifest lives INSIDE the asset directory as .acos-ultimate-designer-manifest.yaml (hidden), NOT inside the skill. This lets users version-control their asset set and manifest together."
  - "Vision call is the ONE cost-sensitive operation. Once per image, cached by hash. A user with 100 brand photos pays ~$1 total, then never again unless they add new photos."
  - "Named entity extraction matters: if an image is of 'Ascent Park City', the tag should capture 'Ascent Park City' so semantic match can prefer it when content mentions Ascent."
  - "v3 ATTRIBUTION.md at /Users/zee/Desktop/Private Credit Capabilities/v3/ATTRIBUTION.md shows how credits are tracked — manifest is the source for generating that file in SLICE-002-04."

technical_requirements:
  - "Python 3.9+; pyyaml, aiohttp or asyncio, hashlib (stdlib)"
  - "Vision agent spawn via Task tool from Claude skill — but this script is Python, so actual spawn happens via a Bash wrapper OR a Python helper that shells out to claude via CLI. Decide approach and document in script header."
  - "Atomic writes: use tempfile.NamedTemporaryFile + os.rename, never partial writes"
  - "Respect UNSPLASH_ACCESS_KEY and PEXELS_API_KEY env vars only for SLICE-002-03 — NOT needed here"

testing_requirements:
  - "Unit: feed directory with 3 images, verify manifest has 3 entries with correct hashes"
  - "Unit: re-run bootstrap, verify zero new vision calls (idempotent)"
  - "Unit: modify one image, re-run, verify only that entry is reprocessed (hash changed)"
  - "Integration: run against /Users/zee/Desktop/Private Credit Capabilities/v3/images/ (~30 images), verify manifest is valid + costs < $1"

expected_reviewers:
  - "ACOS-qa-reviewer"
  - "ACOS-security-reviewer"

effort_estimate: "M"

