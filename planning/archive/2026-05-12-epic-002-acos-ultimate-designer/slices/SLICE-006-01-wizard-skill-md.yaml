title: "Phase 0 wizard in SKILL.md"
objective: |
  Author the full SKILL.md protocol — frontmatter, Purpose, Phase 0 (wizard
  with quick/detailed modes), Phase 1–5 dispatch instructions, status/resume
  commands. Use AskUserQuestion for option-based prompts (format, doc type);
  use text prompts for paths. Store all inputs in
  .acos/ultimate-designer/sessions/{session_id}/manifest.yaml. Replaces
  the SKILL.md stub from SLICE-001-01 with the full specification.

acceptance_criteria:
  - "[ ] ~/.claude/skills/acos-ultimate-designer/SKILL.md contains: (A) frontmatter with valid name, description, user-invocable: true, allowed-tools list including Task/AskUserQuestion/Bash/Read/Write/Edit; (B) Purpose section (2-3 sentences on what the skill does); (C) Phase 0 wizard protocol; (D) Phase 1–5 dispatch instructions referencing phases/phase1-html.md etc.; (E) Status and Resume subcommands"
  - "[ ] Phase 0 wizard — Quick mode (3 prompts): (1) content source path; (2) output format (pdf/pptx/both — AskUserQuestion); (3) brand-asset directory path (text input, optional — use '' for Unsplash-only)"
  - "[ ] Phase 0 wizard — Detailed mode (adds 3 more prompts): (4) document type (editorial/technical/executive — AskUserQuestion, maps to Brad's doc-type templates); (5) special instructions (text input, optional); (6) iteration ceiling override (optional, defaults to 5)"
  - "[ ] Mode selection: first prompt asks 'Quick wizard (3 prompts) or Detailed (6 prompts)?' via AskUserQuestion"
  - "[ ] Session ID format: YYYYMMDD-HHMMSS-<slug> where slug is derived from content title or user-supplied"
  - "[ ] Session directory: .acos/ultimate-designer/sessions/{session_id}/ created at wizard start; manifest.yaml written with all collected inputs"
  - "[ ] Phase dispatch table: each phase lists either (a) inline Bash invocation of the right script with session paths, or (b) Task(agent_name, model) spawn"
  - "[ ] Status subcommand (/acos-ultimate-designer status): lists all sessions with {session_id, doc_type, format, current_phase, verdict (if complete), iteration_count}"
  - "[ ] Resume subcommand (/acos-ultimate-designer resume [session_id]): reads last-completed phase, picks up at next"

