context:
  - "SKILL.md is a prompt, not code. Redundancy aids LLM attention; raw hex values in context beat var() indirection; adversarial checklists pattern well in execution prompts."
  - "Design-library exclusion is enforced here too: Phase 1–5 instructions MUST NOT mention 'design-library', 'design-patterns.yaml', 'benchmark-criteria.yaml'. The epic's acceptance criterion requires this to grep-clean."
  - "AskUserQuestion is for bounded choices (format: pdf/pptx/both). Plain text for open-ended (paths, instructions). Don't force multiple-choice for free-form input."
  - "Wizard UX target: ≤5 prompts in Quick mode, ≤10 in Detailed. Loan-doc's wizard is longer than it needs to be; this skill's wizard should be tighter."

technical_requirements:
  - "SKILL.md has valid YAML frontmatter between --- markers"
  - "Every phase dispatch is specific: exact script path, exact args, exact Task() spawn (if used), model specified where required (e.g., 'model: opus' in Phase 4 visual verifier)"
  - "Session directory creation is mkdir -p, idempotent"

testing_requirements:
