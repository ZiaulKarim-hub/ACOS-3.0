  - "Manual: verify Detailed mode asks 6 prompts total (mode selector doesn't count)"
  - "Manual: grep SKILL.md for 'design-library' — must return empty"
  - "Manual: verify Phase 4 dispatch explicitly pins opus model (not inherited)"

