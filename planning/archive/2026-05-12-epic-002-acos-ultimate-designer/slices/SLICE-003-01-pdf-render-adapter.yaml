flow: "slice-execution-flow"

context:
  - "The v3 render.mjs at /Users/zee/Desktop/Private Credit Capabilities/.build/render.mjs is the proven reference implementation. It produced the v3 PDF we're trying to match. Copy its pattern exactly — this is not a place to innovate."
  - "document.fonts.ready is non-optional. Without it, Cormorant Garamond doesn't load in time, Chrome falls back to Georgia, and the aesthetic silently collapses."
  - "networkidle0 with 120s timeout handles image-heavy pages. 30s default is too tight for 20+ images."
  - "Do NOT reuse loan-doc's pdf-styles.css — that's flow-layout CSS for a different output style. This pipeline emits its own page-as-canvas CSS inline."

technical_requirements:
  - "Node 18+; puppeteer already installed via loan-doc skill's package.json — reuse that node_modules (don't duplicate install)"
  - "Script accepts file:// URLs or absolute paths for input HTML"
  - "120s timeout on page.goto(); 180s total script timeout"
  - "Stderr messages are actionable: 'network timeout' vs 'fonts.ready unavailable' vs 'goto failed' distinguished"

testing_requirements:
  - "Unit: render a 1-page HTML, verify PDF has 1 page at exactly 8.5×11in"
  - "Unit: render HTML with Cormorant text, open PDF in Preview, verify font name is 'Cormorant Garamond' not 'Georgia'"
  - "Integration: render v3-shape HTML, verify file size within 20% of v3 reference (26MB)"

