title: "Puppeteer PDF render adapter"
objective: |
  Build scripts/render-pdf.sh that renders the emitted HTML to PDF using
  Puppeteer with tear-sheet-appropriate settings: margin=0, format=Letter,
  printBackground=true, preferCSSPageSize=true, emulateMediaType='print',
  waitUntil='networkidle0', and an explicit document.fonts.ready await.
  Reuses loan-doc's html-to-pdf.js if its flags suffice; else a dedicated
  inline render-pdf.mjs matching v3's render.mjs pattern.

acceptance_criteria:
  - "[ ] First: read ~/Documents/Vibe Coding/ACOS 3.0/.claude/scripts/html-to-pdf.js and determine whether its flag set supports: margin=0, printBackground=true, preferCSSPageSize=true, fonts.ready await, networkidle0 timeout override"
  - "[ ] If html-to-pdf.js suffices: scripts/render-pdf.sh wraps it with required args + session HTML path + output path"
  - "[ ] If html-to-pdf.js does NOT suffice: scripts/render-pdf.mjs is a new Puppeteer script that mimics /Users/zee/Desktop/Private Credit Capabilities/.build/render.mjs exactly (page.emulateMediaType('print') → page.goto(url, {waitUntil:'networkidle0', timeout:120000}) → page.evaluate(async()=>{if(document.fonts&&document.fonts.ready)await document.fonts.ready}) → page.pdf({format:'Letter', printBackground:true, preferCSSPageSize:true, margin:{top:0,right:0,bottom:0,left:0}})) and render-pdf.sh wraps IT"
  - "[ ] Script accepts --input (HTML path), --output (PDF path), --timeout (default 120s)"
  - "[ ] Exits 0 on success, non-zero with stderr message on failure"
  - "[ ] Renders the v3-style input HTML at file size 20-30MB (consistent with v3 reference PDF of 26MB for 12 pages)"
  - "[ ] All fonts (Cormorant Garamond, IBM Plex Sans, IBM Plex Mono) load before snapshot — verified by opening output in Preview and checking font names"

