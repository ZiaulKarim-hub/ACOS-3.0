context:
  - "Pure wiring — no new business logic. Every script/agent this phase invokes was built in earlier slices."
  - "Parallel execution within phases: Phase 3 with format=both runs render-pdf.sh and (emit-pptx + render-pptx) in parallel via bash wait or & control."
  - "Session state shape: session_dir/manifest.yaml holds user inputs; session_dir/phase1/, phase2/, etc. hold intermediate outputs; session_dir/output.pdf + output.pptx are final outputs."
  - "Integration friction is likely here. Expect to discover that one script needs an argument it wasn't designed for (e.g., emit-pptx-content.py needs a page-plan path that SLICE-004-03 assumed was hardcoded). Budget iteration."

technical_requirements:
  - "Phase files are markdown with explicit bash/Task blocks — agents reading the phase file can execute directly"
  - "Session dir paths are always passed explicitly — no implicit cwd assumptions"
  - "Fail-fast: set -e in any bash blocks; explicit exit-code checks in multi-step sequences"

testing_requirements:
  - "Manual integration: run /acos-ultimate-designer with v3-input-sample.yaml + pdf format + v3 asset dir → expect clean phase-by-phase output + PASS verdict in ≤3 Wigum iterations"
  - "Manual integration: run with format=both → expect both output.pdf AND output.pptx produced"
  - "Manual integration: run with empty asset dir + no API keys → expect brand-only degrade warning + visible empty-slot placeholders in output (visual gate catches)"

