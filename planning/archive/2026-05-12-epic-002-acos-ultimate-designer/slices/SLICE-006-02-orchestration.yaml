title: "End-to-end orchestration"
objective: |
  Wire Phase 1–5 in SKILL.md to dispatch sequentially, passing session_id +
  manifest_path between phases. Each phase is either (a) an inline Bash
  invocation of the right script, or (b) a Task(agent) spawn for model-tier-
  appropriate work. Phase 1-2 can run internally-parallel; Phase 3/4 run
  conditionally on output_format; Phase 5 is unconditional. Wigum loop in
  Phase 5 re-enters Phase 1 with fix-instructions.yaml.

acceptance_criteria:
  - "[ ] Phase 1 dispatch (phase1-html.md): runs decompose-content.py → html-emit.py → html-qa-gate.py sequentially; exits on QA gate failure (with fix context if Wigum-triggered)"
  - "[ ] Phase 2 dispatch (phase2-images.md): runs bootstrap-manifest.py (if asset dir exists + manifest stale) → fill-photo-slots.py; if asset dir is empty/unset, skips manifest and uses fetch-image-fallback.py only"
  - "[ ] Phase 3 dispatch (phase3-convert.md): conditional on format — if pdf or both, runs render-pdf.sh; if pptx or both, runs emit-pptx-content.py + render-pptx.sh; parallel where possible"
  - "[ ] Phase 4 dispatch (phase4-verify.md): runs render-and-verify.sh PER output format; spawns visual-reviewer Task with model='opus' hardcoded; on FAIL, invokes wigum-loop.py control"
  - "[ ] Phase 5 dispatch (in SKILL.md final section): runs wigum-loop.py which wraps 1-4; on PASS, displays final output paths to user"
  - "[ ] Inter-phase state: each phase reads session/manifest.yaml for inputs, writes phase-specific outputs to session/<phase_name>/"
  - "[ ] Fail-fast behavior: any phase exit != 0 terminates orchestration with the phase name + exit code, saves state to session/FAILED_PHASE.txt"
  - "[ ] Graceful degradation: missing API keys (UNSPLASH/PEXELS) → log warning, continue in brand-only mode; font embedding failure → log warning, continue with fallback note; render-and-verify partial failure (some PNGs missing) → abort"

dependencies:
