    rationale: "Visual verification needs actual output files to render and review."
  - phase: 5
    stories: ["STORY-006"]
    rationale: "End-to-end wiring and integration test happen last."

technical_notes: |
  Architectural key decisions locked in during planning:

  1. PAGE-AS-CANVAS COMPOSITION (not flow-layout). Matches v3 example.
     - @page { size: Letter; margin: 0; }
     - Each page is an 8.5×11in fixed-size .page div with page-break-after: always
     - Each .page has its own art-directed layout template
     - This differs from acos-loan-doc-generator's pdf-styles.css (flow-layout)
     - 9 page templates: cover, two-column-narrative, metric-grid, timeline,
       chapter-divider, product-detail, portfolio-grid, photo-break, closing

  2. IMAGE SOURCING: Brand-first with Unsplash/Pexels fallback.
     - Manifest auto-generated from a user-supplied brand-asset directory
     - Claude vision describes each image once, writes description + tags
       to manifest.yaml keyed by file hash
     - Semantic match: content slot tags ↔ manifest entry tags (LLM-scored)
     - Fallback: Unsplash/Pexels API with content-derived query
     - User feedback ("swap this image") writes user_rejected: [page:5] flags
       to prevent re-pick

  3. DESIGN-LIBRARY EXCLUSION: Zero loan-doc design-library content loads.
     - Agent prompts in this skill NEVER read design-library/index.yaml
     - Agent prompts in this skill NEVER read *design-patterns.yaml or
       *benchmark-criteria.yaml from loan-doc extractions
     - Style source: acos-document-design-brad/SKILL.md (read by the emitter
       agent) + locally-maintained tokens.css + coffee-table template library
     - Brad's skill is referenced, not copied — the new skill reads it at runtime

  4. REUSE FROM loan-doc skill (library-level, NOT template-level):
     - Scripts: html-to-pdf.js, html-to-docx.py (optional), render-doc-audit.py,
       check-pdf-layout.py, data-to-pptx.py
     - Patterns: Wigum loop shape, iteration ceiling, visual checklist structure
     - NOT reused: design library, benchmark criteria, doc-type-catalog,
       recommendation matrix, phase orchestration agents

  5. PPTX IS HARDER THAN PDF. Build PDF path first (STORY-003), get it working
     end-to-end with visual verification, then tackle PPTX (STORY-004). The
     PPTX design-spec translation is substantial work; having a working PDF
     to compare against reduces risk.

  6. VISUAL VERIFICATION MODEL: Pin to opus for screenshot review. Subtle
     coffee-table defects (editorial spacing, photo rhythm, typographic
     italic accents) need vision-model acuity. Do not inherit session-level
     model config for this specific step.

