title: "acos-ultimate-designer — Coffee-table Brad-styled HTML → PDF/PPTX skill"
description: |
  A new user-invocable skill that produces institutional-grade documents in
  either PDF or PPTX from arbitrary user-supplied content. Step 1 generates
  HTML using acos-document-design-brad's OKOA design system in the coffee-table
  book aesthetic demonstrated by the v3 Private Credit Capabilities reference
  at /Users/zee/Desktop/Private Credit Capabilities/v3/. Step 2 converts that
  HTML (and a parallel structured content YAML) to the requested output format
  using the conversion machinery of acos-loan-doc-generator-with-visual-verification
  — but WITHOUT loading any of that skill's saved design-library entries. Brad's
  spec is the sole style source. Images are sourced from a brand-asset directory
  (auto-bootstrapped manifest via Claude vision), with Unsplash/Pexels fallback
  for content not matching any brand asset. Visual verification runs on every
  output via screenshot review + Wigum loop.

value_proposition: |
  User already produces investor-grade documents by hand-composing HTML against
  Brad's system (v3 Private Credit Capabilities took this shape). This skill
  automates that workflow so ANY content can be transformed into the same
  aesthetic without manual art direction each time. It also extends the
  workflow to PPTX so the same visual identity can land in slide presentations.

acceptance_criteria:
  - "[ ] Skill scaffold exists at ~/.claude/skills/acos-ultimate-designer/ with SKILL.md, phases/, templates/, scripts/"
  - "[ ] Skill is user-invocable via /acos-ultimate-designer and Claude-invocable via semantic match"
  - "[ ] Running the skill with user content produces a PDF visually comparable to /Users/zee/Desktop/Private Credit Capabilities/OKOA Capital - Private Credit Capabilities (v3 — expanded).pdf — same fonts, same colors, same coffee-table rhythm, full-bleed cover, chapter dividers, mid-content photo bands"
  - "[ ] Running the skill with the same content but format=pptx produces an editable PPTX (not image-only slides) using the same design language, via Option 2 (translate Brad tokens → PPTX design-spec + data-to-pptx.py)"
  - "[ ] Zero content from acos-loan-doc-generator-with-visual-verification's design-library/index.yaml is loaded — verified by inspecting agent prompts"
  - "[ ] Brand-asset manifest is auto-generated on first run using Claude vision; user can drop new images into the asset directory and they're picked up on next run without hand-editing the manifest"
  - "[ ] If no brand asset matches a content slot, Unsplash/Pexels API supplies an HQ image matched semantically to section content"
  - "[ ] HTML QA gate runs before conversion — rejects output that violates Brad's QA checklist or coffee-table composition rules (missing photo break rhythm, missing chapter divider, wrong typography)"
  - "[ ] Visual verification runs after conversion — every page rendered at 200 DPI PNG, agent reads each screenshot, any ERROR-severity defect triggers Wigum loop back to step 1 (ceiling: 5 iterations, hard ceiling: 10)"
  - "[ ] User feedback on images (e.g., 'swap the image on page 5') is persisted to the manifest so the skill avoids the same pick next time"
  - "[ ] Integration test: regenerating the v3 Private Credit Capabilities document from source content yields a PDF with ≥90% visual fidelity (same page count, same photo page rhythm, same color palette, same typography, same logo placement)"

