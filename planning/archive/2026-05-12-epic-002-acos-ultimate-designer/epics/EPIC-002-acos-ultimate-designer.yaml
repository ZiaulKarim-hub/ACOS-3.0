    rationale: "Image sourcing depends on HTML having photo slots to fill."
  - phase: 3
    stories: ["STORY-003", "STORY-004"]
    rationale: "PDF and PPTX paths can be built in parallel once HTML is stable; they share nothing structurally."
  - phase: 4
