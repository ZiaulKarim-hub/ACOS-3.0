      - clarification requests (if any)
    success_criteria:
      - assignment understood
      - all dependencies verified complete
      - no blocking questions
    on_failure: escalate
    max_retries: 0

  - name: implementation
    depends_on: assignment-receipt
    agent: ACOS-developer
    input:
      - slice specification
      - allowed files
      - applicable skills
    output:
      - implemented code
      - code rationale documentation
    success_criteria:
      - all acceptance criteria addressed
      - only allowed files modified
      - code compiles/builds
    on_failure: retry
    max_retries: 3

  - name: evidence-creation
    depends_on: implementation
    agent: ACOS-developer
    input:
      - implemented code
      - acceptance criteria
    output:
      - evidence bundle
      - summary document
    success_criteria:
      - all evidence files created
      - verification steps documented
      - ready for review
    on_failure: retry
    max_retries: 2

  - name: handoff-to-review
    depends_on: evidence-creation
    agent: ACOS-developer
    input:
      - evidence bundle
      - implementation summary
    output:
      - handoff document in memory/handoffs/developer-to-reviewer/
    success_criteria:
      - handoff document created
      - evidence path specified
      - ready_for_review: true
    on_failure: retry
    max_retries: 1

  - name: review-assignment
    depends_on: handoff-to-review
    agent: system
    input:
      - handoff document
      - review-rules.yaml
    output:
      - list of assigned reviewers
    success_criteria:
      - reviewers assigned per rules
      - all matching rules applied
    on_failure: escalate
    max_retries: 0

  - name: parallel-review
    depends_on: review-assignment
    type: parallel
    agents:
      - dynamic (based on review-rules.yaml)
    input:
      - evidence bundle
      - source of truth
      - slice specification
    output:
      - individual review reports
    success_criteria:
      - each reviewer submits independently
      - no cross-contamination
    on_failure: retry
    max_retries: 1

  - name: review-aggregation
    depends_on: parallel-review
    agent: system
    input:
      - all review reports
    output:
      - aggregated verdict
      - combined feedback (if rejected)
    success_criteria:
      - all verdicts collected
      - final verdict determined
    on_failure: escalate
    max_retries: 0

  - name: feedback-to-architect
    depends_on: review-aggregation
    condition: verdict == REJECTED
    agent: system
    input:
      - all review feedback
    output:
      - feedback handoff to architect
    success_criteria:
      - all feedback consolidated
      - handoff created
    on_failure: escalate
    max_retries: 0

  - name: completion
    depends_on: review-aggregation
    condition: verdict == PASSED
    agent: system
    input:
      - passed review confirmation
    output:
      - slice marked complete
      - next slice ready
    success_criteria:
      - status updated
      - parent story notified
    on_failure: retry
    max_retries: 1

