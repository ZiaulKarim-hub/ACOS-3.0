## Stages Detail

### Stage 1: Assignment Receipt

**Agent:** ACOS-developer
**Purpose:** Receive and understand the work assignment

The developer:
1. Reads handoff from `memory/handoffs/architect-to-developer/`
2. Verifies understanding of objective
3. Checks dependencies are complete
4. Raises clarification requests if needed

### Stage 2: Implementation

**Agent:** ACOS-developer
**Purpose:** Write the code to fulfill the slice requirements

The developer:
1. Applies relevant skills
2. Implements code within allowed files only
3. Addresses all acceptance criteria
4. Documents rationale in `memory/code-rationale/`

### Stage 3: Evidence Creation

**Agent:** ACOS-developer
**Purpose:** Create proof of completion

Creates evidence bundle in `.acos/evidence/[DATE]/[SLICE-ID]/`:
- `before/baseline-status.log`
- `after/modified-files.txt`
- `after/git-diff.patch`
- `verify.log`
- `Summary.md`

### Stage 4: Handoff to Review

**Agent:** ACOS-developer
**Purpose:** Signal completion and request review

Creates handoff in `memory/handoffs/developer-to-reviewer/`:
- Specifies evidence bundle path
- Lists acceptance criteria addressed
- Sets `ready_for_review: true`

### Stage 5: Review Assignment

**Agent:** System (automatic)
**Purpose:** Determine which reviewers should review

Based on `review-rules.yaml`:
1. Analyzes file paths
2. Analyzes code content
3. Assigns matching reviewers
4. QA Reviewer always included

### Stage 6: Parallel Review

**Agents:** Dynamic based on rules
**Purpose:** Independent review by multiple specialists

Each reviewer:
1. Reviews against source of truth
2. Cannot see other reviewers' feedback
3. Cannot see Architect decisions
4. Submits independent verdict

### Stage 7: Review Aggregation

**Agent:** System (automatic)
**Purpose:** Combine all review verdicts

Rules:
- ALL reviewers must PASS for slice to pass
- ANY REJECT means slice is rejected
- Feedback is consolidated for architect

### Stage 8: Feedback to Architect (if rejected)

**Agent:** System (automatic)
**Purpose:** Provide consolidated feedback

Creates handoff in `memory/handoffs/reviewer-to-architect/`:
- All issues from all reviewers
- Severity classifications
- Required fixes

### Stage 9: Completion (if passed)

**Agent:** System (automatic)
**Purpose:** Mark slice complete and progress

Actions:
- Update slice status
- Notify parent story
- Enable dependent slices

## Error Handling

| Stage | Error | Response |
|-------|-------|----------|
| Assignment | Unclear requirements | Escalate to Architect |
| Implementation | Build fails | Retry up to 3 times |
| Evidence | Missing files | Retry up to 2 times |
| Review | Reviewer unavailable | Retry once |
| Any | Max retries exceeded | Escalate to human |

## Success Metrics

- **Completion Rate:** Target 95%+
- **First-Pass Review Rate:** Target 70%+
- **Average Iterations:** Target <2

