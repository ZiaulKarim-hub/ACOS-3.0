## Stages Detail

### Stage 1: Vision Planning

**Agent:** The Architect
**Purpose:** Create the complete project plan

The Architect:
1. Reviews vision document (source of truth)
2. Breaks vision into major capabilities (epics)
3. Maps dependencies between epics
4. Creates project roadmap
5. Gets user approval on the plan

### Stage 2: Epic Execution

**Agent:** Orchestrated (via epic-completion-flow)
**Purpose:** Execute each epic in dependency order

For each epic:
1. Wait for dependencies to complete
2. Execute using `epic-completion-flow`
3. Track completion status

Each epic internally executes its stories and slices.

### Stage 3: System Integration

**Agent:** ACOS-developer
**Purpose:** Ensure all epics work together as a complete system

Actions:
1. Verify cross-epic integration
2. Run system-level tests
3. Test vision-level acceptance criteria
4. Create system evidence

### Stage 4: Vision Review

**Agents:** ALL reviewers
**Purpose:** Final, comprehensive review

This is the most thorough review:
- **QA Reviewer:** Complete system correctness
- **Integration Reviewer:** All components work together
- **Performance Reviewer:** System performs at scale
- **Security Reviewer:** System is secure

**Special Check:** Vision Fulfillment
- Compare delivered system against original vision document
- Verify ALL user requirements are met
- Confirm nothing was missed or changed without approval

### Stage 5: User Acceptance

**Agent:** User (human)
**Purpose:** Final approval from the user

User reviews:
1. Complete system demonstration
2. Review reports from all reviewers
3. Compare against their original vision
4. Approve or provide feedback

### Stage 6: Learning Extraction

**Flow:** learning-extraction-flow
**Purpose:** Capture learnings for future projects

Extracts:
- Patterns that worked well
- Anti-patterns to avoid
- Domain knowledge gained
- Flow effectiveness data
- Agent performance data

### Stage 7: Project Completion

**Agent:** System
**Purpose:** Finalize everything

Actions:
1. Mark project as complete
2. Archive project memory
3. Update learning curve with new learnings
4. Generate final project summary

## Vision Fulfillment Check

The most critical check in the entire system:

```
For each requirement in vision-document.md:
  1. Is it implemented? [Yes/No]
  2. Does it work as specified? [Yes/No]
  3. Was any deviation approved by user? [Yes/No/N/A]

If ANY requirement fails: REJECT
```

## Error Handling

| Stage | Error | Response |
|-------|-------|----------|
| Planning | Can't break down | Clarify with user |
| Epic Execution | Epic fails | Retry epic up to 3x |
| Integration | Epics don't integrate | Architect intervention |
| Vision Review | Rejection | Feedback to Architect |
| User Acceptance | User not satisfied | feedback-resolution-flow |
| Max Iterations | Still failing | Escalate to human |

## Success Metrics

- **Vision Fulfillment:** 100% (non-negotiable)
- **User Acceptance Rate:** Target 95%+
- **Learning Extraction:** All significant learnings captured

