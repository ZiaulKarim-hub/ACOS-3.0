## Stages Detail

### Stage 1: Memory Collection

**Agent:** ACOS-memory-agent
**Purpose:** Gather all relevant project data

Collects:
- All decisions from `memory/decisions/`
- All reviews from `memory/reviews/`
- All feedback from `memory/feedback-history/`
- All handoffs from `memory/handoffs/`

### Stage 2-5: Parallel Analysis

Four types of analysis run (can be parallel):

#### Decision Analysis
- Which decisions worked?
- Which decisions failed?
- Why did they succeed/fail?
- What patterns emerge?

#### Review Pattern Analysis
- What issues were found most often?
- By which reviewers?
- What fixes were common?
- What problems kept recurring?

#### Flow Effectiveness Analysis
- Which flows succeeded most?
- Which flows had problems?
- Where were bottlenecks?
- What improvements are needed?

#### Agent Effectiveness Analysis
- Which agents performed well?
- Which skills were most useful?
- Were there capability gaps?

### Stage 6: Learning Synthesis

**Agent:** ACOS-learning-curve-agent
**Purpose:** Combine all analyses into coherent learnings

Categories:
- **Patterns** (what to do)
- **Anti-patterns** (what not to do)
- **Domain knowledge** (technical insights)
- **Process improvements** (workflow insights)

### Stage 7: Learning Documentation

**Agent:** ACOS-learning-curve-agent
**Purpose:** Persist learnings to the learning curve

Creates:
- Individual learning entries in appropriate directories
- Updates `learning-curve/index.yaml`
- Sets initial confidence levels

### Stage 8: Retrospective Creation

**Agent:** ACOS-learning-curve-agent
**Purpose:** Create comprehensive project retrospective

Uses template from `learning-curve/project-retrospectives/.template.md`

Includes:
- Project summary and metrics
- What went well
- What could be improved
- All learnings extracted
- Recommendations for future

## Learning Categories

| Category | Location | Examples |
|----------|----------|----------|
| Architectural Patterns | `patterns/architectural/` | Effective system designs |
| Implementation Patterns | `patterns/implementation/` | Code patterns that worked |
| Review Patterns | `patterns/review/` | Effective review practices |
| Workflow Patterns | `patterns/workflow/` | Process improvements |
| Common Mistakes | `anti-patterns/common-mistakes/` | Frequent errors to avoid |
| Failed Approaches | `anti-patterns/failed-approaches/` | Strategies that don't work |
| Domain Knowledge | `domain-knowledge/[domain]/` | Technical insights by area |

## Confidence Assignment

New learnings start with confidence based on evidence:

| Evidence | Initial Confidence |
|----------|-------------------|
| Single occurrence, clear outcome | LOW |
| Multiple occurrences, consistent outcome | MEDIUM |
| Strong evidence, clear causation | HIGH |

Confidence increases as learnings are successfully applied in future projects.

## Error Handling

| Stage | Error | Response |
|-------|-------|----------|
| Memory Collection | Missing data | Continue with available |
| Analysis | Analysis fails | Retry up to 2x |
| Documentation | Write fails | Retry |
| Any | Max retries | Complete with partial learnings |

This flow should never block project completion - partial learnings are better than none.

## Success Metrics

- **Learnings Extracted:** Target 5+ per project
- **Categories Covered:** Target 3+ categories
- **Retrospective Completeness:** All sections filled

