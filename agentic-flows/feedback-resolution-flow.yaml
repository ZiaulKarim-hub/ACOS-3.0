## Critical Principle: Unified Resolution

**The Architect sees ALL feedback at once and creates ONE unified solution.**

This prevents:
- Conflicting fixes
- Oscillating between reviewer preferences
- Infinite loops of rejection

Example:
```
Security Reviewer: "Add input validation before database query"
Performance Reviewer: "Reduce processing steps in query path"

WRONG approach:
- Fix security → breaks performance
- Fix performance → breaks security
- Loop forever

RIGHT approach (Architect's unified solution):
- Add efficient input validation that adds minimal overhead
- Restructure query path to incorporate both concerns
- Single fix addresses both reviewers
```

## Stages Detail

### Stage 1: Feedback Receipt

**Agent:** The Architect
**Purpose:** Acknowledge and catalogue all feedback

The Architect:
1. Receives consolidated feedback from all reviewers
2. Lists all issues by reviewer
3. Categorizes by severity
4. Identifies overlapping concerns

### Stage 2: Feedback Analysis

**Agent:** The Architect
**Purpose:** Identify conflicts and create unified plan

The Architect:
1. Analyzes all issues for conflicts
2. Identifies issues that affect same code areas
3. Determines if fixes might contradict
4. Plans unified approach

### Stage 3: Fix Planning

**Agent:** The Architect
**Purpose:** Create updated specification

Creates new handoff with:
- All issues to address
- Unified approach for each
- Clear guidance on trade-offs
- Updated acceptance criteria

### Stage 4: Fix Implementation

**Flow:** slice-execution-flow
**Purpose:** Implement the fixes

Developer:
1. Receives updated specification
2. Implements fixes according to unified plan
3. Creates new evidence bundle
4. Submits for re-review

### Stage 5: Re-Review

**Agents:** Same reviewers as original
**Purpose:** Verify fixes address concerns

Each reviewer:
1. Compares to original feedback
2. Verifies their issues are addressed
3. Checks for new issues
4. Submits verdict

### Stage 6: Resolution Check

**Agent:** System
**Purpose:** Determine next action

- If ALL PASS: Mark resolved, complete
- If ANY REJECT: Loop back to analysis (max 3 times)
- If max iterations: Escalate to human

## Conflict Resolution Strategies

| Conflict Type | Resolution Strategy |
|---------------|---------------------|
| Security vs Performance | Security wins, optimize within constraints |
| Feature vs Simplicity | Check source of truth for priority |
| Style vs Convention | Follow project conventions |
| Competing approaches | Choose one, document rationale |

## Error Handling

| Stage | Error | Response |
|-------|-------|----------|
| Analysis | Can't reconcile feedback | Document conflict, escalate |
| Planning | Fixes too complex | Break into smaller fixes |
| Implementation | Can't satisfy all | Prioritize, escalate remainder |
| Re-Review | New issues found | Include in next iteration |
| Max Iterations | Still failing | Escalate to human |

## Max Iteration Escalation

After 3 failed iterations:

1. Summarize all attempts
2. Document persistent issues
3. Notify user
4. Request human decision:
   - Modify requirements?
   - Accept with known issues?
   - Reassign to different approach?

## Success Metrics

- **First Re-Review Pass Rate:** Target 70%+
- **Average Iterations:** Target <2
- **Human Escalation Rate:** Target <5%

