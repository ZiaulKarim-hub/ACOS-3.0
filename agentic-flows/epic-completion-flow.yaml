## Stages Detail

### Stage 1: Epic Initialization

**Agent:** The Architect
**Purpose:** Break epic into executable stories

The Architect:
1. Analyzes epic requirements
2. Identifies user-facing features (stories)
3. Maps dependencies between stories
4. Determines execution order

Output: Story specifications with dependency graph

### Stage 2: Story Execution

**Agent:** Orchestrated (via story-completion-flow)
**Purpose:** Execute each story in dependency order

For each story:
1. Wait for dependencies to complete
2. Execute using `story-completion-flow`
3. Track completion status

Each story internally executes its slices.

### Stage 3: Epic Integration

**Agent:** ACOS-developer
**Purpose:** Ensure all stories work together as a capability

Actions:
1. Verify cross-story integration
2. Run capability-level tests
3. Test epic-level acceptance criteria
4. Create integration evidence

### Stage 4: Epic Review

**Agents:** QA + Integration + Performance + Inherited
**Purpose:** Review the complete capability

Reviews include:
- QA Reviewer (mandatory)
- Integration Reviewer (mandatory for epics)
- Performance Reviewer (mandatory for epics)
- All reviewers inherited from constituent stories

All reviewers work in parallel, independently.

### Stage 5: Epic Completion

**Agent:** System
**Purpose:** Finalize epic

Actions:
1. Update epic status to complete
2. Notify parent vision
3. Enable dependent epics (if any)

## Review Scope at Epic Level

Epic review focuses on:
- **Capability Coherence:** Do all stories deliver the promised capability?
- **Cross-Story Integration:** Do stories work together seamlessly?
- **Performance at Scale:** Does the capability perform under load?
- **User Journey:** Can users accomplish the epic's goal?

## Error Handling

| Stage | Error | Response |
|-------|-------|----------|
| Initialization | Can't break down | Retry with more context |
| Story Execution | Story fails review | Retry story up to 3x |
| Integration | Stories don't integrate | Architect intervention |
| Epic Review | Rejection | Feedback to Architect |
| Max Iterations | Still failing | Escalate to human |

## Success Metrics

- **Epic Completion Rate:** Target 85%+
- **Average Story Iterations:** Target <2
- **Integration Success Rate:** Target 90%+

