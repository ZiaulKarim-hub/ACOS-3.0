stages:
  - name: initial-understanding
    agent: the-architect
    input:
      - user's initial vision statement
    output:
      - preliminary understanding
      - initial questions
    success_criteria:
      - core concept understood
      - question categories identified
    on_failure: retry
    max_retries: 2

  - name: questioning-round
    depends_on: initial-understanding
    agent: the-architect
    input:
      - current understanding
      - remaining question categories
    output:
      - questions for user
    success_criteria:
      - questions are specific
      - questions cover gaps
    on_failure: retry
    max_retries: 1

  - name: user-response
    depends_on: questioning-round
    agent: user
    input:
      - architect's questions
    output:
      - user answers
      - "that's enough" signal (optional)
    success_criteria:
      - responses received
    on_failure: escalate
    max_retries: 0

  - name: understanding-update
    depends_on: user-response
    agent: the-architect
    input:
      - user responses
      - current understanding
    output:
      - updated understanding
      - remaining gaps
    success_criteria:
      - understanding improved
      - gaps identified or closed
    on_failure: retry
    max_retries: 1

  - name: completeness-check
    depends_on: understanding-update
    agent: the-architect
    input:
      - current understanding
      - remaining gaps
      - user satisfaction signal
    output:
      - decision: continue or finalize
    success_criteria:
      - clear decision made
    on_failure: retry
    max_retries: 1

  - name: document-creation
    depends_on: completeness-check
    condition: decision == finalize
    agent: the-architect
    input:
      - complete understanding
      - all Q&A
    output:
      - vision-interview.md
      - vision-document.md
    success_criteria:
      - both documents created
      - saved to source-of-truth
    on_failure: retry
    max_retries: 2

