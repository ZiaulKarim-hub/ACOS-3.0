## Error Handling

| Stage | Error | Response |
|-------|-------|----------|
| Initial Understanding | Can't parse vision | Ask for clarification |
| Questioning | User confused | Rephrase questions |
| Response | User unresponsive | Wait patiently |
| Completeness | Gaps remain | Continue questioning |

## Success Metrics

- **Interview Completion Rate:** Target 100%
- **Average Rounds:** Target 3-5
- **User Satisfaction:** Target high

