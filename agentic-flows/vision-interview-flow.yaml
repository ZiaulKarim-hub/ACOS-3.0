## Question Categories

The Architect must cover these areas:

### 1. Users & Audience
- Who will use this?
- Technical level?
- Primary vs secondary users?
- User personas?

### 2. Platforms & Devices
- Web? Mobile? Desktop?
- Responsive requirements?
- Offline support needed?

### 3. Features & Scope
- Must-have features?
- Nice-to-have features?
- Explicitly excluded features?
- MVP vs full vision?

### 4. Scale & Performance
- Expected users?
- Data volume?
- Growth expectations?
- Performance requirements?

### 5. Integrations
- External services?
- Third-party APIs?
- Existing systems?

### 6. Security & Compliance
- Sensitive data?
- Compliance requirements (HIPAA, GDPR, etc.)?
- Authentication needs?

### 7. Design & UX
- Visual style?
- Brand guidelines?
- Accessibility requirements?
- UX preferences?

### 8. Technology Preferences
- Preferred languages?
- Framework preferences?
- Hosting preferences?
- Existing infrastructure?

### 9. Success Criteria
- How do we know it's done?
- Key metrics?
- Launch criteria?

## Exit Conditions

The interview ends when:

1. **Architect Satisfied:** All question categories covered with sufficient depth
2. **User Signal:** User says "that's enough" or equivalent
3. **Max Iterations:** 10 rounds reached (rare)

