## Stages Detail

### Stage 1: Story Initialization

**Agent:** The Architect
**Purpose:** Break story into executable slices

The Architect:
1. Analyzes story requirements
2. Identifies natural boundaries for slices
3. Maps dependencies between slices
4. Determines execution order

Output: Slice specifications with dependency graph

### Stage 2: Slice Execution

**Agent:** Orchestrated (Developer per slice)
**Purpose:** Execute each slice in dependency order

For each slice:
1. Wait for dependencies to complete
2. Execute using `slice-execution-flow`
3. Track completion status

Parallel execution allowed for independent slices.

### Stage 3: Story Integration

**Agent:** ACOS-developer
**Purpose:** Ensure all slices work together

Actions:
1. Verify component integration
2. Run integration tests
3. Test story-level acceptance criteria
4. Create integration evidence

### Stage 4: Story Review

**Agents:** QA + Integration + Inherited
**Purpose:** Review the complete story

Reviews include:
- All slice reviewers (inherited)
- Integration reviewer (mandatory)
- QA reviewer (mandatory)

All reviewers work in parallel, independently.

### Stage 5: Story Completion

**Agent:** System
**Purpose:** Finalize story

Actions:
1. Update story status to complete
2. Notify parent epic
3. Enable dependent stories (if any)

## Dependency Handling

```
Example Dependency Graph:

Slice 1 ──┐
          ├──► Slice 3 ──┐
Slice 2 ──┘              ├──► Slice 5
               Slice 4 ──┘

Execution Order:
1. [Slice 1, Slice 2] (parallel)
2. [Slice 3, Slice 4] (parallel, after 1&2 complete)
3. [Slice 5] (after 3&4 complete)
```

## Error Handling

| Stage | Error | Response |
|-------|-------|----------|
| Initialization | Can't break down | Retry with more context |
| Slice Execution | Slice fails review | Retry slice up to 3x |
| Integration | Slices don't work together | Architect intervention |
| Story Review | Rejection | Feedback to Architect |
| Any | Max retries exceeded | Escalate to human |

## Success Metrics

- **Story Completion Rate:** Target 90%+
- **Average Slice Iterations:** Target <2
- **Integration Success Rate:** Target 95%+

